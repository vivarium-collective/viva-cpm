biological_story: |
  Sego et al. 2022 built a cellularized, multiscale model of local influenza
  infection: a 2-D epithelial sheet (Cellular Potts) is infected by a
  diffusing virus field, mounts a type-I interferon response that confers
  per-cell resistance, and recruits macrophages, NK cells and CD8+ T cells via
  chemokine gradients to clear infected cells — all coupled bidirectionally to
  a global ODE compartment (Price 2015) that scales the spatial patch to a
  physiological lung-epithelium population. It is a rich, independently
  published, source-available target for testing whether a from-scratch CPM
  engine (viva-cpm) can reach genuine quantitative reproduction of a
  real spatial-immunology model, not just a qualitative phenomenon.

  The investigation treats the paper's own CompuCell3D supplementary source
  (ViralInfectionVTM) as the ground-truth specification, not just the
  paper's printed tables — because the source is what actually produced the
  published figures, and the two disagree in eight places (neighbor order,
  two immune-adhesion entries, lattice-size defaults, the initial-viral-load
  sweep encoding, a simplified death-rate term, an asymmetric resistance
  usage, and a qualitative-versus-numeric label mismatch on macrophage
  chemotaxis). Recording these discrepancies up front, before any engine
  code existed, was the point of this initial stage: later stages could
  then build on a stated, auditable authority rather than an implicit blend
  of whichever value looked right.

  Capability was built up in stages: an epithelial sheet at scale, a virus
  field with infection, interferon-driven resistance, epithelial death and
  recovery, macrophage response, chemokine and IL-10 fields, NK/CD8+
  cytotoxic response, the global ODE coupling, and finally the full
  capstone reproduction against Figs 3B, 5, and 7 at paper scale with 50
  replicas.

  Note on ordering: the plan as originally scaffolded put the chemokine and
  IL-10 fields before macrophage response in the build sequence; the actual
  build order swapped them, validating macrophage response first. The
  rationale was practical: the core macrophage chemotactic-localization
  mechanism — chemotaxing up the virus field already validated in the
  infection study, using the engine's existing chemotaxis mechanism —
  needed no new field and no new low-level engine code, so it was cheaper
  and more legible to validate first, in isolation from recruitment
  dynamics. The chemokine field and Hill-driven macrophage recruitment came
  next, replacing this study's fixed macrophage population with genuine
  inflow and outflow; the antigen-presenting-cell-driven recruitment and
  global interferon-amplification piece remained part of the later global
  ODE coupling work, as originally planned. This changed the build order
  only, not its content — all of the originally planned mechanisms were
  still built, and no scope was dropped.

how_to_read: |
  Read this top-down as a staged build, not a finished result:

  1. The initial stage established the specification and authority, with
     no engine code yet: acquiring the CC3D source, transcribing its
     parameter tables into a cited parameter file, digitizing Figs 3B, 5,
     and 7 into acceptance bands, and recording source-versus-paper
     discrepancies. This is covered by the parameter-provenance study
     (documentation only).
  2. The middle stages each validated one capability against one paper
     target, at reduced (0.3 mm) scale: the epithelial sheet, the virus
     field and infection, interferon-driven resistance, death and
     recovery, macrophage response, the chemokine and IL-10 fields,
     NK/CD8+ cytotoxic killing, and the global ODE coupling. (Macrophage
     response and the chemokine/IL-10 fields were validated in swapped
     order from the original plan — see the note in the biological
     narrative below.)
  3. The capstone stage assembled the full composite model, together with
     three reproduction studies that evaluate it against the acceptance
     bands for Fig 3B (time series versus the ODE), Fig 5 (viral-load
     sweep and lethal threshold), and Fig 7 (infection-fraction sweep).
     The harness and studies are built and run at reduced scale in
     continuous integration, where every band evaluation fails as
     expected; the paper-scale ensembles (1 mm², 50 replicas, 20 for
     Fig 7) were run separately as a follow-up. Full reproducibility is
     the target deliverable of this stage — as detailed in the verdict
     above, it is closely but not fully reached.

  Full staging detail: docs/superpowers/specs/2026-09-18-influenza-sego2022-reproduction-design.md §5.

glossary:
  - {term: "ViralInfectionVTM", definition: "The CompuCell3D supplementary source package for Sego et al. 2022 — the authoritative, source-literal parameter reference for this investigation (as opposed to the paper's printed prose tables, which it occasionally disagrees with)."}
  - {term: "Source-vs-paper discrepancy", definition: "A place where the CC3D source's literal parameter/behavior differs from the paper's printed table or text. Eight are recorded and are treated as open items, not resolved."}
  - {term: "Cellular viral resistance (rho)", definition: "A per-cell state variable modulating virus release and infected-cell death, driven by local type-I IFN exposure."}
  - {term: "Global ODE compartment", definition: "The Price (2015)-derived whole-organ immune ODE model that Sego 2022 couples bidirectionally to the spatial CPM patch via scaling factors eta/theta."}
  - {term: "Acceptance band", definition: "A digitized value/lo/hi target range per observable, read by eye from a paper figure (Figs 3B/5/7), used as the pass/fail criterion for the capstone reproduction."}

at_a_glance:
  - {study: parameter-provenance, role: "Establishes the cited parameter authority, provenance documentation, and digitized figure targets, and documents open source-versus-paper discrepancies. No simulation."}
  - {study: epithelial-sheet-baseline, role: "Validates the confluent epithelial-sheet substrate — geometry and 1 mm^2 throughput — as a composite. Substrate only, with no biology reproduction claim."}
  - {study: virus-field-infection, role: "Validates the virus field (diffusion and decay) and the stochastic healthy-to-infected infection mechanism — local spread, population conserved — over the epithelial sheet. Mechanism only: resistance, interferon, and immune cells are not yet modeled, and no Figs 3B/5/7 reproduction claim is made (that verdict is still pending, at the capstone stage)."}
  - {study: ifn-resistance, role: "Validates the type-I interferon field and the per-cell resistance mechanism that gates virus secretion, over the virus-field/infection path. The primary evidence is total virus output roughly halved — about 53% lower at step 20, about 58% lower by step 40 — with infected-cell count a weaker, corroborating signal (about 4% lower at step 20, widening to about 23% by step 40). Mechanism only: death/recovery, the Allee effect, IL-10, immune cells, and interferon amplification are not yet modeled; resistance plateaus around 0.55 rather than about 1, an open calibration question; no Figs 3B/5/7 reproduction claim is made (still pending, at the capstone stage)."}
  - {study: epithelial-fate, role: "Validates the full epithelial-fate lifecycle mechanism — infection, infected-cell death, and the cellularized Allee effect (death and recovery) — over the virus-field and resistance path. The dead-cell count grows through the healthy-infected-dead progression (0 to 14 over 200 updates, 0 to 77 over 500 updates); Allee recovery is confirmed correct in both directions, with deterministic and organic evidence (3-12 recovery events per run). Mechanism only: direct Allee death is honestly reported as essentially absent at the 0.3 mm scale tested (verified genuine rather than a bug, via rate instrumentation), an open calibration flag; NK/CD8+ contact-killing, the chemokine/IL-10 fields, other immune cells, and interferon amplification are not yet modeled; no Figs 3B/5/7 reproduction claim is made (still pending, at the capstone stage)."}
  - {study: global-coupling, role: "Adds the Price (2015)-derived global, whole-organ immune ODE — 10 systemic species, integrated once per simulated step, coupled bidirectionally to the spatial patch — and resolves three placeholder terms carried from earlier stages into dynamic, source-faithful mechanisms: a signaling term is now dynamic (driven by the ODE's TNF output and the spatial dead-cell count, using the same functional form as before), recruitment is now ODE-driven (chemokine- and antigen-presenting-cell-driven inflows, with CD8's no-baseline asymmetry preserved), and NK/CD8 killing gains a well-mixed, nearby-population term alongside the existing local term. Reports honestly that at this reduced-scale patch none of the three mechanisms' magnitudes yet reconcile with the values they replaced, or reach the level needed to matter within a feasible run: the dynamic signaling term is about six orders of magnitude below the retired static placeholder value of 2.44, recruitment stays below 0.01 per step (baseline-dominated only, with no signal-driven growth in cell counts), and the nearby-killing term is too weak to fire through natural recruitment buildup alone (confirmed instead via a dedicated synthetic test). The mechanisms are resolved; calibration remains pending at the capstone stage. No Figs 3B/5/7 reproduction claim is made (still pending, at the capstone stage)."}
  - {study: repro-fig3b, role: "The capstone stage: wires the full assembled model — every mechanism validated in earlier stages, combined into one integrated per-step loop — into a seeded ensemble driver over the Fig 3B scenario (5% initial infection on a 0.3 mm, 1225-cell patch) and evaluates it against the digitized Fig 3B acceptance bands. At reduced scale (2 replicas, a 15x15-cell patch, 20 recorded steps, about 0.09 simulated days) 0 of 12 observables land in-band at every checkpoint — expected at this population and duration scale, not a mechanism failure. The paper-scale ensemble (50 replicas, a 35x35-cell patch, about 3.5 simulated days, run separately on more capable hardware) is required before any reproduced verdict."}
  - {study: repro-fig5-viral-load, role: "The capstone stage: sweeps the full assembled model over Fig 5's initial-viral-load scenarios and evaluates each dose against only that dose's own band subset (a scenario-grouping check). At reduced scale (initial loads of 1 and 10,000, 1 replica, a 12x12-cell patch, 15 recorded steps, about 0.068 simulated days) the monotone dose-response direction holds — the final uninfected fraction falls from 0.958 at a load of 1 to 0.0 at a load of 10,000, against a model-side lethal threshold of 10,000 — but neither dose's band is met. The paper-scale ensemble (50 replicas, a 35x35-cell patch, about 15 simulated days, run separately on more capable hardware) is required before any reproduced verdict."}
  - {study: repro-fig7-infection-fraction, role: "The capstone stage: sweeps the full assembled model over Fig 7's initial-infection-fraction scenarios and evaluates each fraction against only that fraction's own band subset, using the same scenario-grouping check. At reduced scale (initial fractions of 0.001 and 0.05, 1 replica, a 12x12-cell patch, 15 recorded steps, about 0.068 simulated days) the monotone dose-response direction holds — the final uninfected fraction is 1.0 at a fraction of 0.001 and 0.958 at a fraction of 0.05 — but neither fraction's band is met. The paper-scale ensemble (20 replicas, a 35x35-cell patch, about 15 simulated days, run separately on more capable hardware) is required before any reproduced verdict."}

