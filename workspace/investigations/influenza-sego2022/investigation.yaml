acceptance_criteria:
- {study: parameter-provenance, behavior: "Parameter authority is established and cited"}
- {study: epithelial-sheet-baseline, behavior: "Confluent epithelial sheet holds stable geometry (about 25 lattice sites per cell) and 1mm^2 throughput clears the performance floor of 200.0 steps per second"}
- {study: virus-field-infection, behavior: "Virus field diffuses and decays, and a seeded lesion spreads locally via stochastic healthy-to-infected infection (new infections occur within a few diffusion lengths of previously infected cells), with total population conserved and no spontaneous infection in the absence of a seed or field"}
- {study: ifn-resistance, behavior: "Type-I interferon field drives a per-cell resistance scalar (resist = f_bar/(a_rf+f_bar)) that gates virus secretion by (1-resist), measurably reducing total virus compared with the same-seeded run without interferon (primary evidence, roughly halved: about 53% lower at step 20, about 58% lower by step 40), with a weaker, later-emerging reduction in infected-cell growth (about 4% at step 20, widening to about 23% by step 40), and mean resistance becoming positive once interferon accumulates"}
- {study: epithelial-fate, behavior: "Infected-cell death and the cellularized Allee effect (death of poorly supported healthy cells and recovery of well-supported dead cells, gated by local contact geometry and resistance) compose with infection into a coherent, population-conserving epithelial-fate lifecycle: a dead lesion grows through the healthy-infected-dead progression (dead-cell count 0 to 14 at 200 updates, 0 to 77 at 500 updates), a dead cell fully surrounded by healthy tissue recovers, a dead cell surrounded by dying tissue never recovers, and direct Allee death is honestly reported as rare at reduced scale (a recorded calibration flag, not a wiring bug)"}
- {study: immune-response, behavior: "The immune layer (macrophage, NK, and CD8+ T cells) runs at representative tissue scale (about a 900-cell epithelial sheet plus 60 immune cells): macrophages, NK cells, and CD8 cells chemotax up the macrophage-released chemokine field toward an infected patch and cluster against the sheet, consolidating the earlier single-mechanism demonstrations (chemotaxis, chemokine/IL-10 signaling, contact-killing) into one representative-scale scene. Contact-killing at full scale runs into the documented field-magnitude calibration gap, quantified at the capstone stage; this is reported honestly as a mechanism result, not a Fig-3B/5/7 reproduction claim"}
- {study: global-coupling, behavior: "The 10-systemic-species Price (2015) global ODE (species NB, N, T, X, A, B, P, W, G, O) integrates stably once per simulated step, coupled bidirectionally to the spatial patch — spatial aggregates feed the ODE, the freshly integrated TNF output plus the spatial dead-cell count feed a now-dynamic signaling term (replacing the earlier static placeholder), ODE-driven recruitment activates and removes immune cells in the spatial model (CD8's no-baseline, antigen-presenting-cell-driven asymmetry preserved exactly — inflow is zero when the driving signal is zero), and NK/CD8 killing gains a well-mixed, nearby-population term (verified with a dedicated synthetic test: both seeded infected cells were cleared within 2 simulated steps given a large synthetic nearby population) alongside the unchanged local term. Honest gap: at this reduced-scale patch (scale factor eta about 1.4e-4), none of the three mechanisms' magnitudes yet reconcile — the dynamic signaling term (about 6.04e-7 to 2.82e-6) is about six orders of magnitude below the retired static placeholder value of 2.4412677; ODE-driven recruitment produces sub-0.01-per-step rates from the chemokine/antigen-presenting-cell signal (no observable integer growth from that pathway; a boosted scale factor does seed cells, but from the homeostatic baseline rather than the signal itself); and the nearby-killing term, grown through natural recruitment alone over 300 simulated steps, stays orders of magnitude too weak to fire (rate constant K_nb about 0.16-0.17, effective value E_nb about 0.011) — a field-versus-ODE unit-scale calibration gap, the same category of root cause as the chemotaxis engine-scale correction needed in the cytotoxic-killing study, reported honestly rather than tuned away — an item for the capstone stage"}
- {study: repro-fig3b, behavior: "The full assembled model — every earlier-stage mechanism combined into one integrated per-step loop — runs as a seeded ensemble over the Fig-3B scenario and is evaluated against the digitized Fig-3B acceptance bands, returning a well-formed ensemble and band evaluation at any scale, with the ensemble-mean uninfected-cell count non-increasing under infection. At the reduced scale used for fast automated testing (2 replicas, a 15-cell-per-side patch, 20 steps, a fixed starting seed) 0 of 12 observables land in-band at every digitized checkpoint, honestly expected at this population/duration scale — not a reproduced verdict. The paper-scale ensemble (50 replicas, a 35x35-cell patch, about 3.5 simulated days, run separately on more capable hardware) is the outstanding step before any reproduced verdict for Fig-3B."}
- {study: repro-fig5-viral-load, behavior: "The full assembled model, run at each of Fig-5's initial-viral-load scenarios and evaluated against only that dose's own band subset (a scenario-grouping check), returns a well-formed per-load result, lethal threshold, and band evaluation with a monotone dose-response direction (higher initial viral load gives a not-more-surviving uninfected fraction) at any scale. At the reduced scale used for fast automated testing (initial loads of 1 and 10,000, 1 replica, a 12-cell-per-side patch, 15 steps, a fixed starting seed) the direction holds (final uninfected fraction: 0.958 at a load of 1, 0.0 at a load of 10,000; this driver's own model-side lethal threshold is 10,000, distinct from the paper's ODE-model threshold) but neither dose's band is met — honestly expected at this scale, not a reproduced verdict. The paper-scale ensemble (50 replicas, a 35x35-cell patch, about 15 simulated days, run separately on more capable hardware) is the outstanding step before any reproduced verdict for Fig-5."}
- {study: repro-fig7-infection-fraction, behavior: "The full assembled model, run at each of Fig-7's initial-infection-fraction scenarios and evaluated against only that fraction's own band subset (the same scenario-grouping check), returns a well-formed per-fraction result, lethal threshold, and band evaluation with a monotone dose-response direction (higher initial infection fraction gives a not-more-surviving uninfected fraction) at any scale. At the reduced scale used for fast automated testing (initial fractions of 0.001 and 0.05, 1 replica, a 12-cell-per-side patch, 15 steps, a fixed starting seed) the direction holds (final uninfected fraction: 1.0 at a fraction of 0.001, 0.958 at a fraction of 0.05) but neither fraction's band is met — honestly expected at this scale, not a reproduced verdict. The paper-scale ensemble (20 replicas, a 35x35-cell patch, about 15 simulated days, run separately on more capable hardware) is the outstanding step before any reproduced verdict for Fig-7."}
