acceptance_criteria:
- {study: parameter-provenance, behavior: "Parameter authority is established and cited"}
- {study: epithelial-sheet-baseline, behavior: "Confluent epithelial sheet holds stable geometry (~25 sites/cell) and 1mm^2 throughput clears the perf-gate floor (200.0 MCS/s)"}
- {study: virus-field-infection, behavior: "Virus field diffuses/decays and a seeded lesion spreads locally via stochastic H->I infection (new infections within a few diffusion lengths of prior-infected cells), with population conserved and no spontaneous infection absent a seed/field"}
- {study: ifn-resistance, behavior: "Type-I IFN field drives a per-cell resistance scalar (resist = f_bar/(a_rf+f_bar)) that gates virus secretion by (1-resist), measurably reducing total virus vs the same-seed no-IFN run (primary evidence, roughly halved: ~53% at step 20 through ~58% at step 40), with a weaker, later-emerging reduction in infected-cell growth (n_I: ~4% at step 20, widening to ~23% by step 40) and mean_resist > 0 once IFN accumulates"}
- {study: epithelial-fate, behavior: "Infected death (I->D) and the cellularized Allee effect (H->D death / D->H recovery, gated by local contact geometry and resistance) compose with infection into a coherent, population-conserving epithelial-fate lifecycle: a dead lesion grows via H->I->D (n_D 0->14 at 200 updates, 0->77 at 500 updates), a dead cell fully surrounded by healthy tissue recovers, a dead cell surrounded by dying tissue never recovers, and direct Allee death is honestly reported as rare at reduced scale (a recorded Increment-9 calibration flag, not a wiring bug)"}
- {study: macrophage-response, behavior: "Macrophages (type M), wired to chemotax up the (unchanged) virus field via the engine's existing linear-lambda chemotaxis primitive, LOCALIZE to the infection over a 40-update run, robust across 5 seeds (5, 17, 23, 42, 100) with an unbiased interior-placed control (Task 5.1 fix round 1, commit 4092d7c): mean distance-to-infection change -13.39 sites (range -11.52 to -17.75), negative in 5/5 seeds, chemotaxis on, vs a near-isotropic lambda=0 control (mean -0.85, range -4.99 to +3.45, no consistent sign); chemotaxis-on beats the control in every individual seed and the mean gap exceeds the control's own spread; confirmed both by the full scenario and a minimal 2-cell engine-sanity check. Localization mechanism only — no phagocytosis (source has none), no recruitment dynamics (fixed population), a modest 5-seed ensemble"}
- {study: signaling-fields, behavior: "Macrophage-released chemokine (Hill-self-regulated) forms a spatial gradient CENTERED ON THE MACROPHAGE CLUSTER over a 15-update run (seed=17): per-cell 4.2x higher at macrophages than a far uninfected epithelial patch (0.00261 vs 0.00062), and a raw-lattice radial profile decays monotonically 5.9x across 6 distance bins from the macrophage-cluster centroid (0.00195 -> 0.00033). IL-10 is positive and increasing from BOTH its regulated sources (macrophages 2.97e-4 Hill-self-regulated, uninfected cells 3.71e-5 1-resist-gated). Field mechanism only — sig_1 is a documented constant stub (TNF-dependent true value deferred to Increment 8), g_1/g_2 use the 0.3mm-scenario eta approximation, global boundary terms and IL-10's uniform IC are deferred, and no chemotaxis toward the field is wired yet (Increment 7)"}
- {study: cytotoxic-killing, behavior: "NK (type K) and CD8+ T (type E) cells, chemotaxing up the (unchanged) chemokine field, LOCALIZE to the infection robustly across 5 seeds (NK mean distance change -20.37 vs a lambda=0 control's -1.02; CD8 -35.99 vs -0.54, negative in 5/5 seeds each, CD8 localizing more strongly per its 2x lambda). Contact-killing (killing.contact_kill_rate, the source's literal LOCAL surface-contact form) is a verified-correct mechanism: a small close-contact scenario clears the one infected cell (1 -> 0) with killing enabled vs steady at 1 disabled, same seed. HONEST GAP: at the scenario's own DEFAULT full scale (same 6-macrophage/6-NK/6-CD8 scenario the localization numbers come from), NK/CD8 close much of the distance but never reach actual contact within the run budget, so n_infected stays unchanged — end-to-end cytotoxic clearance is NOT demonstrated at this scale, reported honestly rather than tuned away (an Increment-9 field-magnitude-calibration item, same root cause as the 100x chemotaxis engine-unit-scale correction)"}
