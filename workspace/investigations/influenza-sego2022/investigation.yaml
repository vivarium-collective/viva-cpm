biological_story: |
  Sego et al. 2022 built a cellularized, multiscale model of local influenza
  infection: a 2-D epithelial sheet (Cellular Potts) is infected by a
  diffusing virus field, mounts a type-I interferon response that confers
  per-cell resistance, and recruits macrophages, NK cells and CD8+ T cells via
  chemokine gradients to clear infected cells — all coupled bidirectionally to
  a global ODE compartment (Price 2015) that scales the spatial patch to a
  physiological lung-epithelium population. It is a rich, independently
  published, source-available target for testing whether a from-scratch CPM
  engine (viva-cpm) can reach genuine quantitative reproduction of a
  real spatial-immunology model, not just a qualitative phenomenon.

  The investigation treats the paper's own CompuCell3D supplementary source
  (ViralInfectionVTM) as the ground-truth spec, not just the paper's printed
  tables — because the source is what actually produced the published
  figures, and the two disagree in eight places (neighbor order, two
  immune-adhesion entries, lattice-size defaults, the initial-viral-load
  sweep encoding, a simplified death-rate term, an asymmetric resistance
  usage, and a qualitative-vs-numeric label mismatch on macrophage
  chemotaxis). Recording these discrepancies up front, before any engine code
  exists, is the point of Increment 0: later increments build on a stated,
  auditable authority rather than an implicit blend of "whichever value
  looked right."

  Capability accrues on a 10-increment ladder: epithelial sheet at scale,
  virus field + infection, IFN + resistance, epithelial death/recovery,
  macrophage response, chemokine + IL-10 fields, NK/CD8+ cytotoxic response,
  the global ODE coupling, and finally the full capstone reproduction against
  Figs 3B, 5, and 7 at paper scale with 50 replicas.

  NOTE — Increments 5/6 RE-SCOPED (recorded at Task 5.2, macrophage-response
  study): the ladder as originally scaffolded put "chemokine + IL-10 fields"
  at position 5 and "macrophage response" at position 6. Actual build order
  swapped them — Increment 5 is now macrophage response (this study) and
  Increment 6 will be chemokine + IL-10 fields. Rationale: the core
  macrophage chemotactic-LOCALIZATION mechanism (chemotax up the ALREADY-
  EXISTING Increment-2 virus field toward the infection, via the engine's
  existing `World.set_chemotaxis` primitive) needed no new field and no new
  Rust code, so it was cheaper and more legible to validate FIRST, isolated
  from recruitment dynamics. Increment 6 will build the chemokine C field and
  Hill-driven macrophage recruitment (replacing this study's FIXED
  macrophage population with actual inflow/outflow); the APC-driven (P)
  recruitment/global-IFN-amplification piece stays part of Increment 8's
  global ODE coupling, as originally scoped. This changes the ladder's build
  ORDER only, not its content — all 10 mechanisms are still planned, and no
  scope was dropped.

how_to_read: |
  Read this top-down as a capability ladder, not a finished result:

  1. INCREMENT 0 (this scaffold) — spec authority & targets, no engine code.
     Acquire the CC3D source, transcribe Tables 1-4 into a cited params.yaml,
     digitize Figs 3B/5/7 into acceptance bands, record source-vs-paper
     discrepancies. Study: parameter-provenance (documentation only).
  2. INCREMENTS 1-8 — one capability + one study + one paper target each,
     validated at reduced (0.3 mm) scale: epithelial sheet, virus field +
     infection, IFN + resistance, death/recovery, macrophage response,
     chemokine/IL-10 fields, NK/CD8+ cytotoxic killing, global ODE coupling.
     (Increments 5/6 were RE-SCOPED/swapped from the original ladder order —
     see the note in biological_story below.)
  3. INCREMENT 9 — the capstone: full composite at 1 mm^2 paper scale, 50
     replicas, evaluated against the Increment-0 acceptance bands for Figs
     3B (time series vs ODE), 5 (viral-load sweep, lethal threshold), and 7
     (infection-fraction sweep). This is the "reproducibility achieved"
     deliverable — not yet reached.

  Full ladder detail: docs/superpowers/specs/2026-09-18-influenza-sego2022-reproduction-design.md §5.

glossary:
  - {term: "ViralInfectionVTM", definition: "The CompuCell3D supplementary source package for Sego et al. 2022 — the authoritative, source-literal parameter reference for this investigation (as opposed to the paper's printed prose tables, which it occasionally disagrees with)."}
  - {term: "Source-vs-paper discrepancy", definition: "A place where the CC3D source's literal parameter/behavior differs from the paper's printed table or text. Eight are recorded in docs/cc3d-reference/sego2022-parameters.md §7 and are treated as open items, not resolved."}
  - {term: "Cellular viral resistance (rho)", definition: "A per-cell state variable modulating virus release and infected-cell death, driven by local type-I IFN exposure."}
  - {term: "Global ODE compartment", definition: "The Price (2015)-derived whole-organ immune ODE model that Sego 2022 couples bidirectionally to the spatial CPM patch via scaling factors eta/theta."}
  - {term: "Acceptance band", definition: "A digitized value/lo/hi target range per observable, read by eye from a paper figure (Figs 3B/5/7), used as the pass/fail criterion for the Increment 9 capstone reproduction."}

at_a_glance:
  - {study: parameter-provenance, role: "Increment 0: establishes the cited parameter authority, provenance docs, and digitized figure targets; documents open source-vs-paper discrepancies. No simulation."}
  - {study: epithelial-sheet-baseline, role: "Increment 1: validates the confluent epithelial-sheet substrate (geometry + 1mm^2 throughput) as a process-bigraph composite. Substrate only — no biology reproduction claim."}
  - {study: virus-field-infection, role: "Increment 2: validates the virus field (diffusion/decay) + stochastic H->I infection MECHANISM (local spread, population conserved) over the Increment-1 sheet. Mechanism only — no resistance/IFN/immune cells yet, and no Figs 3B/5/7 reproduction claim (still PENDING, Increment 9)."}
  - {study: ifn-resistance, role: "Increment 3: validates the type-I IFN field + per-cell resistance MECHANISM gating virus secretion by (1-resist) over the Increment-2 virus-field/infection path — PRIMARY evidence is total_virus roughly halved (~53% at step 20 through ~58% at step 40); n_I is a weaker, corroborating signal at the tested step (~4% at step 20, widening to ~23% by step 40). Mechanism only — death/recovery/Allee/IL-10/immune cells/APC-driven IFN amplification not yet modeled; resist plateaus ~0.55 (not ~1), an OPEN Increment-9 calibration question; no Figs 3B/5/7 reproduction claim (still PENDING, Increment 9)."}
  - {study: epithelial-fate, role: "Increment 4: validates the full epithelial-fate lifecycle MECHANISM — infection (H->I) + infected death (I->D) + cellularized Allee death/recovery (H<->D) over the Increment-2/3 path. Dead lesion grows via H->I->D (n_D 0->14 at 200 updates, 0->77 at 500 updates); Allee recovery (D->H) confirmed bidirectionally correct (deterministic + organic evidence, 3-12 events/run). Mechanism only — direct Allee death (H->D) is honestly reported as essentially absent at 0.3mm scale (verified genuine, not a bug, via rate instrumentation), an OPEN Increment-9 calibration flag; NK/CD8+ contact-killing, chemokine/IL-10 fields, other immune cells, and APC-driven IFN amplification not yet modeled; no Figs 3B/5/7 reproduction claim (still PENDING, Increment 9)."}
  - {study: macrophage-response, role: "Increment 5 (RE-SCOPED ahead of chemokine/IL-10 fields — see the 5/6 re-scope note below): validates the macrophage (type M) chemotactic-LOCALIZATION MECHANISM — macrophages chemotax up the unchanged Increment-2 virus field via the engine's existing linear-lambda primitive and accumulate at the infection, robust across 5 seeds (5, 17, 23, 42, 100) with an unbiased interior-placed control (Task 5.1 fix round 1, commit 4092d7c): mean distance-to-infection change -13.39 sites (range -11.52 to -17.75), negative in 5/5 seeds, chemotaxis on, vs a near-isotropic lambda=0 control (mean -0.85, range -4.99 to +3.45); chemotaxis-on beats the control in every seed. Localization only — NO virus phagocytosis (the CC3D source itself has none, a paper-vs-source discrepancy, honestly recorded), NO recruitment dynamics (a fixed population is placed at scenario build time; chemokine/APC-Hill-driven recruitment is Increment 6/8), a 5-seed (modest) ensemble, 2D-approximation geometry, and the engine's linear (not the source's saturating/COM) chemotaxis form; no Figs 2/3A reproduction claim (still PENDING, Increment 9)."}
  - {study: signaling-fields, role: "Increment 6: validates the chemokine + IL-10 diffusible-FIELD MECHANISM over the Increment-5 macrophage scenario (Task 6.1, commit 48c96c1) — macrophage-released chemokine (Hill-self-regulated) forms a spatial gradient CENTERED ON THE MACROPHAGE CLUSTER, confirmed two independent ways: per-cell 0.00261 at macrophages vs 0.00062 far (4.2x), and a raw-lattice radial profile decaying monotonically 0.00195 -> 0.00033 across 6 distance bins (5.9x). IL-10 is positive and increasing from BOTH regulated sources (macrophages 2.97e-4 Hill-self-regulated, uninfected cells 3.71e-5 1-resist-gated). Field mechanism only — sig_1 is a documented constant STUB (the source's true value is TNF/global-ODE-dependent, Increment 8), g_1/g_2 use the 0.3mm-scenario eta approximation (Increment 8/9), global boundary secretion terms and IL-10's uniform initial condition are deferred (Increment 8/9), and NO chemotaxis toward the new chemokine gradient is wired yet (Increment 7's scope); no Figs 2/3A-adjacent reproduction claim (still PENDING, Increment 9)."}
  - {study: cytotoxic-killing, role: "Increment 7: validates NK/CD8 chemotactic-LOCALIZATION (robust across 5 seeds — NK mean distance change -20.37 vs a lambda=0 control's -1.02, CD8 -35.99 vs -0.54, CD8 localizing more strongly matching the paper's 2x-sensitivity claim) AND the contact-killing MECHANISM (a small close-contact scenario clears an infected cell, 1 -> 0) as two independently-correct mechanisms — but HONESTLY reports that at the scenario's own DEFAULT full scale NK/CD8 never reach actual contact with the infected cell within the run budget, so end-to-end cytotoxic CLEARANCE is WEAK/not demonstrated there (n_infected unchanged): killing CAPABILITY proven, end-to-end clearance an Increment-9 field-magnitude-calibration gap, the same root cause as the localization mechanism's own 100x chemotaxis engine-unit-scale correction. Also flags discrepancy #7 (resist-DIRECT kill-rate multiplier), deferred nearby-population killing term (Increment 8), and unmodeled haptotaxis; no Figs 2/3A-adjacent reproduction claim (still PENDING, Increment 9)."}

