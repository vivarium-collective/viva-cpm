schema_version: 3
name: tstmd-network-connectivity
status: complete
phase: Decide
title: Crosslinking builds ECM network connectivity (real TST-MD, 2D)
confidence: Mechanism-confirmed
investigation: merks-ecm-reciprocity-2d

question: >-
  In the real 2D bead-spring ECM engine, does increasing the number of
  crosslinks raise the connectivity (giant component) of the fiber network,
  reproducing the percolation mechanism that underlies Fig 2B of Keijzer &
  Merks 2026?

hypothesis: >-
  With no crosslinks the fiber network is essentially disconnected; adding
  crosslinks sharply raises the fraction of beads in the largest connected
  component, a percolation-onset signature.

objective: >-
  Sweep the requested crosslink count over {0, 500, 2000, 5000, 10000, 20000}
  through the real engine and measure, from the built network, the
  giant-component fraction (beads nodes; fiber bonds + crosslinks edges).

description: >-
  REAL output of the TST-MD engine via the viva-tstmd Docker bridge. For each
  crosslink setting a fresh crosslinked network (1500 strands) is generated and
  its giant-component fraction measured. NOTE: requested != created — only bead
  pairs within crosslink_max_r=6 are linked, so created counts are
  {0, 397, 1661, 3754, 7212, 13231}. A 2D, mechanism-level analog of the
  percolation result in Keijzer & Merks 2026 Fig 2B.

readouts:
  - name: Giant-component fraction
    identifier: giant_component
    units: fraction of beads
    status: measured
    description: Size of the largest connected component (beads = nodes, bonds+crosslinks = edges) / number of beads.
  - name: Crosslinks created
    identifier: crosslinks_created
    units: count
    status: measured
    description: Crosslink bonds actually formed (bond type != fiber) for each requested count.

behavior_tests:
  - name: Crosslinking connects the fiber network (percolation onset)
    classification: primary
    description: >-
      Introducing crosslinks raises the giant component by more than 10x over
      the uncrosslinked network. Measured: giant component 0.0007 (0 crosslinks)
      -> 0.177 (397 created) -> ~0.29 (>=1661 created) — a >250x jump at onset.
    measure: giant_component
    pass_if: giant_component at the lowest nonzero crosslink setting >= 10 * giant_component at zero crosslinks
    status: passed
    result: PASS
    paper_reference: Keijzer & Merks 2026, Fig 2B (network percolation / giant component rises with crosslinking)

visualizations:
  - name: Network connectivity — interactive
    address: local:TstmdNetworkConnectivity
embed_visualizations:
  - name: Interactive figure
    title: Giant-component fraction vs crosslinks created
    url: /workspace/studies/tstmd-network-connectivity/viz/interactive.html

findings:
  - id: F-01
    kind: computational
    status: confirms
    statement: >-
      Crosslinking sharply raises ECM network connectivity: the giant component
      jumps from 0.0007 (no crosslinks) to 0.18 at ~400 crosslinks and ~0.29 at
      >=1600 — the percolation-onset mechanism behind Fig 2B.
  - id: F-02
    kind: methodological
    status: partial
    statement: >-
      Connectivity saturates near 0.29 at these reduced fiber/crosslink
      densities rather than reaching full percolation (~1.0 at the paper's HPC
      scale). The ONSET direction is reproduced; the full percolated regime
      needs near-paper-scale networks (a documented scope/calibration limit).

conclusion: >-
  The real engine reproduces, in 2D, the percolation-onset mechanism of Fig 2B:
  crosslinking takes the fiber network from disconnected to a connected cluster.
  Full percolation (giant component ~1.0) is not reached at the reduced CPU
  densities used — a documented scope limit, not a claimed match.

key_assumptions:
  - Giant component measured on the built network (it is a network property, roughly constant over the run).
  - Reduced densities vs paper HPC scale; 1 seed per crosslink setting.
  - requested crosslinks != created (crosslink_max_r=6 gating); the created count is the honest x-axis.

conditions:
  baseline:
    name: baseline
    composite: viva_cpm_studies.composites.tstmd.tstmd_coupled
    params: {n_cross: 5000, fiber_stiffness: 200.0, target_area: 10, mcs: 20}
  model_settings: []

gate_status: passed
runs:
  - run_id: tstmd-network-connectivity-real
    name: real crosslink sweep (6 settings) through TST-MD
    status: completed
    canonical: true
    timestamp: '2026-10-03'
    seeds:
      - 12345678
