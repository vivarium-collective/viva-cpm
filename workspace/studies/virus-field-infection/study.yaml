    model_observable: "pbg_cpm_studies/influenza/fields.py VIRUS_DIFFUSION_LENGTH_SITES = 25 sites (5 cell diameters x 5 sites/diameter); new-infection distances (5.0-32.0 sites, raw) land ~0.61x as far from prior infection as a uniform-random null baseline (ratio threshold <0.75; shuffled-field non-local control fails at ~1.13), and the first 3 updates with new infections stay under a tighter 50-site (2x diffusion-length) absolute bound."
    source: "CC3D ViralInfectionVTM source (pbg_cpm_studies/influenza/params.yaml virus.diffusion_length_cell_diam)"
    status_in_workspace: "Diffusion length wired into the field; the study's primary locality behavior test compares against a discriminating uniform-random null baseline (not a fixed multiple of this length), with the diffusion length itself used only for the secondary early-update absolute-bound check (50 sites = 2x). No acceptance-band comparison to a digitized figure yet."
    cites: [sego2022influenza]
  - expectation: "Sego et al. 2022 Fig 6 shows the spatial pattern of virus concentration and infected cells spreading outward from an initial lesion over simulated time."
    model_observable: "This study's discriminating locality result (new infections land ~0.61x as far from prior infection as a uniform-random null baseline would predict, vs ~1.13x for a shuffled-field non-local control) is the same qualitative phenomenon (local outward spread from an active lesion) that Fig 6 depicts."
    source: "Sego 2022 Fig 6"
    status_in_workspace: "Referenced QUALITATIVELY only -- no digitized acceptance band exists for Fig 6 in this workspace (unlike Figs 3B/5/7, which are cell-count time-series targets in pbg_cpm_studies/influenza/targets/ and are not spatial-pattern targets). A quantitative Fig-6 comparison is not attempted by this study."
    cites: [sego2022influenza]

