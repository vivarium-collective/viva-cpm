  new_parameters: [patch_mm, seed, init_infected_frac]
  modified_processes: [pbg_cpm_studies.composites.influenza.epithelial_sheet_baseline (adds fields + secretory_types)]
  new_listeners: []
  notes: |
    Wraps the existing CPMProcess (now with `n_fields=1`,
    `secretory_types=[types.I]`, and a `fields:` spec entry from
    `fields.virus_field_spec_entry()`) plus a new InfectionProcess wired
