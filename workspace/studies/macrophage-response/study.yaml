findings:
  - id: F-01
    kind: computational
    status: confirms
    mechanism_origin: engineered
    evidence:
      from_test: Chemotaxis-on reduces distance to infection in every tried seed
      divergence_factor: null
      observed: "distance change -12.35 (seed 5), -13.26 (seed 17), -11.52 (seed 23), -17.75 (seed 42), -12.05 (seed 100); mean -13.39, negative in 5/5 seeds; interior-placed scenario, start distance 47.20 sites all seeds"
    statement: |
      Macrophages chemotaxing up the (unchanged, Increment-2) virus field via
      the engine's existing linear-lambda `World.set_chemotaxis` primitive
      genuinely and CONSISTENTLY localize to the infection: their mean
      distance to the infected-cell centroid falls in every one of 5 tried
      seeds, not just on average. This is the study's central confirming
      result, and matches the qualitative direction of Sego 2022's Fig 2B /
      Fig 3A macrophage-accumulation claim -- not (yet) its quantitative
      magnitude.
  - id: F-02
    kind: computational
    status: confirms
    mechanism_origin: engineered
    evidence:
      from_test: Chemotaxis-on ends closer than the lambda=0 control in every seed (paired comparison)
      divergence_factor: null
      observed: "control (lambda=0) distance change -4.99 (seed 5), +0.69 (seed 17), +3.45 (seed 23), -2.53 (seed 42), -0.84 (seed 100); mean -0.85, range -4.99 to +3.45 (spread 8.44), no consistent sign"
    statement: |
      Placing BOTH the macrophage cluster and the infection in the domain
      interior (fix round 1, commit `4092d7c`) produces a genuinely
      near-isotropic lambda=0 control -- small changes with no consistent
      direction across seeds -- unlike the OLD corner-placed control, which
      drifted with a strong, consistent bias (the confound the fix removed).
      This confirms the localization in F-01 is caused by chemotaxis
      specifically, not by wall-proximity drift, adhesion, or scenario
      geometry alone.
  - id: F-03
    kind: computational
    status: confirms
    mechanism_origin: engineered
    evidence:
      from_test: Mean on/off gap exceeds the control's own seed-to-seed spread
      divergence_factor: 1.486
      observed: "mean on/off gap -12.54 sites (mean_on -13.39 minus mean_off -0.85) vs control's own seed-to-seed spread 8.44 sites (max +3.45 minus min -4.99); gap/spread ratio ~1.49"
    statement: |
      The mean on/off gap exceeds the control's own noise floor (its
      seed-to-seed spread), so the localization effect is not explainable by
      control noise alone -- a direct, seed-by-seed paired comparison also
      confirms chemotaxis-on beats chemotaxis-off in all 5/5 seeds, not just
      on average. Together with F-01/F-02, this establishes the chemotaxis
      mechanism is both necessary and sufficient for the observed
      localization, and that the finding replicates across seeds rather than
      being a single-seed artifact (the concern that fix round 1 addressed).

conclusion: |
  LOCALIZATION MECHANISM VALIDATED, NOT REPRODUCED -- now demonstrated
  ROBUSTLY across seeds with an unbiased control (fix round 1, commit
  `4092d7c`). Macrophages chemotaxing up the (unchanged, Increment-2) virus
  field via the engine's existing linear-lambda `World.set_chemotaxis`
  primitive genuinely localize to the infection: mean distance to the
  infection centroid decreases in 5/5 tried seeds (mean -13.39 sites, range
  -11.52 to -17.75) when chemotaxis is on, while the identical starting
  configuration (both clusters interior-placed, start distance 47.20 sites)
  with chemotaxis off shows a small, directionless change (mean -0.85, range
  -4.99 to +3.45) -- confirmed both by the full scenario (paired seed-by-seed
  comparison: on beats off in 5/5 seeds; mean gap -12.54 exceeds the
  control's own spread 8.44) and by a minimal, fully deterministic 2-cell
  engine-sanity check. This validates the LOCALIZATION mechanism (matching
  Sego 2022 Fig 2B / Fig 3A's qualitative direction) -- it is NOT a claim
  that any quantitative reproduction target is met, that macrophages
  phagocytose virus (the CC3D SOURCE has no per-macrophage virus-uptake
  mechanism -- only a global ODE clearance term, Increment 8 -- so the
  paper's Fig 2 "phagocytosis" panel is not reproduced here or claimed to be
  a source-literal mechanism), or that recruitment dynamics are modeled (a
  FIXED macrophage population is placed at scenario build time; chemokine/
  APC-Hill-driven recruitment is Increment 6/8). The 5-seed ensemble is a
  modest sample -- enough to show the effect replicates and is not a
  seed-specific curve-fit, but not a systematic statistical power analysis
  or a source-scale replicate count (an open Increment-9 item). The scenario
  also uses a NON-CONFLUENT 2D approximation of the source's z=2
  immune-layer-over-confluent-z=1-sheet geometry, and the engine's LINEAR
  chemotaxis form rather than the source's saturating/COM-scaled form --
  both open Increment-9 items. No Figs 2/3A reproduction claim is made --
  that verdict stays PENDING until Increment 9 (the capstone).

