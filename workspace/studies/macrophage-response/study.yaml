      motivation: "This study's F-04 finding -- the on/off contrast holds directionally across a couple of tried seeds (5, 23) but with a smaller margin than the canonical seed=17 -- should be hardened into a systematic multi-seed replicate sweep once Increment 9 needs a quantitative (not just qualitative) localization claim."
