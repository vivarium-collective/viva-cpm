biological_summary: |
  Macrophages (`types.M`) are placed in open Medium space, away from a
  seeded epithelial infection, and wired to chemotax up the extracellular-
  virus gradient using the engine's existing linear-lambda chemotaxis
  primitive (`World.set_chemotaxis`) over the SAME virus field
  (secretion/diffusion/decay from infected cells) validated in Increment 2 --
  no new field, no Rust change. Over a 30-update run (seed=17), the
  macrophage population's mean distance to the infection centroid closes by
  nearly a third (26.302 -> 18.198 sites, -30.8%) when chemotaxis is on
  (lambda=5000, the CC3D source's `chemotaxis_v_macro` value), while an
  identical starting configuration with chemotaxis mechanically disabled
  (lambda=0) drifts AWAY instead (26.302 -> 30.585, +16.3%) -- an honest side
  effect of the macrophages' corner starting placement under undirected
  thermal Potts motion, not a masking bug. A minimal 2-cell engine-sanity
  check isolates the same contrast even more sharply from the fuller
  scenario's multi-cell stochasticity. This demonstrates the qualitative
  mechanism behind Sego 2022's Fig 2B / Fig 3A macrophage-accumulation claim
  -- macrophages find and cluster at the infection -- but macrophages here
  ONLY localize: there is no virus phagocytosis (the CC3D source itself has
  none, only a global ODE clearance term deferred to Increment 8), no
  ongoing recruitment (a fixed 6-macrophage population is placed at scenario
  build time; chemokine/APC-Hill-driven recruitment arrives in Increment
  6/8), and the engine's linear chemotaxis form differs from the source's
  saturating/COM-scaled form. Single-seed (17) demonstration; the source's
  z=2 immune-layer geometry is approximated here by a non-confluent 2D patch.
  All caveats are open Increment-9 items, not resolved here.

key_assumptions:
  - Single seed (17, the investigation's canonical determinism seed) for the
    driver -- the measured localization numbers are a single-run
    demonstration of the mechanism's qualitative and approximate
    quantitative behavior, not a statistically characterized effect size
    across a systematic replicate sweep. A couple of other seeds tried during
    tuning (5, 23) showed the same qualitative direction with a smaller
    margin (F-04, flagged not hidden).
  - 2D-APPROXIMATION geometry — the CC3D source places immune cells in a z=2
    layer above a CONFLUENT z=1 epithelial sheet, with macrophages seeded at
    high-virus MEDIUM sites; this study instead uses a NON-CONFLUENT 2D patch
    (open Medium around a small epithelial block) so macrophages have real
    lattice space to migrate through in-plane. Faithful z=2 immune-layer
    geometry is deferred to Increment 9.
  - NO virus phagocytosis — the CC3D SOURCE has no macrophage-attributed
    virus-uptake mechanism (only a global ODE clearance term, Increment 8);
    the paper's Fig 2 "phagocytosis" panel is therefore a paper-vs-source
    discrepancy, recorded honestly, not implemented here or in the source
    itself. Macrophages in this study ONLY localize (chemotax + adhesion +
    volume constraint).
  - RECRUITMENT is stubbed — a FIXED macrophage population (6 cells) is
    placed at scenario build time; ongoing chemokine/APC-Hill-driven
    recruitment (inflow/outflow) is not modeled here (Increment 6 for the
    chemokine field, Increment 8 for the APC-driven global-ODE coupling).
  - CHEMOTAXIS FUNCTIONAL-FORM gap — the source uses a saturating,
    per-cell-COM-scaled lambda (`chemotaxis_v_macro / (1 + concentration)`,
    `ChemotaxisSteppable.__update_chemotaxis_lambda`); the engine primitive
    used here (`World.set_chemotaxis`) is a fixed LINEAR-regime lambda per
    (field, type). The fidelity criterion tested here is the localization
    BEHAVIOR, not the exact functional form -- an Increment-9 calibration
    item, not fixed here.
  - The lambda=0 control's distance INCREASES rather than staying flat -- an
    honest side effect of the macrophages' corner-placement geometry
    (undirected Potts fluctuations can only push their COM away from that
    corner on net), not a masking bug. The ON vs OFF CONTRAST is the
    evidentiary claim (large and consistent at this seed), not the OFF
    trajectory's absolute shape.
  - Domain/timing constants (20-site margin, 1500-MCS field warmup, 30 x
    10-MCS updates) were tuned empirically against the virus field's own
    steady-state length scale (`sqrt(D/decay) ~ 25 sites`, matching
    `fields.VIRUS_DIFFUSION_LENGTH_SITES`) so the macrophages' starting
    distance is just outside that scale -- not derived from a paper figure.
    Fine for mechanism validation; not a quantitative Fig-2B/3A
    distance-vs-time reproduction.
  - No chemokine/IL-10 field, no NK/CD8+ T cell, no NK/CD8 contact-killing,
    and no APC-driven global IFN/recruitment amplification exist yet -- all
    later increments.

literature_anchors:
  - expectation: "Macrophages are recruited to and accumulate at the site of infection, chemotaxing up locally-produced signals (Sego 2022 Fig 2B qualitative schematic, Fig 3A macrophage-count trajectory); Table 3 gives the source's macrophage-virus chemotaxis coefficient (chemotaxis_v_macro = 5E3)."
    model_observable: "Macrophages' mean distance to the infection centroid falls 26.302 -> 18.198 sites (-30.8%) over 30 updates with chemotaxis on (lambda=5000, seed=17); a lambda=0 control (same seed/scenario) does not localize (drifts to 30.585 instead), and a minimal 2-cell engine-sanity check confirms the same contrast in isolation."
    source: "CC3D ViralInfectionVTM source (ChemotaxisSteppable, ImmuneModelInputs.py chemotaxis_v_macro) via pbg_cpm_studies/influenza/params.yaml chemotaxis: and macrophage: blocks"
    status_in_workspace: "Wired and measured directly (localization mechanism, on vs off). No recruitment dynamics (fixed population), no phagocytosis (source has none), and the engine's linear chemotaxis form (not the source's saturating/COM form) are open Increment-9 items. No acceptance-band comparison to a digitized figure yet."
    cites: [sego2022influenza]
  - expectation: "The paper's Fig 2 depicts macrophages phagocytosing virus at the infection site, in addition to localizing there."
    model_observable: "Not modeled: the CC3D SOURCE itself has no macrophage-attributed virus-uptake term (only a global ODE clearance term, a later increment) -- this is a paper-vs-source discrepancy recorded honestly, not a gap in this study's fidelity to the source. Only the LOCALIZATION half of Fig 2's claim is addressed here."
    source: "Sego 2022 Fig 2 (paper prose/schematic) vs CC3D ViralInfectionVTM source (absence of a macrophage virus-uptake steppable)"
    status_in_workspace: "Explicitly NOT modeled, and explicitly NOT claimed -- recorded as an open discrepancy, not a silent omission."
    cites: [sego2022influenza]

