biological_summary: |
  Macrophages (`types.M`) and a seeded epithelial infection are both placed
  in the domain's INTERIOR (each at least `margin_sites` from every noflux
  wall, separated by `separation_sites` of open Medium -- neither cluster
  wall-pinned, a geometry fix, Task 5.1 commit `4092d7c`, that removes a
  control-drift confound an earlier corner-placed version had), and
  macrophages are wired to chemotax up the extracellular-virus gradient
  using the engine's existing linear-lambda chemotaxis primitive
  (`World.set_chemotaxis`) over the SAME virus field (secretion/diffusion/
  decay from infected cells) validated in Increment 2 -- no new field, no
  Rust change. Over a 40-update run, tested across 5 seeds (5, 17, 23, 42,
  100) with fixed, non-tuned knobs, the macrophage population's mean
  distance to the infection centroid falls consistently when chemotaxis is
  on (mean change -13.39 sites, negative in 5/5 seeds), while the identical
  starting configuration with chemotaxis mechanically disabled (lambda=0)
  shows a small, directionless change (mean -0.85, no consistent sign across
  seeds) -- a genuinely near-isotropic control, not a masked drift.
  Chemotaxis-on beats the lambda=0 control in every individual seed, and the
  mean on/off gap exceeds the control's own seed-to-seed spread, so the
  effect is not explainable by control noise alone. A minimal 2-cell
  engine-sanity check isolates the same contrast even more sharply from the
  fuller scenario's multi-cell stochasticity. This demonstrates the
  qualitative mechanism behind Sego 2022's Fig 2B / Fig 3A macrophage-
  accumulation claim -- macrophages find and cluster at the infection,
  robustly across seeds -- but macrophages here ONLY localize: there is no
  virus phagocytosis (the CC3D source itself has none, only a global ODE
  clearance term deferred to Increment 8), no ongoing recruitment (a fixed
  6-macrophage population is placed at scenario build time; chemokine/
  APC-Hill-driven recruitment arrives in Increment 6/8), and the engine's
  linear chemotaxis form differs from the source's saturating/COM-scaled
  form. The 5-seed ensemble is a modest sample size, not a full statistical
  power analysis; the source's z=2 immune-layer geometry is still
  approximated here by a non-confluent 2D patch. All caveats are open
  Increment-9 items, not resolved here.

key_assumptions:
  - MODEST ENSEMBLE SIZE — 5 seeds (5, 17, 23, 42, 100), fixed non-tuned
    knobs (chosen before any seed's trajectory was inspected). This is
    enough to show the localization effect REPLICATES (5/5 seeds show
    chemotaxis-on beating the control; the mean gap exceeds the control's
    own spread) and is not a single-seed curve-fit, but it is not a
    systematic statistical power analysis, a formal significance test, or a
    source-scale replicate count. Increment 9 (full reproduction, at paper
    scale) is where a fuller statistical treatment belongs if the capstone
    needs it.
  - 2D-APPROXIMATION geometry — the CC3D source places immune cells in a z=2
    layer above a CONFLUENT z=1 epithelial sheet, with macrophages seeded at
    high-virus MEDIUM sites; this study instead uses a NON-CONFLUENT 2D
    patch, with BOTH the epithelial/infection cluster and the macrophage
    cluster placed in the domain interior (open Medium around and between
    them) so macrophages have real lattice space to migrate through in-plane
    and the lambda=0 control is not wall-biased. Faithful z=2 immune-layer
    geometry is deferred to Increment 9.
  - NO virus phagocytosis — the CC3D SOURCE has no macrophage-attributed
    virus-uptake mechanism (only a global ODE clearance term, Increment 8);
    the paper's Fig 2 "phagocytosis" panel is therefore a paper-vs-source
    discrepancy, recorded honestly, not implemented here or in the source
    itself. Macrophages in this study ONLY localize (chemotax + adhesion +
    volume constraint).
  - RECRUITMENT is stubbed — a FIXED macrophage population (6 cells) is
    placed at scenario build time; ongoing chemokine/APC-Hill-driven
    recruitment (inflow/outflow) is not modeled here (Increment 6 for the
    chemokine field, Increment 8 for the APC-driven global-ODE coupling).
  - CHEMOTAXIS FUNCTIONAL-FORM gap — the source uses a saturating,
    per-cell-COM-scaled lambda (`chemotaxis_v_macro / (1 + concentration)`,
    `ChemotaxisSteppable.__update_chemotaxis_lambda`); the engine primitive
    used here (`World.set_chemotaxis`) is a fixed LINEAR-regime lambda per
    (field, type). The fidelity criterion tested here is the localization
    BEHAVIOR, not the exact functional form -- an Increment-9 calibration
    item, not fixed here.
  - Geometry fix (Task 5.1 fix round 1, commit `4092d7c`) — an earlier
    version of this scenario placed the macrophage cluster in a domain
    CORNER, diagonally opposite the (centered) infection. A noflux wall is
    a hard reflector on two sides at once at a corner, so that control's
    thermal/wall drift was NOT isotropic -- it was biased to net-drift away
    from the corner, which happened to point roughly toward the infection,
    inflating the apparent on/off gap. Placing BOTH clusters in the domain
    interior removes that bias. The ABSOLUTE distance numbers from that
    earlier version (26.302 -> 18.198 on, 26.302 -> 30.585 off, seed=17
    only) are NOT comparable to this study's current numbers (different
    scenario geometry, different start distance) and have been fully
    superseded by the multi-seed interior-placement results above.
  - Domain/timing constants (30-site margin, 25-site separation, 3000-MCS
    field warmup, 40 x 10-MCS updates) are fixed, physically-motivated
    values (the field warmup approaches the virus field's own decay
    relaxation time, `1/decay_per_mcs ~ 3500` MCS) chosen BEFORE inspecting
    any seed's trajectory -- not re-tuned per seed, and not derived from a
    paper figure. Fine for mechanism validation; not a quantitative
    Fig-2B/3A distance-vs-time reproduction.
  - No chemokine/IL-10 field, no NK/CD8+ T cell, no NK/CD8 contact-killing,
    and no APC-driven global IFN/recruitment amplification exist yet -- all
    later increments.

