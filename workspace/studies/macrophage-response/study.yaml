    model_observable: "Macrophages' mean distance to the infection centroid falls in 5/5 tried seeds (mean -13.39 sites, range -11.52 to -17.75) with chemotaxis on, vs a near-isotropic lambda=0 control (mean -0.85, range -4.99 to +3.45) over the same seeds and an interior-placed, geometrically unbiased scenario; chemotaxis-on beats the control in every individual seed, and a minimal 2-cell engine-sanity check confirms the same contrast in isolation."
    source: "CC3D ViralInfectionVTM source (ChemotaxisSteppable, ImmuneModelInputs.py chemotaxis_v_macro) via pbg_cpm_studies/influenza/params.yaml chemotaxis: and macrophage: blocks"
    status_in_workspace: "Wired and measured directly (localization mechanism, on vs off, robust across 5 seeds with an unbiased control). No recruitment dynamics (fixed population), no phagocytosis (source has none), and the engine's linear chemotaxis form (not the source's saturating/COM form) are open Increment-9 items. No acceptance-band comparison to a digitized figure yet."
    cites: [sego2022influenza]
  - expectation: "The paper's Fig 2 depicts macrophages phagocytosing virus at the infection site, in addition to localizing there."
    model_observable: "Not modeled: the CC3D SOURCE itself has no macrophage-attributed virus-uptake term (only a global ODE clearance term, a later increment) -- this is a paper-vs-source discrepancy recorded honestly, not a gap in this study's fidelity to the source. Only the LOCALIZATION half of Fig 2's claim is addressed here."
    source: "Sego 2022 Fig 2 (paper prose/schematic) vs CC3D ViralInfectionVTM source (absence of a macrophage virus-uptake steppable)"
    status_in_workspace: "Explicitly NOT modeled, and explicitly NOT claimed -- recorded as an open discrepancy, not a silent omission."
    cites: [sego2022influenza]

