schema_version: 3
name: macrophage-response
status: in-progress
phase: Simulate
title: "Increment 5: macrophages chemotax up the virus field and LOCALIZE to the infection, robust across 5 seeds with an unbiased interior control — LOCALIZATION mechanism validated, reproduction still PENDING"
confidence: Provisional
investigation: influenza-sego2022

purpose:
  question: |
    Introducing the macrophage cell type (`types.M`) into the CPM world and
    wiring it to chemotax up the extracellular-virus gradient (the engine's
    existing `World.set_chemotaxis` primitive, no Rust change): does the
    macrophage population actually LOCALIZE to the infection over time (mean
    centre-of-mass distance to the infected-cell centroid decreases),
    robustly across multiple seeds and with an UNBIASED (interior-placed,
    not wall-pinned) lambda=0 control, so the effect isn't a seed-specific
    curve-fit or a wall-drift confound?
  mechanism: macrophage_chemotactic_localization

report:
  title: "Increment 5: macrophage chemotaxis reduces distance to the infection in 5/5 tried seeds (mean -13.39 sites) against a near-isotropic lambda=0 control (mean -0.85 sites) — LOCALIZATION mechanism validated, reproduction still PENDING"
  verdict: documented
  confidence: medium
  evidence_quality: measured
  objective: >-
    Drive `run.run_macrophage_response` (Task 5.1, fix round 1 at commit
    `4092d7c`) — a non-confluent 2D-approximation scenario
    (`immune.build_macrophage_scenario_spec`) in which BOTH the epithelial/
    infection patch (one cell seeded infected) AND the macrophage cluster
    (6 cells) sit in the domain's INTERIOR, each `margin_sites` (default 30)
    from every noflux wall and separated by `separation_sites` (default 25)
    of open Medium — over the Increment-2 virus field (`fields.
    add_virus_field`, unchanged), with macrophage chemotaxis wired via the
    engine's `World.set_chemotaxis` primitive
    (`immune.set_macrophage_chemotaxis`). Measure the macrophages' mean
    centre-of-mass distance to the infected-cell centroid over 40 updates
    (10 MCS/update, after a 3000-MCS field warmup), chemotaxis on
    (lambda=5000, `params.yaml`'s `macrophage.chemotaxis_v_macro`) vs off
    (lambda=0 control), across 5 seeds (5, 17, 23, 42, 100), fixed
    non-tuned knobs — not re-tuned per seed.
  conclusion: >-
    LOCALIZATION MECHANISM VALIDATED, REPRODUCTION NOT YET ATTEMPTED. Both
    clusters start in the domain interior (same start distance, 47.20 sites,
    across every seed — only the seed and the chemotaxis lambda differ).
    With chemotaxis on (lambda=5000), the macrophages' mean distance to the
    infection centroid DECREASES in EVERY one of the 5 tried seeds: -12.35
    (seed 5), -13.26 (seed 17), -11.52 (seed 23), -17.75 (seed 42), -12.05
    (seed 100) — mean -13.39, range -11.52 to -17.75. With chemotaxis off
    (lambda=0, the control, same seeds/geometry), the change is small and
    has NO consistent sign — -4.99, +0.69, +3.45, -2.53, -0.84 — mean -0.85,
    range -4.99 to +3.45 (spread 8.44): a near-isotropic, noisy baseline, not
    a directional drift. Chemotaxis-on beats the lambda=0 control in EVERY
    individual seed (paired comparison, not just on average), and the mean
    on/off gap (-12.54) exceeds the control's own seed-to-seed spread
    (8.44) — the effect is not explainable by control noise alone. A
    minimal, fully deterministic 2-cell engine-sanity check (unaffected by
    the interior-placement fix, self-contained geometry) shows the same
    qualitative contrast: chemotaxis on 26.87 -> 12.31 sites over 20 steps,
    off 26.87 -> 32.60. This validates the LOCALIZATION mechanism
    (macrophages chemotax up the virus field and accumulate at the
    infection, matching the qualitative claim of Sego 2022 Fig 2B / Fig 3A)
    — it is NOT a claim that any quantitative Fig 2/3A target (or any other
    figure) is met; that evaluation is deferred to Increment 9 (the
    capstone). Macrophages here ONLY localize — they do not consume virus
    (see caveats) and are not recruited dynamically (a fixed population is
    placed at scenario build time).
  main_insight: >-
    Fix round 1 (Task 5.1, commit `4092d7c`) addressed two rigor findings in
    the ORIGINAL single-seed/corner-placed demonstration: (1) a
    control-drift confound — a corner-pinned macrophage start meant the
    lambda=0 control's thermal/wall drift was NOT isotropic, it was biased
    to net-drift away from the corner, and that bias happened to point
    roughly toward the (centered) infection, inflating the apparent on/off
    gap; (2) single-seed/knob-tuning — all assertions and knob choices were
    made against seed=17 alone. The fix places BOTH clusters deep in the
    domain interior (no wall nearby, so the control has no preferred
    direction) and asserts across 5 seeds with knobs fixed in advance, not
    re-tuned per seed. The result is a STRONGER, more honest claim: the
    lambda=0 control is now genuinely close to isotropic (mean -0.85,
    fluctuating both signs, no directional bias), while chemotaxis-on is
    consistently and substantially negative in every seed — the on/off
    contrast is not a seed-specific curve-fit or a masked wall-drift
    artifact, it is a mechanism property that replicates. The absolute
    numbers are NOT comparable to the old single-seed corner-placement
    headline (the interior scenario starts at 47.20 sites vs. the old
    corner scenario's 26.302 sites — different geometry, different scale),
    but the qualitative and now-quantified finding is stronger: chemotaxis
    causes a consistent, seed-robust net approach that a fair (isotropic)
    control does not show.
  caveat: >-
    This is a LOCALIZATION-mechanism claim only, with explicit open items
    carried forward, kept visible rather than hidden: (1) MODEST ENSEMBLE
    SIZE — 5 seeds (5, 17, 23, 42, 100), enough to show the effect replicates
    and is not a single-seed curve-fit (5/5 seeds show ON < OFF, and the
    mean gap exceeds the control's own spread), but this is not a
    systematic statistical power analysis, a source-scale replicate count,
    or a formal significance test; Increment 9 (full reproduction, at paper
    scale) is where that fuller rigor belongs if the capstone needs it. (2)
    2D-APPROXIMATION geometry — the CC3D source places immune cells in a z=2
    layer ABOVE a CONFLUENT z=1 epithelial sheet, with macrophages seeded at
    high-virus MEDIUM sites; viva-cpm's z=1 epithelial increments don't yet
    use that dimension, so this study instead uses a NON-CONFLUENT 2D patch
    (both the epithelial/infection cluster and the macrophage cluster placed
    in the domain interior, open Medium around and between them) so
    macrophages have real lattice space to migrate through in-plane. The
    faithful z=2 immune-layer geometry over a confluent z=1 sheet is
    deferred to Increment 9. (3) NO virus phagocytosis — the CC3D SOURCE
    ITSELF has no macrophage-attributed virus-uptake mechanism (only a
    global ODE clearance term, Increment 8); the paper's Fig 2
    "phagocytosis" panel is therefore NOT a per-macrophage spatial mechanism
    in the source, and this study honestly records that discrepancy rather
    than inventing a phagocytosis mechanism the source doesn't have.
    Macrophages here ONLY localize (chemotax + adhesion + volume); they do
    not consume or remove virus from the field. (4) RECRUITMENT stubbed —
    this study places a FIXED macrophage population (6 cells) at scenario
    build time; it does not model ongoing chemokine/APC-Hill-driven
    recruitment (inflow/outflow), which is a later increment's mechanism
    (Increment 6 for the chemokine field, Increment 8 for the APC-driven
    global-ODE coupling — see the investigation's 5/6 re-scope note). (5)
    CHEMOTAXIS FUNCTIONAL-FORM gap — the source uses a saturating,
    per-cell-COM-scaled lambda
    (`chemotaxis_v_macro / (1 + concentration)`); the engine primitive used
    here (`World.set_chemotaxis`) is a fixed LINEAR-regime lambda per
    (field, type). The fidelity criterion tested here is the localization
    BEHAVIOR, not the exact functional form (an Increment-9 calibration
    item). Reproduction verdict (any Figs 2/3A quantitative target) stays
    PENDING until Increment 9 — verdict here is `documented`, NOT `passing`.
  key_metrics:
    - {name: start_distance_all_seeds, value: 47.20, note: "sites; identical across all 5 seeds (same interior-placed scenario geometry, only seed/lambda differ)"}
    - {name: mean_distance_change_chemotaxis_on, value: -13.39, note: "sites; mean over seeds {5,17,23,42,100}; range -11.52 to -17.75; negative (net approach) in 5/5 seeds"}
    - {name: mean_distance_change_lambda0_control, value: -0.85, note: "sites; mean over the same 5 seeds; range -4.99 to +3.45 (spread 8.44); near-isotropic, no consistent sign"}
    - {name: on_vs_off_paired_wins, value: "5/5", note: "chemotaxis-on ends with a MORE-negative distance change than the lambda=0 control in every individual seed"}
    - {name: on_off_mean_gap_vs_control_spread, value: "-12.54 vs 8.44", note: "the mean on/off gap exceeds the control's own seed-to-seed spread -- not explainable by control noise alone"}
    - {name: engine_sanity_2cell_on, value: "26.87 -> 12.31", note: "20 steps, minimal 2-cell world (one I source, one M cell), lambda=5000; unaffected by the interior-placement fix (self-contained geometry)"}
    - {name: engine_sanity_2cell_off, value: "26.87 -> 32.60", note: "20 steps, same 2-cell world, lambda=0.0"}

study_card:
  goal: Validate that macrophages (type M), wired to chemotax up the virus field via the engine's existing linear-lambda chemotaxis primitive, actually LOCALIZE to the infection over time, robustly across multiple seeds and against a geometrically-unbiased (interior-placed) control -- no claim about phagocytosis, recruitment dynamics, or any quantitative Fig 2/3A reproduction target.
  mechanism: A non-confluent 2D-approximation scenario (`immune.build_macrophage_scenario_spec`) places BOTH a small epithelial/infection patch (1 cell seeded infected) and a 6-macrophage cluster in the domain's INTERIOR (each >= margin_sites from every noflux wall, separated by separation_sites of open Medium -- neither cluster wall-pinned). `run.run_macrophage_response` wires the Increment-2 virus field (unchanged) + macrophage chemotaxis (`World.set_chemotaxis` via `immune.set_macrophage_chemotaxis`), warms the field up via `World.advance_fields`, then steps the coupled CPM+field world for 40 updates, recording macrophages' mean centre-of-mass distance to the infected-cell centroid each update; asserted across 5 seeds with knobs fixed in advance.
  why_before_next: Increment 6 (chemokine + IL-10 fields, Hill-driven recruitment) and Increment 8 (APC-driven global ODE coupling) both assume the core macrophage-localization mechanism already works, robustly, before adding recruitment dynamics on top of it; this study establishes that the chemotaxis primitive itself produces genuine, seed-robust spatial localization (not a wall-drift artifact or a single-seed curve-fit) before anything downstream depends on it.
  expected_result: With chemotaxis on, macrophages' mean distance to the infection centroid decreases substantially and consistently across seeds. With chemotaxis off (an interior-placed, geometrically-unbiased lambda=0 control), the change is small with no consistent sign. A direct on-vs-off comparison, seed by seed, shows chemotaxis-on ending closer than chemotaxis-off in every seed.
  main_expert_question: The ensemble is 5 seeds, enough to show the effect replicates (5/5 seeds, gap exceeds control spread) but not a systematic statistical power analysis or a source-scale run count. Is 5 seeds sufficient evidence for Increment 5's LOCALIZATION-mechanism claim, or should a larger seed ensemble (and/or a formal significance test) be run before Increment 6 builds recruitment dynamics on top of this mechanism?

question: |
  Does wiring the macrophage cell type to chemotax up the extracellular-virus
  gradient (via the engine's existing `World.set_chemotaxis` primitive, no
  Rust change) produce genuine spatial LOCALIZATION to the infection -- mean
  macrophage-to-infection distance decreasing over time -- robustly across
  multiple seeds, and with a geometrically UNBIASED (interior-placed, not
  wall-pinned) lambda=0 control that shows no such localization?

hypothesis: |
  Macrophages (`types.M`) placed in the domain interior, away from a seeded
  infection also placed in the interior (neither cluster wall-pinned), with
  chemotaxis wired toward the (unchanged, Increment-2) virus field via the
  engine's linear-lambda `World.set_chemotaxis` primitive, will move up the
  virus gradient and accumulate near the infection over time -- their mean
  centre-of-mass distance to the infected-cell centroid should decrease
  substantially and consistently across multiple seeds. A lambda=0 control
  (chemotaxis mechanically disabled, same seeds/scenario otherwise) should
  show a small, directionless change -- isolating the chemotaxis mechanism
  (rather than incidental wall drift or adhesion) as the cause of
  localization, and ruling out a seed-specific curve-fit.

objective: |
  Wire the macrophage cell type (`types.M`, Task 5.0) and virus-field
  chemotaxis (`immune.set_macrophage_chemotaxis`, Task 5.1) into a
  non-confluent 2D-approximation scenario
  (`immune.build_macrophage_scenario_spec`, fix round 1: both clusters
  interior-placed) and driver (`run.run_macrophage_response`, fix round 1:
  fixed non-tuned knobs), and measure the resulting
  `mean_distance_to_infection` series with chemotaxis on (lambda=5000,
  `params.yaml` default) vs off (lambda=0 control), across 5 seeds (5, 17,
  23, 42, 100) (Task 5.1's integration test
  `tests/test_influenza_macrophage.py::test_macrophages_localize_to_infection_across_seeds`,
  which asserts ON is negative in every seed, ON < OFF in every seed, and
  the mean on/off gap exceeds OFF's own seed-to-seed spread; plus the
  minimal 2-cell engine-sanity tests, and the fuller localization-number
  table recorded in task-5.1-report.md's fix-round-1 section). A minimal
  in-package figure (`pbg_cpm_studies/influenza/viz.py::macrophage_response_figure`,
  Task 5.2) renders the mean-distance-to-infection trajectory (on vs off
  overlay) plus the macrophage centre-of-mass path for a single representative
  run.

description: |
  Increment 5 of the influenza-sego2022 capability ladder (re-scoped ahead of
  the chemokine/IL-10 fields originally slotted here -- see the
  investigation overview's 5/6 re-scope note): introduces the macrophage
  cell type (`types.M`) and shows it chemotaxes up the extracellular-virus
  gradient toward the infection (the paper's Fig 2B / Fig 3A qualitative
  claim), using ONLY the engine's existing linear-lambda chemotaxis
  primitive (`World.set_chemotaxis`) over the unchanged Increment-2 virus
  field -- no Rust change, no new field, no recruitment dynamics, no
  phagocytosis. Fix round 1 (Task 5.1, commit `4092d7c`) hardened the
  demonstration's rigor after two review findings: the macrophage cluster
  now starts in the domain interior alongside the (also interior-placed)
  infection, rather than in a wall-pinned corner (removing a control-drift
  confound), and the localization claim is now asserted across 5 seeds with
  fixed knobs, rather than a single tuned seed. The source's z=2
  immune-layer geometry over a confluent z=1 sheet is still approximated
  here by a non-confluent 2D patch, documented as an open Increment-9 item.
  No chemokine/IL-10 fields, no NK/CD8+ T cells, no NK/CD8 contact-killing,
  no APC-driven recruitment, and no virus phagocytosis -- those (or their
  absence, in phagocytosis's case) are recorded in the caveats above, not
  modeled here.

claim: |
  Wiring macrophage chemotaxis to the (unchanged) virus field via the
  engine's existing linear-lambda primitive produces genuine spatial
  LOCALIZATION, robust across seeds and against a geometrically unbiased
  control: with both the macrophage cluster and the infection placed in the
  domain interior (start distance 47.20 sites, identical across seeds),
  chemotaxis-on reduces the macrophages' mean distance to the infection
  centroid in EVERY one of 5 tried seeds (mean change -13.39 sites, range
  -11.52 to -17.75), while the SAME starting configuration with chemotaxis
  off (lambda=0 control) shows a small, directionless change (mean -0.85,
  range -4.99 to +3.45) -- near-isotropic, not a masked drift. Chemotaxis-on
  beats the lambda=0 control in every individual seed (paired comparison),
  and the mean on/off gap (-12.54) exceeds the control's own seed-to-seed
  spread (8.44), so the effect is not explainable by control noise alone.
  This is a LOCALIZATION-MECHANISM validation claim (macrophages chemotax
  toward the infection, matching Fig 2B/3A's qualitative direction, and now
  demonstrated to replicate rather than asserted from a single seed), NOT a
  claim that any quantitative reproduction target is met, that macrophages
  phagocytose virus (the CC3D source has no such per-macrophage mechanism),
  or that recruitment dynamics are modeled (a fixed population is placed at
  scenario build time) -- that fuller reproduction verdict remains PENDING
  until Increment 9 (the capstone). The 5-seed ensemble is a modest sample,
  not a full statistical power analysis or source-scale replicate count
  (see caveats).

expected_behavior:
  - Macrophages' mean centre-of-mass distance to the infected-cell centroid
    decreases when chemotaxis is switched on (lambda=5000), consistently
    across multiple seeds.
  - The same starting configuration, with chemotaxis switched off (an
    interior-placed, geometrically unbiased lambda=0 control), shows a
    small change with no consistent sign across seeds -- not a directional
    drift.
  - A direct on-vs-off comparison, seed by seed, shows chemotaxis-on ending
    closer to the infection than chemotaxis-off in every seed, and the mean
    on/off gap exceeds the control's own seed-to-seed spread.
  - A minimal, fully deterministic 2-cell engine-sanity check (one virus-
    secreting I cell, one chemotaxing M cell, unaffected by the
    interior-placement fix) shows the same qualitative contrast, isolated
    from the fuller scenario's stochastic Potts dynamics.

readouts:
  - name: Macrophage localization to infection (chemotaxis on), across seeds
    identifier: mean_distance_to_infection
    units: sites
    status: measured
    description: >-
      `mean_distance_to_infection` change (final - initial) from
      `run.run_macrophage_response` across 5 seeds (5, 17, 23, 42, 100),
      chemotaxis_lambda=None (params.yaml default 5000), interior-placed
      scenario (start distance 47.20 sites, all seeds): -12.35, -13.26,
      -11.52, -17.75, -12.05 -- mean -13.39, negative (net approach) in
      5/5 seeds.
  - name: Lambda=0 control is near-isotropic (no consistent localization)
    identifier: mean_distance_to_infection_control
    units: sites
    status: measured
    description: >-
      Same 5 seeds and interior-placed scenario, chemotaxis_lambda=0.0:
      -4.99, +0.69, +3.45, -2.53, -0.84 -- mean -0.85, range -4.99 to +3.45
      (spread 8.44), no consistent sign. This is the unbiased control the
      Task-5.1 fix round 1 geometry targeted (both clusters interior-placed,
      neither wall-pinned) -- contrast with the OLD corner-placed control,
      which drifted with a strong, consistent +16.3% bias (see
      report.main_insight).
  - name: Chemotaxis-on beats lambda=0 control in every individual seed
    identifier: on_off_paired_comparison
    units: sites
    status: measured
    description: >-
      Paired seed-by-seed comparison (not just means): chemotaxis-on's
      distance change is MORE negative than the lambda=0 control's in all
      5/5 seeds. The mean on/off gap (-12.54) exceeds the control's own
      seed-to-seed spread (8.44), so the effect is not explainable by
      control noise alone.
  - name: Engine-sanity 2-cell chemotaxis check
    identifier: engine_sanity_distance
    units: sites
    status: measured
    description: >-
      A minimal 2-cell world (one virus-secreting I cell, one chemotaxing M
      cell, opposite corners of a 50x50 domain), fully deterministic
      (seed=17), UNAFFECTED by the interior-placement fix (self-contained
      geometry, not the full scenario): chemotaxis on (lambda=5000) 26.87 ->
      12.31 over 20 steps (source and macrophage nearly meet); chemotaxis
      off (lambda=0) 26.87 -> 32.60. Isolates the chemotaxis mechanism from
      the fuller scenario's stochastic multi-cell Potts dynamics.

behavior_tests:
  - name: Chemotaxis-on reduces distance to infection in every tried seed
    classification: primary
    description: |
      The full interior-placed macrophage-response scenario, run for 40
      updates with chemotaxis on (lambda=5000, params.yaml default), across
      5 seeds (5, 17, 23, 42, 100): macrophages' mean distance to the
      infection centroid must decrease (final < initial) in EVERY seed, not
      just on average.
    measure: {kind: all_seeds_on_distance_change_negative, condition: macrophage-response-on-multiseed, stat: final}
    pass_if: {op: eq, value: true}
    status: passed
    result: PASS
    evaluated_by: tests/test_influenza_macrophage.py::test_macrophages_localize_to_infection_across_seeds
  - name: Chemotaxis-on ends closer than the lambda=0 control in every seed (paired comparison)
    classification: primary
    description: |
      Same 5 seeds and scenario, on vs off compared directly per seed (not
      just each condition's own mean): chemotaxis-on's distance change must
      be more negative than the lambda=0 control's in every individual
      seed -- guards against both conditions drifting similarly by chance
      in any one seed.
    measure: {kind: all_seeds_on_lt_off, condition: macrophage-response-on-vs-off-multiseed, stat: final}
    pass_if: {op: eq, value: true}
    status: passed
    result: PASS
    evaluated_by: tests/test_influenza_macrophage.py::test_macrophages_localize_to_infection_across_seeds
  - name: Mean on/off gap exceeds the control's own seed-to-seed spread
    classification: primary
    description: |
      The mean chemotaxis-on vs lambda=0-control gap (-12.54 sites) must
      exceed the control's own seed-to-seed spread (max minus min of the
      5 control values, 8.44 sites) -- the effect must not be explainable
      by control noise alone.
    measure: {kind: mean_gap_exceeds_control_spread, condition: macrophage-response-gap-vs-spread, stat: final}
    pass_if: {op: gt, value: "control_spread"}
    status: passed
    result: PASS
    evaluated_by: tests/test_influenza_macrophage.py::test_macrophages_localize_to_infection_across_seeds
  - name: Engine-sanity — macrophage moves up the virus gradient
    classification: secondary
    description: |
      A minimal, fully deterministic 2-cell world (one I source, one M
      cell): the M cell's distance to the I cell must decrease once
      chemotaxis is wired, isolated from the fuller scenario's multi-cell
      Potts stochasticity. Unaffected by the interior-placement fix
      (self-contained geometry).
    measure: {kind: distance_final_lt_initial, condition: engine-sanity-on, stat: final}
    pass_if: {op: lt, value: "distance[0]"}
    status: passed
    result: PASS
    evaluated_by: tests/test_influenza_macrophage.py::test_macrophage_moves_up_virus_gradient_engine_sanity
  - name: Engine-sanity — no approach without chemotaxis (negative control)
    classification: secondary
    description: |
      Same minimal 2-cell world, lambda=0: the M cell must NOT net-approach
      the I cell.
    measure: {kind: distance_final_ge_initial, condition: engine-sanity-off, stat: final}
    pass_if: {op: ge, value: "distance[0]"}
    status: passed
    result: PASS
    evaluated_by: tests/test_influenza_macrophage.py::test_macrophage_does_not_approach_source_without_chemotaxis

