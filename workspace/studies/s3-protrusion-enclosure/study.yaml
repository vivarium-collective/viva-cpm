schema_version: 3
name: s3-protrusion-enclosure
status: in-progress
phase: Evaluate
title: Protrusions to enclosure — can protrusion mechanics reach stable wrapping?
confidence: Provisional
investigation: endosymbiosis
question: >-
  Can an archaeal-like deformable host physically surround and enclose a bacterial partner from
  differential adhesion alone, and under which mechanical conditions does wrapping reach a stable
  topology rather than a partial cup or a transient contact?
hypothesis: >-
  The host engulfs the symbiont when host-symbiont adhesion beats the combined surface-tension cost
  (J_hs < J_sM - J_hM); stable enclosure is the emergent plateau of the host's coverage of the
  symbiont boundary, with a sharp transition in the mechanical parameters.
objective: >-
  Run the protrusion_enclosure CPM composite (campaign composite B) at strong vs weak host-symbiont
  adhesion, measure the enclosure fraction (host coverage of the symbiont boundary), and sweep the
  adhesion x symbiont-surface-tension plane to produce the enclosure phase diagram.
description: >-
  Gate G3 (Enclosure) of the viva-genesis eukaryogenesis campaign "The Endosymbiotic Transition",
  realized on the real Rust Cellular Potts engine (differential-adhesion engulfment, Glazier &
  Graner 1993 Fig. 18 physics). Replaces the analytical Helfrich-threshold stand-in with an
  emergent, measured spatial outcome.
claim: >-
  Differential adhesion alone drives a deformable host to stable enclosure of a symbiont in a
  well-defined mechanical regime (J_hs below the J_sM - J_hM threshold); below the transition the
  host forms only a partial cup or leaves the symbiont free.
expected_behavior:
- Under strong adhesion (low J_hs) the host coverage of the symbiont boundary rises to a stable plateau near 1.0 (full enclosure).
- Under weak adhesion (high J_hs) coverage settles low (partial cup / free symbiont); the transition tracks J_hs = J_sM - J_hM.
visualizations:
- name: Endosymbiosis phase diagram — enclosure (G3) plane
  rendered: viz/endosymbiosis-phase-diagram.html
embed_visualizations:
- name: Phase diagram
  title: Endosymbiosis phase diagram — enclosure (G3) plane
  url: /workspace/studies/s3-protrusion-enclosure/viz/endosymbiosis-phase-diagram.html
observables:
- name: enc/enclosure_fraction
  store_path: enc/enclosure_fraction
- name: enc/enclosed
  store_path: enc/enclosed
readouts:
- name: Enclosure fraction
  identifier: enc/enclosure_fraction
  units: fraction
  status: measured
  description: Host coverage of the symbiont boundary (symbiont faces touching host / all exposed symbiont faces); 1.0 = fully enclosed.
behavior_tests:
- name: Host reaches stable enclosure under strong adhesion
  classification: primary
  description: >-
    With strong host-symbiont adhesion (J_hs=6, below the J_sM-J_hM=12 threshold) the host wraps the
    symbiont to a stable plateau. Measured from the composite run (40 steps x 60 MCS): enclosure_fraction=1.000.
  measure:
    kind: derived_scalar
    path: enc/enclosure_fraction
  pass_if: {op: ">=", value: 0.85}
  status: passed
  result: PASS
- name: Weak adhesion leaves the symbiont free (failure route)
  classification: control
  description: >-
    With weak host-symbiont adhesion (J_hs=18, above threshold) the host cannot hold the symbiont;
    coverage settles low. Measured: enclosure_fraction=0.176.
  measure:
    kind: derived_scalar
    path: enc/enclosure_fraction
  pass_if: {op: "<", value: 0.45}
  status: passed
  result: PASS
gate_status: passed
runs:
- run_id: s3-enclosure-strong-adhesion
  name: protrusion_enclosure (j_hs=6, strong adhesion)
  status: completed
  canonical: true
  timestamp: '2026-10-27'
  seeds: [7]
  emitter: enc/* overwrite scalars
  outcomes:
    Host reaches stable enclosure under strong adhesion:
      result: PASS
      measured_value: 1.0
      notes: enclosure_fraction 1.000 at 2400 sweeps; stable plateau
      evaluated_by: viva_cpm_studies.endosymbiosis.process.ProtrusionEnclosureProcess
- run_id: s3-enclosure-weak-adhesion
  name: protrusion_enclosure (j_hs=18, weak adhesion)
  status: completed
  canonical: true
  timestamp: '2026-10-27'
  seeds: [7]
  emitter: enc/* overwrite scalars
  outcomes:
    Weak adhesion leaves the symbiont free (failure route):
      result: PASS
      measured_value: 0.176
      notes: enclosure_fraction 0.176 at 2400 sweeps; free symbiont / partial cup
      evaluated_by: viva_cpm_studies.endosymbiosis.process.ProtrusionEnclosureProcess
findings:
- id: F-01
  kind: computational
  status: confirms
  statement: >-
    Differential adhesion alone drives stable enclosure in a well-defined mechanical regime: the
    adhesion x symbiont-surface-tension phase diagram shows a sharp transition tracking
    J_hs = J_sM - J_hM, with stable enclosure, partial wrapping, transient internalization, and no
    enclosure as distinct regimes.
conclusion: >-
  The CPM enclosure model reaches stable wrapping as an emergent outcome when adhesion beats the
  surface-tension cost, and the phase diagram maps where it can and cannot. This is the G3 enclosure
  plane of the endosymbiosis phase diagram and a candidate replacement for S3's analytical gate.
