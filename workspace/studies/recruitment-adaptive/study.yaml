schema_version: 3
name: recruitment-adaptive
status: complete
phase: Decide
title: "Adaptive receptor recruitment: fold-change detection across background cue levels"
investigation: chemotactic-recruitment

question: |
  Across a RANGE of background cue levels -- not just one -- can responders
  keep being recruited to a rising source cue? Fold-change detection
  (fold_change_detection) predicts that an adaptive receptor mechanism, which
  re-centers its half-occupancy point on the locally sensed mean rather than
  fixing it, should recruit at both low and high static backgrounds, while a
  fixed-kd (hill_occupancy) mechanism saturates and collapses once the
  background rises far enough to pin occupancy near its ceiling on both sides
  of the gradient. This study is the LOCKED CONTRACT: it does not itself run
  the model -- it defines the behavior-test bands the model-building loop
  (Task 7) must clear for "the adaptive model works" to be true.

hypothesis: |
  An adaptive receptor mechanism (a slowly-tracked local-mean set-point that
  re-centers the Hill kd every SAMPLE-step increment) recruits responders at
  low background AND at high background, because it senses the CHANGE in
  local occupancy rather than its absolute level (Barkai & Leibler 1997;
  Tu, Shimizu & Berg 2008). A fixed-kd hill mechanism recruits at low
  background but collapses at high background once both sides of the
  gradient saturate near occupancy ceiling. Both mechanisms are abolished
  when the downstream chemotactic response is blocked, since neither is a
  metric artifact -- only a mechanism that isn't receptor-mediated at all
  (the static-lambda control) would ignore that block.

objective: |
  Author the acceptance contract for the adaptive-receptor rung of the
  faithful chemotaxis mechanism ladder (pbg_cpm_studies.model_building.
  mechanisms): three primary behavior tests plus a receptor-gating control,
  with pass/fail bands set from real measured recruitment_index values
  (3-12 seeds) already gathered while calibrating the ladder. The loop
  driver built in the next task runs mechanisms.simulate_condition against
  these bands; this study does not itself constitute a completed run.

description: |
  This is the LOCKED CONTRACT study for the adaptive rung of the
  recruitment-model-building faithful mechanism ladder (static_lambda ->
  hill_occupancy -> adaptive_receptor). The ladder is built and calibrated:
  static recruits at every background (it is not receptor-mediated, so the
  background cancels out of the chemotaxis bias exactly); hill_occupancy
  recruits at low background but collapses once a high uniform background
  saturates receptor occupancy on both sides of the local gradient; and
  adaptive_receptor rescues recruitment at high background by re-centering
  its effective kd on the locally sensed mean every SAMPLE-step increment,
  so it detects the FOLD CHANGE (the rise) in local concentration rather than
  its absolute level. This study authors the behavior_tests that make "the
  adaptive model works" falsifiable and locked BEFORE the loop is driven
  against it: recruitment at low background, recruitment at high background
  (the discriminating test -- only the adaptive mechanism passes; hill
  collapses to 0), and receptor gating (blocking the response abolishes
  recruitment for both receptor-gated mechanisms, but NOT for the
  non-receptor-mediated static mechanism, which is the discriminating
  knockout the loop must climb past). `conditions.baseline.composite`
  points at the real, registered base recruitment world
  (pbg_cpm_studies.composites.chemotaxis.recruitment -- source secretion +
  responder chemotaxis, shared by all three ladder mechanisms); the
  adaptive_receptor mechanism itself (kd/hill/epsilon) is what the loop
  INSTALLS on top of that base world, documented under
  `conditions.model_settings` rather than as baseline params, since it
  directly manipulates the Rust CPM engine's chemotaxis-occupancy API
  (world.set_chemotaxis_occupancy + a per-increment adaptation update)
  rather than being its own registered @composite_generator. The actual
  runner the loop drives is
  mechanisms.simulate_condition("adaptive_receptor", condition, seeds,
  steps) (see key_assumptions / model_change).

claim: |
  A receptor mechanism that adapts its half-occupancy set-point to the
  locally sensed background (fold-change detection) recruits responders
  across a RANGE of background cue levels where a fixed-kd mechanism
  saturates and fails: measured recruitment_index at low_bg is 0.82
  (adaptive) vs 0.58 (hill); at high_bg it is ~0.56 (adaptive, mean over 12
  seeds) vs 0.00 (hill, deterministic collapse). Blocking the receptor-gated
  response abolishes recruitment for both (0.00), while the non-receptor
  static mechanism ignores the block (0.72) -- the discriminating control
  that isolates receptor-mediated gating as the necessary cause.

purpose:
  question: |
    Across a range of background cue levels (fold_change_detection), does an
    adaptive receptor mechanism keep recruiting responders to a rising
    source cue where a fixed-kd mechanism saturates and collapses?
  mechanism: adaptation

requires: [spatial_chemotaxis, receptor_occupancy, adaptation]

parent_studies:
  - study: recruitment-receptor-baseline
    condition: tests-passed
    relation: refines

sourcing:
  decision: compose
  modules: [chemotaxis_receptor]
  rationale: >-
    receptor occupancy is catalogued; adaptation is composed on top via
    occupancy-space chemotaxis with an adaptive kd

catalog:
  chemotaxis: [spatial_chemotaxis]
  chemotaxis_receptor: [spatial_chemotaxis, receptor_occupancy]

conditions:
  baseline:
    name: adaptive
    composite: pbg_cpm_studies.composites.chemotaxis.recruitment
    params: {cue_rate: 10.0, chemo_lambda: 14.0}
  variants: []
  model_settings:
    - name: occupancy_chemotaxis
      note: >-
        The adaptive mechanism the loop installs on the base world: occupancy-space
        chemotaxis (Rust set_chemotaxis_occupancy) with an adaptive kd that tracks the
        local mean concentration. Params kd=1.0, hill=4.0, epsilon=0.5. Run via
        pbg_cpm_studies.model_building.mechanisms.simulate_condition("adaptive_receptor", ...).
      params: {kd: 1.0, hill: 4.0, epsilon: 0.5}

readouts:
  - name: Recruitment index
    identifier: recruitment_index
    units: fraction of responders within radius
    status: measured
    description: >-
      Fraction of responder cell centres of mass within the recruitment
      radius of the source centroid, read off the final live world after
      mechanisms.simulate_condition's SAMPLE-step run increments.
  - name: Responder mean distance
    identifier: mean_distance
    units: px
    status: measured
    description: >-
      Mean centre-of-mass distance from responders to the source centroid,
      the distance-based complement to recruitment_index.

visualizations:
  - name: "Model-building loop — mechanism ladder (recruitment index per rung × condition)"
    address: local:RecruitmentLadder

behavior_tests:
  - name: recruits_low
    classification: primary
    description: >-
      Pass criterion: recruitment index in [0.4, 1.0] at low background
      (background=0.0). Measured: adaptive 0.82, hill 0.58 (both mechanisms
      recruit at low background -- this test establishes baseline
      competence, not discrimination; recruits_high is the discriminator).
    measure: {kind: recruitment_index, condition: low_bg, stat: final}
    pass_if: {op: in_range, low: 0.4, high: 1.0}
    cites: [recruitment-baseline]
  - name: receptor_gating
    classification: primary
    control: negative
    description: >-
      Pass criterion: recruitment index <= 0.15 at high_bg_blocked
      (background=400.0, blocked=True -- the activated-type chemotaxis
      lambda forced to 0 downstream of receptor occupancy). Measured:
      hill/adaptive 0.00 (response blocked, receptor-mediated recruitment
      abolished); static 0.72 (ignores the block -- it is not
      receptor-mediated, so it FAILS this test, isolating receptor-gated
      response as the necessary cause).
    measure: {kind: recruitment_index, condition: high_bg_blocked, stat: final}
    pass_if: {op: "<=", value: 0.15}
    cites: [nasser2009]
  - name: recruits_high
    classification: primary
    description: >-
      Pass criterion: recruitment index in [0.35, 1.0] at high background
      (background=400.0). THE DISCRIMINATING TEST -- fold-change detection:
      measured adaptive ~0.56 (mean over 12 seeds) PASSES; hill_occupancy
      0.00 (deterministic collapse, occupancy saturated on both sides of the
      gradient) FAILS. Only the adaptive mechanism clears this band.
    measure: {kind: recruitment_index, condition: high_bg, stat: final}
    pass_if: {op: in_range, low: 0.35, high: 1.0}
    cites: [barkai1997, tu2008]

controls:
  - kind: negative
    name: Receptor gating (response blocked downstream of receptor occupancy)
    test: receptor_gating
    description: >-
      With the cue present at a high background (400.0) but the
      activated-type chemotaxis lambda forced to 0 (blocked=True), both
      receptor-gated mechanisms (hill_occupancy and adaptive_receptor) fall
      to recruitment_index 0.00 -- receptor-mediated recruitment is
      abolished. The non-receptor static_lambda mechanism ignores the block
      (0.72), because its chemotaxis bias is a raw field-difference term
      unaffected by occupancy gating -- isolating receptor-mediated response
      as this test's discriminator, and static_lambda as a designed FAIL
      case for it.
  - kind: diagnostic
    name: Fixed-kd hill mechanism is the discriminating knockout
    test: recruits_high
    description: >-
      hill_occupancy is not a negative control on the world (the cue and
      response are both present and receptor-gated) -- it is the
      DISCRIMINATING KNOCKOUT the loop must climb past: a receptor mechanism
      with the same Hill machinery as adaptive_receptor but a FIXED kd
      collapses to recruitment_index 0.00 at high background because
      occupancy saturates near its ceiling on both sides of the local
      gradient, erasing the signal the chemotaxis bias needs. Only adding
      adaptation (a tracked, re-centering kd_eff) rescues recruitment
      (~0.56). A loop-built model that reuses hill_occupancy's fixed-kd
      machinery without adaptation will fail recruits_high by design.

key_assumptions:
  - >-
    Measured bands are set from 3-12 seed means gathered during faithful
    mechanism-ladder calibration (docs/superpowers/notes/
    2026-08-18-faithful-ladder-calibration.md), not from a canonical run of
    THIS study -- status is in-progress / phase Build because the loop
    (Task 7) has not yet been driven against this locked contract.
  - >-
    `conditions.baseline.composite` is the real, registered base
    recruitment world (pbg_cpm_studies.composites.chemotaxis.recruitment)
    shared by all three ladder mechanisms (static_lambda / hill_occupancy /
    adaptive_receptor); its params are only what that generator accepts
    (cue_rate, chemo_lambda). The adaptive_receptor mechanism itself
    (kd/hill/epsilon) is what the loop INSTALLS on top of that base world --
    it is not a resolvable @composite_generator on its own, since
    mechanisms.py drives the Rust CPM engine's chemotaxis-occupancy API
    directly (world.set_chemotaxis_occupancy + a per-increment adaptation
    update) rather than assembling a separate process_bigraph Composite
    document -- so those params live under conditions.model_settings as
    documentation. The loop driver runs it via
    mechanisms.simulate_condition(mechanism="adaptive_receptor", condition,
    seeds, steps), reading kd/hill/epsilon from
    conditions.model_settings[0].params.
  - >-
    low_bg / high_bg / high_bg_blocked are entries of mechanisms.CONDITIONS
    (background 0.0 / 400.0 / 400.0+blocked), not separate study
    conditions -- behavior_tests[].measure.condition names the CONDITIONS
    key the loop driver passes to simulate_condition, not a study slug.
  - >-
    recruits_low's band [0.4, 1.0] is intentionally non-discriminating
    (both adaptive 0.82 and hill 0.58 clear it) -- it exists to confirm
    baseline chemotactic competence before recruits_high does the actual
    discriminating work between the fixed-kd and adaptive mechanisms.

model_change:
  base_model: pbg_cpm_studies.composites.chemotaxis.recruitment
  new_processes: []
  new_state_variables: []
  new_parameters: [kd, hill, epsilon]
  modified_processes: []
  new_listeners: []
  notes: >-
    Not yet realized as a run under this study -- the contract documents the
    adaptive_receptor arm of pbg_cpm_studies.model_building.mechanisms,
    which layers an adaptive kd_eff tracking update on top of the existing
    chemotaxis-occupancy bias (world.set_chemotaxis_occupancy), itself built
    on the chemotaxis.recruitment world (source secretion + responder
    chemotaxis). No new CPMProcess or listener was added; the mechanism
    reconfigures the existing engine's per-type chemotaxis parameters
    between SAMPLE-step run increments.

conclusion: |
  DECIDED -- PASS. The model-building loop (scripts/build_recruitment_loop.py)
  was driven against this locked 3-test contract and climbed the faithful
  mechanism ladder emergently, NOT by script: starting from static_lambda it
  read the graded behavior tests each iteration and installed the mechanism
  the most-negative failing margin demanded. iter 0 static_lambda fails
  receptor_gating (0.69 > 0.15 -- not receptor-mediated, ignores the block)
  -> install hill_occupancy; iter 1 hill_occupancy fails recruits_high (0.00 --
  fixed-kd occupancy saturates on both sides of the gradient at high
  background) -> install adaptive_receptor; iter 2 adaptive_receptor clears all
  three (recruits_low 0.9167 in [0.4,1.0]; receptor_gating 0.00 <= 0.15;
  recruits_high 0.7222 in [0.35,1.0]) -> DONE in 3 iterations, violations=[].
  The pass is perturbation-stable: re-grading adaptive_receptor at a fully
  disjoint 6-seed set (7,53,71,89,101,113) clears all three again. A GIVE_UP
  companion run with adaptive_receptor withheld from the library terminates
  HONESTLY at hill_occupancy rather than faking a pass. Fold-change detection
  (Barkai & Leibler 1997; Tu, Shimizu & Berg 2008) is therefore sufficient, on
  the real Rust CPM engine, to keep recruiting responders across a range of
  background cue levels where a fixed-kd receptor mechanism collapses. Full
  emergent trajectory + audit/lock/perturbation/give-up traces:
  ../../investigations/chemotactic-recruitment/trajectory.json (schema
  model_build_trajectory/v2); loop state: .pbg/loop/recruitment-adaptive.json.

gate_status: passed

runs:
  - run_id: recruitment-adaptive-loop-6seed
    name: recruitment-adaptive model-building loop (6 seeds, 40 steps)
    status: completed
    canonical: true
    timestamp: '2026-08-19'
    seeds: [11, 17, 23, 29, 37, 43]
    emitter: model-build loop (mechanisms.simulate_condition, real Rust CPM engine)
    provenance:
      trajectory: workspace/investigations/chemotactic-recruitment/trajectory.json
      loop_state: .pbg/loop/recruitment-adaptive.json
      driver: scripts/build_recruitment_loop.py
      locked_tests_hash: sha256:8cf0e0c748ae9363f
    outcomes:
      recruits_low:
        result: PASS
        measured_value: 0.9167
        notes: >-
          recruitment_index 0.9167 at background=0.0, band [0.4, 1.0]. Baseline
          competence -- both adaptive and (earlier rung) hill clear it.
        evaluated_by: viva_superpowers.test_contract
      receptor_gating:
        result: PASS
        measured_value: 0.0
        notes: >-
          recruitment_index 0.00 at high_bg_blocked (background=400.0,
          blocked=True), band <= 0.15. Blocking the response downstream of
          receptor occupancy abolishes recruitment -- the non-receptor
          static_lambda rung FAILED this (0.69), isolating receptor-gated
          response as the necessary cause.
        evaluated_by: viva_superpowers.test_contract
      recruits_high:
        result: PASS
        measured_value: 0.7222
        notes: >-
          recruitment_index 0.7222 at background=400.0, band [0.35, 1.0]. THE
          DISCRIMINATOR -- fold-change detection: adaptive_receptor clears it
          where the fixed-kd hill_occupancy rung collapsed to 0.00.
        evaluated_by: viva_superpowers.test_contract
