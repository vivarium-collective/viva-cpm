biological_summary: |
  `run.repro_fig3b` assembles the Task-9.1 capstone driver
  (`run_full_model`, every Increment 0-8 mechanism in one source-ordered
  per-MCS loop) into a seeded ensemble over the Sego-2022 Fig-3B scenario
  (5% initial infection, 0.3 mm / 1225-cell patch at paper scale) and
  compares the ensemble mean against Fig. 3B's digitized acceptance bands
  (`targets/fig3b.json`: value = the paper's ODE reference curve, lo/hi =
  its reported 50-replica spatial-model spread, IFN + downstream
  immune/signal observables flagged `soft: true` per the paper's own Sec.
  3.1 note on where spatial-vs-ODE spread is largest). At the REDUCED scale
  this task's fast pytest test uses (`replicas=2, cells_per_side=15,
  steps=20, seed0=0` -- 225 epithelial cells over ~0.09 simulated days),
  the ensemble does not land in-band for any of the 12 mapped observables
  across every digitized checkpoint (`band_eval['passed']=False`); the
  population-count observables (uninfected/infected/dead cells) show the
  largest misses because the target's own trajectory for those moves the
  farthest over its 0.0-3.5-day checkpoint window (uninfected 1164 -> ~2
  cells) while this reduced run only reaches t_days~0.092 and a ~5.4x
  smaller starting population -- a scale-and-duration mismatch, honestly
  reported, not a claim that any Increment 0-8 mechanism is individually
  miscalibrated (each was validated independently in its own increment).
  The soft-flagged systemic/signaling observables (type1_ifn, antibodies,
  nk_cells, cd8_t_cells, il10) land in-band at more checkpoints (5-7 of 8)
  than the hard-flagged population counts, mostly because their early-
  checkpoint target values are still small and their bands are widened
  1.5x -- not because those subsystems are individually better-calibrated.
  THIS STUDY DOES NOT CLAIM FIG-3B IS REPRODUCED: the paper-scale 50-
  replica, 1225-cell, ~3.5-day ensemble (`repro_fig3b`'s own docstring
  documents this as `replicas=50, cells_per_side=35, steps~720`) is the
  Mac-mini Phase-B follow-up that will actually set the `reproduced`
  verdict for Fig 3B. No band in `targets/fig3b.json` was edited and no
  model constant was tuned toward a better-looking number.

key_assumptions:
  - REDUCED-SCALE REPORT, NOT PAPER-SCALE REPRODUCTION -- every band_eval
    number in this study.yaml comes from the exact `replicas=2,
    cells_per_side=15, steps=20, seed0=0` config this task's fast pytest
    test uses, run directly to produce these numbers honestly, NOT from any
    paper-scale (50-replica, 1225-cell) run. The Mac-mini Phase-B follow-up
    (documented in `repro_fig3b`'s own docstring) is the run that will set
    any `reproduced` verdict.
  - RUN-DURATION MISMATCH -- the reduced config's 20 records x
    `mcs_per_step=7` x `s_per_mcs=60` = 8400s = ~0.097 simulated days falls
    far short of `targets/fig3b.json`'s checkpoint window (0.0-3.5 days);
    `bands.series_in_band`'s flat extrapolation carries the model's
    near-t=0 value out to every later checkpoint, which mechanically drives
    most of the reported misses -- a documented property of this reduced
    config, not a bug in `bands.series_in_band` (whose extrapolation
    behavior is itself Task 9.0's, unmodified here).
  - POPULATION-SCALE MISMATCH -- `cells_per_side=15` gives 225 epithelial
    cells vs. `targets/fig3b.json`'s `scenario.total_epithelial_cells=1225`
    (`cells_per_side=35`); raw population counts (uninfected/infected/dead/
    macrophages/nk/cd8) cannot match the target's absolute magnitudes at
    this reduced population even with perfectly calibrated rate constants.
  - INHERITED CALIBRATION-PENDING ITEMS from `run_full_model` (Task 9.1,
    unchanged here) -- the documented `NK_CD8_CHEMOTAXIS_ENGINE_SCALE=100x`
    chemotaxis engine-unit correction (Increment 7), and reduced-eta
    near-inert recruitment/nearby-killing subsystems flagged in Task 9.1's
    own docstring -- carried forward, not resolved by this task.
  - "`targets/fig3b.json` WAS NOT EDITED and no model constant was tuned to narrow the reduced-scale gap reported here -- per the task brief's explicit instruction, a miss is reported honestly, not concealed."

literature_anchors:
  - expectation: "Sego 2022 Fig. 3B (Sec. 3.1): spatial and ODE model results are in close overall agreement for the 0.3mm/1225-cell, 5%-initial-infection scenario over the first several simulated days, with the most notable spatial-vs-ODE spread in Type I IFN and downstream signals/immune cells."
    model_observable: "run.repro_fig3b's ensemble (mapped to targets/fig3b.json's exact observable keys via bands.evaluate_study) at REDUCED scale (replicas=2, cells_per_side=15, steps=20): band_eval['passed']=False, 0/12 observables in-band at every checkpoint -- population-count observables miss most (uninfected_cells 1/8, dead_cells 0/8), soft-flagged systemic/signaling observables miss less (type1_ifn 7/8, antibodies 7/8), driven by this config's ~5.4x-smaller population and ~0.09-day (vs 3.5-day) run duration, not a claim about mechanism fidelity."
    source: "Sego et al. 2022, Fig. 3B, p.7 (digitized by eye, approximate) via pbg_cpm_studies/influenza/targets/fig3b.json"
    status_in_workspace: "Driver wired and evaluable (F-01); reduced-scale comparison reported honestly as a scale/duration-driven miss (F-02), NOT a reproduction claim. Paper-scale 50-replica ensemble is the Mac-mini Phase-B follow-up that will set the reproduced verdict."
    cites: [sego2022influenza]

