  regression_compatibility:
    result: PASS
    basis: "All 5 tests in `tests/test_influenza_full_model.py` pass (4 pre-existing Task 9.1 tests + this task's new `test_repro_fig3b_runs_and_evaluates_bands`); no Increment 0-8 driver, composite, or params.yaml constant is modified by this task. UPDATE (Task-9.3-review units fix, this update) -- all 9 tests in `tests/test_influenza_full_model.py` pass, including the new `test_repro_fig5_extracellular_virus_is_concentration_not_raw_sum` regression test; only `run.py`'s shared repro-observable-mapping helper (`_map_full_model_observables`) changed, leaving this study's own field-observable numbers essentially unchanged (only il10's worst_miss moved, 0.085 -> 0.088) since this scenario's raw field sums were already small at reduced scale."
  biological_validation:
