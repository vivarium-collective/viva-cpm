    kind: computational
    status: partial
    mechanism_origin: engineered
    evidence:
      from_test: null
      divergence_factor: 52.0
      observed: "band_eval['passed']=False at replicas=2, cells_per_side=15, steps=20, seed0=0; 0/12 observables in-band at every checkpoint; uninfected_cells worst_miss=52.0 (largest), dead_cells worst_miss=48.0"
    statement: |
      This is the study's central honest finding, reported as a GAP (status:
      partial), not hidden behind the driver's structural correctness
      (F-01): at reduced scale (225 epithelial cells vs. the target's 1225;
      ~0.09 simulated days vs. the target's 0.0-3.5-day checkpoint window),
      the ensemble does not land in-band for any observable across every
      checkpoint. The population-count observables (uninfected/infected/
      dead) show the largest misses because their target trajectories move
      the farthest over the checkpoint window (1164 -> ~2 uninfected cells)
      -- a scale-and-duration artifact of this fast-test config, not
      evidence any Increment 0-8 mechanism is individually wrong (each was
      independently validated in its own increment's study). NOT tuned
      away: no constant was adjusted and `targets/fig3b.json` was not
      edited to narrow this gap.

conclusion: |
  `run.repro_fig3b` (Task 9.2) IS IMPLEMENTED AND WIRED CORRECTLY: it runs a
  seeded ensemble of `run_full_model` over the Fig-3B scenario, maps every
  observable onto `targets/fig3b.json`'s exact keys, ensemble-means via
  `bands.aggregate_replicas`, and evaluates via `bands.evaluate_study`,
  verified by `tests/test_influenza_full_model.py::
  test_repro_fig3b_runs_and_evaluates_bands`. FIG-3B IS NOT REPRODUCED AT
  THE REDUCED SCALE THIS TASK'S FAST TEST USES, AND THIS STUDY DOES NOT
  CLAIM IT IS: at `replicas=2, cells_per_side=15, steps=20, seed0=0`
  (225 epithelial cells vs. the target's 1225; ~0.09 simulated days vs. the
  target's 0.0-3.5-day checkpoint window), `band_eval['passed']` is False
  and 0 of 12 observables land in-band at every digitized checkpoint (see
  `report.key_metrics` for the full per-observable breakdown). This is
  expected at this scale -- a smaller population and a far shorter run
  duration than the digitized bands assume -- not evidence any wired
  mechanism is incorrect; every Increment 0-8 subsystem this driver
  assembles was independently validated in its own increment's study. THE
  PAPER-SCALE 50-REPLICA, 35x35-CELL (1225-cell), ~2-SIMULATED-DAY ENSEMBLE
  (documented in `repro_fig3b`'s own docstring as the Mac-mini Phase-B
  follow-up) IS REQUIRED BEFORE ANY `reproduced` VERDICT FOR FIG 3B CAN BE
  SET. This study's own verdict stays `documented`, and
  `conclusion_verdicts.biological_validation` stays PENDING. No band was
  widened, no constant was tuned, and `targets/fig3b.json` was not edited
  to make any number in this report look better than it is.

