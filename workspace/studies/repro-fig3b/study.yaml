    kind: computational
    status: confirms
    mechanism_origin: engineered
    evidence:
      from_test: repro_fig3b runs and returns a well-formed ensemble/band evaluation
      divergence_factor: null
      observed: "replicas=2; ensemble contains all 12 fig3b observable keys; band_eval contains 'passed'; uninfected_cells 214.0 (t=0.0) -> 213.0 (t=0.092)"
    statement: |
      `run.repro_fig3b` is wired correctly: it runs a seeded ensemble of
      `run_full_model` over the Fig-3B scenario, maps every observable onto
      `targets/fig3b.json`'s exact keys via `_FIG3B_OBSERVABLE_MAP`,
      ensemble-means them with `bands.aggregate_replicas`, and produces a
      well-formed `band_eval` via `bands.evaluate_study` -- the ensemble
      machinery itself is verified correct and reusable for the Mac-mini
      Phase-B paper-scale run.
