schema_version: 3
name: repro-fig3b
status: in-progress
phase: Evaluate
title: "Reproduction — Fig 3B (time series vs ODE)"
confidence: Provisional
investigation: influenza-sego2022
parent_studies:
  - study: global-coupling
    condition: tests-passed

purpose:
  question: |
    With every mechanism subsystem from Increments 0-8 wired into ONE
    per-MCS loop (`run.run_full_model`, Task 9.1), does running that model
    as a seeded ensemble over the Sego-2022 Fig-3B scenario (5% initial
    infection, 0.3 mm / 1225-cell patch) and comparing the ensemble mean to
    the digitized Fig-3B acceptance bands (`targets/fig3b.json`,
    `bands.evaluate_study`) show the model landing in-band -- and, the
    honest question this task exists to surface, does a REDUCED-scale
    ensemble (small population, few replicas, short duration -- the only
    scale a fast CI test can afford) tell us anything meaningful about
    fidelity, or does it mostly measure population-scale and run-duration
    mismatch rather than mechanism correctness?
  mechanism: full_model_ensemble_vs_fig3b_acceptance_bands

report:
  title: "repro_fig3b runs a seeded ensemble of run_full_model over the Fig-3B scenario and evaluates it against targets/fig3b.json via bands.evaluate_study — at the reduced scale this task's fast test uses (replicas=2, cells_per_side=15, steps=20, ~0.09 simulated days), 0 of 12 observables are in-band at every digitized checkpoint (band_eval['passed']=False); the paper-scale 50-replica/35x35-cell/~3.5-day ensemble is deferred to the Mac-mini Phase-B follow-up"
  verdict: documented
  confidence: medium
  evidence_quality: measured
  objective: >-
    Implement `run.repro_fig3b(*, replicas, cells_per_side, steps, seed0)`
    (Task 9.2): for each of `replicas` seeds, run `run.run_full_model`
    (Task 9.1) with `init_infection_frac=0.05` at the given
    `cells_per_side`/`steps`; map each run's `counts`/`fields`/`ode` series
    onto the EXACT observable key names in `targets/fig3b.json`
    (`_FIG3B_OBSERVABLE_MAP`: uninfected_cells, infected_cells, dead_cells,
    macrophages, nk_cells, cd8_t_cells <- counts; extracellular_virus,
    type1_ifn, chemokines, il10 <- fields; apcs, antibodies <- the ODE's
    integrated P/A states, which have no spatial CPM type or diffusive
    field of their own); ensemble-mean each observable across replicas
    (`bands.aggregate_replicas`); evaluate the ensemble against the fig3b
    bands (`bands.evaluate_study`), honoring each observable's `soft` flag
    (IFN + downstream immune/signal observables get the 1.5x widened band,
    per `bands.SOFT_WIDEN_FACTOR`). Measured at this task's added test's
    reduced config (`replicas=2, cells_per_side=15, steps=20, seed0=0`,
    `tests/test_influenza_full_model.py::
    test_repro_fig3b_runs_and_evaluates_bands`) -- the same config reported
    below, run directly (not fabricated) to produce every number in this
    report.
  conclusion: >-
    THE DRIVER IS WIRED CORRECTLY AND PRODUCES A WELL-FORMED BAND
    EVALUATION; IT DOES NOT REPRODUCE FIG-3B AT REDUCED SCALE, AND THIS
    STUDY DOES NOT CLAIM IT DOES. At `replicas=2, cells_per_side=15,
    steps=20, seed0=0` (225 epithelial cells vs. the target's 1225; the
    ensemble's simulated time only reaches t_days~0.092, i.e. ~2.2 hours,
    vs. the target's checkpoints out to t_days=3.5), `band_eval['passed']`
    is False and 0 of the 12 fig3b observables land in-band at EVERY
    digitized checkpoint. Two distinct, honestly-separated reasons drive
    this, neither of which is a mechanism defect: (1) POPULATION-SCALE
    mismatch -- 225 cells is ~5.4x smaller than the target's 1225, so raw
    counts (uninfected_cells, dead_cells, macrophages, nk_cells, cd8_t_cells)
    cannot match the target's absolute magnitudes even if every rate
    constant were perfectly calibrated; (2) RUN-DURATION mismatch -- the
    reduced test's 20 records x 7 MCS/record x 60s/MCS = 8400s = 0.097 days
    of simulated time falls far short of the target's checkpoints (0.0 to
    3.5 days), so `bands.series_in_band`'s flat extrapolation carries the
    model's near-t=0 value out to every later checkpoint, comparing an
    early-infection snapshot against a target that expects the FULL
    infection/clearance trajectory. Per-observable results (n_in/n_checked
    out of 8 digitized checkpoints each, worst_miss = largest relative
    out-of-band distance): uninfected_cells 1/8 (worst_miss 52.0),
    infected_cells 2/8 (4.5), dead_cells 0/8 (48.0), extracellular_virus
    0/8 (0.5), apcs 0/8 (0.48), macrophages[soft] 2/8 (0.19), nk_cells[soft]
    6/8 (0.10), cd8_t_cells[soft] 5/8 (0.20), chemokines[soft] 3/8 (0.067),
    type1_ifn[soft] 7/8 (0.037), antibodies[soft] 7/8 (0.089), il10[soft]
    5/8 (0.088). NONE of these numbers were tuned to look better, and
    `targets/fig3b.json` was NOT edited -- the band is the fixed oracle per
    the task brief. UNITS FIX (Task-9.3-review MUST-FIX, this update):
    `extracellular_virus`/`type1_ifn`/`chemokines`/`il10` are now mapped as
    the field's SPATIAL-MEAN concentration (`sum(field_conc)/n_lattice_sites`)
    instead of `run_full_model`'s raw per-lattice-site sum -- the units
    `targets/fig3b.json` actually digitizes. At THIS scenario
    (`init_infection_frac=0.05`, no initial virus-field IC), the four field
    observables start at 0 and only build up via secretion from a handful of
    infected cells over a ~0.09-day window, so their raw sums were already
    small (tens, not thousands) even before the fix -- the fix changes only
    `il10`'s worst_miss (0.085 -> 0.088, n_in unchanged at 5/8) and leaves
    `extracellular_virus`/`type1_ifn`/`chemokines` numerically unchanged at
    this reduced scale. This is the honest, unturned result of the fix
    here, NOT evidence the fix is inert -- `repro-fig5-viral-load`'s
    `init_viral_load` scenario (a uniform virus-field IC, not
    secretion-built) is where the raw-sum bug was structurally large
    (~1200x worst_miss) and where this same fix materially changes the
    result; see that study for the units fix's dominant effect.

    CONSOLIDATED (Incr 13-14): recruitment-cadence BUG fixed (#60: recruitment ran
    once per 7-MCS record vs its per-MCS rates, ~7x throttle) + agent-based
    process-bigraph Composite immune layer (#61). Paper-scale: macrophage counts
    stay ~2x below band -- DEFINITIVELY source-faithful chemokine-loop physics
    (uncapping the reserve pool + correct IL-10 gives peak 119 < the capped 176;
    z=2 geometry cannot help, recruitment is driven by the z-invariant chemokine
    INTEGRAL), NOT the pool cap. CD8 (APC-driven) uncapped INTO its band
    (188 -> 330; lower band 280); NK ~186. See known-divergences.md D1/D5. No tuning.
  main_insight: >-
    The soft-flagged observables (type1_ifn, antibodies, nk_cells,
    cd8_t_cells, il10) land in-band at MORE checkpoints (5-7 of 8) than the
    hard-flagged population counts (uninfected_cells, infected_cells,
    dead_cells: 0-2 of 8) -- not because those mechanisms are individually
    more correct, but because (a) `bands.SOFT_WIDEN_FACTOR=1.5` widens
    their bands, and (b) their target trajectories start near-zero and stay
    small through the target's early checkpoints, so the reduced run's
    near-t=0 flat-extrapolated value happens to fall inside those wider,
    still-small early bands more often. This is a run-duration/scale
    coincidence, not evidence the immune-signaling subsystem is better
    calibrated than the epithelial-population subsystem at this scale --
    the honest read is that population counts (uninfected/infected/dead)
    expose the scale-and-duration mismatch most starkly because their
    target trajectories move the farthest (1164 -> ~2 uninfected cells)
    over the checkpoint window, while the ODE-driven systemic signals
    (apcs, antibodies) move on a slower, ODE-integrated timescale that a
    ~0.1-day snapshot cannot resolve either way.
  caveat: >-
    CENTRAL HONEST CAVEAT (per the task brief, repeated here deliberately):
    this reduced-scale run (0.3mm-scale cell count reduced further to 225
    cells, 2 replicas, ~0.1 simulated days) is NOT the paper-scale 50-replica
    ensemble the Sego-2022 Fig-3B comparison requires. The mechanisms this
    study exercises (infection/death transitions, resistance, all four
    diffusive fields, macrophage/NK/CD8 chemotaxis + contact/nearby
    killing, ODE-driven recruitment, the Allee rule, the hybrid Price-2015
    global ODE) are all WIRED, per Increments 0-8's individually-validated
    studies -- but this driver's REPORTED MAGNITUDES here are
    calibration-pending at this reduced population/time scale, not a
    verified reproduction. `repro_fig3b`'s own docstring documents the
    paper-scale config (`replicas=50, cells_per_side=35, steps~720` = ~3.5
    simulated days at the default `s_per_mcs=60`/`mcs_per_step=7`, covering
    the full 0-3.5 day Fig-3B checkpoint window) as the
    Mac-mini Phase-B follow-up that will actually set the `reproduced`
    verdict for Fig 3B -- this study's verdict stays `documented`, and
    `conclusion_verdicts.biological_validation` stays PENDING. No
    observable's band was widened, no constant was tuned, and
    `targets/fig3b.json` was not touched to make this report's numbers look
    better.
  key_metrics:
    - {name: band_eval_passed, value: false, note: "replicas=2, cells_per_side=15, steps=20, seed0=0 -- 0 of 12 fig3b observables in-band at every digitized checkpoint"}
    - {name: uninfected_cells_n_in, value: "1/8", note: "worst_miss 52.0 (relative to band width); model holds ~213-214 cells (225-cell patch) vs target's 1164->2 trajectory"}
    - {name: infected_cells_n_in, value: "2/8", note: "worst_miss 4.5"}
    - {name: dead_cells_n_in, value: "0/8", note: "worst_miss 48.0; model records 0 dead throughout the ~0.09-day run vs target ramping to ~1220 by day 2"}
    - {name: extracellular_virus_n_in, value: "0/8", note: "worst_miss 0.5 (units fix, this update: field observable now spatial-mean concentration, sum/n_lattice_sites -- unchanged numerically at this scenario/scale, see caveat below)"}
    - {name: apcs_n_in, value: "0/8", note: "worst_miss 0.48; ODE-integrated P state"}
    - {name: macrophages_n_in_soft, value: "2/8", note: "worst_miss 0.19; soft=true, 1.5x widened band"}
    - {name: nk_cells_n_in_soft, value: "6/8", note: "worst_miss 0.10; soft=true"}
    - {name: cd8_t_cells_n_in_soft, value: "5/8", note: "worst_miss 0.20; soft=true"}
    - {name: chemokines_n_in_soft, value: "3/8", note: "worst_miss 0.067; soft=true (units fix: unchanged numerically at this scenario/scale)"}
    - {name: type1_ifn_n_in_soft, value: "7/8", note: "worst_miss 0.037; soft=true (units fix: unchanged numerically at this scenario/scale)"}
    - {name: antibodies_n_in_soft, value: "7/8", note: "worst_miss 0.089; soft=true; ODE-integrated A state"}
    - {name: il10_n_in_soft, value: "5/8", note: "worst_miss 0.088 (was 0.085 pre-units-fix); soft=true"}
    - {name: reduced_run_sim_duration_days, value: 0.092, note: "20 records x mcs_per_step=7 x s_per_mcs=60 / 86400; target checkpoints run 0.0-3.5 days -- bands.series_in_band flat-extrapolates the near-t=0 model value out to every later checkpoint"}
    - {name: reduced_vs_target_population, value: "225 vs 1225", note: "cells_per_side=15 -> 225 epithelial cells; targets/fig3b.json scenario.total_epithelial_cells=1225 (cells_per_side=35)"}

study_card:
  goal: Wire `run.repro_fig3b` -- a seeded ensemble driver over the Fig-3B scenario that maps `run_full_model`'s output onto `targets/fig3b.json`'s exact observable keys and evaluates the ensemble mean against the digitized acceptance bands (`bands.evaluate_study`) -- and honestly report the REDUCED-scale comparison result (this task's fast-test config), without tuning any constant or widening any band to make it pass.
  mechanism: >-
    For each of `replicas` seeds, `run.run_full_model` (Task 9.1's
    source-ordered per-MCS assembly of every Increment 0-8 mechanism) runs
    the `init_infection_frac=0.05` Fig-3B scenario at `cells_per_side x
    cells_per_side` epithelial cells; `_FIG3B_OBSERVABLE_MAP` maps its
    `counts`/`fields`/`ode` sections onto the fig3b target's 12 observable
    keys; `bands.aggregate_replicas` ensemble-means each mapped series
    across replicas; `bands.evaluate_study` interpolates the ensemble mean
    to each digitized checkpoint's `t_days` and checks containment in
    `[lo, hi]` (widened 1.5x for `soft: true` observables).
  why_before_next: Task 9.3/9.4 (the remaining Increment-9 reproduction studies, Figs 5/7) and the Mac-mini Phase-B paper-scale run both need `repro_fig3b`'s ensemble-and-band-eval machinery already working correctly at small scale before it's trusted at 50-replica/35x35-cell scale; this task establishes the driver is wired and evaluable, while being explicit that the reduced-scale numbers it currently reports are a scale/duration artifact, not a fidelity result -- so Phase-B doesn't have to first debug the harness itself.
  expected_result: >-
    A well-formed dict with an "ensemble" section and a "band_eval" section
    containing a "passed" boolean and per-observable "observables" detail,
    with every fig3b observable key present in the ensemble and every
    mapped series non-vacuous (the uninfected count must decline under
    infection). At the reduced-scale config used here, band_eval's
    "passed" value is expected to be False and most observables are
    expected to miss most checkpoints, driven by population-scale (225 vs
    1225 cells) and run-duration (~0.09 vs up to 3.5 simulated days)
    mismatch, not by an incorrect mechanism -- reported honestly, not
    disguised as a near-miss or hidden by only reporting the observables
    that happen to land in-band.
  main_expert_question: The reduced-scale run's simulated duration (~0.09 days) is far shorter than the target's checkpoint window (0.0-3.5 days) purely because the fast test needs to stay fast (steps=20 at mcs_per_step=7) -- should the Mac-mini Phase-B paper-scale run (steps~720, replicas=50) be treated as this study's REQUIRED next run before any `reproduced` verdict is even attempted, or is there value in first running an intermediate scale (e.g. full cells_per_side=35 patch but few replicas and a longer but sub-720-step duration) to separate the population-scale effect from the run-duration effect before committing the expensive 50-replica ensemble?

question: |
  Does `run.repro_fig3b` (Task 9.2) correctly assemble a seeded ensemble of
  `run.run_full_model` (Task 9.1) over the Sego-2022 Fig-3B scenario, map
  its output onto `targets/fig3b.json`'s exact observable keys, and evaluate
  the ensemble mean against the digitized Fig-3B acceptance bands
  (`bands.evaluate_study`) -- and, honestly, does a REDUCED-scale ensemble
  (the only scale a fast CI test can run) land in-band, or does it mostly
  expose the reduced population/duration's mismatch with the paper-scale
  bands rather than any mechanism defect?

hypothesis: |
  `run.repro_fig3b` correctly wires the ensemble-and-band-evaluation
  machinery: it runs `replicas` seeded `run_full_model` calls, maps every
  mapped observable's series onto the fig3b target's keys, ensemble-means
  them, and produces a well-formed `band_eval` dict. At REDUCED scale
  (small `cells_per_side`, few `replicas`, short `steps` -- all needed to
  keep the added pytest test fast), the ensemble is NOT expected to land
  in-band against bands digitized from a 1225-cell, 50-replica, ~3.5-day
  paper-scale ensemble; any near-miss or in-band result at reduced scale
  should be reported as what it is (a coincidence of a widened `soft` band
  and/or an early-timepoint value that happens to still be small), not
  oversold as reproduction evidence.

objective: |
  Implement `run.repro_fig3b(*, replicas=3, cells_per_side=35, steps=240,
  seed0=0) -> dict` (Task 9.2): loop `replicas` seeds through
  `run.run_full_model(cells_per_side=cells_per_side, steps=steps,
  seed=seed0+i, init_infection_frac=0.05)`; map each run's
  `counts`/`fields`/`ode` sections onto `targets/fig3b.json`'s exact
  observable keys (`_FIG3B_OBSERVABLE_MAP`); ensemble-mean via
  `bands.aggregate_replicas`; evaluate via `bands.evaluate_study(ensemble,
  "fig3b")`. Add `tests/test_influenza_full_model.py::
  test_repro_fig3b_runs_and_evaluates_bands` (reduced: `replicas=2,
  cells_per_side=15, steps=20`) asserting the ensemble/band_eval dict is
  well-formed and the uninfected series is non-vacuous (declines under
  infection) -- NOT that the bands pass, since reduced scale is not
  expected to. Run that same reduced config directly (not the pytest
  assertions alone) to report the actual per-observable band_eval numbers
  in this study honestly.

description: |
  Increment 9 Task 9.2 (part of the capstone reproduction ladder):
  `run.repro_fig3b` is the ensemble-and-band-comparison driver for the
  Sego-2022 Fig-3B scenario, built on top of Task 9.1's `run.
  run_full_model` (every mechanism subsystem from Increments 0-8 assembled
  into one source-ordered per-MCS loop) and Task 9.0's `bands` acceptance-
  band harness (`targets/fig3b.json`, digitized from the paper's Fig. 3B).
  This task WIRES the ensemble machinery and EVALUATES it -- it explicitly
  does NOT attempt the paper-scale 50-replica, 35x35-cell, ~3.5-day ensemble
  needed to actually claim Fig-3B reproduction; that run is deferred to the
  Mac-mini Phase-B follow-up (documented in `repro_fig3b`'s own docstring).
  The reduced-scale config this task's fast pytest test uses (`replicas=2,
  cells_per_side=15, steps=20`) is run directly here and its actual
  `band_eval` result reported honestly: 0 of 12 observables are in-band at
  every digitized checkpoint, driven by population-scale (225 vs. 1225
  cells) and run-duration (~0.09 vs. up to 3.5 simulated days) mismatch --
  not by tuning any constant, and `targets/fig3b.json` is not edited.

claim: |
  `run.repro_fig3b` is implemented and wired correctly: it runs a seeded
  ensemble of `run_full_model` over the Fig-3B scenario, maps every
  observable onto `targets/fig3b.json`'s exact keys, ensemble-means via
  `bands.aggregate_replicas`, and evaluates via `bands.evaluate_study`,
  producing a well-formed `{"ensemble":..., "band_eval":{"passed": bool,
  ...}, "replicas":..., "cells_per_side":..., "steps":...}` dict (verified
  by `tests/test_influenza_full_model.py::
  test_repro_fig3b_runs_and_evaluates_bands`). THIS STUDY DOES NOT CLAIM
  FIG-3B IS REPRODUCED. At the reduced scale this task's fast test uses
  (`replicas=2, cells_per_side=15, steps=20, seed0=0`), `band_eval['passed']`
  is False and 0 of the 12 fig3b observables are in-band at every
  checkpoint (per-observable n_in/8 and worst_miss reported in `report.
  key_metrics` above) -- expected given the ~5.4x smaller epithelial
  population and the ~0.09-simulated-day run duration vs. the target's
  0.0-3.5-day checkpoint window, not a mechanism defect. The paper-scale
  50-replica, 35x35-cell, ~3.5-day ensemble (Mac-mini Phase-B) is required
  before any `reproduced` verdict for Fig 3B, and `conclusion_verdicts.
  biological_validation` stays PENDING here.

expected_behavior:
  - "`repro_fig3b` returns a dict with an `ensemble` section containing every fig3b observable key, each a non-empty time/value series."
  - "`band_eval` is present and contains a `passed` boolean plus a per-observable breakdown (`in_band`, `n_checked`, `n_in`, `worst_miss`)."
  - "The ensemble's `uninfected_cells` series is non-vacuous: it declines (or stays flat) under infection, final value <= initial value."
  - "At REDUCED scale (small `cells_per_side`/`replicas`/`steps`), `band_eval`'s `passed` value is NOT expected to be True -- reported honestly, not tuned toward a pass."

readouts:
  - name: repro_fig3b returns a well-formed ensemble + band evaluation
    identifier: repro_fig3b_structure
    units: n/a
    status: measured
    description: >-
      `run.repro_fig3b(replicas=2, cells_per_side=15, steps=20, seed0=0)`
      returns `replicas=2`, an `ensemble` dict with all 12 fig3b observable
      keys present (uninfected_cells, infected_cells, dead_cells,
      extracellular_virus, apcs, macrophages, nk_cells, cd8_t_cells,
      chemokines, type1_ifn, antibodies, il10), and a `band_eval` dict with
      a `passed` key.
  - name: Ensemble uninfected count declines under infection (non-vacuous)
    identifier: uninfected_declines
    units: cell count
    status: measured
    description: >-
      Ensemble-mean `uninfected_cells` at `replicas=2, cells_per_side=15,
      steps=20, seed0=0`: 214.0 at t_days=0.0 -> 213.0 at t_days=0.092
      (final <= initial, non-vacuous decline under the 5% initial-infection
      seeding, even over this short window).
  - name: Reduced-scale band comparison -- per-observable in-band fraction
    identifier: fig3b_band_eval_reduced_scale
    units: n_in / n_checked (of 8 digitized checkpoints each)
    status: measured
    description: >-
      `band_eval['observables']` at the same reduced config: uninfected_cells
      1/8 (worst_miss 52.0), infected_cells 2/8 (4.5), dead_cells 0/8
      (48.0), extracellular_virus 0/8 (0.5), apcs 0/8 (0.48), macrophages
      2/8 (0.19, soft), nk_cells 6/8 (0.10, soft), cd8_t_cells 5/8 (0.20,
      soft), chemokines 3/8 (0.067, soft), type1_ifn 7/8 (0.037, soft),
      antibodies 7/8 (0.089, soft), il10 5/8 (0.088, soft). `band_eval
      ['passed']` is False (0/12 observables in-band at every checkpoint).
      UNITS FIX (this update, Task-9.3-review MUST-FIX): the 4 field
      observables (extracellular_virus, type1_ifn, chemokines, il10) are now
      mapped as spatial-mean concentration (sum/n_lattice_sites), not
      run_full_model's raw lattice sum; at this init_infection_frac scenario
      the raw sums were already small (secretion-built from a few infected
      cells, not an initial field load), so only il10 moved (0.085 -> 0.088,
      n_in unchanged); see repro-fig5-viral-load for the scenario where the
      pre-fix bug was structurally large.

