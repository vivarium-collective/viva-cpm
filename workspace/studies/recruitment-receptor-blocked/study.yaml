    name: blocked
    composite: pbg_cpm_studies.composites.chemotaxis_receptor.recruitment_receptor
    params: {cue_rate: 10.0, chemo_lambda: 14.0, kd: 2.9, blocked: true} # cue ON, response BLOCKED (intervention)

  model_settings: []
inputs: []

