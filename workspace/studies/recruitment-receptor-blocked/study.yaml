schema_version: 3
name: recruitment-receptor-blocked
status: complete
phase: Decide
title: "Receptor realization: blocking the response abolishes recruitment"
confidence: Accepted
investigation: chemotactic-recruitment

purpose:
  question: |
    In the receptor-level realization, if the activated response is forced off
    (blocked=True, zeroing the activated-type chemotaxis lambda even for cells
    that cross the receptor-occupancy activation threshold) while the cue is
    still secreted, is recruitment abolished?
  mechanism: receptor_occupancy

report:
  title: "Receptor realization: blocking the response abolishes recruitment"
  verdict: passing
  confidence: high
  evidence_quality: literature-matched
  objective: >-
    Repeat the receptor-recruitment world with the activated-type chemotaxis
    lambda forced to 0 (blocked=True, downstream of receptor binding) and
    measure the recruitment index over 500 MC sweeps across 5 seeds.
  conclusion: >-
    Blocking the response downstream of receptor activation abolishes
    recruitment: the final recruitment index is 0.0667 (95% CI 0.0-0.1467),
    below the 0.1 pass threshold, versus 0.5667 for the receptor-gated
    baseline, despite the cue being present and receptors still able to bind
    ligand (kd 2.9 nM, Nasser 2009).
  main_insight: >-
    Blocking downstream of receptor occupancy — rather than blocking receptor
    binding itself — still abolishes recruitment, isolating the chemotactic
    response (not mere receptor activation) as the necessary cause even in
    the receptor-gated realization.
  caveat: >-
    The response is now receptor-gated (emergent activation from a per-cell
    Hill relation), closing the phenomenological gap the phenomenological
    baseline flagged; the remaining gap is background-invariance -- the Kd
    calibration does not yet model adaptation to ambient cue levels, a future
    adaptive rung.
  key_metrics:
    - {name: recruitment_index, value: "0.0667 (95% CI 0.0-0.1467)", n_seeds: 5}
    - {name: kd, value: "2.9 nM (Nasser 2009)"}

study_card:
  goal: "negative control: response blocked downstream of receptor abolishes recruitment"
  mechanism: Identical receptor wiring to recruitment-receptor-baseline (per-cell Hill occupancy, kd 2.9 nM) except the activated-type chemotaxis lambda is forced to 0.
  why_before_next: Isolates the receptor-gated response as a necessary cause, pairing with recruitment-receptor-baseline to establish the receptor arm's causal structure.
  expected_result: Recruitment index stays below 0.1 for the whole run despite receptors still able to bind ligand.
  main_expert_question: Does blocking downstream of receptor occupancy (rather than blocking binding itself) fully account for the loss of recruitment?

question: |
  In the receptor-level realization, if the activated response is forced off
  (blocked=True, zeroing the activated-type chemotaxis lambda even for cells
  that cross the receptor-occupancy activation threshold) while the cue is
  still secreted, is recruitment abolished?

hypothesis: |
  With the cue present (rate 10) but the receptor-gated response disabled
  (blocked=True), responders may still activate (naive -> activated) but no
  longer chemotax, so the recruitment index stays near zero.

objective: |
  Repeat the receptor-recruitment world with blocked=True (the intervention)
  and measure the recruitment index over 500 MC sweeps across 5 seeds.

description: |
  The intervention arm of the receptor-level realization, paired with
  recruitment-receptor-baseline. The world and receptor wiring are identical
  to the baseline -- same cue, same per-cell ReceptorSubcell computing Hill
  occupancy against the same cited Kd (2.9 nM, Nasser et al. 2009) -- except
  the activated type's chemotaxis lambda is forced to 0 in
  chemotaxis_receptor.build_receptor_spec, the receptor-realization analogue
  of pharmacologically blocking the response downstream of receptor binding.
  As in the baseline, the Kd is recorded as a calibrated parameter
  (model_settings below), not as a literature_target on the recruitment-index
  test.

claim: |
  Blocking the response downstream of receptor activation abolishes
  recruitment: the final recruitment index is 0.0667 (95% CI 0.0-0.1467),
  below the 0.1 pass threshold, despite the cue being present and receptors
  still able to bind ligand.

expected_behavior:
  - Recruitment index stays below 0.1 for the whole run.
  - Responders may still receptor-activate (naive -> activated) but do not chemotax, since the activated-type lambda is forced to 0.

model_settings:
  - name: kd
    current: 2.9
    units: nM
    cites: [nasser2009]
    notes: "CXCL8 monomer–CXCR1 Kd (Nasser 2009)"
  - name: conc_scale
    current: 0.02
    provenance: theory
    notes: "CPM field-unit → nM mapping; modeling choice, not fit"
  - name: hill
    current: 2.0
    provenance: theory
    notes: "Hill coefficient for receptor occupancy; assumed cooperative binding, not independently fit"
  - name: activate_occupancy
    current: 0.5
    provenance: theory
    notes: "Naive -> activated switch fires at half-maximal receptor occupancy; a modeling choice, not a literature value"

visualizations:
  - name: Recruitment over time (all conditions)
    address: local:ChemotaxisRecruitment
  - name: Recruitment scene — responders climb the chemokine gradient (animated, baseline)
    address: local:ReceptorRecruitmentScene
  - name: Receptor occupancy law with the cited Kd (evidence → mechanism)
    address: local:ReceptorOccupancyLaw
  - name: Receptor-gated recruitment (baseline vs blocked, CI ribbons)
    address: local:ReceptorRecruitmentCurve

embed_visualizations:
  - name: Animated spatial scene
    title: "Receptor recruitment — responders climb the chemokine gradient (animated)"
    url: /workspace/studies/recruitment-receptor-blocked/viz/scene.html
  - name: Receptor occupancy law
    title: "Receptor occupancy law with the cited Kd (evidence → mechanism)"
    url: /workspace/studies/recruitment-receptor-blocked/viz/occupancy-law.html
  - name: Receptor-gated recruitment curve
    title: "Receptor-gated recruitment (baseline vs blocked, CI ribbons)"
    url: /workspace/studies/recruitment-receptor-blocked/viz/recruitment-curve.html

readouts:
  - name: Recruitment index
    identifier: recruitment_index
    units: fraction of responders within radius
    status: measured
    description: |
      Fraction of responder cell centres of mass within 15 px of the source
      centroid; activated-type chemotaxis lambda is forced to 0 regardless of
      receptor occupancy.
  - name: Mean approach
    identifier: mean_approach
    units: dimensionless (0-1)
    status: derived
    description: Fraction of the initial responder-to-source gap closed over the run.
  - name: Responder mean distance
    identifier: responder_mean_distance
    units: px
    status: derived
    description: Mean centre-of-mass distance from responders to the source centroid.
  - name: Receptor occupancy
    identifier: receptor_occupancy
    units: fraction (0-1)
    status: derived
    description: Hill occupancy θ = c^h/(Kd^h + c^h) of the per-cell receptor at the local cue concentration; unaffected by the downstream block. Derived from the Hill law (ReceptorOccupancyLaw), not emitted per run.
  - name: Activation fraction
    identifier: activation_by_cell
    units: fraction of responders
    status: measured
    description: Fraction of responder cells whose occupancy crossed the activation threshold (naive→activated); activation still occurs even though chemotaxis is blocked downstream.

behavior_tests:
  - name: Blocking the response abolishes recruitment (receptor realization)
    classification: primary
    description: |
      Pass criterion: recruitment index below 0.1 at the end of the run.
      Measured from workspace/chemotaxis_data/results/receptor_blocked.json
      (5 seeds, [17, 29, 43, 61, 89]): recruitment index stays at 0.0 through
      mcs 325, then drifts to 0.0667 (95% CI 0.0-0.1467) by the end of the
      run -- versus 0.5667 for the receptor baseline.
    measure: {kind: recruitment_index, condition: recruitment-receptor-blocked, stat: final}
    pass_if: {op: lt, value: 0.1}
    cites: [nasser2009]
    status: passed
    result: PASS

findings:
  - id: F-01
    kind: computational
    status: confirms
    mechanism_origin: emergent
    evidence:
      from_test: Blocking the response abolishes recruitment (receptor realization)
      observed: "recruitment index 0.0667 (95% CI 0.0-0.1467) across 5 seeds despite the cue present and receptors still able to bind (baseline 0.5667)"
    statement: |
      The intervention works in the receptor-level realization too: across 5
      seeds the final recruitment index is 0.0667 (95% CI 0.0-0.1467) with
      the activated-type chemotaxis lambda forced to 0, versus 0.5667 for the
      receptor baseline -- recruitment remains response-dependent even when
      receptor binding itself is unaffected.

robustness:
  n_replicates: 5
  seeds: [17, 29, 43, 61, 89]
  parameter_sweep: false
  per_measure:
    - name: recruitment_index
      final_mean: 0.0667
      final_ci: [0.0, 0.1467]

controls:
  - kind: negative
    name: This study IS the negative control — response blocked downstream of receptor (reciprocal of recruitment-receptor-baseline)
    test: Blocking the response abolishes recruitment (receptor realization)
    result: PASS
    observed: {recruitment_index: 0.0667}
    description: This study is itself the receptor arm's negative-control leg — with the receptor bound but the response blocked, recruitment falls to 0.0667 (95% CI 0.0-0.1467), far below the receptor-gated baseline's 0.5667 — isolating the receptor-gated response as load-bearing.
  - kind: adversarial
    name: No cue yields no recruitment (recruitment-adversarial)
    test: Blocking the response abolishes recruitment (receptor realization)
    result: PASS
    observed: {recruitment_index: 0.0}
    description: Competent responders with no cue are not recruited (cross-arm negative control).

alternative_hypotheses:
  - claim: Responders accumulate by adhesion differences, not receptor-gated chemotaxis.
    status: excluded
    discriminated_by: Unconfounded contact-J design (activated type-3 J-rows copied from naive type-2).
    note: Adhesion is held equal across naive/activated, so only chemotaxis differs; irrelevant here since chemotaxis itself is blocked and recruitment still collapses.
  - claim: The recruitment signal is a metric artifact (spurious proximity counting).
    status: excluded
    discriminated_by: Blocking the response abolishes recruitment (receptor realization)
    note: Excluded by this arm itself — recruitment index falls to 0.0667 (95% CI 0.0-0.1467), below the 0.1 pass threshold, when the response is blocked, versus 0.5667 for the receptor-gated baseline.

parent_studies:
  - study: recruitment-receptor-baseline
    condition: tests-passed
    relation: leads-to
  - study: recruitment-inhibited
    condition: tests-passed
    relation: refines

conclusion: |
  In the receptor-level realization, blocking the response downstream of
  receptor occupancy (as opposed to blocking receptor binding itself)
  abolishes recruitment, mirroring recruitment-inhibited's phenomenological
  result. This isolates the chemotactic response -- not merely receptor
  activation -- as the necessary cause, consistent with the baseline
  investigation's finding for the phenomenological realization.

conclusion_verdicts:
  regression_compatibility:
    result: PASS
    basis: Reproduces the expected abolished-recruitment behaviour with the declared energies, ICs, and Hill-occupancy wiring (activated-type lambda forced to 0).
  biological_validation:
    result: PASS
    basis: Recruitment index 0.0667 (95% CI 0.0-0.1467) across 5 seeds, below the 0.1 pass threshold, versus 0.5667 for the receptor-gated baseline (kd 2.9 nM, Nasser 2009).
  explanatory_gain:
    result: POSITIVE
    basis: Isolates the chemotactic response — not merely receptor activation — as the necessary cause, even in the receptor-gated realization.

biological_summary: |
  This is the response-blocked negative-control arm of the receptor-level
  realization. The world and receptor wiring are identical to
  recruitment-receptor-baseline — the same cue, the same per-cell
  ReceptorSubcell computing Hill occupancy against the cited CXCL8-CXCR1
  affinity (Kd = 2.9 nM, Nasser et al. 2009) — except the activated type's
  chemotaxis lambda is forced to 0, the receptor-realization analogue of
  pharmacologically blocking the response downstream of receptor binding.
  Responders can still cross the receptor-occupancy activation threshold
  (naive -> activated), but no longer chemotax. Across 5 seeds the final
  recruitment index is 0.0667 (95% CI 0.0-0.1467), below the 0.1 pass
  threshold and far below the receptor-gated baseline's 0.5667 — showing the
  chemotactic response itself, not merely receptor binding, is the necessary
  ingredient for recruitment.

literature_anchors:
  - expectation: Receptor occupancy follows a Hill law with Kd≈2.9 nM.
    model_observable: receptor_occupancy
    source: "CXCL8–CXCR1"
    status_in_workspace: "Available via receptor_occupancy readout"
    cites: [nasser2009]
  - expectation: Blocking the chemotactic response downstream of receptor binding abolishes gradient-directed recruitment even when the cue is present and receptors can still bind.
    model_observable: recruitment_index
    source: "Chemotaxis up a secreted gradient (canonical)"
    status_in_workspace: "Verified — observed value matches (0.0667 vs 0.5667 baseline)"
    cites: [glazier1993]

key_assumptions:
  - Same world geometry and receptor wiring as recruitment-receptor-baseline; only the activated-type chemotaxis lambda is forced to 0.
  - Responders can still cross the receptor-occupancy activation threshold (naive -> activated); blocked=True acts downstream of receptor binding, not on it.
  - Recruitment radius = 15 px, identical to recruitment-receptor-baseline.

gate_status: passed

runtime:
  default_emitter: series-json
  max_generations: 1
  post_run_scripts: []

model_change:
  base_model: pbg_cpm_studies.composites.chemotaxis_receptor.recruitment_receptor
  new_processes: []
  new_state_variables: []
  new_parameters: [cue_rate, chemo_lambda, kd, blocked]
  modified_processes: []
  new_listeners: []
  notes: |
    Same receptor-gated CPMProcess as recruitment-receptor-baseline, with the
    activated-type chemotaxis lambda forced to 0 (blocked=True) in
    chemotaxis_receptor.build_receptor_spec while cue_rate and kd are
    unchanged. Receptor occupancy computation and the naive->activated switch
    are unaffected — only the downstream chemotactic response is blocked. No
    new state variables or listeners were added.

design_pivot_required:
  - id: negative-control-arm
    status: resolved
    question: Should the receptor-realization's response-blocked condition be built as a dedicated study arm, or treated only as an implicit lambda=0 comparison?
    alternatives:
      - Treat blocked=True as an informal comparison only, folded into recruitment-receptor-baseline
      - Build a dedicated receptor-blocked study as a first-class necessary-ingredient control (this study)
    requested_response: none — resolved
    notes: |
      Resolved by building this as its own study, mirroring recruitment-inhibited's
      role for the phenomenological arm: it isolates the chemotactic response
      as a necessary cause downstream of receptor occupancy, excluding "receptor
      binding alone suffices" as an alternative explanation.

enforced_params:
  cue_rate: 10.0
  chemo_lambda: 14.0
  kd: 2.9
  blocked: true

runs:
  - run_id: recruitment-receptor-blocked-5seed
    name: recruitment-receptor-blocked (5 seeds)
    status: completed
    canonical: true
    timestamp: '2026-08-11'
    seeds: [17, 29, 43, 61, 89]
    emitter: chemotaxis_data/results series-json
    outcomes:
      'Blocking the response abolishes recruitment (receptor realization)':
        result: PASS
        measured_value: 0.0667
        notes: "0.0667 (95% CI 0.0-0.1467) across 5 seeds with the cue present; kd=2.9 nM (Nasser 2009)"
        evaluated_by: pbg_cpm_studies.evaluators

discovery_implications:
  followup_study_proposals:
    - id: receptor-partial-block
      title: "Partial block: response strength as a graded parameter, not just on/off"
      motivation: "Test whether recruitment degrades gradually as chemo_lambda is reduced from 14 to 0, rather than only at the two endpoints."
conditions:
