schema_version: 3
name: recruitment-receptor-blocked
status: complete
phase: Decide
title: "Receptor realization: blocking the response abolishes recruitment"
confidence: Accepted
investigation: chemotactic-recruitment

question: |
  In the receptor-level realization, if the activated response is forced off
  (blocked=True, zeroing the activated-type chemotaxis lambda even for cells
  that cross the receptor-occupancy activation threshold) while the cue is
  still secreted, is recruitment abolished?

hypothesis: |
  With the cue present (rate 10) but the receptor-gated response disabled
  (blocked=True), responders may still activate (naive -> activated) but no
  longer chemotax, so the recruitment index stays near zero.

objective: |
  Repeat the receptor-recruitment world with blocked=True (the intervention)
  and measure the recruitment index over 500 MC sweeps across 5 seeds.

description: |
  The intervention arm of the receptor-level realization, paired with
  recruitment-receptor-baseline. The world and receptor wiring are identical
  to the baseline -- same cue, same per-cell ReceptorSubcell computing Hill
  occupancy against the same cited Kd (2.9 nM, Nasser et al. 2009) -- except
  the activated type's chemotaxis lambda is forced to 0 in
  chemotaxis_receptor.build_receptor_spec, the receptor-realization analogue
  of pharmacologically blocking the response downstream of receptor binding.
  As in the baseline, the Kd is recorded as a calibrated parameter
  (model_settings below), not as a literature_target on the recruitment-index
  test.

claim: |
  Blocking the response downstream of receptor activation abolishes
  recruitment: the final recruitment index is 0.0667 (95% CI 0.0-0.1467),
  below the 0.1 pass threshold, despite the cue being present and receptors
  still able to bind ligand.

expected_behavior:
  - Recruitment index stays below 0.1 for the whole run.
  - Responders may still receptor-activate (naive -> activated) but do not chemotax, since the activated-type lambda is forced to 0.

model_settings:
  - name: kd
    current: 2.9
    units: nM
    cites: [nasser2009]
    notes: "CXCL8 monomer–CXCR1 Kd (Nasser 2009)"
  - name: conc_scale
    current: 0.02
    provenance: theory
    notes: "CPM field-unit → nM mapping; modeling choice, not fit"
  - name: hill
    current: 2.0
    provenance: theory
    notes: "Hill coefficient for receptor occupancy; assumed cooperative binding, not independently fit"
  - name: activate_occupancy
    current: 0.5
    provenance: theory
    notes: "Naive -> activated switch fires at half-maximal receptor occupancy; a modeling choice, not a literature value"

visualizations:
  - name: Recruitment over time (all conditions)
    address: local:ChemotaxisRecruitment
  - name: Recruitment scene — responders climb the chemokine gradient (animated, baseline)
    address: local:ReceptorRecruitmentScene
  - name: Receptor occupancy law with the cited Kd (evidence → mechanism)
    address: local:ReceptorOccupancyLaw
  - name: Receptor-gated recruitment (baseline vs blocked, CI ribbons)
    address: local:ReceptorRecruitmentCurve

readouts:
  - name: Recruitment index
    identifier: recruitment_index
    units: fraction of responders within radius
    status: measured
    description: |
      Fraction of responder cell centres of mass within 15 px of the source
      centroid; activated-type chemotaxis lambda is forced to 0 regardless of
      receptor occupancy.

behavior_tests:
  - name: Blocking the response abolishes recruitment (receptor realization)
    classification: primary
    description: |
      Pass criterion: recruitment index below 0.1 at the end of the run.
      Measured from workspace/chemotaxis_data/results/receptor_blocked.json
      (5 seeds, [17, 29, 43, 61, 89]): recruitment index stays at 0.0 through
      mcs 325, then drifts to 0.0667 (95% CI 0.0-0.1467) by the end of the
      run -- versus 0.5667 for the receptor baseline.
    measure: {kind: recruitment_index, condition: recruitment-receptor-blocked, stat: final}
    pass_if: {op: lt, value: 0.1}
    cites: [nasser2009]
    status: passed
    result: PASS

findings:
  - id: F-01
    kind: computational
    status: confirms
    mechanism_origin: emergent
    evidence:
      from_test: Blocking the response abolishes recruitment (receptor realization)
      observed: "recruitment index 0.0667 (95% CI 0.0-0.1467) across 5 seeds despite the cue present and receptors still able to bind (baseline 0.5667)"
    statement: |
      The intervention works in the receptor-level realization too: across 5
      seeds the final recruitment index is 0.0667 (95% CI 0.0-0.1467) with
      the activated-type chemotaxis lambda forced to 0, versus 0.5667 for the
      receptor baseline -- recruitment remains response-dependent even when
      receptor binding itself is unaffected.

robustness:
  n_replicates: 5
  seeds: [17, 29, 43, 61, 89]
  parameter_sweep: false
  per_measure:
    - name: recruitment_index
      final_mean: 0.0667
      final_ci: [0.0, 0.1467]

parent_studies:
  - study: recruitment-receptor-baseline
    condition: tests-passed
    relation: leads-to
  - study: recruitment-inhibited
    condition: tests-passed
    relation: refines

conclusion: |
  In the receptor-level realization, blocking the response downstream of
  receptor occupancy (as opposed to blocking receptor binding itself)
  abolishes recruitment, mirroring recruitment-inhibited's phenomenological
  result. This isolates the chemotactic response -- not merely receptor
  activation -- as the necessary cause, consistent with the baseline
  investigation's finding for the phenomenological realization.

key_assumptions:
  - Same world geometry and receptor wiring as recruitment-receptor-baseline; only the activated-type chemotaxis lambda is forced to 0.
  - Responders can still cross the receptor-occupancy activation threshold (naive -> activated); blocked=True acts downstream of receptor binding, not on it.
  - Recruitment radius = 15 px, identical to recruitment-receptor-baseline.

gate_status: passed

runs:
  - run_id: recruitment-receptor-blocked-5seed
    name: recruitment-receptor-blocked (5 seeds)
    status: completed
    canonical: true
    timestamp: '2026-08-11'
    seeds: [17, 29, 43, 61, 89]
    emitter: chemotaxis_data/results series-json
    outcomes:
      'Blocking the response abolishes recruitment (receptor realization)':
        result: PASS
        measured_value: 0.0667
        notes: "0.0667 (95% CI 0.0-0.1467) across 5 seeds with the cue present; kd=2.9 nM (Nasser 2009)"
        evaluated_by: pbg_cpm_studies.evaluators

discovery_implications:
  followup_study_proposals:
    - id: receptor-partial-block
      title: "Partial block: response strength as a graded parameter, not just on/off"
      motivation: "Test whether recruitment degrades gradually as chemo_lambda is reduced from 14 to 0, rather than only at the two endpoints."
conditions:
  baseline:
    name: blocked
    composite: pbg_cpm_studies.composites.chemotaxis_receptor.recruitment_receptor
    params: {cue_rate: 10.0, chemo_lambda: 14.0, kd: 2.9, blocked: true} # cue ON, response BLOCKED (intervention)

  model_settings: []
inputs: []
