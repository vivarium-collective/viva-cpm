schema_version: 3
name: tstmd-contraction-reorientation
status: complete
phase: Decide
title: Cell contraction & fiber reorientation (real TST-MD, 2D)
confidence: Mechanism-confirmed
investigation: merks-ecm-reciprocity-2d

question: >-
  In the real 2D static-adhesion hybrid CPM + bead-spring ECM engine (Tsingos
  et al. 2023, the published ancestor of Merks' 3D model), does a contractile
  cell contract against a crosslinked ECM and reorient the surrounding fibers
  toward itself, reproducing the direction of the 3D paper's remodeling result?

hypothesis: >-
  A contractile cell coupled to the fiber network via static adhesions will
  contract over Monte Carlo time and drag/align nearby fibers toward it, so the
  fraction of radially-aligned fibers (q) rises above its initial value
  (q/q0 > 1), as in Keijzer & Merks 2026 Fig 4.

objective: >-
  Run one seeded coupled simulation (single contractile cell, 1200 fiber
  strands, ~3750 crosslinks, 300 MCS) through the real engine and measure the
  cell-area and reorientation (q/q0) trajectories plus start/end snapshots.

description: >-
  REAL output of the TST-MD engine, driven CPU-only via the viva-tstmd Docker
  bridge (TST C++ + HOOMD + MUSCLE3). Single contractile cell
  (size_init_cells=120, target_area=10, lambda=50) in a crosslinked bead-spring
  ECM. q = fraction of fibers with alignment gamma>=0.9 to the cell centroid
  (paper eq. 7); q0 is the initial value. This is a 2D, mechanism-level analog
  of Keijzer & Merks 2026 (arXiv:2609.02375) Fig 4 reorientation — not a
  quantitative figure match (see investigation caveats).

claim: >-
  The real engine reproduces, in 2D, the direction of the 3D paper's
  mechanical-reciprocity result: a contractile cell contracts
  (13135 -> ~10 lattice sites over ~80 MCS) and reorients fibers toward itself
  (q/q0 rises 1.00 -> ~1.09 and holds).

expected_behavior:
  - Cell area decreases monotonically from its initial value as the cell contracts
  - Fiber reorientation q/q0 rises above 1.0 and stays above 1.0 (fibers align toward the cell)

readouts:
  - name: Cell area
    identifier: cell_area
    units: lattice sites
    status: measured
    description: Count of lattice sites with spin sigma>=1 (the contractile cell), per state dump.
  - name: Reorientation ratio
    identifier: q_ratio
    units: dimensionless (q/q0)
    status: measured
    description: >-
      Fraction of fibers nearly radial to the cell (gamma>=0.9, paper eq. 7)
      normalised by the initial value; q/q0>1 means fibers reorient toward the cell.

behavior_tests:
  - name: Contractile cell contracts against the ECM
    classification: primary
    description: >-
      The cell area falls to below 10% of its initial value over the run.
      Measured from the real run: 13135 -> 10 lattice sites (>99% reduction) by MCS ~80.
    measure: cell_area
    pass_if: final cell_area < 0.10 * initial cell_area
    status: passed
    result: PASS
    paper_reference: Keijzer & Merks 2026, Fig 2/3 (contraction of a contractile cell in ECM)
  - name: Fibers reorient toward the contracting cell (q/q0 > 1)
    classification: primary
    description: >-
      Peak and final q/q0 exceed 1.05, i.e. the contracting cell measurably
      aligns nearby fibers toward itself. Measured: q/q0 1.00 -> peak ~1.10,
      final ~1.09.
    measure: q_ratio
    pass_if: final q_ratio >= 1.05 AND max q_ratio >= 1.05
    status: passed
    result: PASS
    paper_reference: Keijzer & Merks 2026, Fig 4A-B (q/q0 > 1 reorientation toward cell)

visualizations:
  - name: Contraction & reorientation — interactive
    address: local:TstmdContractionReorientation
embed_visualizations:
  - name: Interactive figure
    title: Contraction dynamics + fiber reorientation (+ start/end ECM snapshots)
    url: /workspace/studies/tstmd-contraction-reorientation/viz/interactive.html

findings:
  - id: F-01
    kind: computational
    status: confirms
    evidence:
      from_test: Contractile cell contracts against the ECM
      observed: "cell area 13135 -> ~10 lattice sites; q/q0 1.00 -> ~1.09"
    statement: >-
      The real TST-MD engine reproduces the DIRECTION of the 3D paper's
      remodeling result in 2D: a contractile cell contracts against the
      crosslinked ECM (13135 -> ~10 lattice sites) and reorients fibers toward
      itself (q/q0 1.00 -> ~1.09).
  - id: F-02
    kind: methodological
    status: partial
    statement: >-
      At this parameter regime the cell's equilibrium area is set by its target
      area (10), not by ECM resistance — so this study demonstrates the
      contraction + reorientation MECHANISM, not the quantitative
      ECM-limited-equilibrium relationship of Fig 2. Closing that gap requires
      model calibration (physical->ymmsl unit scaling); documented as the
      investigation's open calibration item.

conclusion: >-
  Using the real published engine, a 2D contractile cell contracts against a
  crosslinked bead-spring ECM and reorients nearby fibers toward itself
  (q/q0>1), reproducing the direction of Keijzer & Merks 2026's Fig 4. The
  magnitude/equilibrium relationship (Fig 2) is a documented calibration gap,
  not claimed here.

key_assumptions:
  - 2D (the real engine is 2D; the target paper is 3D) — mechanism/direction analog only.
  - Static adhesions (as in the 3D paper), not the dynamic focal adhesions of Keijzer et al. 2025.
  - Reduced size vs the paper's HPC scale (1200 strands, 300 MCS) for CPU tractability.
  - 1 seed; q uses the gamma>=0.9 radial-alignment threshold of paper eq. 7.

variants:
  - name: reference
    description: Single contractile cell in a crosslinked ECM (sic=120, target_area=10, 5000 crosslinks, 1200 strands, 300 MCS) — the published-style reference regime.

simulation_set:
  - name: reference-coupled-run
    kind: coupled CPM + bead-spring ECM (real TST-MD via viva-tstmd/Docker)
    status: completed
    base_model: viva_cpm_studies.composites.tstmd.tstmd_coupled
    duration_steps: 300
    seeds: [12345678]
    metrics: [cell_area, q_ratio]
    pass_fail_tests:
      - Contractile cell contracts against the ECM
      - Fibers reorient toward the contracting cell (q/q0 > 1)

conditions:
  baseline:
    name: baseline
    composite: viva_cpm_studies.composites.tstmd.tstmd_coupled
    params: {n_cross: 5000, fiber_stiffness: 200.0, target_area: 10, mcs: 300}
  model_settings: []

gate_status: passed
runs:
  - run_id: tstmd-contraction-reorientation-real
    name: real coupled TST-MD run (single contractile cell, 300 MCS)
    status: completed
    canonical: true
    timestamp: '2026-10-03'
    seeds:
      - 12345678
    emitter: baked real-run data in viva_cpm_studies/visualizations/_tstmd_data.py (engine run externally via viva-tstmd; not through the dashboard run-logger)
    outcomes:
      Contractile cell contracts against the ECM:
        result: PASS
        measured_value: "13135 -> 10 lattice sites (>99% reduction by MCS ~80)"
        notes: single contractile cell contracts against the crosslinked ECM
        evaluated_by: viva-tstmd (pbg_tstmd.processes.run_once / cell_area)
      Fibers reorient toward the contracting cell (q/q0 > 1):
        result: PASS
        measured_value: "q/q0 peak ~1.10, final ~1.09"
        notes: fibers align radially toward the cell during contraction
        evaluated_by: viva-tstmd (pbg_tstmd.analysis.reorientation_q)
