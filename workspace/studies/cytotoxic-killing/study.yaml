biological_summary: |
  NK (`types.K`) and CD8+ T (`types.E`) cells are placed in the domain
  interior (the Task-7.1 three-cluster scenario: epithelial/infection patch
  | macrophage cluster | NK+CD8 cluster, every cluster >= `margin_sites`
  from every noflux wall) and wired to chemotax up the macrophage-released
  chemokine field (Increment 6, unchanged) via the engine's linear-lambda
  `World.set_chemotaxis` primitive, at the documented, non-per-seed-tuned
  `NK_CD8_CHEMOTAXIS_ENGINE_SCALE=100x` correction (Task 7.1 -- the literal
  source lambda is statistically undetectable at this engine's
  chemokine-field concentration scale). Over a 60-update run, tested across
  5 seeds (5, 17, 23, 42, 100), both NK and CD8's mean distance to the
  infection centroid falls consistently when chemotaxis is on (NK mean
  change -20.37, CD8 -35.99, negative in 5/5 seeds each), against a
  near-isotropic lambda=0 control (NK -1.02, CD8 -0.54, no consistent sign)
  -- CD8 (2x NK's literal lambda) localizes more strongly than NK in every
  seed, matching the paper's Sec. 2.3 stated 2x-sensitivity ratio. Each
  update, `killing.contact_kill_rate` (the CC3D source's literal LOCAL
  surface-contact kill-rate form, applying `cell_resist` DIRECTLY per
  discrepancy #7, NK checked before CD8 per the source's ordering) draws a
  stochastic kill for every currently-infected cell from its NK/CD8 contact
  area; a small, deliberately close-contact scenario (2 macrophages/2 NK/2
  CD8, tight margin/separation) confirms this mechanism actually clears the
  infected cell (1 -> 0 at update 22 of 45) once genuine lattice contact
  happens, vs steady at 1 with killing disabled, same seed. This study's
  central, deliberately UN-hidden finding: at the SAME scenario's own
  DEFAULT full scale (6 macrophages/6 NK/6 CD8, the scale the localization
  numbers above are measured at), NK/CD8 close much of the distance to the
  infection (NK ~81.6 -> ~57.8, CD8 ~81.6 -> ~39.8 over 60 updates) but
  NEVER reach actual contact within the run budget -- n_infected stays
  unchanged at 1 for all 61 recorded steps, no kill fires. The killing
  CAPABILITY is demonstrated and verified correct; end-to-end cytotoxic
  CLEARANCE at default/realistic scale is NOT -- this is the same root
  cause as the localization mechanism's own 100x engine-unit-scale
  correction (the chemokine field's raw concentration is far below what the
  source's literal parameters were calibrated for), compounded by the
  three-cluster scenario's extra cluster-separation distance, and is
  recorded as an open Increment-9 field-magnitude-calibration item rather
  than tuned away. Discrepancy #7 (resist-DIRECT), the deferred
  nearby-population killing term, haptotaxis, stubbed recruitment, and
  2D-approximation geometry are all additional open items, not resolved
  here.

key_assumptions:
  - 100x CHEMOTAXIS ENGINE-UNIT SCALE — `NK_CD8_CHEMOTAXIS_ENGINE_SCALE=100.0`
    (Task 7.1), applied identically to NK and CD8's literal params.yaml
    lambda (preserving CD8's exact 2:1 ratio over NK), chosen from a
    one-time grid scan (50/200/500x) at a single seed then CONFIRMED (not
    re-tuned) across all 5 required seeds. The chemokine field's raw
    concentration is ~2-3 orders of magnitude smaller than the virus
    field's at comparable distances (chemokine diffuses ~87x faster, the
    same secreted mass spreads far more thinly), so the literal source
    lambda (5000/10000) is statistically undetectable against
    thermal/adhesion noise at this concentration scale -- a documented,
    non-per-seed-tuned engine-unit correction, an open Increment-9
    calibration item.
  - >-
    DISCREPANCY #7 (resist-DIRECT) — `ContactKillingSteppable.step()`
    multiplies `kill_rate` by `cell_resist` DIRECTLY, not `(1 -
    cell_resist)`, unlike every other resistance consumer in this codebase
    (`transitions.infected_death_step`, `allee.*`, the secretion-scale
    gates). Implemented literally per the source, not "fixed" -- a cell
    with MORE local IFN is killed FASTER by contact NK/CD8, the opposite of
    every other resist-gated protective mechanism here. Left unresolved as
    recorded (possible intentional antigen-presentation effect, or a
    source inconsistency -- not adjudicated).
  - NEARBY-POPULATION killing term deferred — `ContactKillingSteppable`
    also applies a well-mixed, non-spatial "nearby" kill term
    (`params.yaml`'s `nk.killing.nearby_term_deferred`/
    `cd8.killing.nearby_term_deferred`), independent of the LOCAL
    surface-contact term modeled here; requires Increment 8's
    population-scale ODE bookkeeping.
  - HAPTOTAXIS not modeled — only field-gradient chemotaxis (toward the
    chemokine field) drives NK/CD8 movement here; any
    adhesion/contact-gradient-driven directed-migration component is not
    implemented, an open Increment-9 item.
  - RECRUITMENT is stubbed — a FIXED NK/CD8 population (6 cells each) is
    placed at scenario build time; chemokine-driven inflow/outflow
    (`params.yaml`'s `nk.recruitment`/`cd8.recruitment`) is not modeled
    (requires the live immune-model ODE/SBML solver, Increment 8).
  - 2D-APPROXIMATION geometry — the same non-confluent, interior-placed 2D
    three-cluster patch as Increments 5/6, not the source's z=2
    immune-layer-over-confluent-z=1-sheet geometry. Faithful z=2 geometry
    is deferred to Increment 9, and may place NK/CD8 closer to the
    infection than this study's layout does (see report.main_expert_question).
  - CHEMOTAXIS FUNCTIONAL-FORM gap — the source uses a saturating,
    per-cell-COM-scaled lambda (`chemotaxis_v_nk / (1 + concentration)`);
    the engine primitive used here (`World.set_chemotaxis`) is a fixed
    LINEAR-regime lambda per (field, type). The fidelity criterion tested
    here is the localization/killing BEHAVIOR, not the exact functional
    form -- an Increment-9 calibration item.
  - END-TO-END CLEARANCE not demonstrated at default scale — reported
    honestly as this study's central gap (finding F-04), not tuned away by
    widening `NK_CD8_CHEMOTAXIS_ENGINE_SCALE` further or shrinking
    `separation_sites` until the default scenario also clears the
    infection; doing so would hide the real finding (the source's literal
    parameters don't calibrate against this engine's field-concentration
    units at any scale tried so far) behind a number that looks better than
    the mechanism's honest state.
  - No chemokine-driven APC/global-ODE-coupled recruitment amplification,
    no global ODE compartment, and no Figs 2/3A/3B/5/7 reproduction claim
    exist yet -- all later increments.

