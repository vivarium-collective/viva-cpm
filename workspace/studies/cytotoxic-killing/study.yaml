      on/off comparison against an unbiased interior-placed control) and the
      CONTACT-KILLING mechanism (a small close-contact scenario) as
      independently correct, but explicitly does NOT demonstrate end-to-end
      cytotoxic clearance at the scenario's own default/realistic scale
      (n_infected unchanged there) -- an honestly-reported gap, not a
      quantitative reproduction against any figure's acceptance band. Do
      NOT read PENDING here as a passing or failing reproduction verdict;
