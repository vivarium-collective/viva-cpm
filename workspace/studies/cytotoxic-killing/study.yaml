schema_version: 3
name: cytotoxic-killing
status: in-progress
phase: Simulate
title: "Increment 7: NK/CD8 chemotax up the chemokine field and localize robustly (5/5 seeds); contact-killing WORKS in a close-contact test (1->0) — but at the DEFAULT full-scale scenario NK/CD8 never reach the infected cell, so end-to-end cytotoxic CLEARANCE is WEAK — capability proven, clearance an Increment-9 calibration gap"
confidence: Provisional
investigation: influenza-sego2022
parent_studies:
  - study: signaling-fields
    condition: tests-passed

purpose:
  question: |
    Introducing NK (`types.K`) and CD8+ T (`types.E`) cells, wired to
    chemotax up the macrophage-released chemokine field (Increment 6) and to
    contact-kill infected cells via the CC3D source's literal LOCAL
    (surface-contact) kill-rate formula: do NK/CD8 genuinely LOCALIZE toward
    the infection (robust across seeds), does the contact-killing MECHANISM
    itself actually clear an infected cell once contact happens, and — the
    honest question this study exists to surface — does that killing
    mechanism actually engage end-to-end at the scenario's own DEFAULT
    full scale, or do NK/CD8 simply never get close enough within a
    feasible step budget?
  mechanism: nk_cd8_chemotactic_localization_and_contact_killing

report:
  title: "Increment 7: NK/CD8 localization is robust (NK mean change -20.37 vs control -1.02; CD8 -35.99 vs -0.54, 5/5 seeds) and contact-killing works in a close-contact test (infected 1->0 at ~update 22) — but at DEFAULT full scale NK/CD8 never reach the infected cell within budget (n_infected unchanged), so end-to-end clearance is WEAK — capability proven, clearance PENDING Increment 9"
  verdict: documented
  confidence: medium
  evidence_quality: measured
  objective: >-
    Drive `run.run_cytotoxic_response` (Task 7.1 localization + Task 7.2
    contact-killing, commit `4f28eba`) — the Task-7.1 three-cluster
    non-confluent scenario (`immune.build_cytotoxic_scenario_spec`:
    epithelial/infection patch | macrophage cluster | NK+CD8 cluster, every
    cluster INTERIOR, >= `margin_sites` from every noflux wall) over the
    Increment-6 macrophage/chemokine/IL-10 field stack, with NK/CD8
    chemotaxis wired up the CHEMOKINE field (`immune.
    set_nk_cd8_chemotaxis`) and, each update, a contact-kill draw
    (`killing.contact_kill_rate`, the CC3D source's literal LOCAL
    surface-contact kill-rate form) for every still-infected cell against
    its NK/CD8 neighbor contact area. Measure (a) NK/CD8 mean
    distance-to-infection-centroid across 5 seeds (5, 17, 23, 42, 100),
    chemotaxis on (params.yaml's `nk.chemotaxis_v_nk`/`cd8.chemotaxis_v_cd8`
    x the documented `NK_CD8_CHEMOTAXIS_ENGINE_SCALE=100` engine-unit
    correction, Task 7.1) vs a lambda=0 control, 60 updates each; (b) a
    small, tight close-contact scenario (2 macrophages/2 NK/2 CD8,
    `margin_sites=4`, `separation_sites=1`, `steps=45`, seed=17) with
    killing enabled vs disabled, same seed; and (c) the DEFAULT full-scale
    scenario (6 macrophages/6 NK/6 CD8, `margin_sites=20`,
    `separation_sites=20`, `steps=60`, seed=17) with killing enabled, to
    check whether the killing mechanism actually engages at the scale this
    increment's own localization numbers were measured at.
  conclusion: >-
    TWO SEPARATE, HONESTLY-DISTINGUISHED FINDINGS. (1) LOCALIZATION is
    robust: NK/CD8 mean distance to the infection centroid decreases in
    5/5 tried seeds for both cell types (NK mean change -20.37, range -15.22
    to -23.77; CD8 mean change -35.99, range -22.87 to -41.86), against a
    lambda=0 control with no consistent direction (NK mean -1.02, spread
    7.59; CD8 mean -0.54, spread 4.52) — both mean gaps comfortably exceed
    their control's own seed-to-seed spread, and CD8 (2x NK's lambda)
    localizes more strongly than NK in every seed and on average, matching
    the paper's Sec. 2.3 "CD8+ sensitivity twice that of NK cells." (2)
    CONTACT-KILLING is a proven, working MECHANISM, not an end-to-end
    CLEARANCE result: a small close-contact scenario (2 macrophages/2 NK/2
    CD8, `margin_sites=4`, `separation_sites=1`) kills the one infected cell
    (n_infected 1 -> 0 at update 22 of 45) with killing enabled, vs steady at
    1 with the identical seed/scenario and killing disabled — proving
    `contact_kill_rate`'s contact-area lookup -> stochastic draw -> `types.D`
    transition engages correctly once NK/CD8 are in actual lattice contact
    with an infected cell. BUT at the scenario's own DEFAULT full scale (6
    macrophages/6 NK/6 CD8, `margin_sites=20`, `separation_sites=20`, 60
    updates, same seed=17 as the close-contact test), NK/CD8's mean distance
    to the infection closes substantially (NK ~81.6 -> ~57.8, CD8 ~81.6 ->
    ~39.8) but NEVER reaches actual contact within the run budget —
    `n_infected` stays at 1 for all 61 recorded steps, no kill fires. The
    killing CAPABILITY is proven; end-to-end cytotoxic CLEARANCE at
    default/realistic scale is NOT demonstrated here, and this study does
    NOT claim "NK/CD8 clear the infection" — only that the mechanism that
    would clear it, once contact happens, is implemented and verified
    correct.
  main_insight: >-
    The weak end-to-end result is NOT a separate bug — it is the SAME root
    cause Task 7.1 already flagged for localization: the chemokine field's
    raw concentration in this engine's units is ~2-3 orders of magnitude
    smaller than the virus field's at comparable distances, so the source's
    literal chemotaxis lambda (5000/10000) is statistically undetectable
    against thermal/adhesion noise at this field's scale, requiring the
    documented, non-per-seed-tuned `NK_CD8_CHEMOTAXIS_ENGINE_SCALE=100`
    correction just to produce a MEASURABLE on/off localization gap — itself
    still far short of closing the FULL distance to actual contact within a
    feasible step budget. This compounds with `build_cytotoxic_scenario_spec`'s
    three-cluster layout (epithelial/infection patch -> macrophage cluster ->
    NK/CD8 cluster): NK/CD8 must close TWO cluster-separations' worth of
    distance to physically reach an infected cell, not one. Both are
    Increment-9 field-magnitude-calibration items, recorded not tuned away
    (per the brief's explicit instruction not to smuggle a rescue via
    re-tuning): if this study widened `NK_CD8_CHEMOTAXIS_ENGINE_SCALE` or
    shrank `separation_sites` until the default scenario also cleared the
    infection, that would hide the real finding (the source's literal
    parameters don't calibrate against this engine's field-concentration
    units) behind a number that looks better than the mechanism's honest
    state.
  caveat: >-
    Kept fully visible, not resolved here: (1) 100x CHEMOTAXIS ENGINE-UNIT
    SCALE — `NK_CD8_CHEMOTAXIS_ENGINE_SCALE=100.0` (Task 7.1), a single,
    documented, non-per-seed-tuned correction; the literal source lambda
    values (5000/10000) are statistically undetectable at this engine's
    chemokine-field concentration scale. (2) DISCREPANCY #7 (resist-DIRECT)
    — `ContactKillingSteppable.step()` multiplies `kill_rate` by
    `cell_resist` DIRECTLY, not `(1 - cell_resist)`, unlike every other
    resistance consumer in this codebase; implemented literally per the
    source, not "fixed," flagged in `killing.py`, `run.py`, and
    `params.yaml`'s `nk.killing.kill_rate_resist_direct`/
    `cd8.killing.kill_rate_resist_direct`. (3) NEARBY-POPULATION killing
    term deferred — `ContactKillingSteppable` also applies a well-mixed
    "nearby" (non-spatial) kill term (`params.yaml`'s
    `nk.killing.nearby_term_deferred`); only the LOCAL surface-contact term
    is modeled here, the nearby term requires Increment 8's population-scale
    ODE bookkeeping. (4) HAPTOTAXIS deferred — only field-gradient
    chemotaxis (toward the chemokine field) is modeled for NK/CD8 movement
    here; any adhesion/contact-gradient-driven (haptotactic) component of
    the source's fuller migration model is not implemented, an open
    Increment-9 item. (5) RECRUITMENT stubbed — a FIXED NK/CD8 population
    (6 cells each) is placed at scenario build time; chemokine-driven
    inflow/outflow (`params.yaml`'s `nk.recruitment`/`cd8.recruitment`) is
    not modeled. (6) 2D-APPROXIMATION geometry — the same non-confluent
    interior-placed 2D patch as Increments 5/6, not the source's z=2
    immune-layer-over-confluent-z=1-sheet geometry. (7) CHEMOTAXIS
    FUNCTIONAL-FORM gap — the engine's fixed linear-lambda
    `World.set_chemotaxis` primitive, not the source's saturating,
    per-cell-COM-scaled `chemotaxis_v_nk / (1 + concentration)` form. (8) NO
    Figs 2/3A/3B/5/7 reproduction claim is made — verdict stays
    `documented`, NOT `passing`; the full reproduction verdict is PENDING
    until Increment 9 (the capstone).
  key_metrics:
    - {name: nk_mean_distance_change_on, value: -20.37, note: "sites; mean over 5 seeds (5,17,23,42,100), NK_CD8_CHEMOTAXIS_ENGINE_SCALE=100x; negative (net approach) in 5/5 seeds"}
    - {name: nk_mean_distance_change_control, value: -1.02, note: "sites; mean over the same 5 seeds, lambda=0 control; spread 7.59, no consistent sign"}
    - {name: cd8_mean_distance_change_on, value: -35.99, note: "sites; mean over the same 5 seeds; CD8's lambda is 2x NK's, matching paper Sec. 2.3's 'CD8+ sensitivity twice that of NK cells'"}
    - {name: cd8_mean_distance_change_control, value: -0.54, note: "sites; mean over the same 5 seeds, lambda=0 control; spread 4.52, no consistent sign"}
    - {name: cd8_localizes_more_strongly_than_nk, value: "35.45 vs 19.35", note: "CD8's mean on/off gap exceeds NK's in every seed and on average"}
    - {name: close_contact_killing_infected_count, value: "1 -> 0", note: "small scenario (2 macrophages/2 NK/2 CD8, margin_sites=4, separation_sites=1, steps=45, seed=17); killed at update 22; steady at 1 with killing disabled, same seed"}
    - {name: default_scale_killing_n_infected, value: 1, note: "6/6/6 default scenario, margin_sites=20, separation_sites=20, steps=60, seed=17: n_infected stays 1 for all 61 recorded steps -- NO kill fires (ad hoc measurement, not part of the fast pytest suite; see task-7.2-report.md)"}
    - {name: default_scale_nk_distance_close, value: "81.6 -> 57.8", note: "sites; NK mean distance to infection over 60 updates at default scale -- closes substantially but never reaches contact"}
    - {name: default_scale_cd8_distance_close, value: "81.6 -> 39.8", note: "sites; CD8 mean distance to infection over 60 updates at default scale -- closer than NK but still never reaches contact"}

study_card:
  goal: Validate that NK (type K) and CD8+ T (type E) cells, wired to chemotax up the macrophage-released chemokine field and to contact-kill infected cells via the CC3D source's literal LOCAL surface-contact kill-rate formula, actually (a) LOCALIZE toward the infection robustly across seeds, and (b) actually CLEAR an infected cell once genuine lattice contact happens -- while honestly reporting whether that killing mechanism engages at the scenario's own DEFAULT full scale, rather than only in an artificially close-contact test.
  mechanism: >-
    The Task-7.1 three-cluster scenario (`immune.build_cytotoxic_scenario_spec`,
    every cluster interior-placed) extends the Increment-6
    macrophage/chemokine/IL-10 field stack with NK+CD8 cells chemotaxing up
    the chemokine field (`immune.set_nk_cd8_chemotaxis`); each update,
    `killing.contact_kill_rate` (literal `ContactKillingSteppable` LOCAL
    form, resist-DIRECT per discrepancy #7) draws a stochastic kill for
    every currently-infected cell from its NK/CD8 contact-area neighbors
    (`world.cell_contact_area_by_type`), NK checked first, CD8 skipped if
    NK already killed that update (source ordering).
  why_before_next: Increment 8 (global ODE coupling, APC-driven recruitment, the nearby-population killing term) and Increment 9 (the capstone reproduction) both assume the core NK/CD8 localization AND contact-killing mechanisms already work correctly in isolation before adding population-scale/ODE-coupled dynamics on top; this study establishes that both mechanisms are individually correct, while being explicit that they do not yet compose into end-to-end clearance at realistic scale -- a finding Increment 9's field-magnitude calibration needs to know about before it can be addressed, not hidden by tuning this study's own knobs.
  expected_result: NK/CD8 mean distance to the infection centroid decreases substantially and consistently across seeds when chemotaxis is on, vs a near-isotropic lambda=0 control. A small, deliberately close-contact scenario shows the contact-kill mechanism actually removes an infected cell once NK/CD8 reach it. At the scenario's own default full scale, NK/CD8 close much of the distance but do not reach actual contact within a feasible step budget, so the infected count is unchanged -- reported honestly as a gap, not tuned away.
  main_expert_question: The weak end-to-end result at default scale is the same chemokine-field-magnitude root cause Task 7.1 already flagged for localization alone (a single 100x engine-unit correction, not per-seed-tuned) -- should Increment 9's field-magnitude calibration treat chemotaxis lambda and contact-killing distance as one combined calibration target, or should the scenario geometry itself (cluster separation) also be recalibrated toward the source's true (non-2D-approximated) z=2 immune-layer placement, which may put NK/CD8 much closer to the infection than this study's 2D three-cluster layout does?

question: |
  Do NK (type K) and CD8+ T (type E) cells, chemotaxing up the macrophage-
  released chemokine field and contact-killing infected cells via the CC3D
  source's literal LOCAL surface-contact kill-rate formula, genuinely
  LOCALIZE to the infection (robust across seeds) and genuinely CLEAR an
  infected cell once contact happens -- and does that killing mechanism
  actually engage end-to-end within a feasible step budget at the
  scenario's own DEFAULT full scale, or only in an artificially
  close-contact test?

hypothesis: |
  NK/CD8 cells placed in the domain interior, chemotaxing toward the
  macrophage-released chemokine field via the engine's linear-lambda
  `World.set_chemotaxis` primitive, will move up the gradient and
  accumulate near the infection, robustly across seeds, with CD8 (2x NK's
  literal lambda) localizing more strongly. Once NK/CD8 are in actual
  lattice contact with an infected cell, `killing.contact_kill_rate`'s
  stochastic draw will remove it (`types.I` -> `types.D`). At the
  scenario's own default full scale, however, NK/CD8 may not close the full
  distance to the infected cell within a feasible step budget -- if so,
  that should be reported honestly as a weak end-to-end result, not
  concealed by re-tuning the scenario/lambda until it "works."

objective: |
  Wire NK (`types.K`)/CD8+ (`types.E`) chemotaxis (`immune.
  set_nk_cd8_chemotaxis`, Task 7.1) up the chemokine field (Increment 6)
  and contact-killing (`killing.contact_kill_rate`, Task 7.2, the literal
  `ContactKillingSteppable` LOCAL form) into the Task-7.1 three-cluster
  scenario (`immune.build_cytotoxic_scenario_spec`) and driver (`run.
  run_cytotoxic_response`), and measure: (a) NK/CD8 `mean_distance_to_
  infection` across 5 seeds (5, 17, 23, 42, 100), chemotaxis on (lambda x
  `NK_CD8_CHEMOTAXIS_ENGINE_SCALE=100`) vs a lambda=0 control (`tests/
  test_influenza_nk_cd8.py::test_nk_and_cd8_localize_to_infection_across_seeds`,
  task-7.1-report.md); (b) `n_infected` in a small close-contact scenario,
  killing enabled vs disabled, same seed (`tests/test_influenza_killing.py::
  test_infected_count_lower_with_nk_cd8_killing_than_without`,
  task-7.2-report.md); (c) `n_infected` at the scenario's own DEFAULT full
  scale with killing enabled, an ad hoc (not fast-pytest-suite) measurement
  recorded honestly in task-7.2-report.md's "Honest assessment" section. A
  minimal in-package figure (`pbg_cpm_studies/influenza/viz.py::
  cytotoxic_killing_figure`, Task 7.3) renders the NK+CD8 distance
  trajectory (on vs control overlay) plus the infected-count trajectory
  (killing enabled vs disabled overlay).

description: |
  Increment 7 of the influenza-sego2022 capability ladder: introduces NK
  (`types.K`) and CD8+ T (`types.E`) cell types, chemotaxing up the
  Increment-6 chemokine field (NOT the virus field -- that stays the
  macrophages' own chemotaxis target) and contact-killing infected cells via
  the CC3D source's literal LOCAL surface-contact kill-rate term
  (`ContactKillingSteppable`). Localization (Task 7.1) is validated across 5
  seeds against an unbiased interior-placed lambda=0 control, following the
  same fix-round-1 rigor Increment 5's macrophage-response study
  established. Contact-killing (Task 7.2) is validated as a working
  mechanism via a small, deliberately close-contact scenario -- and this
  study's central honest contribution is reporting, rather than concealing,
  that the SAME mechanism does not engage end-to-end at the scenario's own
  default full scale within a feasible step budget: NK/CD8 localize but
  don't reach actual contact, so no infected cell is cleared there. No
  nearby-population killing term (Increment 8), no haptotaxis, no
  chemokine/APC-driven recruitment dynamics (a fixed population is placed
  at scenario build time), and no Figs 2/3A/3B/5/7 reproduction claim --
  those are recorded in the caveats above, not modeled here.

claim: |
  NK/CD8 chemotaxis up the (unchanged, Increment-6) chemokine field
  produces genuine spatial LOCALIZATION, robust across 5 tried seeds (NK
  mean distance change -20.37, CD8 -35.99, both negative in 5/5 seeds,
  against a near-isotropic lambda=0 control, NK -1.02/CD8 -0.54) with CD8
  (2x NK's lambda) localizing more strongly than NK in every seed and on
  average -- matching the paper's Sec. 2.3 "CD8+ sensitivity twice that of
  NK cells." Separately, the contact-killing MECHANISM itself
  (`killing.contact_kill_rate`, the source's literal LOCAL surface-contact
  form, resist-DIRECT per discrepancy #7) is proven correct: a small
  close-contact scenario kills the one infected cell (1 -> 0 at update 22
  of 45) with killing enabled vs steady at 1 with the identical seed and
  killing disabled. THIS STUDY DOES NOT CLAIM "NK/CD8 CLEAR THE INFECTION"
  AT REALISTIC SCALE -- at the scenario's own DEFAULT full scale (same
  6-macrophage/6-NK/6-CD8, 60-update scenario the localization numbers
  above come from), NK/CD8 close much of the distance to the infection
  (NK ~81.6 -> ~57.8, CD8 ~81.6 -> ~39.8) but NEVER reach actual contact
  within the run budget, so `n_infected` is unchanged (stays at 1 for all
  61 recorded steps, no kill fires). The killing CAPABILITY is
  demonstrated; end-to-end cytotoxic CLEARANCE at default/realistic scale
  is an OPEN Increment-9 field-magnitude-calibration item, the same root
  cause as the localization mechanism's own 100x engine-unit-scale
  correction, deliberately NOT tuned away here.

expected_behavior:
  - NK and CD8 cells' mean centre-of-mass distance to the infected-cell
    centroid decreases when chemotaxis is switched on, consistently across
    multiple seeds, with CD8 (2x NK's lambda) showing a larger effect.
  - The same starting configuration, with chemotaxis switched off (an
    interior-placed, geometrically unbiased lambda=0 control), shows a
    small change with no consistent sign across seeds.
  - A small, deliberately close-contact scenario shows the infected-cell
    count drop to zero with killing enabled, vs remaining unchanged with
    killing disabled, same seed.
  - At the scenario's own DEFAULT full scale, the infected-cell count is
    NOT expected to drop within a feasible step budget -- NK/CD8 do not
    close the full distance to the infected cell in this run's step count,
    a result to be reported honestly, not tuned away.

readouts:
  - name: NK localization to infection (chemotaxis on), across seeds
    identifier: nk_mean_distance_to_infection
    units: sites
    status: measured
    description: >-
      `nk_mean_distance_to_infection` change (final - initial) from
      `run.run_cytotoxic_response` across 5 seeds (5, 17, 23, 42, 100):
      -18.59 (5), -23.39 (17), -15.22 (23), -23.77 (42), -20.86 (100);
      mean -20.37, negative in 5/5 seeds.
  - name: CD8 localization to infection (chemotaxis on), across seeds
    identifier: cd8_mean_distance_to_infection
    units: sites
    status: measured
    description: >-
      Same 5 seeds: -22.87 (5), -41.86 (17), -39.81 (23), -35.48 (42),
      -39.94 (100); mean -35.99, negative in 5/5 seeds, and more negative
      than NK's own change in every seed (CD8's lambda is 2x NK's).
  - name: Lambda=0 control is near-isotropic for both NK and CD8
    identifier: nk_cd8_distance_control
    units: sites
    status: measured
    description: >-
      Same 5 seeds, chemotaxis_lambda=0.0 for both types: NK +2.86, -0.66,
      -4.73, +1.01, -3.56 (mean -1.02, spread 7.59); CD8 +0.80, -3.72,
      +0.80, -0.34, -0.24 (mean -0.54, spread 4.52) -- no consistent sign
      in either type.
  - name: Contact-killing clears the infected cell in a close-contact scenario
    identifier: close_contact_n_infected
    units: cell count
    status: measured
    description: >-
      A small, tight-margin/separation variant (2 macrophages/2 NK/2 CD8,
      `margin_sites=4`, `separation_sites=1`, `steps=45`, seed=17): n_infected
      goes 1 -> 0 (killed at update 22) with killing enabled, vs steady at 1
      with killing disabled, identical seed/scenario otherwise.
  - name: End-to-end killing does NOT engage at the default full-scale scenario
    identifier: default_scale_n_infected
    units: cell count
    status: measured
    description: >-
      The scenario's own DEFAULT scale (6 macrophages/6 NK/6 CD8,
      `margin_sites=20`, `separation_sites=20`, `steps=60`, seed=17,
      `NK_CD8_CHEMOTAXIS_ENGINE_SCALE=100`) -- the same scenario the
      localization numbers above come from -- shows n_infected UNCHANGED
      at 1 for all 61 recorded steps: NK/CD8 close much of the distance
      (NK ~81.6 -> ~57.8, CD8 ~81.6 -> ~39.8) but never reach actual
      lattice contact with the infected cell within the run budget. This is
      the study's central honest finding: the killing mechanism itself is
      correct (see close_contact_n_infected above), but does not engage
      end-to-end at realistic scale. Ad hoc measurement (task-7.2-report.md),
      not part of the fast pytest suite (would be as slow as Task 7.1's own
      multi-seed test).

behavior_tests:
  - name: NK localization -- distance to infection decreases in every tried seed
    classification: primary
    description: |
      The full interior-placed cytotoxic scenario, chemotaxis on
      (NK_CD8_CHEMOTAXIS_ENGINE_SCALE=100x params.yaml default), across 5
      seeds (5, 17, 23, 42, 100): NK mean distance to the infection centroid
      must decrease (final < initial) in EVERY seed.
    measure: {kind: all_seeds_nk_on_distance_change_negative, condition: cytotoxic-nk-on-multiseed, stat: final}
    pass_if: {op: eq, value: true}
    status: passed
    result: PASS
    evaluated_by: tests/test_influenza_nk_cd8.py::test_nk_and_cd8_localize_to_infection_across_seeds
  - name: CD8 localization -- distance to infection decreases in every tried seed
    classification: primary
    description: |
      Same scenario/seeds: CD8 mean distance to the infection centroid must
      decrease in EVERY seed, and CD8's gap over the lambda=0 control must
      exceed NK's (matching the paper's Sec. 2.3 2x-sensitivity claim).
    measure: {kind: all_seeds_cd8_on_distance_change_negative, condition: cytotoxic-cd8-on-multiseed, stat: final}
    pass_if: {op: eq, value: true}
    status: passed
    result: PASS
    evaluated_by: tests/test_influenza_nk_cd8.py::test_nk_and_cd8_localize_to_infection_across_seeds
  - name: Contact-killing reduces infected count vs. killing-disabled control
    classification: primary
    description: |
      A small close-contact scenario (2 macrophages/2 NK/2 CD8,
      margin_sites=4, separation_sites=1, steps=45, seed=17): n_infected at
      the final step must be lower WITH killing enabled than WITHOUT,
      same-seed/scenario otherwise.
    measure: {kind: n_infected_final_with_killing_lt_without, condition: close-contact-killing-on-vs-off, stat: final}
    pass_if: {op: lt, value: "n_infected_without_killing[final]"}
    status: passed
    result: PASS
    evaluated_by: tests/test_influenza_killing.py::test_infected_count_lower_with_nk_cd8_killing_than_without
  - name: Killing-disabled control holds an identical scenario
    classification: secondary
    description: |
      `enable_killing=False` must build the SAME scenario/chemotaxis (NK/CD8
      present, still chemotaxing) as `enable_killing=True`, isolating the
      killing step's own effect from any localization run-to-run variation.
    measure: {kind: scenario_params_match_across_killing_flag, condition: killing-control-scenario-identity, stat: final}
    pass_if: {op: eq, value: true}
    status: passed
    result: PASS
    evaluated_by: tests/test_influenza_killing.py::test_killing_disabled_control_holds_identical_scenario
  - name: contact_kill_rate matches params.yaml's precomputed coefficients
    classification: secondary
    description: |
      `killing.contact_kill_rate`'s LOCAL kill-rate formula must reproduce
      params.yaml's precomputed `pr_cf_nk_loc`/`pr_cf_cd8_loc` (= g_i *
      tot_ec_ODE) to 1e-9 relative tolerance, and must apply `cell_resist`
      DIRECTLY (discrepancy #7), not `(1 - cell_resist)`.
    measure: {kind: contact_kill_rate_matches_precomputed_coefficients, condition: contact-kill-rate-unit, stat: final}
    pass_if: {op: eq, value: true}
    status: passed
    result: PASS
    evaluated_by: tests/test_influenza_killing.py::test_contact_kill_rate_matches_params_yaml_precomputed_coefficients

