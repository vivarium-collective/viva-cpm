discovery_implications:
  followup_study_proposals:
    - id: incr9-field-magnitude-calibration
      title: "Increment 9: chemokine field magnitude / chemotaxis lambda joint calibration"
      motivation: "This study's F-04 (end-to-end clearance does not engage at default scale) is the same root cause as Task 7.1's NK_CD8_CHEMOTAXIS_ENGINE_SCALE=100x correction. Increment 9's capstone reproduction needs a principled calibration of chemokine field magnitude and/or chemotaxis lambda against this engine's units, not another ad hoc scale factor -- and should consider whether NK/CD8-to-infection distance (this study's cluster-separation scenario choice) also needs recalibrating toward the source's true z=2 immune-layer geometry."
    - id: incr8-nearby-killing-and-recruitment
      title: "Increment 8: nearby-population killing term + chemokine-driven NK/CD8/macrophage recruitment"
      motivation: "params.yaml's nk.killing.nearby_term_deferred/cd8.killing.nearby_term_deferred and nk.recruitment/cd8.recruitment are both recorded but stubbed here, requiring the well-mixed 'nearby' population bookkeeping and the live immune-model ODE/SBML solver -- both explicitly scoped to Increment 8."
    - id: cytotoxic-larger-ensemble
      title: "Increment 9 (or earlier spike): larger-ensemble statistical characterization of NK/CD8 localization"
      motivation: "Same modest-ensemble caveat as macrophage-response (Increment 5): this study's 5-seed ensemble (5, 17, 23, 42, 100) shows the localization effect replicates but is not a systematic statistical power analysis or a source-scale replicate count."

