schema_version: 3
name: global-coupling
status: in-progress
phase: Simulate
title: "Increment 8: hybrid 10-species global ODE (Price 2015) integrates once/MCS, coupled bidirectionally to the spatial CPM model — the three carried stubs (dynamic sig_1, ODE-driven recruitment, NK/CD8 nearby-killing) are RESOLVED as mechanisms, source-faithful and wired correctly — but at reduced scale the coupling MAGNITUDES are not yet calibrated (dynamic sig_1 collapses ~1e-6 vs the old stub's 2.44; recruitment/nearby-killing stay too weak to engage naturally): mechanism-resolved, calibration-pending, Increment 9"
confidence: Provisional
investigation: influenza-sego2022
parent_studies:
  - study: cytotoxic-killing
    condition: tests-passed

purpose:
  question: |
    Coupling the Price (2015)-derived global immune ODE (10 systemic
    species) bidirectionally to the spatial CPM patch — spatial aggregates
    feeding the ODE each MCS, the freshly-integrated ODE state (TNF, APC)
    feeding back into spatial secretion regulation and recruitment — do the
    three mechanisms carried as documented stubs since Increments 5-7
    (static sig_1, absent recruitment, LOCAL-only cytotoxic killing) now
    resolve into DYNAMIC, ODE-driven mechanisms that are individually
    correct and source-faithful, and — the honest question this study
    exists to surface — do the resulting coupling MAGNITUDES already
    reconcile at this reduced-scale patch, or is the wiring correct while
    the field-vs-ODE unit scales still need Increment-9 calibration?
  mechanism: hybrid_price2015_global_ode_bidirectional_coupling

report:
  title: "Increment 8: the hybrid Price-2015 global ODE (10 systemic species) integrates once/MCS coupled bidirectionally to the spatial model, resolving all three carried stubs (dynamic sig_1, ODE-driven recruitment, NK/CD8 nearby-killing) as correct mechanisms — but coupling magnitudes are NOT yet calibrated at reduced scale (dynamic sig_1 ~1e-6 vs stub 2.44; recruitment/nearby-killing baseline-dominated or too weak to fire naturally): mechanism-resolved, calibration-pending Increment 9"
  verdict: documented
  confidence: medium
  evidence_quality: measured
  objective: >-
    Drive `run.run_global_coupling` (Tasks 8.1-8.5) — the Task-7.1
    three-cluster non-confluent scenario extended with a per-MCS
    `price_ode.GlobalODE` integration step (Task 8.1, discrepancy #9's
    hybrid correction: only the 10 systemic/integrated states `{NB, N, T,
    X, A, B, P, W, G, O}` are advanced by the integrator; the spatialized
    species `{H, I, M, E, K, L, C, F, V, DH}` are read from the CPM world
    each MCS as ODE inputs, never integrated). Each MCS: read spatial
    aggregates (cell counts by type, z-normalized field integrals, the
    resistance-weighted infected-load terms B_ei/G_ki) into the ODE (Task
    8.2); integrate one MCS (scipy `solve_ivp` LSODA, dt=60s, approximating
    the source's RoadRunner/libRoadRunner CVODE integrator); feed the
    freshly-integrated TNF (`T`) plus the spatial dead-epithelial count
    (`D`, DH-fix applied) into a DYNAMIC `sig_1 = a_11*T + a_12*D` (Task
    8.3, discrepancy #11's saturating IL-10-inhibited Michaelis secretion
    form) that replaces the static Increment-6 stub as the macrophage
    chemokine/IL-10 secretion-scale driver; run ODE-driven recruitment
    (Task 8.4, discrepancy #12: macrophage/NK inflow chemokine(C)-Hill-
    driven with a homeostatic baseline, CD8+ inflow strictly APC(P)-Hill-
    driven with NO baseline — asymmetric per the source, not symmetrized)
    that activates/removes CPM cells from a pre-seeded dormant reserve pool
    (the engine's `add_cell`/`seed_block` cannot mint cells after
    `finalize`, an engine-imposed geometry approximation: reserve cells
    activate from an interior reservoir rather than being minted at the
    lesion) and maintains well-mixed ODE nearby-population surrogates
    (`M_nb`/`K_nb`/`E_nb`); and combine the Increment-7 LOCAL NK/CD8
    contact-killing term with a new well-mixed NEARBY-population killing
    term (Task 8.5) into one `Pr = 1 - exp(-total_rate)` draw per infected
    cell. Measure, at the driver's default reduced-scale patch (`side=30`,
    tiny `eta` ~1.4e-4): (a) sig_1's dynamic range vs the retired static
    stub; (b) recruitment inflow/outflow rates and population trajectories,
    default vs a boosted-`eta` regime; (c) whether the nearby-killing term
    fires via NATURAL recruitment buildup within a feasible step budget,
    and via a documented test-seam override (`initial_K_nb`/`initial_E_nb`)
    that isolates the term's own wiring from the recruitment-magnitude gap.
  conclusion: >-
    MECHANISM RESOLVED, MAGNITUDE CALIBRATION PENDING (Increment 9) — this
    is the study's central, deliberately un-hidden finding, not a clean
    pass. All three stubs carried since Increments 5-7 are now DYNAMIC,
    source-faithful mechanisms, individually verified correct: (1) sig_1 is
    no longer a constant — it tracks the ODE's own integrated TNF (`T`)
    plus the spatial dead-epithelial count (`D`), through the unchanged
    Increment-6 Michaelis secretion-scale form (discrepancy #11 preserved
    verbatim). (2) Recruitment is ODE-driven with the source's documented
    asymmetry intact — CD8+ inflow is strictly APC-Hill-driven with NO
    homeostatic baseline (exactly 0.0 in the zero-signal control), while
    macrophage/NK keep a positive baseline even with their chemokine signal
    zeroed (discrepancy #12, not symmetrized). (3) NK/CD8 killing now
    combines the Increment-7 LOCAL contact term with a well-mixed NEARBY
    term driven by the ODE's `K_nb`/`E_nb` surrogates — verified to clear
    infected cells when a large synthetic nearby population is present (via
    the `initial_K_nb`/`initial_E_nb` test seam), confirming the wiring
    itself is correct. BUT at this driver's default reduced-scale patch
    (`side=30`, `eta` ~1.4e-4), none of the three mechanisms' MAGNITUDES
    reconcile with the values they replaced or need to produce an
    observable effect within a feasible run: dynamic sig_1 collapses the
    Michaelis secretion-scale factor to ~1e-5-1e-7 (vs the static stub's
    ~0.5-0.975) because the dynamic sig_1 value itself (~6.04e-7 at MCS 1,
    rising to ~2.82e-6 at MCS 20) is ~6 orders of magnitude below the
    retired stub (2.4412677); ODE-driven recruitment produces rates <0.01
    per MCS at default eta (macrophage 1.69e-3, NK 8.04e-3, CD8 3.29e-5 per
    MCS) — populations persist flat rather than growing by whole cells, and
    even a boosted `eta=1` regime that DOES seed cells (macrophage 10->43)
    does so from the homeostatic BASELINE term, not the chemokine/APC
    signal; and the nearby-killing term, left to grow via natural
    recruitment alone over a 300-MCS run, reaches only `K_nb` ~0.16-0.17
    and `E_nb` ~0.011 (eta ~1.44e-4) — orders of magnitude too small for
    `nearby_kill_rate` to fire within any fast step budget (no infected
    cell cleared by the nearby term alone in that run). These are FIELD-vs-
    ODE UNIT-SCALE CALIBRATION gaps, the same category of finding as
    Increment 7's `NK_CD8_CHEMOTAXIS_ENGINE_SCALE=100x` correction — NOT
    wiring bugs, and NOT tuned away here per the brief's explicit
    instruction. Do NOT read this study as a quantitative Fig-3B
    reproduction (that is Increment 9's capstone target); it establishes
    that the coupling mechanisms are correct and ready for that
    calibration pass.
  main_insight: >-
    Every one of this task's three "resolved" mechanisms hits the SAME
    root cause the investigation has flagged repeatedly since Increment 5:
    this engine's small default-scale patch produces field concentrations
    and population counts many orders of magnitude below what the source's
    literal ODE constants (calibrated at `tot_ec_ODE=250000`, the paper's
    full 1mm^2 organ scale) were designed to consume. `eta` (=
    `num_epithelial / 250000`) is tiny (~1.4e-4) at this driver's default
    `side=30`, so every `eta`-scaled coupling term — the cellularized
    Hill-dissociation constants driving recruitment, the nearby-population
    surrogates driving the new killing term, and (via `a_11`/`a_12`) the
    dynamic sig_1 itself — collapses toward zero long before it can produce
    an observable integer effect within a feasible step budget. This is
    NOT a new failure mode this task introduced; it is the field-magnitude/
    engine-unit-scale gap already recorded in `cytotoxic-killing`'s
    `main_insight` and `macrophage-response`'s localization numbers,
    now propagating into the ODE-coupling layer this task adds on top.
    Increment 9's capstone calibration needs to treat sig_1, recruitment,
    and nearby-killing as one COMBINED eta-scale calibration target, not
    three separate ad hoc corrections.
  caveat: >-
    Kept fully visible, not resolved here: (1) DISCREPANCY #9 (hybrid ODE)
    — only the 10 systemic/integrated states are advanced by the
    integrator; the spatialized species are held fixed as per-MCS inputs,
    never integrated, per the source's own spatial-coupling model (NOT the
    full ~20-variable well-mixed ODE). (2) DISCREPANCY #10 (spatial-string
    scalings) — the cellularized constants use the source's documented
    `s_t`/`s_v`/`s_l` (time/population/density) scale tokens from the
    "spatial model" variant of the ODE string, a judgment call the Task 8.1
    brief mandated over the alternative "well-mixed" scaling. (3)
    DISCREPANCY #11 (sig_1 dynamic form) — `sig_1 = a_11*T + a_12*D` and
    the unchanged Michaelis secretion-scale function are implemented
    verbatim; the MAGNITUDE gap above is a calibration item, not a
    functional-form deviation. (4) DISCREPANCY #12 (recruitment asymmetry)
    — CD8+'s no-baseline APC-driven inflow is implemented literally per the
    source and NOT symmetrized with macrophage/NK's baseline-bearing form,
    even though this makes CD8+ population growth strictly signal-gated.
    (5) DISCREPANCY #7 (resist-DIRECT), carried from Increment 7 — both the
    LOCAL and NEARBY killing terms multiply `resist` DIRECTLY, not
    `(1-resist)`, per the source's literal `ContactKillingSteppable` form.
    (6) LSODA-vs-CVODE — `scipy.integrate.solve_ivp`'s LSODA method
    approximates the source's RoadRunner/libRoadRunner CVODE integrator;
    not bit-for-bit identical, not expected to be. (7) RESERVE-POOL
    RECRUITMENT GEOMETRY — the engine's `World.add_cell`/`seed_block`
    error after `finalize`, so recruited cells activate from a pre-seeded
    dormant reserve pool parked in the domain's Medium margins (an interior
    reservoir), not minted at the lesion the way the source's
    `new_immune_cell_by_type` does — an engine-imposed approximation,
    immaterial to this task's population-count observable but a geometry
    difference worth flagging. (8) 2D-APPROXIMATION geometry, carried
    forward — the same non-confluent interior-placed 2D patch as
    Increments 5-7, not the source's z=2 immune-layer-over-confluent-z=1
    geometry. (9) NO Figs 3B/5/7 reproduction claim is made — verdict stays
    `documented`, biological_validation PENDING; the full quantitative
    reproduction is Increment 9 (the capstone), which must resolve the
    field-vs-ODE unit-scale calibration this study surfaces before a
    Fig-3B-style acceptance-band comparison is meaningful.
  key_metrics:
    - {name: sig_1_static_stub, value: 2.4412677, note: "params.il10.sig_1_stub == fields.il10_hill_constants()[0] — the retired Increment-6 constant"}
    - {name: sig_1_dynamic_mcs1, value: 6.04429e-07, note: "run_global_coupling(side=30, steps=20, seed=3): dynamic sig_1 = a_11*T + a_12*D at MCS 1 -- ~6 orders of magnitude below the retired stub"}
    - {name: sig_1_dynamic_mcs20, value: 2.82018e-06, note: "same run, MCS 20 -- monotone-rising as TNF T builds, still far below the stub"}
    - {name: secretion_scale_static_stub_at_L0, value: 0.975039, note: "signaling.macrophage_secretion_scale(L=0, sig_1=static stub, ...) -- near-maximal secretion"}
    - {name: secretion_scale_dynamic_at_L0_mcs20, value: 4.512e-05, note: "same function, dynamic sig_1 at MCS 20 -- secretion collapses to near-zero at this reduced scale (task-8.3-report.md)"}
    - {name: recruitment_default_eta_macro_inflow_per_mcs, value: 0.00169, note: "seed=5, default eta (tot_cell=36); chemokine-signal-driven, exceeds the zero-signal control's 0.000517 baseline, but far below one cell/MCS"}
    - {name: recruitment_default_eta_cd8_inflow_zero_signal, value: 0.0, note: "CD8+ inflow is EXACTLY 0.0 with the APC signal zeroed (discrepancy #12: no homeostatic baseline), vs macrophage/NK which stay positive"}
    - {name: recruitment_boosted_eta1_macrophage_growth, value: "10 -> 43", note: "eta=1 (tot_cell=250000): macrophage count grows from the homeostatic BASELINE term (mu_m*b_m ~3.6/MCS), not the chemokine-signal Hill term, which collapses at this eta (task-8.4-report.md)"}
    - {name: nearby_killing_natural_300mcs_K_nb, value: 0.165, note: "seed=1, default scenario, natural Task-8.4 recruitment (no test seam), 300 MCS: K_nb rises to ~0.16-0.17 then slowly declines as G_ki outflow grows; eta ~1.44e-4"}
    - {name: nearby_killing_natural_300mcs_infected_cleared, value: 0, note: "same 300-MCS run: no infected cell cleared by the nearby term alone at natural scale -- nearby_kill_rate's NK term ~2.4e-5*resist, orders of magnitude too small to fire (task-8.5-report.md)"}
    - {name: nearby_killing_test_seam_infected_cleared_mcs, value: 2, note: "with the initial_K_nb=2000/initial_E_nb=100 test seam (a synthetic large INITIAL CONDITION, not a tuned rate): both seeded infected cells cleared within the first 2 MCS -- confirms the nearby_kill_rate WIRING is correct, isolated from the recruitment-magnitude gap"}

study_card:
  goal: Validate that coupling the Price (2015)-derived global immune ODE (10 systemic species) bidirectionally to the spatial CPM patch resolves the three stubs carried since Increments 5-7 (static sig_1, absent recruitment, LOCAL-only NK/CD8 killing) into dynamic, source-faithful mechanisms -- and honestly report whether the resulting coupling magnitudes already reconcile at this reduced-scale patch, or whether that is deferred to Increment 9 calibration.
  mechanism: >-
    Each MCS, `run.run_global_coupling` reads spatial aggregates (cell
    counts, field integrals, resistance-weighted infected-load terms) into
    `price_ode.GlobalODE` (Task 8.1, discrepancy #9's hybrid 10-species
    integration), integrates one MCS (LSODA, dt=60s), feeds the freshly-
    integrated TNF + spatial dead count into a dynamic `sig_1` driving
    macrophage chemokine/IL-10 secretion (Task 8.3), runs ODE-driven
    recruitment that activates/removes CPM cells from a pre-seeded dormant
    reserve pool and maintains well-mixed nearby-population surrogates
    (Task 8.4), and combines LOCAL contact-killing with a new NEARBY
    well-mixed killing term for NK/CD8 (Task 8.5).
  why_before_next: Increment 9 (the capstone full-scale reproduction) assumes every coupling mechanism this task adds -- the global ODE integration, the spatial<->ODE bidirectional push, dynamic sig_1, ODE-driven recruitment, and nearby-population killing -- is individually WIRED CORRECTLY before its own field-magnitude/eta calibration pass can be meaningful; this study establishes that correctness while being explicit that the coupling magnitudes are not yet reconciled at reduced scale, so Increment 9 knows exactly what needs calibrating (sig_1's effective range, recruitment's chemokine/APC-Hill dissociation constants, and the nearby-killing rate's eta-scale divisor) rather than starting from an untested assumption.
  expected_result: The 10 systemic ODE species integrate stably once per MCS and respond to the spatial infection (TNF rises with dead-from-infected count). Dynamic sig_1 replaces the static stub and drives the same (unchanged) Michaelis secretion-scale form. ODE-driven recruitment shows a measurable chemokine/APC-signal-driven inflow rate above a zero-signal baseline, with CD8+'s no-baseline asymmetry preserved. The nearby-killing term clears infected cells when a large nearby population is present. At this driver's small default scale, none of these effects are expected to reach the same MAGNITUDE as the values/behavior they replace or need for an observable effect within a short run -- reported honestly as a calibration gap, not tuned away.
  main_expert_question: All three magnitude gaps (sig_1's collapse, recruitment's sub-single-cell rates, nearby-killing's too-weak natural buildup) trace to the same tiny default `eta` (~1.4e-4) -- should Increment 9's capstone calibration treat sig_1/recruitment/nearby-killing as ONE combined eta-scale calibration target (the way cytotoxic-killing's chemotaxis-lambda and default-scale-contact gap were flagged as the same root cause), or does each of the three ODE-coupling mechanisms need its own independent scale correction given they enter the ODE through different constants (a_11/a_12 for sig_1, a_mc/a_kc/a_ep for recruitment, g_ik/g_ie/eta directly for nearby-killing)?

question: |
  Does coupling the Price (2015)-derived global immune ODE (10 systemic
  species) bidirectionally to the spatial CPM patch — dynamic sig_1
  feedback, ODE-driven recruitment, and a well-mixed nearby-population
  killing term — resolve the three stubs carried since Increments 5-7 into
  mechanisms that are individually correct and source-faithful, and do the
  resulting coupling magnitudes already reconcile at this reduced-scale
  patch, or is that an open Increment-9 calibration item?

hypothesis: |
  Integrating the 10 systemic ODE species once per MCS, fed by the spatial
  model's cell counts/field integrals and feeding back a dynamic sig_1 plus
  ODE-driven recruitment plus a nearby-population killing term, will
  produce mechanisms that are each individually verifiable as correct
  (dynamic sig_1 tracks TNF/dead count; recruitment shows the source's
  documented CD8-no-baseline asymmetry; nearby-killing clears infected
  cells given a sufficient nearby population) — but at this driver's small
  reduced-scale default (tiny eta), the resulting coupling magnitudes may
  not yet be large enough to produce an observable effect within a
  feasible step budget, which should be reported honestly as a
  calibration gap deferred to Increment 9, not concealed by tuning
  constants to force a better-looking number.

objective: |
  Wire `price_ode.GlobalODE` (Task 8.1, the hybrid 10-species integrator,
  discrepancy #9) into `run.run_global_coupling`'s per-MCS loop: spatial->
  ODE aggregate push (Task 8.2), ODE->spatial dynamic sig_1 feedback (Task
  8.3, discrepancy #11), ODE-driven recruitment (Task 8.4, discrepancy
  #12), and NK/CD8 LOCAL+NEARBY cytotoxic killing (Task 8.5). Measure sig_1's
  dynamic range vs the retired static stub, recruitment inflow/outflow
  rates and population trajectories (default vs boosted eta), and whether
  the nearby-killing term fires via natural recruitment buildup vs a
  documented test-seam override
  (`tests/test_influenza_price_ode.py`, `tests/test_influenza_recruitment.py`,
  `tests/test_influenza_killing.py`, task-8.1 through task-8.5-report.md).
  A minimal in-package figure (`pbg_cpm_studies/influenza/viz.py::
  global_coupling_figure`, Task 8.6) renders the systemic ODE species
  (T/X/A/P) and the spatial aggregates (I/M/K/E) plus dynamic sig_1 over
  MCS.

description: |
  Increment 8 of the influenza-sego2022 capability ladder: adds the
  Price (2015)-derived global (whole-organ) immune ODE compartment,
  integrated once per MCS and coupled BIDIRECTIONALLY to the spatial CPM
  patch built up across Increments 1-7. This is the increment that
  resolves the three mechanisms carried as documented stubs since
  Increments 5-7 — the static `sig_1` secretion-scale constant
  (Increment 6), the absent chemokine/APC-driven recruitment dynamics
  (fixed populations, Increments 5-7), and the LOCAL-only NK/CD8
  cytotoxic-killing term (Increment 7, no well-mixed nearby-population
  contribution) — into dynamic, ODE-driven mechanisms. Each is verified
  individually correct and source-faithful (the Michaelis secretion form,
  the CD8-no-baseline recruitment asymmetry, the nearby-killing wiring via
  a documented test seam). This study's central, deliberately UN-hidden
  contribution is reporting — not concealing — that at this driver's small
  reduced-scale default (tiny eta ~1.4e-4), none of the three mechanisms'
  MAGNITUDES yet reconcile with the values they replaced or need to
  produce an observable effect within a feasible step budget: this is a
  field-vs-ODE unit-scale calibration gap, the same category of finding
  already recorded for macrophage/NK/CD8 chemotaxis in Increments 5/7, now
  propagating into the ODE-coupling layer. No Figs 3B/5/7 quantitative
  reproduction claim is made here — that is Increment 9 (the capstone),
  which needs this study's calibration gaps resolved first.

claim: |
  The hybrid Price-2015 global ODE (10 systemic species, discrepancy #9)
  integrates stably once per MCS and responds to the spatial infection.
  All three stubs carried since Increments 5-7 are RESOLVED as dynamic,
  source-faithful mechanisms: dynamic sig_1 (`a_11*T + a_12*D`, the
  unchanged Michaelis secretion form, discrepancy #11), ODE-driven
  recruitment (chemokine/APC Hill inflows with the source's CD8-no-
  baseline asymmetry preserved, discrepancy #12), and NK/CD8 killing
  extended with a well-mixed NEARBY term (verified via a documented test
  seam) alongside the unchanged Increment-7 LOCAL contact term. THIS STUDY
  DOES NOT CLAIM THESE MECHANISMS ARE ALREADY CALIBRATED — at this
  driver's default reduced-scale patch (eta ~1.4e-4), dynamic sig_1's
  value is ~6 orders of magnitude below the retired static stub (2.44),
  collapsing the secretion-scale factor to near-zero; ODE-driven
  recruitment produces sub-0.01-per-MCS rates (no observable integer
  population growth from the chemokine/APC signal within a short run, only
  from the baseline term at a boosted eta); and the nearby-killing term,
  grown via natural recruitment alone over 300 MCS, remains orders of
  magnitude too weak to fire. These are FIELD-vs-ODE UNIT-SCALE
  CALIBRATION gaps — the same root-cause category as Increment 7's
  chemotaxis-engine-scale correction — deliberately reported as open,
  NOT tuned away, and deferred to Increment 9.

expected_behavior:
  - The 10 systemic ODE species integrate stably (no divergence/NaN) once
    per MCS across a run, responding to the spatial infection (TNF rises
    with dead-from-infected count).
  - Dynamic sig_1 (a_11*T + a_12*D) replaces the static Increment-6 stub
    and drives the unchanged Michaelis macrophage secretion-scale form;
    its value differs from and is NOT expected to match the retired
    stub's magnitude at this reduced scale.
  - ODE-driven recruitment shows a measurably higher chemokine/APC-signal-
    driven inflow rate than a zero-signal control, with CD8+'s inflow
    EXACTLY zero when its APC signal is zeroed (the source's documented
    no-baseline asymmetry) while macrophage/NK keep a positive baseline.
  - The nearby-population killing term clears infected cells when a
    sufficiently large nearby population is present (test-seam override),
    confirming the wiring; it is NOT expected to fire via natural
    recruitment buildup alone within a short run at this reduced scale.

readouts:
  - name: Dynamic sig_1 replaces the static stub and is monotone-rising with TNF
    identifier: sigma1
    units: dimensionless (Michaelis-form driver)
    status: measured
    description: >-
      `run.run_global_coupling(side=30, steps=20, seed=3)`: sig_1 goes
      6.04429e-07 (MCS 1) -> 2.82018e-06 (MCS 20), monotone-rising as TNF
      T builds, ~6 orders of magnitude below the retired static stub
      (2.4412677) at this reduced scale.
  - name: ODE-driven recruitment preserves the source's CD8-no-baseline asymmetry
    identifier: recruit
    units: cells/inflow-rate per MCS
    status: measured
    description: >-
      seed=5, default eta: macrophage/NK inflow with signal (1.69e-3,
      8.04e-3 per MCS) exceeds their own zero-signal-control baseline
      (5.17e-4, 4.98e-5); CD8+ inflow is EXACTLY 0.0 in the zero-signal
      control (no homeostatic baseline, discrepancy #12) vs macrophage/NK
      which stay positive. At boosted eta=1, macrophage count grows 10->43
      from the baseline term, not the chemokine Hill term.
  - name: Nearby-killing wiring verified correct via test seam; too weak at natural scale
    identifier: nearby_kill
    units: cell count
    status: measured
    description: >-
      With `initial_K_nb=2000, initial_E_nb=100` (a synthetic initial
      condition, not a tuned rate): both seeded infected cells cleared
      within 2 MCS. With natural Task-8.4 recruitment alone over 300 MCS
      (seed=1, default eta~1.44e-4): K_nb reaches only ~0.16-0.17, E_nb
      ~0.011 -- nearby_kill_rate's NK term ~2.4e-5*resist, no infected
      cell cleared by the nearby term alone in that run.

behavior_tests:
  - name: GlobalODE integrates the 10 systemic species stably over a run
    classification: primary
    description: |
      `run.run_global_coupling` must return finite (non-NaN, non-diverging)
      trajectories for all 10 INTEGRATED_STATES across a short run.
    measure: {kind: ode_states_finite_and_stable, condition: global-coupling-ode-stability, stat: final}
    pass_if: {op: eq, value: true}
    status: passed
    result: PASS
    evaluated_by: tests/test_influenza_price_ode.py
  - name: Dynamic sig_1 differs from and replaces the static stub
    classification: primary
    description: |
      sig_1 computed each MCS from a_11*T + a_12*D must be a genuinely
      time-varying series (not the constant stub), monotone-rising when
      TNF T is rising.
    measure: {kind: sig_1_dynamic_monotone_and_differs_from_stub, condition: dynamic-sig1-vs-stub, stat: final}
    pass_if: {op: eq, value: true}
    status: passed
    result: PASS
    evaluated_by: tests/test_influenza_signaling.py
  - name: CD8+ recruitment inflow is APC-driven with no homeostatic baseline
    classification: primary
    description: |
      CD8+ inflow rate must be exactly 0.0 when the APC driving signal is
      zeroed (recruit_zero_signal=True), while macrophage and NK inflow
      stay strictly positive under the same control (discrepancy #12).
    measure: {kind: cd8_recruitment_is_apc_driven_asymmetry_preserved, condition: cd8-no-baseline-recruitment, stat: final}
    pass_if: {op: eq, value: true}
    status: passed
    result: PASS
    evaluated_by: tests/test_influenza_recruitment.py::test_cd8_recruitment_is_apc_driven_asymmetry_preserved
  - name: Nearby-population killing clears infected cells given a sufficient nearby population
    classification: primary
    description: |
      With the initial_K_nb/initial_E_nb test seam set to a large
      synthetic value, n_infected_final/I[-1] must be strictly lower than
      the K_nb=E_nb=0 control over the same short run, and
      dead_from_infected must be 0 in that control (non-vacuous).
    measure: {kind: n_infected_final_lower_with_nearby_surrogate_present, condition: nearby-killing-on-vs-off, stat: final}
    pass_if: {op: lt, value: "n_infected_final[K_nb=E_nb=0 control]"}
    status: passed
    result: PASS
