      observed: "default-eta chemokine/APC-Hill-driven inflow rates are all <0.01/MCS (macrophage 1.69e-3, NK 8.04e-3, CD8 3.29e-5); boosted eta=1 DOES seed cells (macrophage 10->43) but from the homeostatic baseline term, not the signal-driven Hill term, which collapses at that eta"
    statement: |
