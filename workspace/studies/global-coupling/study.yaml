conclusion: |
  MECHANISM RESOLVED, MAGNITUDE CALIBRATION PENDING (Increment 9). The
  hybrid Price-2015 global ODE (10 systemic species, discrepancy #9)
  integrates stably once per MCS, coupled bidirectionally to the spatial
  CPM patch. All three stubs carried since Increments 5-7 are now dynamic,
  source-faithful mechanisms, each individually verified correct: dynamic
  sig_1 (discrepancy #11's Michaelis form, unchanged, now driven by the
  ODE's own TNF + spatial dead count), ODE-driven recruitment (discrepancy
  #12's CD8-no-baseline asymmetry preserved literally), and NK/CD8 killing
  extended with a verified-correct NEARBY term alongside the unchanged
  Increment-7 LOCAL term. This study's central, deliberately UN-hidden
  finding: at this driver's small reduced-scale default (eta ~1.4e-4),
  NONE of these three mechanisms' MAGNITUDES yet reconcile with the values
  they replaced (sig_1) or need to produce an observable effect within a
  feasible run (recruitment, nearby-killing) -- a field-vs-ODE unit-scale
  calibration gap, the same root-cause category as Increment 7's
  chemotaxis-engine-scale correction, deliberately reported as open rather
  than tuned away. Other open items, all recorded not resolved:
  discrepancy #9 (hybrid, not full well-mixed ODE), #10 (spatial-string
  scalings), #7 (resist-direct killing, carried from Increment 7),
  LSODA-approximates-CVODE, the reserve-pool recruitment geometry
  approximation (engine add_cell-after-finalize limitation), and
  2D-approximation geometry. No Figs 3B/5/7 reproduction claim is made --
  that verdict stays PENDING until Increment 9 (the capstone), which needs
  this study's calibration gaps resolved first.

