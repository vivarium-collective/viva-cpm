  - id: F-01
    kind: computational
    status: confirms
    mechanism_origin: engineered
    evidence:
      from_test: Dynamic sig_1 differs from and replaces the static stub
      divergence_factor: null
      observed: "sig_1 = a_11*T + a_12*D: 6.04429e-07 (MCS 1) -> 2.82018e-06 (MCS 20), monotone-rising; retired static stub was the constant 2.4412677"
    statement: |
      The macrophage chemokine/IL-10 secretion-scale driver is genuinely
      dynamic now, computed each MCS from the ODE's own freshly-integrated
      TNF plus the spatial dead-epithelial count, through the unchanged
      Increment-6 Michaelis functional form (discrepancy #11) -- this
      resolves the static Increment-6 stub as a MECHANISM.
  - id: F-02
    kind: computational
    status: partial
    mechanism_origin: engineered
    evidence:
