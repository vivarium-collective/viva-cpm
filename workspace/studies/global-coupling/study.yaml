      divergence_factor: null
      observed: "dynamic sig_1 (~6.04e-7 to ~2.82e-6) is ~6 orders of magnitude below the retired static stub (2.4412677); the resulting Michaelis secretion-scale factor collapses to ~1e-5-1e-7 vs the stub's ~0.5-0.975 at representative local-IL-10 readings"
    statement: |
      Reported as a GAP, not hidden (status: partial): at this reduced-
      scale default (tiny eta), the dynamic sig_1's MAGNITUDE is far below
      what the retired stub supplied, collapsing macrophage secretion
      regulation to near-zero. This is a field-vs-ODE unit-scale
      calibration gap, not a functional-form or wiring defect -- deferred
      to Increment 9, not tuned away.
  - id: F-03
    kind: computational
    status: confirms
    mechanism_origin: engineered
    evidence:
      from_test: CD8+ recruitment inflow is APC-driven with no homeostatic baseline
      divergence_factor: null
      observed: "CD8+ inflow rate == 0.0 exactly when the APC signal is zeroed; macrophage inflow 5.17e-4, NK inflow 4.98e-5 stay positive under the same zero-signal control (seed=5, default eta)"
    statement: |
      Recruitment is genuinely ODE-driven and preserves the source's
      documented asymmetry (discrepancy #12): CD8+'s Hill-driven inflow has
      no homeostatic baseline term, unlike macrophage/NK -- implemented
      literally, not symmetrized for convenience.
  - id: F-04
    kind: computational
    status: partial
    mechanism_origin: engineered
    evidence:
      from_test: null
