    name: baseline
    composite: pbg_cpm_studies.composites.chemotaxis_receptor.recruitment_receptor
    params: {cue_rate: 10.0, chemo_lambda: 14.0, kd: 2.9} # cue ON, receptor-gated response ON

  model_settings: []
inputs: []

narrative_spine_skip: [implementation_requirements]
