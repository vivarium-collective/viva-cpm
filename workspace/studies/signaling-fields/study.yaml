biological_summary: |
  Building on Increment 5's macrophage-localization mechanism, this study
  adds two macrophage-released diffusible fields -- chemokine (attractant
  for future NK/CD8+ recruitment, Increment 7) and IL-10 (an
  immunoregulatory cytokine) -- both secreted by macrophages under a shared
  IL-10-Hill self-regulation loop (`signaling.macrophage_secretion_scale`,
  each macrophage gated by its OWN local IL-10 reading), with uninfected
  epithelial cells contributing a second, independently-gated IL-10 source
  (`signaling.uninfected_il10_scale`, `1-resist`, resist from local type-I
  IFN). Over a 15-update run (seed=17, default scenario), the chemokine
  field forms a genuine spatial gradient centered on the macrophage cluster:
  4.2x higher per-cell at macrophages than at a far uninfected epithelial
  patch, and a raw-lattice radial profile (independent of any cell's
  position) decays monotonically 5.9x from the macrophage-centered innermost
  bin outward across 6 bins. IL-10 is positive and increasing from both
  regulated sources (macrophages 2.97e-4, uninfected cells 3.71e-5), neither
  pinned at 0 nor saturating instantly. This demonstrates the FIELD
  mechanism behind the paper's chemokine-driven recruitment claim -- the
  gradient future NK/CD8+ chemotaxis (Increment 7) will follow genuinely
  exists and is correctly centered -- but nothing chemotaxes toward it yet,
  and several source terms are documented approximations, not
  reproductions: `sig_1` (the source's live TNF/global-ODE state gating both
  fields' secretion) is a fixed constant STUB, not the true dynamic value
  (Increment 8); `g_1`/`g_2`'s cellularization defaults to the
  0.3mm-scenario `eta` (this scenario has no exact patch size of its own,
  Increment 8/9); global boundary secretion terms and IL-10's uniform
  initial condition are both deferred (no field-write API for the latter;
  Increment 8/9). No reproduction verdict against any figure is made --
  that stays PENDING until Increment 9.

key_assumptions:
  - SIG_1 STUBBED — the source's `sig_1` (`Sigma1 := a_11*T + a_12*D`) is a
    live TNF-dependent global-ODE-solver state, not a fixed literal; Task
    6.1 introduces a SEPARATE, documented `il10.sig_1_stub` constant
    (distinct from Task 6.0's own honest non-numeric `il10.sig_1`
    documentation string) chosen so the Hill ratio term sits at a genuine
    non-degenerate self-regulation point (Hill(0)~=0.975 sliding toward
    Hill(large L)~=0.5) rather than trivially saturating. The L-dependent
    self-regulation SHAPE and the chemokine gradient's spatial shape both
    hold regardless of the stub value; the true TNF-dependent DYNAMICS are
    deferred to Increment 8.
  - G_1/G_2 ETA APPROXIMATION — `il10.g_1`/`g_2`/`d_2`'s cellularization
    (`fields.il10_hill_constants`) defaults to the 0.3mm-scenario `eta`
    (`scaling.eta_0p3mm`), the package's existing convention for a scenario
    (the non-confluent macrophage scenario) with no exact patch size of its
    own. Order-of-magnitude, documented, not scenario-calibrated
    (Increment 8/9).
  - GLOBAL BOUNDARY SECRETION + IL-10 IC DEFERRED — the source's
    `num_macro`-scaled global boundary terms are not modeled (Increment 8);
    IL-10's uniform initial condition is skipped because the engine has no
    field-write API (fields build up from sources only, starting at 0; the
    formula and raw `b_lh` constant are already recorded in `params.yaml`
    by Task 6.0) (Increment 9).
  - NO CHEMOTAXIS ON THE NEW FIELDS YET — this study measures that the
    chemokine gradient EXISTS and is correctly centered; wiring NK/CD8+
    recruitment to chemotax up it is Increment 7's scope, not modeled here.
  - Absolute chemokine/IL-10 magnitudes are NOT calibrated against the
    paper's figures (Increment-9 territory) — the fidelity criterion tested
    here (gradient shape centered on the macrophages, dual-source IL-10
    positivity) holds cleanly, not the exact numeric magnitudes.
  - Same 2D-approximation geometry and modest-scale scenario knobs as
    Increment 5's macrophage-response study (non-confluent 2D patch, both
    clusters domain-interior, 6 macrophages, 1 infected cell) — see that
    study's key_assumptions for the full geometry rationale, unchanged here.

literature_anchors:
  - expectation: "Macrophages release chemokine that recruits immune cells to the infection site, and IL-10 as an immunoregulatory cross-talk signal between macrophages and epithelial cells (Sego 2022 model structure; Table 3/4 give chemokine/IL-10 diffusion, decay, and secretion/Hill-regulation constants)."
    model_observable: "Chemokine forms a gradient centered on the macrophage cluster (4.2x per-cell near/far, 5.9x radial decay across 6 bins); IL-10 is positive and increasing from both the macrophage (Hill-self-regulated) and uninfected-cell (1-resist-gated) sources, over a 15-update run, seed=17."
    source: "CC3D ViralInfectionVTM source (ChemokineFieldSteppable / IL10FieldSteppable and their Antimony Hill-regulation rules) via pbg_cpm_studies/influenza/params.yaml chemokine: and il10: blocks"
    status_in_workspace: "Wired and measured directly (chemokine gradient shape, dual-source IL-10 positivity). sig_1 is a documented constant stub (not the true TNF-dependent dynamic value, Increment 8); g_1/g_2 use the 0.3mm-scenario eta approximation (Increment 8/9); global boundary secretion + IL-10 uniform IC are deferred (Increment 8/9); no chemotaxis toward the field is wired yet (Increment 7). No acceptance-band comparison to a digitized figure yet."
    cites: [sego2022influenza]

