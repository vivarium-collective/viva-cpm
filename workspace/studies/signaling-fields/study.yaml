schema_version: 3
name: signaling-fields
status: in-progress
phase: Simulate
title: "Chemokine & IL-10 signaling fields"
confidence: Provisional
investigation: influenza-sego2022
parent_studies:
  - study: macrophage-response
    condition: tests-passed

purpose:
  question: |
    Adding macrophage-released chemokine and IL-10 diffusible fields (Task
    6.1: `fields.add_chemokine_field`/`add_il10_field`, with per-cell
    secretion regulated by an IL-10-Hill self-regulation loop on macrophages
    and a `1-resist` gate on uninfected epithelial cells): does the
    chemokine field actually form a spatial GRADIENT centered on the
    macrophage cluster (the attractant signal Increment 7's NK/CD8+ cells
    will chemotax up), and is IL-10 genuinely positive and increasing from
    BOTH its regulated sources (macrophage, uninfected-cell)?
  mechanism: chemokine_il10_field_gradient

report:
  title: "Increment 6: chemokine field peaks at the macrophage cluster (0.00261 vs 0.00062 far, 4.2x) and decays monotonically with distance (0.00195 -> 0.00033 across 6 radial bins, 5.9x); IL-10 positive and increasing from both the macrophage-Hill and uninfected-1-resist sources — FIELD MECHANISM documented, reproduction still PENDING"
  verdict: documented
  confidence: medium
  evidence_quality: measured
  objective: >-
    Drive `run.run_macrophage_signaling` (Task 6.1, commit `48c96c1`) --
    extends the Increment-5 non-confluent macrophage scenario
    (`immune.build_macrophage_scenario_spec`) with two new diffusible
    fields (`fields.add_chemokine_field`/`add_il10_field`, on top of the
    unchanged virus + type-I IFN fields): macrophages (`types.M`) secrete
    BOTH chemokine and IL-10, per-cell-scaled by an IL-10-Hill
    self-regulation term (`signaling.macrophage_secretion_scale`, gated by
    each macrophage's own local IL-10 reading); uninfected epithelial cells
    (`types.H`) ALSO secrete IL-10, scaled by `1 - resist` (`signaling.
    uninfected_il10_scale`, resist from local type-I IFN). Measure (a) the
    chemokine field's per-cell near/far split (macrophages vs. an
    uninfected epithelial patch `separation_sites` of open Medium away) and
    its raw-lattice radial profile around the macrophage-cluster centroid
    (6 concentric distance bins, cell-position-independent), and (b) IL-10
    positivity/growth at both source populations, over 15 updates (10
    MCS/update), seed=17, default scenario knobs (6 macrophages, 1 infected
    cell, 16-cell epithelial patch, 25-site cluster separation).
  conclusion: >-
    CHEMOKINE/IL-10 FIELD MECHANISM DOCUMENTED, REPRODUCTION NOT YET
    ATTEMPTED. The chemokine field forms a genuine spatial gradient CENTERED
    ON THE MACROPHAGE CLUSTER, confirmed two independent ways: (1) per-cell,
    macrophages read 0.00261 vs. the far uninfected epithelial patch's
    0.00062 -- a 4.2x near/far ratio; (2) the raw-lattice radial profile (6
    concentric bins from the macrophage-cluster centroid, independent of any
    cell's position) decays monotonically from 0.00195 (innermost bin) to
    0.00033 (outermost bin) -- a 5.9x end-to-end drop. This is the direct
    "gradient centered on the macrophages, decaying with distance" evidence
    -- the attractant profile Increment 7's NK/CD8+ recruitment will chemotax
    up. IL-10 is positive and increasing at BOTH its regulated sources: 2.97e-4
    at macrophages (Hill self-regulated), 3.71e-5 at uninfected cells
    (1-resist gated) -- both engage cleanly (neither pinned at exactly 0 nor
    saturating instantly). This validates the FIELD mechanism (macrophage-
    released chemokine/IL-10, spatially localized, positive-and-regulated
    secretion) -- it is NOT a claim that any quantitative Fig 2/3A-adjacent
    target is met; that evaluation is deferred to Increment 9 (the
    capstone). No chemotaxis toward the chemokine field is wired yet (that
    is Increment 7's NK/CD8+ recruitment); this study only establishes that
    the gradient the future chemotaxis will follow actually exists and is
    centered where it should be.
  main_insight: >-
    The chemokine gradient is measured TWO independent ways that agree: a
    simple per-cell near/far comparison (macrophages vs. a far epithelial
    patch, 4.2x) and a raw-lattice radial profile around the macrophage
    centroid that is fully independent of cell positions (5.9x, 6 bins,
    predominantly monotonic decay). Agreement between a per-cell reading and
    a position-independent lattice reading rules out the gradient being an
    artifact of which cells happen to sample which lattice sites. IL-10's
    dual-source regulation (macrophage Hill self-regulation AND uninfected
    `1-resist` gating) both engage in the same short run, using the SAME
    IL-10-Hill parameters that gate chemokine secretion (source: `b_c`/`b_l`
    share `sig_1`/`g_1`/`g_2`/`d_2`) -- a single shared regulatory loop
    driving two distinct fields, matching the source's structure even though
    `sig_1` itself is a documented stub (see caveats).
  caveat: >-
    This is a FIELD-MECHANISM validation only, with explicit open items
    carried forward from Task 6.0/6.1, kept visible rather than hidden: (1)
    SIG_1 STUBBED -- the source's `sig_1` (`Sigma1 := a_11*T + a_12*D`) is a
    live TNF/global-ODE-solver state, not a fixed constant; Increment 6 uses
    a documented constant stub (`il10.sig_1_stub` = the cellularized `g_1`
    at the 0.3mm scenario, chosen so the Hill ratio sits at a genuine
    non-degenerate self-regulation point, Hill(0)~=0.975 sliding toward
    Hill(large L)~=0.5, rather than trivially saturating at 0 or 1). The
    L-dependent Hill self-regulation shape and the chemokine gradient's
    spatial shape both hold regardless of the stub; the TNF-dependent
    DYNAMICS of `sig_1` are deferred to Increment 8. (2) G_1/G_2 ETA
    APPROXIMATION -- `il10.g_1`/`g_2`/`d_2`'s cellularization (`fields.
    il10_hill_constants`) defaults to the 0.3mm-scenario `eta` (the
    package's existing convention for scenarios with no exact patch size of
    their own); the non-confluent macrophage scenario has no scenario-exact
    `eta`, so this is a documented order-of-magnitude approximation, not a
    scenario-calibrated value (Incr 8/9). (3) GLOBAL BOUNDARY TERMS +
    IL-10 IC DEFERRED -- the source's `num_macro`-scaled global boundary
    secretion terms are not modeled (Increment 8); IL-10's uniform initial
    condition is skipped (no field-write API in the engine -- fields build
    up from sources only, starting at 0; the formula and raw `b_lh` constant
    are already recorded in `params.yaml` by Task 6.0) (Increment 9). (4)
    REPRODUCTION VERDICT PENDING -- absolute chemokine/IL-10 magnitudes are
    NOT calibrated against the paper (Increment-9 territory); the fidelity
    criterion tested here (gradient shape centered on the macrophages,
    dual-source IL-10 positivity) holds cleanly, but no Figs 2/3A-adjacent
    reproduction claim is made. verdict = `documented`, NOT `passing`. (5)
    NO CHEMOTAXIS ON THE CHEMOKINE FIELD YET -- this study measures that the
    gradient EXISTS; wiring NK/CD8+ recruitment to chemotax up it is
    Increment 7's scope, not this study's.
  key_metrics:
    - {name: chemo_near_macrophages, value: 0.00261, note: "per-cell chemokine concentration at macrophage cells, final step (15 updates, seed=17)"}
    - {name: chemo_far_uninfected, value: 0.00062, note: "per-cell chemokine concentration at the far uninfected epithelial patch (separation_sites=25 of open Medium away), final step"}
    - {name: chemo_near_far_ratio, value: 4.2, note: "chemo_near_macrophages / chemo_far_uninfected"}
    - {name: chemo_radial_profile_innermost, value: 0.00195, note: "mean chemokine over the innermost of 6 concentric distance bins from the macrophage-cluster centroid (raw lattice, cell-position-independent)"}
    - {name: chemo_radial_profile_outermost, value: 0.00033, note: "mean chemokine over the outermost of 6 bins"}
    - {name: chemo_radial_decay_ratio, value: 5.9, note: "chemo_radial_profile_innermost / chemo_radial_profile_outermost; monotonic decay across all 6 bins"}
    - {name: il10_at_macrophages, value: 2.97e-4, note: "per-cell IL-10 at macrophages, final step; Hill-self-regulated secretion, positive and increasing"}
    - {name: il10_at_uninfected, value: 3.71e-5, note: "per-cell IL-10 at uninfected (H) cells, final step; (1-resist)-gated secretion, positive and increasing"}
    - {name: total_chemokine_final, value: 9.17, note: "lattice-sum chemokine, 0 -> 9.17 over 15 updates, strictly increasing"}
    - {name: total_il10_final, value: 0.72, note: "lattice-sum IL-10, 0 -> 0.72 over 15 updates, strictly increasing"}

study_card:
  goal: Validate that the macrophage-released chemokine field forms a genuine spatial gradient centered on the macrophage cluster (not a diffuse or wrong-centered artifact), and that IL-10 is positive and increasing from BOTH its regulated sources (macrophage Hill self-regulation, uninfected 1-resist gating) -- no claim about NK/CD8 chemotaxis toward the field (Increment 7) or any quantitative Fig 2/3A-adjacent reproduction target.
  mechanism: Task 6.1 extends the Increment-5 non-confluent macrophage scenario with two new diffusible fields (`fields.add_chemokine_field`/`add_il10_field`, dt/substeps stability-checked). Each update, after `world.step`, every macrophage's chemokine AND IL-10 per-cell secretion scale is set to `signaling.macrophage_secretion_scale(local_il10, sig_1_stub, g_1, g_2, d_2)` (an IL-10-Hill self-regulation loop reading each macrophage's OWN local IL-10); every uninfected epithelial cell's IL-10 secretion scale is set to `signaling.uninfected_il10_scale(resist)` (`1-resist`, resist from local type-I IFN). `run.run_macrophage_signaling` records per-cell near/far readings plus a raw-lattice radial profile around the macrophage-cluster centroid.
  why_before_next: Increment 7 (NK/CD8+ cytotoxic recruitment) needs a real chemokine gradient centered on the infection/macrophage site to chemotax up -- this study establishes that gradient exists, is correctly centered, and decays with distance, before any recruitment mechanism is built to follow it.
  expected_result: Chemokine concentration is substantially higher at/near the macrophage cluster than far from it, both per-cell and via a position-independent radial profile that decays monotonically with distance from the macrophage-cluster centroid. IL-10 is positive and increasing at both the macrophage and uninfected-cell source populations, neither pinned at 0 nor saturating instantly.
  main_expert_question: sig_1 (the source's TNF-dependent global-ODE state gating both chemokine and IL-10 secretion) is stubbed to a documented constant this increment, deferred to Increment 8's global ODE coupling. Is the chosen stub value (the cellularized g_1 at the 0.3mm scenario, giving a genuine non-degenerate Hill(0)~0.975->Hill(large L)~0.5 self-regulation range) an acceptable placeholder for Increment 7's chemotaxis-following work to build on, or should Increment 7 wait for Increment 8's dynamic sig_1 first?

question: |
  Do the macrophage-released chemokine and IL-10 diffusible fields (Task
  6.1) actually form the expected spatial and regulatory structure: a
  chemokine GRADIENT centered on the macrophage cluster (higher near, lower
  far, decaying with distance -- the attractant profile future NK/CD8+
  recruitment will chemotax up), and IL-10 positive/increasing from BOTH its
  regulated sources (macrophage Hill self-regulation, uninfected 1-resist
  gating)?

hypothesis: |
  Wiring macrophage-released chemokine secretion (Hill-self-regulated by
  each macrophage's own local IL-10) and dual-source IL-10 secretion
  (macrophage Hill-regulated + uninfected 1-resist-gated) as diffusible
  fields over the Increment-5 macrophage scenario will produce a chemokine
  concentration that is substantially higher at/near the macrophage cluster
  than far from it, decaying with distance in a position-independent radial
  profile -- and both IL-10 sources will register positive, increasing
  concentration, neither pinned at exactly 0 (the secretion never engages)
  nor saturating instantly (the Hill/resist gates are degenerate).

objective: |
  Wire the chemokine + IL-10 fields (`fields.add_chemokine_field`/
  `add_il10_field`, Task 6.1) and their per-cell secretion regulation
  (`signaling.macrophage_secretion_scale`/`uninfected_il10_scale`) into the
  Increment-5 non-confluent macrophage scenario, and drive
  `run.run_macrophage_signaling` (steps=15, seed=17, default scenario
  knobs) to measure: (a) the chemokine field's per-cell near (macrophages)
  vs. far (uninfected epithelial patch, `separation_sites` away) split, and
  its raw-lattice radial profile (6 concentric bins) around the macrophage-
  cluster centroid; (b) IL-10 positivity and growth at both the macrophage
  and uninfected-cell source populations. Evidence: `tests/
  test_influenza_signaling.py`'s 4 integration tests
  (`test_chemokine_and_il10_fields_are_positive_after_macrophage_signaling_run`,
  `test_chemokine_field_is_highest_near_macrophages_and_decays_with_distance`,
  `test_il10_positive_from_macrophage_and_uninfected_sources`,
  `test_macrophage_signaling_run_is_deterministic`) plus the full
  localization numbers recorded in task-6.1-report.md. A minimal in-package
  figure (`pbg_cpm_studies/influenza/viz.py::signaling_fields_figure`, Task
  6.2) renders the chemokine radial profile (panel a) and the IL-10
  trajectories at both source populations (panel b).

description: |
  Increment 6 of the influenza-sego2022 capability ladder (re-scoped after
  Increment 5 -- see the investigation overview's 5/6 re-scope note): adds
  the chemokine and IL-10 diffusible fields (`fields.add_chemokine_field`/
  `add_il10_field`, Task 6.1), macrophage-released and regulated by a shared
  IL-10-Hill self-regulation loop (`signaling.macrophage_secretion_scale`),
  with uninfected epithelial cells contributing a second, `1-resist`-gated
  IL-10 source (`signaling.uninfected_il10_scale`) -- on top of the
  unchanged Increment-5 macrophage scenario and Increment-2/3 virus/IFN
  fields. No chemotaxis toward the new chemokine field is wired yet (that is
  Increment 7's NK/CD8+ recruitment mechanism); this increment only
  establishes that the gradient exists and is correctly centered. `sig_1`
  (the source's TNF-dependent global-ODE state) is a documented constant
  stub, not the true dynamic value (Increment 8); `g_1`/`g_2`'s
  cellularization uses the 0.3mm-scenario `eta` approximation (Increment
  8/9); global boundary secretion terms and IL-10's uniform initial
  condition are deferred (Increment 8/9). No reproduction claim against any
  figure is made -- that verdict stays PENDING until Increment 9.

claim: |
  Wiring macrophage-released chemokine + IL-10 diffusible fields, with
  per-cell secretion regulated by a shared IL-10-Hill self-regulation loop
  (macrophages) and a `1-resist` gate (uninfected epithelial cells),
  produces a genuine chemokine GRADIENT centered on the macrophage cluster:
  per-cell, macrophages read 0.00261 vs. 0.00062 at a far uninfected
  epithelial patch (4.2x near/far), and a raw-lattice radial profile
  (position-independent) decays monotonically from 0.00195 at the
  macrophage-centered innermost bin to 0.00033 at the outermost of 6 bins
  (5.9x end-to-end drop). IL-10 is positive and increasing from BOTH its
  regulated sources (macrophages 2.97e-4, uninfected cells 3.71e-5, final
  step). This is a FIELD-MECHANISM validation claim (the gradient future
  NK/CD8+ recruitment, Increment 7, will chemotax up genuinely exists and is
  correctly centered) -- NOT a claim that any quantitative reproduction
  target is met, that `sig_1`'s true TNF-dependent dynamics are modeled (a
  documented constant stub is used, Increment 8), or that recruitment/
  chemotaxis toward the field is wired (Increment 7). That fuller
  reproduction verdict remains PENDING until Increment 9 (the capstone).

expected_behavior:
  - Chemokine concentration at macrophage cells exceeds chemokine
    concentration at a far uninfected epithelial patch, and both are
    positive and increasing over the run.
  - A raw-lattice radial profile around the macrophage-cluster centroid
    (independent of any cell's position) decays predominantly monotonically
    from the innermost (macrophage-centered) bin to the outermost.
  - IL-10 concentration is positive and increasing at both the macrophage
    (Hill-self-regulated) and uninfected-cell (1-resist-gated) source
    populations.
  - Repeated runs with the same seed produce identical field trajectories
    and radial profiles (fully deterministic).

readouts:
  - name: Chemokine near/far ratio (macrophages vs. far uninfected patch)
    identifier: chemo_near_far_ratio
    units: dimensionless (concentration ratio)
    status: measured
    description: >-
      `chemo_at_macrophages` / `chemo_at_uninfected` from
      `run.run_macrophage_signaling` at the final step (steps=15, seed=17):
      0.00261 / 0.00062 = 4.2x. The per-cell near/far evidence for a
      gradient centered on the macrophages.
  - name: Chemokine radial decay (macrophage-cluster centroid)
    identifier: chemo_radial_decay_ratio
    units: dimensionless (concentration ratio)
    status: measured
    description: >-
      `chemo_radial_profile.bin_means`, innermost / outermost of 6
      concentric distance bins from the macrophage-cluster centroid,
      computed over the raw lattice (independent of cell positions):
      0.00195 / 0.00033 = 5.9x, monotonically decaying across all 6 bins.
      The direct, cell-position-independent "gradient centered on the
      macrophages, decaying with distance" evidence.
  - name: IL-10 positive from both regulated sources
    identifier: il10_dual_source_positivity
    units: concentration (per-cell field mean)
    status: measured
    description: >-
      `il10_at_macrophages` (2.97e-4, Hill self-regulated) and
      `il10_at_uninfected` (3.71e-5, 1-resist gated) both positive and
      increasing over the run's final step -- both regulated sources
      engage, neither degenerate (pinned at 0 or saturating instantly).

behavior_tests:
  - name: Chemokine and IL-10 fields are positive after the run
    classification: primary
    description: |
      `run.run_macrophage_signaling`'s lattice-sum chemokine and IL-10
      totals must both be positive and strictly greater than their (zero)
      starting values by the final step.
    measure: {kind: total_field_positive_and_increasing, condition: signaling-fields-positivity, stat: final}
    pass_if: {op: eq, value: true}
    status: passed
    result: PASS
    evaluated_by: tests/test_influenza_signaling.py::test_chemokine_and_il10_fields_are_positive_after_macrophage_signaling_run
  - name: Chemokine is highest near macrophages and decays with distance
    classification: primary
    description: |
      Per-cell chemokine at macrophages must exceed chemokine at the far
      uninfected epithelial patch, AND the raw-lattice radial profile
      around the macrophage-cluster centroid must be positive in the
      innermost bin, higher in the innermost than the outermost bin, and
      predominantly non-increasing with distance (at most one local bump
      allowed, from noise/geometry).
    measure: {kind: chemo_near_gt_far_and_radial_decay, condition: signaling-fields-gradient, stat: final}
    pass_if: {op: eq, value: true}
    status: passed
    result: PASS
    evaluated_by: tests/test_influenza_signaling.py::test_chemokine_field_is_highest_near_macrophages_and_decays_with_distance
  - name: IL-10 positive from both macrophage and uninfected sources
    classification: primary
    description: |
      `il10_at_macrophages` and `il10_at_uninfected` must both be positive
      at the final step -- confirming both regulated secretion pathways
      (macrophage Hill self-regulation, uninfected 1-resist gating)
      actually engage.
    measure: {kind: il10_dual_source_positive, condition: signaling-fields-il10-sources, stat: final}
    pass_if: {op: eq, value: true}
    status: passed
    result: PASS
    evaluated_by: tests/test_influenza_signaling.py::test_il10_positive_from_macrophage_and_uninfected_sources
  - name: Run is fully deterministic given a fixed seed
    classification: secondary
    description: |
      Two `run.run_macrophage_signaling(steps=8, seed=17)` calls must
      produce identical `total_chemokine`, `total_il10`, and
      `chemo_radial_profile` series -- no unseeded randomness in the field
      mechanism.
    measure: {kind: series_equal_across_repeats, condition: signaling-fields-determinism, stat: all}
    pass_if: {op: eq, value: true}
    status: passed
    result: PASS
    evaluated_by: tests/test_influenza_signaling.py::test_macrophage_signaling_run_is_deterministic

