findings:
  - id: F-01
    kind: computational
    status: confirms
    mechanism_origin: engineered
    evidence:
      from_test: repro_fig5 sweeps viral loads and returns a well-formed by_load/band_eval dict with the monotone dose-response
      divergence_factor: null
      observed: "by_load keys == {1, 10000}; lethal_threshold=10000; top-level band_eval present with passed=False; uninfected_final_frac 0.6111 (load=1) -> 0.0 (load=10000), monotone non-increasing"
    statement: |
      `run.repro_fig5` is wired correctly: it sweeps a seeded ensemble of
      `run_full_model` per initial viral load with a uniform virus-field
      IC, maps every observable onto `targets/fig5.json`'s exact keys via
      `_FIG5_OBSERVABLE_MAP`, ensemble-means per load with
      `bands.aggregate_replicas`, filters each load's own scenario-tagged
      band subset via `_fig5_target_subset` (verified to raise `ValueError`
      rather than silently mixing scenarios when a load has no tagged
      entries -- the Task-9.0-review scenario-grouping guard), and produces
      a well-formed per-load and aggregate `band_eval` via
      `_evaluate_fig5_subset` -- the sweep-and-guard machinery itself is
      verified correct and reusable for the Mac-mini Phase-B paper-scale,
      all-5-load run.
  - id: F-02
    kind: computational
    status: confirms
    mechanism_origin: engineered
    evidence:
      from_test: repro_fig5 sweeps viral loads and returns a well-formed by_load/band_eval dict with the monotone dose-response
      divergence_factor: null
      observed: "uninfected_final_frac(load=1)=0.6111 (88/144), uninfected_final_frac(load=10000)=0.0 (0/144); infected_cells rises to 56/144 by load=1's final record vs 133/144 by load=10000's"
    statement: |
      The MONOTONE dose-response direction -- the qualitative mechanism
      this task's reduced-scale test is built to check, per the task
      brief's fidelity criterion -- holds cleanly: seeding a higher initial
      viral load never leaves MORE surviving uninfected cells than a lower
      load, at this reduced 144-cell, 1-replica, ~0.068-day scale. This is
      consistent with (though far smaller-scale than, and not a magnitude
      match for) the paper's own Sec. 3.3 qualitative narrative that higher
      viral-load multipliers drive progressively worse outcomes.
  - id: F-03
    kind: computational
    status: partial
    mechanism_origin: engineered
    evidence:
      from_test: null
      divergence_factor: 35.7
      observed: "load=1 band_eval passed=False (0/4 observables fully in-band); load=10000 band_eval passed=False (3/4 observables fully in-band, up from 2/4 -- see F-04); infected_cells (load=1, worst_miss 35.7) and uninfected_cells (load=1, worst_miss 5.57) are now the dominant misses, not extracellular_virus (see F-04)."
    statement: |
      SUPERSEDED IN PART by F-04 (Task-9.3-review units fix, this update):
      this finding originally reported extracellular_virus missing hardest
      and identically at both loads (worst_miss ~1200) as a "units
      mismatch" attributed to the engine's virus-field concentration scale.
      That diagnosis was WRONG -- it was a structural raw-sum-vs-mean units
      BUG in `repro_fig5`'s observable mapping (fixed, see F-04), not a
      genuine PFU-equivalent calibration gap. With the bug fixed,
      extracellular_virus is now among the BEST-matching observables (4/6
      at load=1, FULLY in-band at load=10000), and the dominant remaining
      miss driver is the population-count observables (infected_cells,
      uninfected_cells) at load=1 -- the same population-scale (144 vs.
      10000 cells) and run-duration (~0.068 vs. up to 15 simulated days)
      mismatch `repro_fig3b`'s study documents for its own population
      counts, not a units or PFU-scale issue. This is the study's honest
      reported GAP (status: partial), not hidden behind the driver's
      structural correctness (F-01/F-02): at reduced scale, per-load
      `band_eval["passed"]` is still False for every tested load. load=10000's
      uninfected_cells/antibodies/extracellular_virus land fully in-band, but
      as `report.main_insight` documents this partly reflects the paper's
      own widest, highest-spread bands at that load (Sec. 3.3) plus this
      reduced run's near-instant total-infection collapse, not
      individually-superior calibration at that load. NOT tuned away: no
      constant was adjusted and `targets/fig5.json` was not edited to
      narrow this gap.
  - id: F-04
    kind: computational
    status: confirms
    mechanism_origin: engineered
    evidence:
      from_test: test_repro_fig5_extracellular_virus_is_concentration_not_raw_sum
      divergence_factor: null
      observed: "extracellular_virus worst_miss: load=1 1199 -> 0.208, load=10000 1196 -> 0.0 (now fully in-band); t=0 spatial-mean model value ~0.375x target at both loads (e.g. load=1: mean=0.375 vs target=1.0; load=10000: mean=3750 vs target=10000), same order of magnitude"
    statement: |
      UNITS FIX (Task-9.3-review MUST-FIX): `repro_fig5` (and
      `repro_fig3b`/`repro_fig7`) previously mapped `run_full_model`'s
      "fields" section -- a RAW SUM of `world.field_conc(...)` over every
      lattice site, needed as-is by the §4 ODE coupling's V/F/C/L inputs --
      straight through to the field-typed target observables
      (extracellular_virus, type1_ifn, chemokines, il10), while
      `targets/{fig3b,fig5,fig7}.json` digitizes those as PER-SITE
      CONCENTRATIONS (fig5.json's t=0 extracellular_virus target for
      viral_load_multiplier=load IS load itself). The raw sum over-reports
      by ~n_lattice_sites (structurally worse at paper scale, more lattice
      sites), which is exactly what F-03 originally (mis)diagnosed as a
      PFU-equivalent calibration gap. `_map_full_model_observables`
      (`pbg_cpm_studies/influenza/run.py`) now converts only the 4
      field-typed observables to the SPATIAL-MEAN concentration
      (`sum(field_conc)/n_lattice_sites`, `n_lattice_sites` from this run's
      own `params.dims`) at the repro-observable-mapping layer -- NOT in
      `run_full_model`'s own recording, which Increments 0-8 and the ODE
      coupling still rely on as a raw sum. This resolves the structural
      sites-factor: extracellular_virus's worst_miss drops by ~4 orders of
      magnitude at both tested loads, and load=10000's extracellular_virus
      is now fully in-band (was 0/6). An HONEST RESIDUAL remains, NOT tuned
      away: the spatial-mean model value at t=0 is consistently ~0.375x the
      target at both loads -- the ratio of the seeded patch's lattice-site
      count to the full simulation domain's lattice-site count
      (`run_full_model` reserves margin/separation sites around the patch
      for the immune-cell clusters and recruit reserve pool; the virus is
      seeded only under the patch, so averaging over the larger full-domain
      lattice dilutes it by the patch/domain area ratio). This is a
      distinct, real domain-geometry effect, honestly flagged for Phase-B,
      not evidence the units fix is incomplete, and no constant was tuned
      and no band was widened to close it. Verified by the new fast
      regression test
      `test_repro_fig5_extracellular_virus_is_concentration_not_raw_sum`
      (`tests/test_influenza_full_model.py`).

conclusion: |
  `run.repro_fig5` (Task 9.3) IS IMPLEMENTED AND WIRED CORRECTLY, INCLUDING
  THE SCENARIO-GROUPING GUARD (`_fig5_target_subset`, verified both to
  filter correctly and to raise loudly on an untagged load): it sweeps a
  seeded ensemble of `run_full_model` per initial viral load, maps every
  observable onto `targets/fig5.json`'s exact keys, ensemble-means per load,
  and evaluates EACH load against ONLY that load's own scenario-tagged band
  subset, verified by `tests/test_influenza_full_model.py::
  test_repro_fig5_viral_load_sweep`. FIG-5 IS NOT REPRODUCED AT THE REDUCED
  SCALE THIS TASK'S FAST TEST USES, AND THIS STUDY DOES NOT CLAIM IT IS: at
  `loads=(1,10000), replicas=1, cells_per_side=12, steps=15, seed0=0` (144
  epithelial cells vs. the target's 10000; only 2 of the paper's 5 viral
  loads swept; ~0.068 simulated days vs. the target's 0.0-15-day checkpoint
  window), per-load `band_eval["passed"]` is False for both tested loads
  (see `report.key_metrics` for the full per-observable breakdown). The
  MONOTONE dose-response direction this reduced test's own assertion checks
  holds cleanly (`uninfected_final_frac`: 0.6111 at load=1 -> 0.0 at
  load=10000) -- the qualitative mechanism fidelity criterion the task
  brief specifies for this reduced scale, distinct from and not a substitute
  for per-load band containment at paper scale. THE PAPER-SCALE 50-REPLICA,
  ALL-5-LOAD, 35x35-CELL (10000-cell), ~15-SIMULATED-DAY ENSEMBLE
  (documented in `repro_fig5`'s own docstring, including the corrected
  `steps≈3086` for the full 15-day window, as the Mac-mini Phase-B
  follow-up) IS REQUIRED BEFORE ANY `reproduced` VERDICT FOR FIG 5 CAN BE
  SET. This study's own verdict stays `documented`, and
  `conclusion_verdicts.biological_validation` stays PENDING. No band was
  widened, no constant was tuned, and `targets/fig5.json` was not edited to
  make any number in this report look better than it is.

  UNITS FIX UPDATE (Task-9.3-review MUST-FIX, this update, see F-04):
  extracellular_virus is no longer the dominant miss -- the structural
  raw-sum-vs-mean units bug this study previously (mis)read as a
  PFU-equivalent scale mismatch is fixed, and extracellular_virus now lands
  fully in-band at load=10000 and 4/6 at load=1 (worst_miss 0.208-0.0, down
  from ~1200 at both loads). FIXING THE UNITS DOES NOT MAKE FIG-5
  REPRODUCED -- both loads' `band_eval["passed"]` is still False, now driven
  by population-count observables (infected_cells/uninfected_cells) at
  load=1, the same population-scale/run-duration mismatch already
  documented above; this study's verdict and
  `conclusion_verdicts.biological_validation` are UNCHANGED (documented/
  PENDING).

