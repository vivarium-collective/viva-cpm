      `uninfected_min_frac`; a top-level `lethal_threshold=10000`; and a
      top-level `band_eval` with `passed=False`.
  - name: Scenario-grouping guard filters correctly and raises on a mismatched load
    identifier: scenario_grouping_guard
    units: n/a
    status: measured
    description: >-
      `run._fig5_target_subset(bands.load("fig5")["observables"], 10000)`
      returns exactly the 6 `viral_load_multiplier=10000`-tagged entries per
      observable (verified: `{10000}` is the only tag value present in each
      filtered list). `run._fig5_target_subset(..., 5)` (an untagged load)
      raises `ValueError` naming the missing observable/load rather than
      falling back to the unfiltered, all-scenario list.
  - name: Monotone dose-response holds at reduced scale
    identifier: monotone_dose_response_reduced_scale
    units: uninfected fraction
    status: measured
    description: >-
      Ensemble-mean `uninfected_final_frac` at `loads=(1,10000),
      replicas=1, cells_per_side=12, steps=15, seed0=0`: 0.6111 (88/144
      cells) at load=1 vs 0.0 (0/144 cells) at load=10000 -- higher initial
      viral load leaves fewer (here, zero) surviving uninfected cells,
      the dose-response direction the paper's Fig-5 narrative depends on.
  - name: Reduced-scale per-load band comparison -- per-observable in-band fraction
    identifier: fig5_band_eval_reduced_scale
