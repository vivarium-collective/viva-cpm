    - {name: load10000_uninfected_final_frac, value: 0.0, note: "0/144 cells uninfected -- near-total infection within the first record at this reduced scale and uniform-IC seeding"}
    - {name: load1_uninfected_cells_n_in, value: "4/6", note: "worst_miss 5.57"}
    - {name: load1_infected_cells_n_in, value: "0/6", note: "worst_miss 35.7"}
    - {name: load1_extracellular_virus_n_in, value: "0/6", note: "worst_miss 1199; engine virus-field units not on the paper's reported concentration scale, same issue fig3b's study flagged"}
    - {name: load1_antibodies_n_in_soft, value: "5/6", note: "worst_miss 0.097; ODE-integrated A state, soft=true"}
    - {name: load10000_uninfected_cells_n_in, value: "6/6", note: "worst_miss 0.0 -- fully in-band, but a scale/duration+wide-band coincidence, see report.main_insight"}
    - {name: load10000_infected_cells_n_in, value: "5/6", note: "worst_miss 0.037"}
    - {name: load10000_extracellular_virus_n_in, value: "0/6", note: "worst_miss 1196"}
    - {name: load10000_antibodies_n_in_soft, value: "6/6", note: "worst_miss 0.0; soft=true"}
    - {name: reduced_run_sim_duration_days, value: 0.0681, note: "15 records x mcs_per_step=7 x s_per_mcs=60 / 86400; fig5 target checkpoints run 0.0-15.0 days -- bands.series_in_band flat-extrapolates the near-t=0 model value out to every later checkpoint"}
