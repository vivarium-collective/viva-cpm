biological_summary: |
  `run.repro_fig5` sweeps the Task-9.1 capstone driver (`run_full_model`,
  every Increment 0-8 mechanism in one source-ordered per-MCS loop) over
  Sego-2022 Fig-5's initial-viral-load scenarios (a uniform virus-field IC
  at 1x/10x/100x/1000x/10000x the ODE-calibrated dose, zero pre-infected
  cells, at 10000 epithelial cells / 50 replicas at paper scale) and
  compares each load's ensemble mean against that load's own digitized
  acceptance-band subset (`targets/fig5.json`, filtered per load by the
  scenario-grouping guard `_fig5_target_subset` -- the guard the Task-9.0
  review flagged as load-bearing, since the raw file interleaves all 5
  loads' bands in one flat list per observable). At the REDUCED scale this
  task's fast pytest test uses (`loads=(1,10000), replicas=1,
  cells_per_side=12, steps=15, seed0=0` -- 144 epithelial cells over ~0.068
  simulated days, only 2 of the paper's 5 loads swept), neither tested
  load's ensemble lands fully in-band against its own fig5 band subset
  (`band_eval["passed"]=False` for both) -- driven by population-scale (144
  vs 10000 cells) and the sharply truncated run duration (~0.068 vs up to 15
  simulated days). UNITS FIX (Task-9.3-review MUST-FIX, this update, F-04):
  a prior version of this study attributed part of that gap to a
  "virus-field concentration-units mismatch"; that was actually a
  structural raw-sum-vs-mean BUG in `repro_fig5`'s observable mapping
  (`run_full_model`'s raw per-lattice-site sum was fed straight to
  extracellular_virus instead of the per-site concentration
  `targets/fig5.json` digitizes). Fixed by reporting the spatial-mean
  concentration (`sum(field_conc)/n_lattice_sites`); extracellular_virus is
  now fully in-band at load=10000 and 4/6 at load=1 (worst_miss ~1200 -> 0.0
  and 0.208 respectively) -- it is no longer a miss driver at either load.
  The qualitative mechanism this task's reduced-scale test IS built to check --
  a MONOTONE, more-virus-worse-outcome dose-response -- holds cleanly:
  seeding a higher initial viral load (10000x) leaves the ensemble with
  ZERO surviving uninfected cells (0/144) by this short run's end, vs 88/144
  (61%) surviving at the lowest tested load (1x). `lethal_threshold`
  (the smallest tested load crossing 50% uninfected loss) comes out as
  10000, the same load Sego-2022's own Sec. 3.3 identifies as where the
  spatial model trends toward lethal outcomes -- a DIRECTIONAL echo of the
  paper's finding, not a magnitude or threshold-VALUE reproduction (only 2
  of the paper's 5 loads were tested here, so this reduced run cannot
  establish whether THIS model's own threshold sits between 1x and 10000x
  the way the paper's does between 1000x and 10000x). THIS STUDY DOES NOT
  CLAIM FIG-5 IS REPRODUCED: the paper-scale 50-replica, all-5-load,
  10000-cell, ~15-day ensemble (`repro_fig5`'s own docstring documents this
  as `replicas=50, cells_per_side=35, steps≈3086`) is the Mac-mini Phase-B
  follow-up that will actually set the `reproduced` verdict for Fig 5. No
  band in `targets/fig5.json` was edited and no model constant was tuned
  toward a better-looking number.

key_assumptions:
  - REDUCED-SCALE REPORT, NOT PAPER-SCALE REPRODUCTION -- every band_eval
    number in this study.yaml comes from the exact `loads=(1,10000),
    replicas=1, cells_per_side=12, steps=15, seed0=0` config this task's
    fast pytest test uses, run directly to produce these numbers honestly,
    NOT from any paper-scale (50-replica, all-5-load, 10000-cell) run. The
    Mac-mini Phase-B follow-up (documented in `repro_fig5`'s own docstring)
    is the run that will set any `reproduced` verdict.
  - ONLY 2 OF 5 LOADS SWEPT AT REDUCED SCALE -- `loads=(1,10000)`, chosen
    to keep the reduced test's fast dose-response assertion meaningful
    (the largest available load-ratio contrast) without paying for a
    5-load sweep in the fast test suite; loads 10/100/1000 are exercised
    only by `repro_fig5`'s default signature (`loads=(1,10,100,1000,
    10000)`), not by this study's reported numbers, and are NOT swept at
    paper scale until the Mac-mini Phase-B follow-up.
  - RUN-DURATION MISMATCH -- the reduced config's 15 records x
    `mcs_per_step=7` x `s_per_mcs=60` = 6300s = ~0.068 simulated days falls
    far short of `targets/fig5.json`'s checkpoint window (0.0-15.0 days);
    `bands.series_in_band`'s flat extrapolation carries the model's
    near-t=0 (or, for load=10000, near-instant-collapse) value out to every
    later checkpoint, which mechanically drives most of the reported
    misses -- a documented property of this reduced config, not a bug in
    `bands.series_in_band` (Task 9.0's, unmodified here).
  - POPULATION-SCALE MISMATCH -- `cells_per_side=12` gives 144 epithelial
    cells vs. `targets/fig5.json`'s `scenario.total_epithelial_cells=10000`
    (`cells_per_side=35`, `patch_mm=1.0` at paper scale); raw population
    counts (uninfected/infected cells) cannot match the target's absolute
    magnitudes at this reduced population even with perfectly calibrated
    rate constants.
  - "EXTRACELLULAR-VIRUS UNITS BUG, FIXED (Task-9.3-review MUST-FIX, this update, see F-04) -- SUPERSEDES the prior bullet's \"units mismatch\" reading: the ~1200x extracellular_virus miss at both tested loads was a structural raw-sum-vs-mean bug in `repro_fig5`'s observable mapping (`run_full_model`'s raw lattice sum fed straight to a per-site-concentration target), not a PFU-equivalent calibration gap. Fixed by reporting the spatial-mean concentration (`sum(field_conc)/n_lattice_sites`); extracellular_virus now lands fully in-band at load=10000 (worst_miss 0.0) and 4/6 at load=1 (worst_miss 0.208). An HONEST RESIDUAL remains, not tuned away: the t=0 spatial-mean is consistently ~0.375x the target at both loads -- the seeded patch's lattice-site-count / full-simulation-domain's lattice-site-count ratio (the domain reserves margin/separation sites around the patch for the immune-cell clusters and recruit reserve pool; virus is seeded only under the patch, diluting the full-domain mean) -- a real, distinct domain-geometry effect, flagged for Phase-B, not a units bug."
  - INHERITED CALIBRATION-PENDING ITEMS from `run_full_model` (Task 9.1,
    unchanged here) -- the documented `NK_CD8_CHEMOTAXIS_ENGINE_SCALE=100x`
    chemotaxis engine-unit correction (Increment 7), and reduced-eta
    near-inert recruitment/nearby-killing subsystems flagged in Task 9.1's
    own docstring -- carried forward, not resolved by this task.
  - "`targets/fig5.json` WAS NOT EDITED and no model constant was tuned to narrow the reduced-scale gap reported here -- per the task brief's explicit instruction, a miss is reported honestly, not concealed."
  - "SCENARIO-GROUPING GUARD IS LOAD-BEARING (per the Task-9.0 review, restated here per the task brief) -- `_fig5_target_subset` filters `targets/fig5.json`'s observable lists to ONLY the requested load's `viral_load_multiplier`-tagged entries before any band comparison, and raises `ValueError` (never silently falls back to the unfiltered, multi-scenario list) if a load has zero matching entries for any observable; verified directly (not just via the pytest assertions) in this task's implementation work -- see task-9.3-report.md."

