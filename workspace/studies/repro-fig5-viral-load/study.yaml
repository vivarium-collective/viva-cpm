discovery_implications:
  followup_study_proposals:
    - id: incr9-phaseb-fig5-paper-scale-sweep
      title: "Mac-mini Phase-B: paper-scale 50-replica, all-5-load repro_fig5 sweep (cells_per_side=35, steps≈3086)"
      motivation: "This task's reduced-scale sweep (144 cells, 1 replica, 2 of 5 loads, ~0.068 simulated days) can only check the qualitative dose-response direction, not magnitude/threshold-value fidelity -- only the paper-scale (10000 cells, 50 replicas, all 5 loads, ~15 simulated days) ensemble repro_fig5's own docstring documents can actually test Fig-5 reproduction, including whether THIS model's own lethal threshold lands near 10000x the way the paper's does, and set the reproduced verdict for this study."
    - id: incr9-fig5-virus-units-calibration
      title: "RESOLVED (Task-9.3-review MUST-FIX, this update, see F-04): the extracellular_virus miss was a units BUG, not a PFU-scale calibration gap -- fixed by reporting spatial-mean concentration instead of the raw lattice sum"
      status: resolved
      motivation: "ORIGINAL (superseded): extracellular_virus missed fig5's bands by the same ~1000x order of magnitude at BOTH tested loads, consistent with repro_fig3b's own finding for the same observable, and was read as a units/scale mismatch between this engine's virus-field integral and the paper's reported PFU-equivalent values. RESOLUTION: it was a structural raw-sum-vs-mean bug in the repro-observable mapping layer (fixed in `_map_full_model_observables`, pbg_cpm_studies/influenza/run.py); extracellular_virus is now fully in-band at load=10000 and 4/6 at load=1. A small honest residual (~0.375x, domain-geometry dilution from margin/separation sites around the seeded patch) remains and is tracked as a NEW follow-up below, not this proposal."
    - id: incr9-fig5-virus-domain-dilution-residual
      title: "Increment 9: investigate the ~0.375x patch/full-domain-area dilution residual left in extracellular_virus after the Task-9.3-review units fix"
      motivation: "After the units fix (F-04), extracellular_virus's t=0 spatial-mean model value is consistently ~0.375x the target at every tested load (e.g. load=1: mean=0.375 vs target=1.0) -- the ratio of the seeded patch's lattice-site count to the full simulation domain's lattice-site count (run_full_model reserves margin/separation sites around the patch for the immune-cell clusters and recruit reserve pool). Worth investigating at Phase-B paper scale whether this residual shrinks (larger patch, relatively smaller margin) or persists, and whether the paper's own digitization implicitly assumes a patch-only mean rather than a full-domain mean -- NOT a reason to tune margin_sites/separation_sites or widen a band to close it."

