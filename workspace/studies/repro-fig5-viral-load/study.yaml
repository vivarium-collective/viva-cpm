      soft) -- load band_eval passed=False. load=10000: uninfected_cells
      6/6 (0, fully in-band), infected_cells 5/6 (0.037),
      extracellular_virus 0/6 (1196), antibodies 6/6 (0, soft) -- load
      band_eval passed=False (infected_cells + extracellular_virus miss).
      Overall `band_eval["passed"]`=False.

behavior_tests:
  - name: repro_fig5 sweeps viral loads and returns a well-formed by_load/band_eval dict with the monotone dose-response
    classification: primary
    description: |
      `run.repro_fig5(loads=(1,10000), replicas=1, cells_per_side=12,
      steps=15, seed0=0)` must return `by_load` keyed by exactly `{1,
      10000}`, a non-more-surviving-uninfected dose-response
      (`uninfected_final_frac(10000) <= uninfected_final_frac(1) + 1e-9`),
      and a `band_eval` key. Does NOT assert either load's `band_eval
      ["passed"]` -- reduced scale is not expected to pass the
      paper-scale-digitized bands.
    measure: {kind: repro_fig5_wellformed_and_monotone_dose_response, condition: repro-fig5-reduced-scale, stat: final}
    pass_if: {op: eq, value: true}
    status: passed
    result: PASS
    evaluated_by: tests/test_influenza_full_model.py::test_repro_fig5_viral_load_sweep

findings:
  - id: F-01
    kind: computational
    status: confirms
    mechanism_origin: engineered
    evidence:
      from_test: repro_fig5 sweeps viral loads and returns a well-formed by_load/band_eval dict with the monotone dose-response
      divergence_factor: null
      observed: "by_load keys == {1, 10000}; lethal_threshold=10000; top-level band_eval present with passed=False; uninfected_final_frac 0.6111 (load=1) -> 0.0 (load=10000), monotone non-increasing"
    statement: |
      `run.repro_fig5` is wired correctly: it sweeps a seeded ensemble of
      `run_full_model` per initial viral load with a uniform virus-field
      IC, maps every observable onto `targets/fig5.json`'s exact keys via
      `_FIG5_OBSERVABLE_MAP`, ensemble-means per load with
      `bands.aggregate_replicas`, filters each load's own scenario-tagged
      band subset via `_fig5_target_subset` (verified to raise `ValueError`
      rather than silently mixing scenarios when a load has no tagged
      entries -- the Task-9.0-review scenario-grouping guard), and produces
      a well-formed per-load and aggregate `band_eval` via
      `_evaluate_fig5_subset` -- the sweep-and-guard machinery itself is
      verified correct and reusable for the Mac-mini Phase-B paper-scale,
      all-5-load run.
  - id: F-02
    kind: computational
    status: confirms
    mechanism_origin: engineered
    evidence:
      from_test: repro_fig5 sweeps viral loads and returns a well-formed by_load/band_eval dict with the monotone dose-response
      divergence_factor: null
      observed: "uninfected_final_frac(load=1)=0.6111 (88/144), uninfected_final_frac(load=10000)=0.0 (0/144); infected_cells rises to 56/144 by load=1's final record vs 133/144 by load=10000's"
    statement: |
      The MONOTONE dose-response direction -- the qualitative mechanism
      this task's reduced-scale test is built to check, per the task
      brief's fidelity criterion -- holds cleanly: seeding a higher initial
      viral load never leaves MORE surviving uninfected cells than a lower
      load, at this reduced 144-cell, 1-replica, ~0.068-day scale. This is
      consistent with (though far smaller-scale than, and not a magnitude
      match for) the paper's own Sec. 3.3 qualitative narrative that higher
      viral-load multipliers drive progressively worse outcomes.
  - id: F-03
    kind: computational
    status: partial
    mechanism_origin: engineered
    evidence:
      from_test: null
      divergence_factor: 1199.0
      observed: "load=1 band_eval passed=False (0/4 observables fully in-band); load=10000 band_eval passed=False (2/4 observables fully in-band); extracellular_virus worst_miss ~1200 at BOTH loads"
    statement: |
      This is the study's central honest finding, reported as a GAP (status:
      partial), not hidden behind the driver's structural correctness
      (F-01/F-02): at reduced scale (144 epithelial cells vs. the target's
      10000; only 2 of the paper's 5 viral loads swept; ~0.068 simulated
      days vs. the target's 0.0-15-day checkpoint window), per-load
      `band_eval["passed"]` is False for every tested load. The
      extracellular_virus observable misses hardest and identically at
      both loads (worst_miss ~1200), the same units-mismatch this
      investigation's `repro_fig3b` study already flagged for that
      observable -- this engine's virus-field concentration units are not
      on the paper's reported PFU-equivalent scale at ANY tested load, not
      a load-specific defect. load=10000's uninfected_cells/antibodies land
      fully in-band, but as `report.main_insight` documents this reflects
      the paper's own widest, highest-spread bands at that load (Sec. 3.3)
      plus this reduced run's near-instant total-infection collapse, not
      individually-superior calibration at that load. NOT tuned away: no
      constant was adjusted and `targets/fig5.json` was not edited to
      narrow this gap.

conclusion: |
  `run.repro_fig5` (Task 9.3) IS IMPLEMENTED AND WIRED CORRECTLY, INCLUDING
  THE SCENARIO-GROUPING GUARD (`_fig5_target_subset`, verified both to
  filter correctly and to raise loudly on an untagged load): it sweeps a
  seeded ensemble of `run_full_model` per initial viral load, maps every
  observable onto `targets/fig5.json`'s exact keys, ensemble-means per load,
  and evaluates EACH load against ONLY that load's own scenario-tagged band
  subset, verified by `tests/test_influenza_full_model.py::
  test_repro_fig5_viral_load_sweep`. FIG-5 IS NOT REPRODUCED AT THE REDUCED
  SCALE THIS TASK'S FAST TEST USES, AND THIS STUDY DOES NOT CLAIM IT IS: at
  `loads=(1,10000), replicas=1, cells_per_side=12, steps=15, seed0=0` (144
  epithelial cells vs. the target's 10000; only 2 of the paper's 5 viral
  loads swept; ~0.068 simulated days vs. the target's 0.0-15-day checkpoint
  window), per-load `band_eval["passed"]` is False for both tested loads
  (see `report.key_metrics` for the full per-observable breakdown). The
  MONOTONE dose-response direction this reduced test's own assertion checks
  holds cleanly (`uninfected_final_frac`: 0.6111 at load=1 -> 0.0 at
  load=10000) -- the qualitative mechanism fidelity criterion the task
  brief specifies for this reduced scale, distinct from and not a substitute
  for per-load band containment at paper scale. THE PAPER-SCALE 50-REPLICA,
  ALL-5-LOAD, 35x35-CELL (10000-cell), ~15-SIMULATED-DAY ENSEMBLE
  (documented in `repro_fig5`'s own docstring, including the corrected
  `steps≈3086` for the full 15-day window, as the Mac-mini Phase-B
  follow-up) IS REQUIRED BEFORE ANY `reproduced` VERDICT FOR FIG 5 CAN BE
  SET. This study's own verdict stays `documented`, and
  `conclusion_verdicts.biological_validation` stays PENDING. No band was
  widened, no constant was tuned, and `targets/fig5.json` was not edited to
  make any number in this report look better than it is.

conclusion_verdicts:
  regression_compatibility:
    result: PASS
    basis: All 6 tests in `tests/test_influenza_full_model.py` pass (5 pre-existing Task 9.1/9.2 tests + this task's new `test_repro_fig5_viral_load_sweep`); no Increment 0-8 driver, composite, `bands.py`, or params.yaml constant is modified by this task, and `targets/fig5.json` is read-only.
  biological_validation:
