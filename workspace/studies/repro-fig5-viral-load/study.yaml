    basis: "All 6 tests in `tests/test_influenza_full_model.py` pass (5 pre-existing Task 9.1/9.2 tests + this task's new `test_repro_fig5_viral_load_sweep`); no Increment 0-8 driver, composite, `bands.py`, or params.yaml constant is modified by this task, and `targets/fig5.json` is read-only. UPDATE (Task-9.3-review units fix, this update) -- all 9 tests in `tests/test_influenza_full_model.py` pass, including the new `test_repro_fig5_extracellular_virus_is_concentration_not_raw_sum` regression test; only `run.py`'s repro-observable-mapping layer changed (`_map_full_model_observables`), `run_full_model`'s own field recording, `bands.py`, and `targets/fig5.json` are unchanged."
