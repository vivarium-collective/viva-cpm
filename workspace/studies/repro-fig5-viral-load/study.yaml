study_card:
  goal: Wire `run.repro_fig5` -- a per-load seeded ensemble driver that sweeps `run_full_model`'s initial viral-load IC across Fig-5's scenarios, maps each load's output onto `targets/fig5.json`'s 4 observable keys, and evaluates EACH load against ONLY that load's own scenario-tagged band subset (the scenario-grouping guard) -- and honestly report the REDUCED-scale sweep result (this task's fast-test config), without tuning any constant or widening any band to make it pass.
  mechanism: >-
    For each `load` in `loads`, `run.run_full_model` (Task 9.1) runs
    `replicas` seeded scenarios with `init_viral_load=load,
    init_infection_frac=None` -- a ~uniform virus-field IC under the
    epithelial patch (`_seed_uniform_virus`) with zero pre-infected cells,
    so infection emerges purely from the seeded field via
    `transitions.infection_step`; `_FIG5_OBSERVABLE_MAP` maps the run's
    `counts`/`fields`/`ode` sections onto fig5's 4 observable keys;
    `bands.aggregate_replicas` ensemble-means each mapped series across that
    load's replicas; `_fig5_target_subset` filters `targets/fig5.json`'s
    flat, multi-scenario observable lists down to ONLY the entries tagged
    `viral_load_multiplier == load` (raising `ValueError` if a load has no
    matching entries, rather than silently falling back to the unfiltered
    list); `_evaluate_fig5_subset` then runs `bands.series_in_band`'s
    interpolate-and-contain check against that filtered subset per
    observable, honoring each entry's `soft` flag.
  why_before_next: Task 9.4 (the remaining Increment-9 reproduction study,
    Fig 7) and the Mac-mini Phase-B paper-scale run both need
    `repro_fig5`'s per-load ensemble-and-scenario-filtered-band-eval
    machinery already working correctly (including the scenario-grouping
    guard, verified here both for the happy path and its raise) before
    it's trusted at 50-replica/5-load/35x35-cell scale; this task
    establishes the driver is wired, the guard prevents the exact silent
    cross-scenario averaging bug the Task-9.0 review flagged, and the
    reduced-scale numbers it currently reports are honestly a scale/
    duration artifact, not a fidelity result.
  expected_result: >-
    A well-formed dict with a `by_load` section keyed by every tested load,
    each containing a per-load `ensemble`/`band_eval`/`uninfected_final_frac`,
    a top-level `lethal_threshold`, and a top-level `band_eval` aggregating
    every load. At the reduced-scale config used here, per-load
    `band_eval["passed"]` is expected to be False for most/all loads
    (population-scale and run-duration mismatch, as in `repro_fig3b`), but
    the monotone dose-response direction (`uninfected_final_frac`
    non-increasing in `load`) is expected to hold even at reduced scale,
    since it is a direction-of-effect check, not a magnitude/band-fit check.
  main_expert_question: The reduced-scale sweep only evaluates 2 of fig5's
    5 viral loads (1x, 10000x) to keep the fast test fast -- should the
    Mac-mini Phase-B paper-scale run (all 5 loads, 50 replicas each,
    steps≈3086) be the REQUIRED next run before any `reproduced` verdict is
    attempted, or is there value in first running an intermediate-scale
    sweep across all 5 loads (full cells_per_side=35 patch, few replicas,
    a duration between this reduced test's ~0.068 days and the paper's 15
    days) to locate where THIS model's own lethal threshold falls among
    10/100/1000x before committing the expensive 50-replica x 5-load
    ensemble?

question: |
  Does `run.repro_fig5` (Task 9.3) correctly sweep `run.run_full_model`
  (Task 9.1) over Sego-2022 Fig-5's initial-viral-load scenarios, evaluate
  EACH load against ONLY that load's own fig5.json band subset (never the
  unfiltered, multi-scenario list), and reproduce the paper's central
  monotone, threshold-like dose-response direction -- and, honestly, does a
  REDUCED-scale sweep (the only scale a fast CI test can run) show that
  direction even though it cannot match the digitized bands' absolute
  magnitudes at paper scale?

hypothesis: |
  `run.repro_fig5` correctly wires the per-load ensemble-and-scenario-
  filtered-band-evaluation machinery: for each tested load it runs
  `replicas` seeded `run_full_model` calls with a uniform virus-field IC,
  maps every observable onto fig5's keys, ensemble-means them, filters
  fig5.json's observable lists down to that load's own scenario subset
  (the guard), and produces a well-formed per-load `band_eval`. At REDUCED
  scale (few loads/replicas, a small population, a short duration -- all
  needed to keep the added pytest test fast), the ensemble is NOT expected
  to land in-band against bands digitized from a 10000-cell, 50-replica,
  15-day paper-scale ensemble, but the MONOTONE dose-response direction
  (higher initial viral load -> not-more surviving uninfected fraction)
  should still hold, since it is a qualitative mechanism check independent
  of population/time scale; any near-miss or in-band result at reduced
  scale should be reported as what it is (a coincidence of a wide,
  paper-reported-high-spread band and/or a near-instant collapse that
  happens to land inside it), not oversold as reproduction evidence.

objective: |
  Implement `run.repro_fig5(*, loads=(1,10,100,1000,10000), replicas=3,
  cells_per_side=35, steps=240, seed0=0) -> dict` (Task 9.3): for each
  `load`, loop `replicas` seeds through `run.run_full_model(
  cells_per_side=cells_per_side, steps=steps, seed=seed0+load_idx*replicas+r,
  init_viral_load=load, init_infection_frac=None)`; map each run's
  `counts`/`fields`/`ode` sections onto `targets/fig5.json`'s exact 4
  observable keys (`_FIG5_OBSERVABLE_MAP`); ensemble-mean via
  `bands.aggregate_replicas`; filter that load's own band subset from
  fig5.json's multi-scenario observable lists (`_fig5_target_subset`,
  raising `ValueError` rather than silently mixing scenarios if a load has
  no matching entries); evaluate via `_evaluate_fig5_subset`. Add
  `tests/test_influenza_full_model.py::test_repro_fig5_viral_load_sweep`
  (reduced: `loads=(1,10000), replicas=1, cells_per_side=12, steps=15`)
  asserting the by_load dict has exactly the tested loads as keys, the
  monotone dose-response holds (`uninfected_final_frac(10000) <=
  uninfected_final_frac(1) + 1e-9`), and `band_eval` is present -- NOT
  that the bands pass, since reduced scale is not expected to. Run that
  same reduced config directly (not the pytest assertions alone) to report
  the actual per-load, per-observable band_eval numbers in this study
  honestly.

description: |
  Increment 9 Task 9.3 (part of the capstone reproduction ladder):
  `run.repro_fig5` is the per-load viral-load-sweep ensemble driver for the
  Sego-2022 Fig-5 scenario family, built on top of Task 9.1's `run.
  run_full_model` (every mechanism subsystem from Increments 0-8 assembled
  into one source-ordered per-MCS loop), Task 9.0's `bands` acceptance-band
  harness, and the load-bearing SCENARIO-GROUPING GUARD the Task-9.0 review
  called out: `targets/fig5.json`'s observable lists interleave all 5
  viral-load scenarios in one flat list per observable, tagged by
  `viral_load_multiplier`, so evaluating a single load's model run against
  the WHOLE unfiltered list would silently average its comparison against
  every other load's band too. `_fig5_target_subset` filters to just that
  load's tagged entries (raising loudly, not falling back silently, if a
  requested load has no matches) before `_evaluate_fig5_subset` runs
  `bands.series_in_band`'s containment check. This task WIRES the sweep
  machinery and EVALUATES it -- it explicitly does NOT attempt the
  paper-scale 50-replica, all-5-load, 35x35-cell, ~15-day ensemble needed
  to actually claim Fig-5 reproduction; that run is deferred to the
  Mac-mini Phase-B follow-up (documented in `repro_fig5`'s own docstring,
  including the corrected `steps≈3086` for the full 15-day window at
  `mcs_per_step=7, s_per_mcs=60` -- NOT the `steps≈2880`/2-day figure a
  prior task mistakenly used for this figure). The reduced-scale config
  this task's fast pytest test uses (`loads=(1,10000), replicas=1,
  cells_per_side=12, steps=15`) is run directly here and its actual
  `band_eval` result reported honestly: both loads fail per-load band
  containment, but the monotone dose-response direction the paper's own
  Fig-5 narrative depends on holds cleanly at this reduced scale.

claim: |
  `run.repro_fig5` is implemented and wired correctly: it sweeps a seeded
  ensemble of `run_full_model` over Fig-5's viral-load scenarios, maps
  every observable onto `targets/fig5.json`'s exact keys, ensemble-means
  per load via `bands.aggregate_replicas`, filters each load's own
  scenario-tagged band subset (`_fig5_target_subset`, verified to raise
  `ValueError` rather than silently mixing scenarios when a load has no
  tagged entries), and evaluates via `_evaluate_fig5_subset`, producing a
  well-formed `{"by_load": {load: {...}}, "lethal_threshold": ...,
  "band_eval": {...}, "loads":..., "replicas":..., "cells_per_side":...,
  "steps":...}` dict (verified by `tests/test_influenza_full_model.py::
  test_repro_fig5_viral_load_sweep`). THIS STUDY DOES NOT CLAIM FIG-5 IS
  REPRODUCED. At the reduced scale this task's fast test uses
  (`loads=(1,10000), replicas=1, cells_per_side=12, steps=15, seed0=0`),
  per-load `band_eval["passed"]` is False for both loads (per-observable
  n_in/6 and worst_miss reported in `report.key_metrics` above) -- expected
  given the ~69x smaller epithelial population and the ~0.068-simulated-day
  run duration vs. the target's 0.0-15-day checkpoint window, not a
  mechanism defect. The MONOTONE dose-response direction this reduced
  test's own assertion checks (`uninfected_final_frac(load=10000)=0.0 <=
  uninfected_final_frac(load=1)=0.611`) holds. The paper-scale 50-replica,
  all-5-load, 35x35-cell, ~15-day ensemble (Mac-mini Phase-B) is required
  before any `reproduced` verdict for Fig 5, and `conclusion_verdicts.
  biological_validation` stays PENDING here.

expected_behavior:
  - "`repro_fig5` returns a `by_load` dict keyed by exactly the requested loads, each with an `ensemble`, a per-load `band_eval`, and `uninfected_final_frac`/`uninfected_min_frac`."
  - "`_fig5_target_subset` raises `ValueError` (never silently falls back to the unfiltered, multi-scenario list) if a requested load has no matching `viral_load_multiplier`-tagged entries in `targets/fig5.json` for any observable."
  - "The monotone dose-response holds: `uninfected_final_frac` is non-increasing across ascending `loads` (higher initial viral load never leaves MORE surviving uninfected cells than a lower load, within a small numerical tolerance)."
  - "At REDUCED scale (small `cells_per_side`/`replicas`/`steps`, few `loads`), per-load `band_eval`'s `passed` value is NOT expected to be True -- reported honestly, not tuned toward a pass."

