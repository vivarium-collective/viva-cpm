schema_version: 3
name: recruitment-baseline
status: complete
phase: Decide
title: "Baseline: cue + response recruits"
confidence: Accepted
investigation: chemotactic-recruitment

purpose:
  question: |
    When source cells secrete a diffusible cue and responder cells carry a
    competent chemotactic response, do responders migrate up the gradient and
    accumulate at the source?
  mechanism: chemotactic_recruitment

report:
  title: "Baseline: a secreted cue recruits competent responders"
  verdict: passing
  confidence: high
  evidence_quality: calibrated
  objective: >-
    Simulate the CPM recruitment world (source slab + six responders in the
    gradient zone), equilibrate the secreted field, and measure the recruitment
    index over 500 MC sweeps across 5 seeds.
  conclusion: >-
    Cue + competent response recruits: the final recruitment index is
    0.767 ± 0.170 across 5 seeds, versus 0.000 for both negative conditions
    (Cohen's d = 6.38).
  main_insight: >-
    Recruitment is an emergent collective outcome of local chemotactic
    copy-attempt biases, not an engineered per-cell rule.
  caveat: >-
    The chemotaxis lambda is a PHENOMENOLOGICAL response strength, not a
    receptor-level model — a deliberate semantic gap the receptor arm closes.
  key_metrics:
    - {name: recruitment_index, value: "0.767 ± 0.170", n_seeds: 5}
    - {name: mean_approach, value: "0.608"}
    - {name: effect_size, value: "Cohen's d = 6.38 vs negatives"}

study_card:
  goal: Show that a secreted cue plus a competent chemotactic response recruits responders to the source.
  mechanism: Type-1 source cells secrete field C; type-2 responders chemotax up the gradient (lambda=14).
  why_before_next: The anchoring positive condition — the ground truth the receptor realization must reproduce.
  expected_result: Recruitment index rises from 0 to a plateau ~0.67–0.83; mean approach > 0.4.
  main_expert_question: Is a phenomenological chemotaxis lambda an acceptable stand-in for receptor-gated response at this level?

question: |
  When source cells secrete a diffusible cue and responder cells carry a
  competent chemotactic response, do the responders directionally migrate up the
  gradient and accumulate at the source?

hypothesis: |
  With the cue secreted (rate 10) and the response intact (lambda 14), responder
  centres of mass move toward the source region and the recruitment index rises
  well above zero.

objective: |
  Simulate the CPM recruitment world (source slab + six responders in the gradient
  zone), equilibrate the secreted field, and measure the recruitment index —
  fraction of responders within 15 px of the source — over 500 MC sweeps.

description: |
  The anchoring positive condition of the chemotactic-recruitment slice. Type-1
  source cells secrete field C (d=0.22, decay=0.001); type-2 responders start ~33 px
  away and chemotax up the gradient with strength lambda=14. This is the native
  viva-cpm realization of the biological claim "a secreted cue recruits responder
  cells", and the ground-truth study the Biological Claim Layer compiler must
  reproduce.

claim: |
  Responders climb the secreted gradient and are recruited to the source: the
  recruitment index rises from 0 to a plateau of ~0.67-0.83 (mean approach 0.61).

expected_behavior:
  - Responder mean distance to the source falls substantially over the run.
  - Recruitment index rises above 0.5 (a majority of responders reach the source region).

visualizations:
  - name: "Claim layer — claim → mechanism → realization"
    address: local:ClaimLayerAtlas
  - name: "Claim bundle — source (claim / mechanism / realization)"
    address: local:ClaimBundle
  - name: Recruitment over time (all conditions)
    address: local:ChemotaxisRecruitment

embed_visualizations:
  - name: Animated spatial scene
    title: "Chemotactic recruitment — animated scene (baseline vs inhibited)"
    url: /workspace/studies/recruitment-baseline/viz/scene.html

readouts:
  - name: Recruitment index
    identifier: recruitment_index
    units: fraction of responders within radius
    status: measured
    description: Fraction of responder cell centres of mass within 15 px of the source centroid.
  - name: Mean approach
    identifier: mean_approach
    units: dimensionless (0-1)
    status: measured
    description: Fraction of the initial responder-to-source gap closed over the run.

behavior_tests:
  - name: Responders are recruited to the source
    classification: primary
    description: |
      Pass criterion: recruitment index rises above 0.5 and mean approach exceeds
      0.4. Measured from the run: recruitment index 0.000 -> 0.667 (peak 0.833),
      mean approach 0.608.
    measure: {kind: recruitment_index, condition: recruitment-baseline, stat: final}
    pass_if: {op: gt, value: 0.5}
    status: passed
    result: PASS

findings:
  - id: F-01
    kind: computational
    status: confirms
    mechanism_origin: emergent
    evidence:
      from_test: Responders are recruited to the source
      divergence_factor: 6.38
      observed: "recruitment index 0.767 ± 0.170 across 5 seeds vs 0.000 for both negative conditions (Cohen's d = 6.38)"
    statement: |
      Cue + competent response recruits: across 5 independent seeds the final
      recruitment index is 0.767 +/- 0.170, versus 0.000 +/- 0.000 for both negative
      conditions (Cohen's d = 6.38). Recruitment is an emergent collective outcome of
      local chemotactic copy-attempt biases, not an engineered per-cell rule.

robustness:
  n_replicates: 5
  seeds: [17, 29, 43, 61, 89]
  parameter_sweep: false
  seeds_with_advantage: 5
  per_measure:
    - name: recruitment_index
      cv: 0.22

controls:
  - kind: adversarial
    name: No cue yields no recruitment (recruitment-adversarial)
    test: Responders are recruited to the source
    result: PASS
    observed:
      recruitment_index: 0.0
    description: Competent responders with no cue are not recruited (negative control).
  - kind: negative
    name: Response blocked (recruitment-inhibited)
    test: Responders are recruited to the source
    result: PASS
    observed:
      recruitment_index: 0.0
    description: With the cue present but lambda=0, recruitment is abolished.

alternative_hypotheses:
  - claim: Responders accumulate by random diffusion, not by climbing the cue gradient.
    status: excluded
    discriminated_by: Responders are recruited to the source
    note: Excluded by the inhibited arm — lambda=0 abolishes recruitment despite the cue present.
  - claim: The recruitment signal is a metric artifact (spurious proximity counting).
    status: excluded
    discriminated_by: Responders are recruited to the source
    note: Excluded by the adversarial arm — no cue leaves the recruitment index at 0.

conclusion: |
  The native CPM realization reproduces cue-driven recruitment. Fidelity note:
  the CPM chemotaxis lambda is a PHENOMENOLOGICAL response strength (a bias on the
  copy-attempt energy), not a receptor-level model — a deliberate semantic-gap the
  realization records rather than hides.

conclusion_verdicts:
  regression_compatibility:
    result: PASS
    basis: Reproduces the expected CPM recruitment behaviour with the declared energies and ICs.
  biological_validation:
    result: PASS
    basis: Recruitment index 0.767 ± 0.170 vs 0.000 for both negative controls (Cohen's d = 6.38, 5 seeds).
  explanatory_gain:
    result: POSITIVE
    basis: Recruitment emerges from local copy-attempt biases rather than an imposed per-cell rule.

biological_summary: |
  Source cells secrete a diffusible chemokine that forms a spatial gradient from
  the source slab into the responder zone. Responder cells bias their Cellular
  Potts copy attempts up the local gradient (chemotaxis strength lambda), so over
  ~500 Monte-Carlo sweeps their centres of mass drift toward the source and a
  majority end up within the recruitment radius. Removing either ingredient — the
  cue (adversarial arm) or the response (inhibited arm) — abolishes recruitment,
  establishing that both are necessary. This is the phenomenological realization
  of the biological claim "a secreted cue recruits responder cells".

literature_anchors:
  - expectation: Responder cells climb a secreted chemokine gradient toward the source.
    model_observable: recruitment_index
    source: "Chemotaxis up a secreted gradient (canonical)"
    status_in_workspace: "Verified — observed value matches (0.767 vs 0 controls)"
    cites: [glazier1993]

key_assumptions:
  - Second-nearest-neighbour (Moore-8) square lattice, order 2.
  - Field diffusion capped at d<=0.25 for numerical stability; gradient equilibrated with 600 advance_fields sweeps before cell stepping.
  - Recruitment radius = 15 px (source at x~10; responders start at x~43).

gate_status: passed

runtime:
  default_emitter: series-json
  max_generations: 1
  post_run_scripts: []

model_change:
  base_model: pbg_cpm_studies.composites.chemotaxis.recruitment
  new_processes: []
  new_state_variables: []
  new_parameters: [cue_rate, chemo_lambda]
  modified_processes: []
  new_listeners: []
  notes: |
    Realizes the recruitment claim with one parameterized CPMProcess. Type-1
    source cells secrete field C (d=0.22, decay=0.001) at cue_rate; type-2
    responders chemotax up the local gradient with strength chemo_lambda — a
    phenomenological copy-attempt bias on the existing CPM engine. No new
    processes, state variables, or listeners were added.

design_pivot_required:
  - id: response-representation
    status: resolved
    question: Represent the chemotactic response as a phenomenological lambda or a receptor-level model?
    alternatives:
      - Phenomenological chemotaxis lambda (this study)
      - Receptor-gated Hill occupancy (recruitment-receptor-baseline)
    requested_response: none — resolved
    notes: |
      Resolved by building BOTH rungs: this study anchors the claim with a
      phenomenological lambda; the receptor arm refines it to a Kd-calibrated
      Hill occupancy. The semantic gap is recorded, not hidden.

enforced_params:
  cue_rate: 10.0
  chemo_lambda: 14.0

runs:
  - run_id: recruitment-baseline-5seed
    name: recruitment-baseline (5 seeds)
    status: completed
    canonical: true
    timestamp: '2026-08-07'
    seeds: [17, 29, 43, 61, 89]
    emitter: chemotaxis_data/results series-json
    outcomes:
      'Responders are recruited to the source':
        result: PASS
        measured_value: 0.767
        notes: 0.767 ± 0.170 across 5 seeds vs 0.000 for both negatives (d=6.38)
        evaluated_by: pbg_cpm_studies.evaluators

discovery_implications:
  followup_study_proposals:
    - id: recruitment-dose-response
      title: "Dose-response: recruitment vs cue rate and chemotaxis lambda"
      motivation: "Map the transition between recruited and not-recruited, not just the on/off endpoints."
    - id: recruitment-3d
      title: "3D-lattice recruitment"
      motivation: "Check the phenotype generalizes beyond the 2D lattice (an applicability boundary)."
    - id: receptor-kinetics-realization
      title: "Receptor-kinetics realization of the same claim"
      motivation: "Refine the phenomenological chemotaxis lambda into a receptor model; it must preserve the recruitment response."
conditions:
  baseline:
    name: baseline
    composite: pbg_cpm_studies.composites.chemotaxis.recruitment
    params: {cue_rate: 10.0, chemo_lambda: 14.0} # cue ON, response ON

  model_settings: []

