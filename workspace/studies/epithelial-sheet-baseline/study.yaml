schema_version: 3
name: epithelial-sheet-baseline
status: in-progress
phase: Simulate
title: "Epithelial sheet baseline"
confidence: Provisional
investigation: influenza-sego2022
parent_studies:
  - study: parameter-provenance
    condition: tests-passed

purpose:
  question: |
    Does the CPM engine hold a confluent, source-literal-adhesion epithelial
    sheet stable (no gaps, no vanished cells) at 1 mm^2 paper scale, and does
    it step fast enough (Rust engine, `step_parallel`) for the eventual
    2-week/~20160-MCS capstone run to be computationally feasible?
  mechanism: epithelial_sheet_substrate

report:
  title: "Increment 1: the epithelial sheet holds confluent and steps fast enough"
  verdict: passing
  confidence: high
  evidence_quality: measured
  objective: >-
    Build the confluent epithelial-only sheet (type H, target volume 25
    sites, source-literal adhesion H-H=5.0 / H-medium=25.0) at 0.3mm scale,
    relax it, and confirm every cell holds ~25 sites with none vanished;
    separately benchmark step throughput at full 1mm^2 (500x500 lattice,
    10000 cells).
  conclusion: >-
    SUBSTRATE VALIDATED, NOT BIOLOGY REPRODUCED. The confluent 0.3mm sheet
    (900 cells) holds mean cell volume ~25 sites with none vanishing after
    relaxation, and the 1mm^2 lattice steps at ~406-422 MCS/s (perf-gate
    floor 200.0 MCS/s) — comfortably above the ~2.0 MCS/s floor needed for
    the eventual capstone run. This increment has no virus field, no
    infection, no immune cells, and makes no claim about reproducing any of
    Sego et al. 2022's published figures.
  main_insight: >-
    The bare geometry + adhesion substrate is stable and fast enough to
    carry the remaining 8 increments of biology; this is a scaffolding
    result, not a reproduction result.
  caveat: >-
    This study validates ONLY the epithelial-sheet substrate (geometry +
    throughput). It does NOT reproduce, and is not evaluated against, any of
    the paper's Figs 3B/5/7 acceptance bands — that begins at Increment 9
    (the capstone).
  key_metrics:
    - {name: mean_cell_volume_sites, value: "~25 (target)", n_cells: 900}
    - {name: throughput_1mm2_mcs_per_s, value: "406.47-421.95 (4 runs)"}
    - {name: perf_gate_floor_mcs_per_s, value: "200.0"}

study_card:
  goal: Confirm the confluent epithelial-only sheet geometry holds at scale and steps fast enough for the capstone run — no biology claim.
  mechanism: Uniform tiling of 5x5-site (10 um) type-H cells with source-literal adhesion (H-H=5.0, H-medium=25.0); no fields, no other cell types.
  why_before_next: The load-bearing substrate every later increment (virus field, IFN, immune cells) is layered on top of — must be stable and fast before adding dynamics.
  expected_result: Cells hold ~25 sites each, confluent (no medium gaps in an exactly-tiled patch), and the 1mm^2 lattice steps well above the ~2.0 MCS/s floor needed for a 2-week simulated run.
  main_expert_question: Is validating geometry + throughput alone (no biology) a legitimate Increment-1 gate, deferring all reproduction claims to the capstone?

question: |
  Does a confluent tiling of epithelial (type H) cells, using the CC3D
  source-literal adhesion values (H-H=5.0, H-medium=25.0) and target volume
  (25 sites), hold stable under CPM relaxation at paper scale, and does the
  Rust engine step it fast enough for the eventual 2-week/~20160-MCS
  capstone run?

hypothesis: |
  The confluent sheet holds: after relaxation every real cell (indices 1..N,
  excluding the medium placeholder at index 0) has volume close to its
  target of 25 sites, with none vanishing. Separately, 1mm^2 throughput
  comfortably clears the ~2.0 MCS/s floor required for the capstone's
  ~20160-step run to finish in a practical wall-clock time.

objective: |
  Build the epithelial-sheet `load_world` spec (Task 1.1), instantiate and
  relax the CPM world (Task 1.2), and measure step throughput on the full
  1mm^2 patch (Task 1.3). Wrap the geometry in a process-bigraph composite
  (`pbg_cpm_studies.composites.influenza.epithelium`) so the
  dashboard can run a modest (0.1mm, 100-cell) live demo of the same
  substrate (Task 1.4, this study).

description: |
  Increment 1 of the influenza-sego2022 capability ladder: the bare
  confluent epithelial sheet, no virus field, no infection, no immune
  cells. A uniform grid of 5x5-site (10 um) type-H cells tiles the patch;
  adhesion is the source-literal CC3D value (H-H=5.0, H-medium=25.0,
  CONTROLLER OVERRIDE vs the CC3D-typical 4.0/16.0 — see
  `pbg_cpm_studies/influenza/sheet.py`). This study validates that the
  substrate is mechanically sound (confluent, stable target volume) and
  computationally fast enough — it does NOT attempt, and is not scored
  against, any biological reproduction target. The live-demo composite here
  runs a small 0.1mm/100-cell patch for a fast dashboard "run baseline";
  the 1mm^2/10000-cell throughput characterization is a separate perf test
  (`tests/test_influenza_perf.py`, Task 1.3), not re-run live by this
  composite.

claim: |
  The confluent epithelial-only sheet is geometrically stable (mean cell
  volume ~25 sites, none vanished) and the Rust CPM engine steps the full
  1mm^2 lattice at ~406-422 MCS/s, far above the throughput needed to make
  the eventual 2-week capstone run computationally tractable. This is a
  substrate-readiness claim, not a biological-reproduction claim.

expected_behavior:
  - After relaxation, real cells (excluding the medium placeholder) hold a
    mean volume close to the 25-site target, and none vanish.
  - The 1mm^2 lattice (500x500 sites, 10000 cells) steps at throughput well
    above the perf-gate floor.

readouts:
  - name: Mean cell volume
    identifier: mean_cell_volume_sites
    units: lattice sites
    status: measured
    description: >-
      Mean of `world.cell_volumes()[1:]` (excludes the medium placeholder
      at index 0) after relaxation on the 0.3mm/900-cell confluent tiling;
      target volume per cell is 25 sites (Task 1.2).
  - name: Cell count
    identifier: cell_count
    units: cells
    status: measured
    description: >-
      900 real cells on the 0.3mm confluent tiling used for the geometry
      check (Task 1.2); the live-demo composite here (0.1mm) builds 100.
  - name: 1mm^2 throughput
    identifier: throughput_mcs_per_s
    units: MCS/s
    status: measured
    description: >-
      `step_parallel(steps, 64)` on the full 500x500/10000-cell 1mm^2
      lattice, 5-step warmup before timing; measured 406.47-421.95 MCS/s
      across 4 runs on this machine (Task 1.3). Perf-gate floor asserted in
      `tests/test_influenza_perf.py::test_mcs_throughput_1mm` is 200.0
      MCS/s (~50% of measured, raised from the brief's initial 2.0 MCS/s
      floor since measured throughput is ~200x that minimum).

behavior_tests:
  - name: Sheet holds confluent after relaxation
    classification: primary
    description: |
      Pass criterion: after 50-step relaxation, every real cell (indices
      1..900) has volume > 0 and the mean is close to the 25-site target.
      Measured: mean volume ~25 sites, none vanished (Task 1.2).
    measure: {kind: mean_cell_volume_sites, condition: epithelial-sheet-baseline, stat: mean}
    pass_if: {op: gt, value: 0}
    status: passed
    result: PASS
  - name: 1mm^2 throughput clears the perf-gate floor
    classification: primary
    description: |
      Pass criterion: `step_parallel` throughput on the full 1mm^2 lattice
      exceeds the 200.0 MCS/s perf-gate floor. Measured 406.47 MCS/s (one
      of 4 runs, range 406.47-421.95).
    measure: {kind: throughput_mcs_per_s, condition: epithelial-sheet-baseline, stat: min}
    pass_if: {op: gt, value: 200.0}
    status: passed
    result: PASS

visualizations:
  - name: Spatial state — sheet relaxation (animated)
    address: local:InfluenzaSpatialSheet
  - name: Confluent epithelial sheet
    address: local:InfluenzaEpithelialSheet
