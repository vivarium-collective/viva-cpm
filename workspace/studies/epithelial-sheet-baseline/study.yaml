  - name: Confluent sheet
    title: "Confluent epithelial sheet at scale \u2014 geometry + throughput"
    url: /workspace/studies/epithelial-sheet-baseline/viz/confluent-sheet.html

findings:
  - id: F-01
    kind: computational
    status: confirms
    mechanism_origin: engineered
    evidence:
      from_test: Sheet holds confluent after relaxation
      divergence_factor: 1.0
      observed: "mean cell volume ~25 sites, none vanished after 50-step relaxation on the 900-cell confluent 0.3mm tiling"
    statement: |
      The confluent epithelial-only sheet (source-literal adhesion H-H=5.0,
      H-medium=25.0, target volume 25 sites) is mechanically stable under
      CPM relaxation at 0.3mm scale — an engineered geometric result (target
      volume matched by construction), not an emergent biological finding.
  - id: F-02
    kind: computational
    status: confirms
    mechanism_origin: engineered
    evidence:
      from_test: 1mm^2 throughput clears the perf-gate floor
      divergence_factor: 2.0
      observed: "406.47-421.95 MCS/s measured across 4 runs at 1mm^2 (500x500 lattice, 10000 cells), vs 200.0 MCS/s perf-gate floor"
    statement: |
      The Rust CPM engine's `step_parallel` throughput at full 1mm^2 scale
      is ~2x the perf-gate floor (and ~200x the brief's original 2.0 MCS/s
      minimum), so the ~20160-step capstone run remains computationally
      tractable — a performance-engineering result, not a biology finding.

conclusion: |
  SUBSTRATE VALIDATED, NOT BIOLOGY REPRODUCED. The confluent epithelial
  sheet geometry is stable at scale and the engine is fast enough. No
  virus field, infection dynamics, IFN response, or immune cells exist yet
  in this increment, and this study makes no reproduction claim against
  Sego et al. 2022's published figures (Figs 3B/5/7) — that evaluation is
  deferred to Increment 9 (the capstone), per the investigation's
  capability-ladder design.

conclusion_verdicts:
  regression_compatibility:
    result: PASS
    basis: Geometry and throughput reproduce Task 1.1-1.3's measured results exactly (same spec builder, same perf test).
  biological_validation:
    result: PENDING
    basis: >-
      This increment has no biology to validate against (no virus, no
      infection, no immune response) — it is a substrate/perf gate only.
      Do NOT read PENDING as a passing or failing reproduction verdict; no
      reproduction claim is made until Increment 9 (the capstone), which
      evaluates against Figs 3B/5/7.
  explanatory_gain:
    result: PENDING
    basis: >-
      No mechanism is being compared to an alternative explanation at this
      increment; deferred to later increments where dynamics exist.

biological_summary: |
  A uniform lattice of type-H (uninfected epithelial) cells, each occupying
  a 5x5-site (10 um) block, tiles the simulated patch. Cell-cell (H-H) and
  cell-medium (H-medium) adhesion energies are taken source-literally from
  the CC3D ViralInfectionVTM reference (H-H=5.0, H-medium=25.0 — a
  CONTROLLER OVERRIDE of the CC3D-typical 4.0/16.0 pair, see
  `pbg_cpm_studies/influenza/params.yaml` provenance). This produces a
  confluent monolayer with no biological dynamics yet: no infection, immune
  response, or cell death. It is the mechanical substrate the subsequent 8
  increments (virus field, IFN/resistance, death/recovery, chemokines,
  macrophages, NK/CD8+ T, global ODE coupling, capstone) build on top of.

key_assumptions:
  - Confluent exact tiling (5x5-site cells, no gaps by construction) — the
    0.3mm/900-cell geometry check and the 1mm^2/10000-cell throughput
    benchmark are both exactly-confluent lattices.
  - Second-nearest-neighbour (neighbor_order=3) square lattice, per the
    CC3D source (accepted by the Rust engine without a capability
    fallback — see task-1.1-1.3-report.md Task 1.2).
  - Perf numbers are single-machine measurements (this laptop); re-measure
    before relying on the 200.0 MCS/s floor as a strict CI gate on
    different hardware (e.g. the Mac mini).

gate_status: passed

