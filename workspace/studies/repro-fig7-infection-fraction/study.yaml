schema_version: 3
name: repro-fig7-infection-fraction
status: in-progress
phase: Evaluate
title: "Increment 9 Task 9.4 (CAPSTONE): repro_fig7 sweeps run_full_model over Sego-2022's initial-infection-fraction scenarios (0.001x/0.05x, REDUCED scale: 1 replica, 12x12 cells, 15 records ~0.068 days) and evaluates each fraction against ONLY that fraction's fig7.json band subset (scenario-grouping guard) — the monotone dose-response direction holds trivially (frac=0.001 rounds to 0 pre-infected cells of 144 at this reduced population -> uninfected_final_frac=1.0; frac=0.05 seeds 7 -> 0.9444) but per-fraction band_eval.passed is False for both fractions; the paper-scale 20-replica, 35x35-cell, ~15-day ensemble (Mac-mini Phase-B) is required before any reproduced verdict"
confidence: Provisional
investigation: influenza-sego2022

purpose:
  question: |
    With every mechanism subsystem from Increments 0-8 wired into ONE
    per-MCS loop (`run.run_full_model`, Task 9.1), does sweeping that model
    over Sego-2022 Fig-7's four initial-infection-fraction scenarios (0.1%,
    0.5%, 1%, 5% of the epithelial patch pre-infected, zero initial virus
    field) reproduce the paper's central Fig-7/Sec-3.4 finding -- a
    threshold-like severity response in which every replica is non-lethal
    (the patch recovers) for fraction <=1%, even though the ODE model is
    fatal for all of these, while at fraction=5% the spatial model becomes
    comparably severe to the ODE model (though some replicas still retain
    surviving uninfected cells) -- and, honestly, does a REDUCED-scale sweep
    (the only scale a fast CI test can afford) show a consistent (non-more-
    surviving-at-higher-fraction) direction even though it cannot match the
    digitized bands' absolute magnitudes at paper scale?
  mechanism: full_model_infection_fraction_sweep_vs_fig7_acceptance_bands

report:
  title: "repro_fig7 sweeps run_full_model over Fig-7's initial-infection-fraction scenarios and evaluates EACH fraction against only that fraction's fig7.json band subset (the shared scenario-grouping guard, generalized from repro_fig5's Task-9.0-review-flagged guard into `_scenario_target_subset`) — at reduced scale (fracs=(0.001,0.05), replicas=1, cells_per_side=12, steps=15, ~0.068 simulated days), the monotone dose-response direction holds (uninfected_final_frac: frac=0.001 -> 1.0, frac=0.05 -> 0.9444) but band_eval['passed'] is False for both fractions; the paper-scale 20-replica/35x35-cell/~15-day ensemble is deferred to the Mac-mini Phase-B follow-up"
  verdict: documented
  confidence: medium
  evidence_quality: measured
  objective: >-
    Implement `run.repro_fig7(*, fracs, replicas, cells_per_side, steps,
    seed0)` (Task 9.4): for each initial infection fraction in `fracs`, run
    `run.run_full_model` (Task 9.1) `replicas` times with
    `init_infection_frac=frac, init_viral_load=None` (`round(frac*tot_cell)`
    random pre-infected epithelial cells, no initial virus field -- the
    mirror image of `repro_fig5`'s uniform-virus-field-IC branch); map each
    run's `counts`/`fields`/`ode` series onto `targets/fig7.json`'s 4
    observable keys (`_FIG5_OBSERVABLE_MAP` -- fig7.json uses the SAME 4
    keys as fig5.json: uninfected_cells, infected_cells,
    extracellular_virus, antibodies, so the existing map is reused rather
    than duplicated); ensemble-mean per fraction (`bands.aggregate_replicas`);
    evaluate EACH fraction's ensemble against ONLY that fraction's band
    subset, filtered from fig7.json's `initial_infection_fraction`-tagged,
    multi-scenario flat observable lists (`_fig7_target_subset` +
    `_evaluate_fig7_subset`) -- the SCENARIO-GROUPING GUARD this task's
    brief calls out as load-bearing, generalized here (DRY, per the brief's
    explicit preference) into a shared `_scenario_target_subset(obs,
    tag_key, tag_value, source_name=...)` / `_evaluate_scenario_subset(...)`
    pair that BOTH `_fig5_target_subset`/`_evaluate_fig5_subset` and
    `_fig7_target_subset`/`_evaluate_fig7_subset` now call, preserving
    fig5's exact prior behavior (verified: all pre-existing fig5 tests still
    pass unchanged). `_fig7_target_subset` raises `ValueError` (fail loudly)
    if a requested fraction has zero matching entries for any observable,
    rather than silently falling back to the unfiltered (all-scenario)
    list. Measured at this task's added test's reduced config
    (`fracs=(0.001,0.05), replicas=1, cells_per_side=12, steps=15,
    seed0=0`, `tests/test_influenza_full_model.py::
    test_repro_fig7_infection_fraction_sweep`) -- the same config reported
    below, run directly (not fabricated) to produce every number in this
    report. A dedicated fast unit test
    (`test_fig7_target_subset_scenario_grouping_guard`) was ALSO added to
    close the Task-9.3-review-flagged gap that the guard was previously
    verified only interactively, not in pytest.
  conclusion: >-
    THE DRIVER IS WIRED CORRECTLY, THE SHARED SCENARIO-GROUPING GUARD WORKS
    (VERIFIED IN PYTEST BOTH FOR THE HAPPY PATH AND THE RAISE, CLOSING THE
    TASK-9.3-REVIEW GAP), AND THE MONOTONE DOSE-RESPONSE DIRECTION HOLDS AT
    REDUCED SCALE; PER-FRACTION BAND CONTAINMENT DOES NOT HOLD, AND THIS
    STUDY DOES NOT CLAIM FIG-7 IS REPRODUCED. At `fracs=(0.001,0.05),
    replicas=1, cells_per_side=12, steps=15, seed0=0` (144 epithelial cells
    vs. the target's 10000; the ensemble's simulated time only reaches
    t_days~0.068, vs. the target's checkpoints out to t_days=15),
    `r["band_eval"]["passed"]` is False (both per-fraction evaluations fail)
    but the reduced-scale fidelity criterion this driver's own test checks
    -- a larger initial infection fraction does not leave MORE surviving
    uninfected cells than a smaller one -- holds: `uninfected_final_frac` is
    1.0 (144/144 cells, i.e. NO cell ever became infected) at frac=0.001 vs
    0.9444 (136/144 cells) at frac=0.05. A HONEST AND LOAD-BEARING CAVEAT
    THIS REPORT FLAGS EXPLICITLY: at `cells_per_side=12` (144 epithelial
    cells), `round(0.001 * 144) = round(0.144) = 0` -- the smallest tested
    fraction rounds DOWN to zero pre-infected cells, so frac=0.001's
    reduced-scale run is a degenerate no-infection control (infected[0]==0
    for the whole run, not `infected[0] > 0` as `run_full_model`'s
    docstring states for a typical `init_infection_frac` usage), not an
    exercise of the fraction=0.001 infection dynamics fig7.json's band
    targets. This is a population-scale rounding artifact of the REDUCED
    test config, not a driver bug: `repro_fig7`'s own `n_infected =
    round(frac*tot_cell)` logic (inherited unchanged from `run_full_model`,
    Task 9.1) is correct; it is simply that 0.1% of 144 rounds to 0, while
    0.1% of the paper's 10000-cell population rounds to 10 (fig7.json's own
    scenario). The monotone-direction assertion still holds cleanly (1.0
    surviving at the degenerate no-infection control vs 0.9444 at
    frac=0.05's real 7-cell seed), but it should not be read as evidence the
    model reproduces Fig-7's frac=0.001 trajectory -- that fraction was
    effectively not simulated at this reduced population size. Per-fraction,
    per-observable band results (n_in/n_checked out of 6 digitized
    checkpoints each, worst_miss = largest relative out-of-band distance):
    frac=0.001 -- uninfected_cells 0/6 (worst_miss 2.29), infected_cells 3/6
    (0.33), extracellular_virus 5/6 (0.33), antibodies 2/6 (0.097);
    frac=0.05 -- uninfected_cells 5/6 (0.35), infected_cells 3/6 (0.32),
    extracellular_virus 6/6 (0, fully in-band), antibodies 6/6 (0, fully
    in-band). NONE of these numbers were tuned to look better, and
    `targets/fig7.json` was NOT edited -- the band is the fixed oracle per
    the task brief.
  main_insight: >-
    The reduced-scale result here is dominated by a DIFFERENT mechanism than
    `repro_fig5`'s reduced-scale report: not a virus-field-units mismatch
    (extracellular_virus is actually FULLY in-band, 6/6, at frac=0.05, and
    5/6 at frac=0.001 -- unlike fig5's ~1200x worst_miss for the same
    observable at both tested loads), but a POPULATION-SCALE ROUNDING
    ARTIFACT specific to `init_infection_frac` scenarios at small
    `cells_per_side`: frac=0.001 * 144 cells rounds to 0 pre-infected cells,
    so that "run" never seeds any infection at all, trivially landing
    uninfected_cells at 144/144 for all 15 records -- a value nowhere near
    fig7.json's frac=0.001 band (which expects infection to emerge and
    recede, e.g. t_days=6: lo=2000,hi=9000 at paper scale, or as a fraction
    of 10000 cells ~0.2-0.9, vs this run's degenerate 1.0 constant), hence
    uninfected_cells' 0/6 in-band and worst_miss=2.29 (the largest relative
    miss of any observable/fraction pair in this report). frac=0.05's 7
    initially-infected-of-144 cells is a real (non-degenerate) seed, and its
    extracellular_virus/antibodies land fully in-band while
    uninfected_cells/infected_cells do not -- consistent with the same
    short-duration (~0.068 vs up to 15 simulated days) and population-scale
    (144 vs 10000 cells) mismatch `repro_fig5`'s study already documented
    for cell-count observables, which don't rescale cleanly with a smaller
    population the way field-integral/ODE-state observables sometimes land
    inside a wide digitized band by coincidence. The honest read: the
    DIRECTION of the fraction-response (more initially infected cells ->
    fewer surviving uninfected cells) is correctly reproduced by the wired
    mechanism at frac=0.05, but frac=0.001's reduced-scale result reflects a
    rounding degeneracy, not the mechanism's fidelity at that specific
    fraction -- a distinct, additional honesty caveat beyond
    `repro_fig5`'s scale/duration findings.
  caveat: >-
    CENTRAL HONEST CAVEAT (per the task brief, repeated here deliberately):
    this reduced-scale sweep (2 of the paper's 4 infection fractions, 1
    replica each, 144 epithelial cells, ~0.068 simulated days) is NOT the
    paper-scale 20-replica, 4-fraction ensemble the Sego-2022 Fig-7
    comparison requires. FIG-7 IS NOT REPRODUCED BY THIS STUDY. The
    mechanisms this driver exercises (pre-infected-cell seeding, per-cell
    resistance, all four diffusive fields, macrophage/NK/CD8 chemotaxis +
    contact/nearby killing, ODE-driven recruitment, the Allee rule, the
    hybrid Price-2015 global ODE) are all WIRED, per Increments 0-8's
    individually-validated studies and Task 9.1/9.2/9.3's capstone assembly
    -- but this driver's REPORTED MAGNITUDES here are calibration-pending at
    this reduced population/time/fraction-count scale, not a verified
    reproduction; additionally, frac=0.001 at `cells_per_side=12` is a
    degenerate zero-infected-cells run (see `report.conclusion` /
    `report.main_insight`), so this reduced sweep effectively tests only ONE
    real infection-fraction scenario (0.05) plus a no-infection control, not
    two genuine points on Fig-7's dose-response curve. `repro_fig7`'s own
    docstring documents the paper-scale config (`replicas=50,
    cells_per_side=35, steps≈3086` -- following `repro_fig5`'s corrected
    steps-per-15-day-window derivation: `mcs_per_step=7, s_per_mcs=60` gives
    0.0048611 days/record, so fig7's 15-day checkpoint window needs
    steps≈15/0.0048611≈3086) at ALL FOUR fractions
    (0.001,0.005,0.01,0.05) as the Mac-mini Phase-B follow-up that will
    actually set the `reproduced` verdict for Fig 7 -- note fig7.json's own
    `scenario.replicas` is 20, not 50 (fig5's paper replica count); the
    Phase-B run should match fig7.json's own scenario block
    (`replicas=20`), not blindly reuse fig5's 50. This study's verdict stays
    `documented`, `conclusion_verdicts.biological_validation` stays
    PENDING, no observable's band was widened, no constant was tuned, and
    `targets/fig7.json` was not touched to make this report's numbers look
    better than they are.
  key_metrics:
    - {name: band_eval_passed, value: false, note: "fracs=(0.001,0.05), replicas=1, cells_per_side=12, steps=15, seed0=0 -- both per-fraction band evaluations fail"}
    - {name: lethal_threshold, value: null, note: "neither tested fraction's ensemble-mean final uninfected fraction drops to <=0.5 at this reduced scale/duration"}
    - {name: monotone_dose_response, value: true, note: "uninfected_final_frac(frac=0.05)=0.9444 <= uninfected_final_frac(frac=0.001)=1.0 -- the reduced-scale test's own fidelity criterion, holds, BUT see the degenerate-frac=0.001 caveat in report.conclusion"}
    - {name: frac0001_n_infected_seeded, value: 0, note: "round(0.001 * 144) = 0 -- the smallest tested fraction seeds ZERO pre-infected cells at this reduced population (vs 10 of 10000 at paper scale); a degenerate no-infection control, not a real exercise of fig7.json's frac=0.001 scenario"}
    - {name: frac0001_uninfected_final_frac, value: 1.0, note: "144/144 cells uninfected for all 15 records -- trivial, since no cell was ever infected"}
    - {name: frac05_n_infected_seeded, value: 7, note: "round(0.05 * 144) = 7 -- a real (non-degenerate) infection seed"}
    - {name: frac05_uninfected_final_frac, value: 0.9444, note: "136/144 cells uninfected at t_days~0.068 (15 records)"}
    - {name: frac0001_uninfected_cells_n_in, value: "0/6", note: "worst_miss 2.29 -- largest miss in this report; the degenerate zero-infection run never approaches fig7.json's expected frac=0.001 infection/recovery trajectory"}
    - {name: frac0001_infected_cells_n_in, value: "3/6", note: "worst_miss 0.33"}
    - {name: frac0001_extracellular_virus_n_in, value: "5/6", note: "worst_miss 0.33"}
    - {name: frac0001_antibodies_n_in_soft, value: "2/6", note: "worst_miss 0.097; ODE-integrated A state, soft=true"}
    - {name: frac05_uninfected_cells_n_in, value: "5/6", note: "worst_miss 0.35"}
    - {name: frac05_infected_cells_n_in, value: "3/6", note: "worst_miss 0.32"}
    - {name: frac05_extracellular_virus_n_in, value: "6/6", note: "worst_miss 0.0 -- fully in-band, unlike repro_fig5's ~1200x extracellular_virus miss at both tested loads; see report.main_insight for why this should not be read as the fig3b/fig5 units gap being resolved"}
    - {name: frac05_antibodies_n_in_soft, value: "6/6", note: "worst_miss 0.0; soft=true, fully in-band"}
    - {name: reduced_run_sim_duration_days, value: 0.0681, note: "15 records x mcs_per_step=7 x s_per_mcs=60 / 86400; fig7 target checkpoints run 0.0-15.0 days -- bands.series_in_band flat-extrapolates the near-t=0 model value out to every later checkpoint"}
    - {name: reduced_vs_target_population, value: "144 vs 10000", note: "cells_per_side=12 -> 144 epithelial cells; targets/fig7.json scenario.total_epithelial_cells=10000 (cells_per_side=35 at paper scale, patch_mm=1.0)"}
    - {name: reduced_vs_target_fracs_swept, value: "2 of 4", note: "fracs=(0.001,0.05) reduced-test subset vs targets/fig7.json's full initial_infection_fractions=[0.001,0.005,0.01,0.05]"}

study_card:
  goal: Wire `run.repro_fig7` -- a per-fraction seeded ensemble driver that sweeps `run_full_model`'s pre-infected-cell IC across Fig-7's initial-infection-fraction scenarios, maps each fraction's output onto `targets/fig7.json`'s 4 observable keys, and evaluates EACH fraction against ONLY that fraction's own scenario-tagged band subset (the shared, DRY-generalized scenario-grouping guard) -- and honestly report the REDUCED-scale sweep result (this task's fast-test config), including the frac=0.001 rounding degeneracy, without tuning any constant or widening any band to make it pass.
  mechanism: >-
    For each `frac` in `fracs`, `run.run_full_model` (Task 9.1) runs
    `replicas` seeded scenarios with `init_infection_frac=frac,
    init_viral_load=None` -- `round(frac*tot_cell)` random pre-infected
    epithelial cells with NO initial virus field, so infection starts from
    the seeded cells and spreads via the field (`transitions.infection_step`
    from the infected cells' virus secretion); `_FIG5_OBSERVABLE_MAP`
    (reused, not duplicated -- fig7.json uses the identical 4 observable
    keys as fig5.json) maps the run's `counts`/`fields`/`ode` sections onto
    fig7's observable keys; `bands.aggregate_replicas` ensemble-means each
    mapped series across that fraction's replicas; `_fig7_target_subset`
    (built on the newly-shared `_scenario_target_subset`, generalized from
    `repro_fig5`'s guard) filters `targets/fig7.json`'s flat, multi-scenario
    observable lists down to ONLY the entries tagged
    `initial_infection_fraction == frac` (raising `ValueError` if a fraction
    has no matching entries, rather than silently falling back to the
    unfiltered list); `_evaluate_fig7_subset` then runs
    `bands.series_in_band`'s interpolate-and-contain check against that
    filtered subset per observable, honoring each entry's `soft` flag.
  why_before_next: This task completes the Increment-9 reproduction ladder's
    four target figures (fig3b, fig5, fig7 now wired + evaluated; fig7 is
    the last per the plan's re-scoped ladder). The Mac-mini Phase-B
    paper-scale follow-up needs `repro_fig7`'s per-fraction
    ensemble-and-scenario-filtered-band-eval machinery already working
    correctly (including the shared scenario-grouping guard, now verified
    in pytest for BOTH fig5 and fig7's specializations, closing the
    Task-9.3-review gap that it was previously checked only interactively)
    before it's trusted at 20-replica/4-fraction/35x35-cell scale; this task
    also surfaces a NEW honesty finding beyond fig5/fig3b's (the
    frac=0.001-at-cells_per_side=12 rounding degeneracy) that the Phase-B
    run at cells_per_side=35 does not share (round(0.001*1225)=1,
    round(0.001*10000)=10 at paper scale -- non-degenerate), so it is
    reduced-test-config-specific, not a driver defect to fix before
    Phase-B.
  expected_result: >-
    A well-formed dict with a `by_frac` section keyed by every tested
    fraction, each containing a per-fraction `ensemble`/`band_eval`/
    `uninfected_final_frac`, a top-level `lethal_threshold`, and a top-level
    `band_eval` aggregating every fraction. At the reduced-scale config used
    here, per-fraction `band_eval["passed"]` is expected to be False for
    most/all fractions (population-scale and run-duration mismatch, as in
    `repro_fig3b`/`repro_fig5`), but the monotone dose-response direction
    (`uninfected_final_frac` non-increasing in `frac`) is expected to hold
    even at reduced scale, since it is a direction-of-effect check, not a
    magnitude/band-fit check -- though, as this run discovered, the smallest
    fraction can round to a degenerate zero-infection control at small
    `cells_per_side`, which the direction check tolerates but which is not
    evidence of fidelity at that fraction.
  main_expert_question: The reduced-scale sweep's frac=0.001 point seeds
    ZERO pre-infected cells at cells_per_side=12 (round(0.001*144)=0),
    making it a no-infection control rather than a real test of fig7.json's
    smallest-fraction scenario -- should the Mac-mini Phase-B run use a
    LARGER reduced/intermediate `cells_per_side` (e.g. 35, the full paper
    patch size, as `repro_fig7`'s own default already does) even for an
    initial pre-paper-scale check, specifically to avoid this rounding
    degeneracy at fig7's smallest tested fraction, before committing the
    expensive 20-replica x 4-fraction x ~15-day paper-scale ensemble?

question: |
  Does `run.repro_fig7` (Task 9.4) correctly sweep `run.run_full_model`
  (Task 9.1) over Sego-2022 Fig-7's initial-infection-fraction scenarios,
  evaluate EACH fraction against ONLY that fraction's own fig7.json band
  subset (never the unfiltered, multi-scenario list, via the shared
  scenario-grouping guard generalized from `repro_fig5`), and reproduce the
  paper's central threshold-like severity-response direction -- and,
  honestly, does a REDUCED-scale sweep (the only scale a fast CI test can
  run) show that direction even though it cannot match the digitized bands'
  absolute magnitudes at paper scale, and does it surface any NEW
  reduced-scale artifacts beyond what `repro_fig5`/`repro_fig3b` already
  documented?

hypothesis: |
  `run.repro_fig7` correctly wires the per-fraction ensemble-and-scenario-
  filtered-band-evaluation machinery, reusing `repro_fig5`'s shared
  `_scenario_target_subset` guard rather than duplicating it: for each
  tested fraction it runs `replicas` seeded `run_full_model` calls with
  `round(frac*tot_cell)` pre-infected cells, maps every observable onto
  fig7's keys, ensemble-means them, filters fig7.json's observable lists
  down to that fraction's own scenario subset (the guard), and produces a
  well-formed per-fraction `band_eval`. At REDUCED scale (few fractions/
  replicas, a small population, a short duration -- all needed to keep the
  added pytest test fast), the ensemble is NOT expected to land in-band
  against bands digitized from a 10000-cell, 20-replica, 15-day paper-scale
  ensemble, but the MONOTONE dose-response direction (higher initial
  infection fraction -> not-more surviving uninfected fraction) should
  still hold. A risk specific to `init_infection_frac` (unlike fig5's
  `init_viral_load`, which has no analogous rounding step): the smallest
  fraction may round to zero seeded cells at a small `cells_per_side`,
  producing a degenerate no-infection run that should be reported as what
  it is, not oversold as reproduction evidence.

objective: |
  Implement `run.repro_fig7(*, fracs=(0.001,0.005,0.01,0.05), replicas=3,
  cells_per_side=35, steps=240, seed0=0) -> dict` (Task 9.4): for each
  `frac`, loop `replicas` seeds through `run.run_full_model(
  cells_per_side=cells_per_side, steps=steps, seed=seed0+frac_idx*replicas+r,
  init_infection_frac=frac, init_viral_load=None)`; map each run's
  `counts`/`fields`/`ode` sections onto `targets/fig7.json`'s exact 4
  observable keys (reusing `_FIG5_OBSERVABLE_MAP`); ensemble-mean via
  `bands.aggregate_replicas`; filter that fraction's own band subset from
  fig7.json's multi-scenario observable lists (`_fig7_target_subset`,
  raising `ValueError` rather than silently mixing scenarios if a fraction
  has no matching entries); evaluate via `_evaluate_fig7_subset`. Add
  `tests/test_influenza_full_model.py::
  test_repro_fig7_infection_fraction_sweep` (reduced:
  `fracs=(0.001,0.05), replicas=1, cells_per_side=12, steps=15`) asserting
  the by_frac dict has exactly the tested fractions as keys, the monotone
  dose-response holds (`uninfected_final_frac(0.05) <=
  uninfected_final_frac(0.001) + 1e-9`), and `band_eval` is present -- NOT
  that the bands pass. ALSO add
  `test_fig7_target_subset_scenario_grouping_guard`, a fast unit test
  directly exercising `_fig7_target_subset`'s filter (returns only the
  matching-tag entries) and its raise (unmatched fraction), closing the
  Task-9.3-review-flagged gap that the guard was previously verified only
  interactively. Run the reduced config directly (not the pytest assertions
  alone) to report the actual per-fraction, per-observable band_eval numbers
  in this study honestly.

description: |
  Increment 9 Task 9.4 (the final task of the capstone reproduction ladder):
  `run.repro_fig7` is the per-fraction infection-fraction-sweep ensemble
  driver for the Sego-2022 Fig-7 scenario family, built on top of Task
  9.1's `run.run_full_model` (every mechanism subsystem from Increments 0-8
  assembled into one source-ordered per-MCS loop), Task 9.0's `bands`
  acceptance-band harness, and Task 9.3's SCENARIO-GROUPING GUARD, now
  generalized (DRY, per the brief's stated preference and this task's
  verification that doing so preserves fig5's exact prior behavior) into a
  shared `_scenario_target_subset`/`_evaluate_scenario_subset` pair used by
  BOTH `_fig5_target_subset`/`_evaluate_fig5_subset` and this task's new
  `_fig7_target_subset`/`_evaluate_fig7_subset`: `targets/fig7.json`'s
  observable lists interleave all 4 initial-infection-fraction scenarios in
  one flat list per observable, tagged by `initial_infection_fraction`, so
  evaluating a single fraction's model run against the WHOLE unfiltered
  list would silently average its comparison against every other
  fraction's band too. This task WIRES the sweep machinery, EVALUATES it,
  and closes a test-coverage gap the Task-9.3 review flagged (the guard was
  only verified interactively, not in pytest) by adding a dedicated fast
  unit test for the filter-and-raise behavior. It explicitly does NOT
  attempt the paper-scale 20-replica, all-4-fraction, 35x35-cell, ~15-day
  ensemble needed to actually claim Fig-7 reproduction; that run is
  deferred to the Mac-mini Phase-B follow-up (documented in `repro_fig7`'s
  own docstring, following `repro_fig5`'s corrected `steps≈3086` derivation
  for the full 15-day window at `mcs_per_step=7, s_per_mcs=60`, but noting
  fig7.json's own `scenario.replicas=20`, not fig5's 50). The reduced-scale
  config this task's fast pytest test uses (`fracs=(0.001,0.05), replicas=1,
  cells_per_side=12, steps=15`) is run directly here and its actual
  `band_eval` result reported honestly: both fractions fail per-fraction
  band containment, the monotone dose-response direction holds, and a NEW
  reduced-scale artifact is surfaced and reported honestly -- frac=0.001
  rounds to ZERO pre-infected cells at `cells_per_side=12`
  (`round(0.001*144)=0`), so that point is a degenerate no-infection
  control at this population size, not a real exercise of fig7.json's
  frac=0.001 scenario.

claim: |
  `run.repro_fig7` is implemented and wired correctly: it sweeps a seeded
  ensemble of `run_full_model` over Fig-7's initial-infection-fraction
  scenarios, maps every observable onto `targets/fig7.json`'s exact keys
  (reusing fig5's `_FIG5_OBSERVABLE_MAP` since both targets share the same 4
  keys), ensemble-means per fraction via `bands.aggregate_replicas`, filters
  each fraction's own scenario-tagged band subset (`_fig7_target_subset`,
  built on the shared `_scenario_target_subset` this task generalized from
  `repro_fig5`'s guard, verified to raise `ValueError` rather than silently
  mixing scenarios when a fraction has no tagged entries, AND verified to
  filter correctly for the happy path -- both now covered by a dedicated
  pytest unit test), and evaluates via `_evaluate_fig7_subset`, producing a
  well-formed `{"by_frac": {frac: {...}}, "lethal_threshold": ...,
  "band_eval": {...}, "fracs":..., "replicas":..., "cells_per_side":...,
  "steps":...}` dict (verified by `tests/test_influenza_full_model.py::
  test_repro_fig7_infection_fraction_sweep`). THIS STUDY DOES NOT CLAIM
  FIG-7 IS REPRODUCED. At the reduced scale this task's fast test uses
  (`fracs=(0.001,0.05), replicas=1, cells_per_side=12, steps=15, seed0=0`),
  per-fraction `band_eval["passed"]` is False for both fractions
  (per-observable n_in/6 and worst_miss reported in `report.key_metrics`
  above) -- expected given the ~69x smaller epithelial population and the
  ~0.068-simulated-day run duration vs. the target's 0.0-15-day checkpoint
  window, not a mechanism defect. The MONOTONE dose-response direction this
  reduced test's own assertion checks
  (`uninfected_final_frac(frac=0.05)=0.9444 <=
  uninfected_final_frac(frac=0.001)=1.0`) holds, BUT frac=0.001's value is a
  degenerate no-infection control at this reduced population
  (`round(0.001*144)=0` pre-infected cells seeded), reported here honestly
  rather than presented as a real reproduction of fig7.json's frac=0.001
  trajectory. The paper-scale 20-replica, all-4-fraction, 35x35-cell,
  ~15-day ensemble (Mac-mini Phase-B) is required before any `reproduced`
  verdict for Fig 7, and `conclusion_verdicts.biological_validation` stays
  PENDING here.

expected_behavior:
  - "`repro_fig7` returns a `by_frac` dict keyed by exactly the requested fractions, each with an `ensemble`, a per-fraction `band_eval`, and `uninfected_final_frac`/`uninfected_min_frac`."
  - "`_fig7_target_subset` raises `ValueError` (never silently falls back to the unfiltered, multi-scenario list) if a requested fraction has no matching `initial_infection_fraction`-tagged entries in `targets/fig7.json` for any observable."
  - "The monotone dose-response holds: `uninfected_final_frac` is non-increasing across ascending `fracs` (a larger initial infection fraction never leaves MORE surviving uninfected cells than a smaller one, within a small numerical tolerance) -- though at small `cells_per_side`, the smallest fraction may round to zero seeded cells, a reported artifact rather than mechanism evidence."
  - "At REDUCED scale (small `cells_per_side`/`replicas`/`steps`, few `fracs`), per-fraction `band_eval`'s `passed` value is NOT expected to be True -- reported honestly, not tuned toward a pass."

readouts:
  - name: repro_fig7 returns a well-formed per-fraction sweep + band evaluation
    identifier: repro_fig7_structure
    units: n/a
    status: measured
    description: >-
      `run.repro_fig7(fracs=(0.001,0.05), replicas=1, cells_per_side=12,
      steps=15, seed0=0)` returns `by_frac` with exactly keys
      `{0.001, 0.05}`, each containing `ensemble` (all 4 fig7 observable
      keys), `band_eval` (with `passed`), `uninfected_final_frac`, and
      `uninfected_min_frac`; a top-level `lethal_threshold=None` (neither
      tested fraction reaches the 0.5 final-uninfected-fraction threshold
      at this reduced scale); and a top-level `band_eval` with
      `passed=False`.
  - name: Scenario-grouping guard filters correctly and raises on a mismatched fraction
    identifier: scenario_grouping_guard
    units: n/a
    status: measured
    description: >-
      `run._fig7_target_subset(bands.load("fig7")["observables"], 0.05)`
      returns exactly the `initial_infection_fraction=0.05`-tagged entries
      per observable (verified: `{0.05}` is the only tag value present in
      each filtered list, and every subset is non-empty).
      `run._fig7_target_subset(..., 0.5)` (an untagged fraction) raises
      `ValueError`. Both checks are now covered by
      `tests/test_influenza_full_model.py::
      test_fig7_target_subset_scenario_grouping_guard`, closing the
      Task-9.3-review gap that this guard was previously verified only
      interactively.
  - name: Monotone dose-response holds at reduced scale (with a degenerate-fraction caveat)
    identifier: monotone_dose_response_reduced_scale
    units: uninfected fraction
    status: measured
    description: >-
      Ensemble-mean `uninfected_final_frac` at `fracs=(0.001,0.05),
      replicas=1, cells_per_side=12, steps=15, seed0=0`: 1.0 (144/144
      cells) at frac=0.001 vs 0.9444 (136/144 cells) at frac=0.05 -- a
      larger initial infection fraction leaves not-more surviving
      uninfected cells, the direction the paper's Fig-7 narrative depends
      on. Honestly caveated: frac=0.001 seeds `round(0.001*144)=0`
      pre-infected cells at this reduced population, so its 1.0 value is a
      degenerate no-infection control, not a measured infection-recovery
      trajectory.
  - name: Reduced-scale per-fraction band comparison -- per-observable in-band fraction
    identifier: fig7_band_eval_reduced_scale
    units: n_in / n_checked (of 6 digitized checkpoints each)
    status: measured
    description: >-
      frac=0.001: uninfected_cells 0/6 (worst_miss 2.29 -- degenerate
      zero-infection run vs. fig7.json's expected infection/recovery
      trajectory), infected_cells 3/6 (0.33), extracellular_virus 5/6
      (0.33), antibodies 2/6 (0.097, soft) -- fraction band_eval
      passed=False. frac=0.05: uninfected_cells 5/6 (0.35), infected_cells
      3/6 (0.32), extracellular_virus 6/6 (0, fully in-band), antibodies
      6/6 (0, soft, fully in-band) -- fraction band_eval passed=False
      (uninfected_cells + infected_cells miss). Overall
      `band_eval["passed"]`=False.

behavior_tests:
  - name: repro_fig7 sweeps infection fractions and returns a well-formed by_frac/band_eval dict with the monotone dose-response
    classification: primary
    description: |
      `run.repro_fig7(fracs=(0.001,0.05), replicas=1, cells_per_side=12,
      steps=15, seed0=0)` must return `by_frac` keyed by exactly
      `{0.001, 0.05}`, a non-more-surviving-uninfected dose-response
      (`uninfected_final_frac(0.05) <= uninfected_final_frac(0.001) +
      1e-9`), and a `band_eval` key. Does NOT assert either fraction's
      `band_eval["passed"]` -- reduced scale is not expected to pass the
      paper-scale-digitized bands.
    measure: {kind: repro_fig7_wellformed_and_monotone_dose_response, condition: repro-fig7-reduced-scale, stat: final}
    pass_if: {op: eq, value: true}
    status: passed
    result: PASS
    evaluated_by: tests/test_influenza_full_model.py::test_repro_fig7_infection_fraction_sweep
  - name: Scenario-grouping guard filters fig7's tagged observables correctly and raises loudly on an unmatched fraction
    classification: primary
    description: |
      `run._fig7_target_subset(bands.load("fig7")["observables"], 0.05)`
      returns a non-empty, `{0.05}`-only-tagged subset for every observable;
      `run._fig7_target_subset(bands.load("fig7")["observables"], 0.5)`
      (an untagged fraction) raises `ValueError`. Closes the Task-9.3-review
      gap that this guard pattern was previously verified only
      interactively for fig5, not in pytest for either figure.
    measure: {kind: fig7_scenario_grouping_guard_filter_and_raise, condition: repro-fig7-reduced-scale, stat: final}
    pass_if: {op: eq, value: true}
    status: passed
    result: PASS
    evaluated_by: tests/test_influenza_full_model.py::test_fig7_target_subset_scenario_grouping_guard

findings:
  - id: F-01
    kind: computational
    status: confirms
    mechanism_origin: engineered
    evidence:
      from_test: repro_fig7 sweeps infection fractions and returns a well-formed by_frac/band_eval dict with the monotone dose-response
      divergence_factor: null
      observed: "by_frac keys == {0.001, 0.05}; lethal_threshold=None; top-level band_eval present with passed=False; uninfected_final_frac 1.0 (frac=0.001) -> 0.9444 (frac=0.05), monotone non-increasing"
    statement: |
      `run.repro_fig7` is wired correctly: it sweeps a seeded ensemble of
      `run_full_model` per initial infection fraction with pre-infected
      cells (no initial virus field), maps every observable onto
      `targets/fig7.json`'s exact keys (reusing `_FIG5_OBSERVABLE_MAP`
      since both targets share the same 4 keys), ensemble-means per
      fraction with `bands.aggregate_replicas`, filters each fraction's own
      scenario-tagged band subset via `_fig7_target_subset` (built on the
      shared `_scenario_target_subset` generalized from `repro_fig5`'s
      Task-9.0-review guard), and produces a well-formed per-fraction and
      aggregate `band_eval` via `_evaluate_fig7_subset` -- the sweep-and-
      guard machinery itself is verified correct and reusable for the
      Mac-mini Phase-B paper-scale, all-4-fraction run.
  - id: F-02
    kind: computational
    status: confirms
    mechanism_origin: engineered
    evidence:
      from_test: test_fig7_target_subset_scenario_grouping_guard
      divergence_factor: null
      observed: "_fig7_target_subset(obs, 0.05) returns non-empty, {0.05}-only-tagged subsets for all 4 observables; _fig7_target_subset(obs, 0.5) raises ValueError"
    statement: |
      The SCENARIO-GROUPING GUARD (shared `_scenario_target_subset`,
      generalized from `repro_fig5`'s Task-9.0-review-flagged guard into a
      DRY helper both `_fig5_target_subset` and `_fig7_target_subset` call)
      is verified DIRECTLY in pytest for fig7, both for the happy path
      (correct filtering) and the failure path (loud raise on an untagged
      fraction) -- closing the Task-9.3-review-flagged test-coverage gap
      that this pattern was previously checked only interactively.
      Generalizing did not change fig5's prior behavior: all pre-existing
      `repro_fig5`/`_fig5_target_subset` tests still pass unchanged after
      the refactor.
  - id: F-03
    kind: computational
    status: partial
    mechanism_origin: engineered
    evidence:
      from_test: null
      divergence_factor: 2.29
      observed: "frac=0.001 band_eval passed=False (0/4 observables fully in-band); frac=0.05 band_eval passed=False (2/4 observables fully in-band); frac=0.001's uninfected_cells worst_miss=2.29 is the largest miss in this report"
    statement: |
      This is the study's central honest finding, reported as a GAP (status:
      partial), not hidden behind the driver's structural correctness
      (F-01/F-02): at reduced scale (144 epithelial cells vs. the target's
      10000; only 2 of the paper's 4 infection fractions swept; ~0.068
      simulated days vs. the target's 0.0-15-day checkpoint window),
      per-fraction `band_eval["passed"]` is False for every tested
      fraction. A NEW artifact beyond `repro_fig5`/`repro_fig3b`'s
      documented gaps: `round(0.001 * 144) = 0` -- the smallest tested
      fraction seeds ZERO pre-infected cells at this reduced population, so
      that run never experiences infection at all, driving its
      uninfected_cells worst_miss to 2.29 (the largest of any
      observable/fraction pair here) purely because the target expects
      infection to emerge and partially recede, not because the mechanism
      is wrong. Unlike `repro_fig5`'s extracellular_virus finding (a
      consistent ~1200x units-scale miss at every tested load), fig7's
      extracellular_virus actually lands mostly/fully in-band here (5/6 at
      frac=0.001, 6/6 at frac=0.05) -- this should NOT be read as the
      fig3b/fig5 virus-field-units gap being resolved (it is not
      investigated or fixed by this task, per the brief's explicit
      instruction not to fix it here), but rather as a coincidence of this
      reduced run's near-zero/low virus-field magnitudes landing inside
      fig7.json's own bands at these particular fractions and this short
      duration. NOT tuned away: no constant was adjusted and
      `targets/fig7.json` was not edited to narrow this gap.

conclusion: |
  `run.repro_fig7` (Task 9.4, the final task of the Increment-9 capstone
  reproduction ladder) IS IMPLEMENTED AND WIRED CORRECTLY, INCLUDING THE
  SCENARIO-GROUPING GUARD (`_fig7_target_subset`, built on a newly shared
  `_scenario_target_subset` generalized from `repro_fig5`'s guard,
  DRY-preserving fig5's exact prior behavior, and now verified in pytest
  both to filter correctly and to raise loudly on an untagged fraction --
  closing the Task-9.3-review-flagged gap that this pattern was previously
  verified only interactively): it sweeps a seeded ensemble of
  `run_full_model` per initial infection fraction, maps every observable
  onto `targets/fig7.json`'s exact keys, ensemble-means per fraction, and
  evaluates EACH fraction against ONLY that fraction's own scenario-tagged
  band subset, verified by `tests/test_influenza_full_model.py::
  test_repro_fig7_infection_fraction_sweep` and
  `test_fig7_target_subset_scenario_grouping_guard`. FIG-7 IS NOT
  REPRODUCED AT THE REDUCED SCALE THIS TASK'S FAST TEST USES, AND THIS
  STUDY DOES NOT CLAIM IT IS: at `fracs=(0.001,0.05), replicas=1,
  cells_per_side=12, steps=15, seed0=0` (144 epithelial cells vs. the
  target's 10000; only 2 of the paper's 4 infection fractions swept; ~0.068
  simulated days vs. the target's 0.0-15-day checkpoint window),
  per-fraction `band_eval["passed"]` is False for both tested fractions
  (see `report.key_metrics` for the full per-observable breakdown). The
  MONOTONE dose-response direction this reduced test's own assertion checks
  holds (`uninfected_final_frac`: 1.0 at frac=0.001 -> 0.9444 at
  frac=0.05), but this report explicitly flags that frac=0.001 is a
  DEGENERATE no-infection control at this reduced population
  (`round(0.001*144)=0` pre-infected cells seeded) -- an honesty finding
  new to this study, distinct from and in addition to `repro_fig5`'s
  documented scale/duration/virus-units gaps. THE PAPER-SCALE 20-REPLICA
  (fig7.json's own `scenario.replicas`, not fig5's 50), ALL-4-FRACTION,
  35x35-CELL (10000-cell), ~15-SIMULATED-DAY ENSEMBLE (documented in
  `repro_fig7`'s own docstring, following `repro_fig5`'s corrected
  `steps≈3086` derivation for the full 15-day window, as the Mac-mini
  Phase-B follow-up) IS REQUIRED BEFORE ANY `reproduced` VERDICT FOR FIG 7
  CAN BE SET. This study's own verdict stays `documented`, and
  `conclusion_verdicts.biological_validation` stays PENDING. No band was
  widened, no constant was tuned, and `targets/fig7.json` was not edited to
  make any number in this report look better than it is.

conclusion_verdicts:
  regression_compatibility:
    result: PASS
    basis: >-
      All 8 tests in `tests/test_influenza_full_model.py` pass (6
      pre-existing Task 9.1/9.2/9.3 tests, unaffected by generalizing
      `_fig5_target_subset`/`_evaluate_fig5_subset` into shared helpers,
      plus this task's 2 new tests -- `test_repro_fig7_infection_fraction_sweep`
      and `test_fig7_target_subset_scenario_grouping_guard`); no Increment
      0-8 driver, composite, `bands.py`, or params.yaml constant is
      modified by this task, and `targets/fig7.json` is read-only.
  biological_validation:
    result: PENDING
    basis: >-
      This study validates that `run.repro_fig7`'s per-fraction sweep,
      scenario-grouping guard (now shared with fig5, verified for both
      figures in pytest), and band-evaluation MACHINERY is wired correctly
      (F-01, F-02), and honestly reports the reduced-scale per-fraction
      band comparison result including a newly-surfaced degenerate-fraction
      artifact (F-03: both tested fractions fail per-fraction band
      containment; frac=0.001 seeds zero infected cells at this reduced
      population) -- but it explicitly does NOT attempt the paper-scale
      20-replica, all-4-fraction ensemble Fig-7 reproduction requires. Do
      NOT read PENDING here as a passing or failing reproduction verdict at
      paper scale; that verdict is set by the Mac-mini Phase-B follow-up
      run, not by this task.
  explanatory_gain:
    result: PENDING
    basis: >-
      No alternative mechanism or model variant is being compared at this
      task; deferred to the paper-scale reproduction run where a meaningful
      comparison against the paper's own reported spatial-vs-ODE
      disagreement at high infection fraction (Sec. 3.4) becomes possible.

biological_summary: |
  `run.repro_fig7` sweeps the Task-9.1 capstone driver (`run_full_model`,
  every Increment 0-8 mechanism in one source-ordered per-MCS loop) over
  Sego-2022 Fig-7's initial-infection-fraction scenarios (a fixed count of
  pre-infected epithelial cells, `round(frac*tot_cell)`, at
  0.1%/0.5%/1%/5% of the patch, zero initial virus field, at 10000
  epithelial cells / 20 replicas at paper scale) and compares each
  fraction's ensemble mean against that fraction's own digitized
  acceptance-band subset (`targets/fig7.json`, filtered per fraction by the
  scenario-grouping guard `_fig7_target_subset` -- now built on a shared
  `_scenario_target_subset` helper generalized from `repro_fig5`'s
  Task-9.0-review-flagged guard, verified not to change fig5's prior
  behavior). At the REDUCED scale this task's fast pytest test uses
  (`fracs=(0.001,0.05), replicas=1, cells_per_side=12, steps=15, seed0=0`
  -- 144 epithelial cells over ~0.068 simulated days, only 2 of the paper's
  4 fractions swept), neither tested fraction's ensemble lands fully
  in-band against its own fig7 band subset (`band_eval["passed"]=False`
  for both) -- driven by population-scale (144 vs 10000 cells) and the
  sharply truncated run duration (~0.068 vs up to 15 simulated days), plus
  a NEW reduced-scale artifact this task surfaces and reports honestly:
  `round(0.001*144)=0` pre-infected cells, so the smallest tested fraction
  is a degenerate no-infection control at this population size, not a real
  test of that scenario. The qualitative mechanism this task's reduced-
  scale test IS built to check -- a non-increasing surviving-uninfected
  fraction as initial infection fraction rises -- holds
  (`uninfected_final_frac`: 1.0 at frac=0.001's degenerate control vs
  0.9444 at frac=0.05's real 7-cell seed), but should be read cautiously
  given the frac=0.001 degeneracy: this reduced config effectively compares
  ONE real infection scenario (0.05) against a no-infection baseline, not
  two genuine points on Fig-7's dose-response curve. Unlike
  `repro_fig5`/`repro_fig3b`'s documented ~1200x extracellular_virus
  units-scale miss, fig7's extracellular_virus lands mostly/fully in-band
  here (5/6 at frac=0.001, 6/6 at frac=0.05) -- reported as a coincidence
  of this reduced run's low virus-field magnitudes, NOT as evidence the
  units gap is resolved (not investigated here, per the brief). THIS STUDY
  DOES NOT CLAIM FIG-7 IS REPRODUCED: the paper-scale 20-replica (fig7.json's
  own `scenario.replicas`), all-4-fraction, 10000-cell, ~15-day ensemble
  (`repro_fig7`'s own docstring documents this as `replicas=50` default
  signature for API symmetry with `repro_fig5`, but the Phase-B run itself
  should use `replicas=20` per fig7.json's scenario, `cells_per_side=35,
  steps≈3086`) is the Mac-mini Phase-B follow-up that will actually set the
  `reproduced` verdict for Fig 7. No band in `targets/fig7.json` was edited
  and no model constant was tuned toward a better-looking number.

key_assumptions:
  - REDUCED-SCALE REPORT, NOT PAPER-SCALE REPRODUCTION -- every band_eval
    number in this study.yaml comes from the exact
    `fracs=(0.001,0.05), replicas=1, cells_per_side=12, steps=15, seed0=0`
    config this task's fast pytest test uses, run directly to produce these
    numbers honestly, NOT from any paper-scale (20-replica, all-4-fraction,
    10000-cell) run. The Mac-mini Phase-B follow-up (documented in
    `repro_fig7`'s own docstring) is the run that will set any `reproduced`
    verdict.
  - ONLY 2 OF 4 FRACTIONS SWEPT AT REDUCED SCALE -- `fracs=(0.001,0.05)`,
    chosen to keep the reduced test's fast dose-response assertion
    meaningful (the largest available fraction-ratio contrast in
    fig7.json's own scenario list) without paying for a 4-fraction sweep in
    the fast test suite; fractions 0.005/0.01 are exercised only by
    `repro_fig7`'s default signature
    (`fracs=(0.001,0.005,0.01,0.05)`), not by this study's reported
    numbers, and are NOT swept at paper scale until the Mac-mini Phase-B
    follow-up.
  - "FRAC=0.001 ROUNDING DEGENERACY AT REDUCED POPULATION -- `round(0.001 * 144) = 0`: the smallest tested fraction seeds ZERO pre-infected cells at `cells_per_side=12`, so that run is a no-infection control, not a real exercise of fig7.json's frac=0.001 scenario. At paper scale (`cells_per_side=35`, 1225 cells at the fig3b-matched 0.3mm patch, or 10000 cells at fig7.json's own 1.0mm patch scenario), `round(0.001*1225)=1` / `round(0.001*10000)=10` -- non-degenerate. This is specific to this reduced test config, not a driver defect, and is reported honestly rather than concealed."
  - RUN-DURATION MISMATCH -- the reduced config's 15 records x
    `mcs_per_step=7` x `s_per_mcs=60` = 6300s = ~0.068 simulated days falls
    far short of `targets/fig7.json`'s checkpoint window (0.0-15.0 days);
    `bands.series_in_band`'s flat extrapolation carries the model's
    near-t=0 (or, for frac=0.001, degenerate-constant) value out to every
    later checkpoint, which mechanically drives most of the reported
    misses -- a documented property of this reduced config, not a bug in
    `bands.series_in_band` (Task 9.0's, unmodified here).
  - POPULATION-SCALE MISMATCH -- `cells_per_side=12` gives 144 epithelial
    cells vs. `targets/fig7.json`'s `scenario.total_epithelial_cells=10000`
    (`cells_per_side=35`, `patch_mm=1.0` at paper scale); raw population
    counts (uninfected/infected cells) cannot match the target's absolute
    magnitudes at this reduced population even with perfectly calibrated
    rate constants.
  - "EXTRACELLULAR-VIRUS RESULT DIFFERS FROM fig5/fig3b's DOCUMENTED UNITS GAP -- unlike `repro_fig5` (which missed extracellular_virus by ~1200x the band width at BOTH tested loads), this reduced fig7 run's extracellular_virus lands mostly/fully in-band (5/6 at frac=0.001, 6/6 at frac=0.05); this is reported as a likely coincidence of this reduced run's low virus-field magnitudes and fig7.json's own band widths at these fractions/duration, NOT as evidence the fig3b/fig5 virus-field-units mismatch is resolved -- that units question is out of scope for this task per the brief and is not investigated here."
  - INHERITED CALIBRATION-PENDING ITEMS from `run_full_model` (Task 9.1,
    unchanged here) -- the documented `NK_CD8_CHEMOTAXIS_ENGINE_SCALE=100x`
    chemotaxis engine-unit correction (Increment 7), and reduced-eta
    near-inert recruitment/nearby-killing subsystems flagged in Task 9.1's
    own docstring -- carried forward, not resolved by this task.
  - "`targets/fig7.json` WAS NOT EDITED and no model constant was tuned to narrow the reduced-scale gap reported here -- per the task brief's explicit instruction, a miss is reported honestly, not concealed."
  - "SCENARIO-GROUPING GUARD IS LOAD-BEARING AND NOW SHARED (per the Task-9.0/9.3-review findings, restated here per the task brief) -- `_fig7_target_subset` (built on the newly-generalized `_scenario_target_subset`, also used by `_fig5_target_subset`) filters `targets/fig7.json`'s observable lists to ONLY the requested fraction's `initial_infection_fraction`-tagged entries before any band comparison, and raises `ValueError` (never silently falls back to the unfiltered, multi-scenario list) if a fraction has zero matching entries for any observable; verified in pytest for BOTH the filter and the raise (`test_fig7_target_subset_scenario_grouping_guard`), closing the Task-9.3-review-flagged gap that this pattern was previously checked only interactively -- see task-9.4-report.md."

literature_anchors:
  - expectation: "Sego 2022 Fig. 7 / Sec. 3.4, p.11: all replicas are non-lethal (the epithelial patch recovers) for initial infection fraction <=1%, even though the ODE model alone is fatal for all of these fractions; at fraction=5% the spatial model is comparably severe to the ODE model (the Fig. 3B scenario), though some replicas still retain surviving uninfected cells -- another spatial-vs-ODE disagreement, this time in initial-condition sensitivity rather than viral-dose sensitivity (Fig. 5's comparison)."
    model_observable: "run.repro_fig7's per-fraction ensemble (mapped to targets/fig7.json's exact observable keys, evaluated per fraction via _fig7_target_subset/_evaluate_fig7_subset) at REDUCED scale (fracs=(0.001,0.05), replicas=1, cells_per_side=12, steps=15): band_eval['passed']=False for both fractions (population-scale/run-duration mismatch plus a frac=0.001 rounding degeneracy, per report.key_metrics); the qualitative monotone dose-response direction holds (uninfected_final_frac 1.0 at frac=0.001's degenerate control -> 0.9444 at frac=0.05's real seed), a directional echo of the paper's own severity-rises-with-initial-fraction narrative, NOT a magnitude or threshold-value reproduction (only 2 of 4 fractions tested, and frac=0.001 did not actually seed any infection at this reduced population)."
    source: "Sego et al. 2022, Fig. 7, p.11 (digitized by eye from log-scale panels, approximate) via pbg_cpm_studies/influenza/targets/fig7.json"
