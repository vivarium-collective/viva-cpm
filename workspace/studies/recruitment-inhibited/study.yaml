schema_version: 3
name: recruitment-inhibited
status: complete
phase: Decide
title: "Intervention: block the response"
confidence: Accepted
investigation: chemotactic-recruitment

purpose:
  question: |
    If the chemotactic response is blocked (lambda -> 0) while the cue is still
    secreted, is recruitment abolished?
  mechanism: chemotactic_recruitment

report:
  title: "Intervention: blocking the response abolishes recruitment"
  verdict: passing
  confidence: high
  evidence_quality: calibrated
  objective: >-
    Repeat the baseline CPM recruitment world with responder chemotaxis strength
    set to zero (the intervention) and measure the recruitment index over 500 MC
    sweeps across 5 seeds.
  conclusion: >-
    Blocking the response abolishes recruitment: the recruitment index stays at
    0.000 ± 0.000 across 5 seeds despite the cue being present, versus 0.767 ±
    0.170 for the baseline (Cohen's d = 6.38).
  main_insight: >-
    Recruitment is causally dependent on the chemotactic response, not merely on
    the presence of the cue — the response is a necessary ingredient.
  caveat: >-
    This is a negative control, not an independent positive result: it isolates
    the response as a necessary cause by removing it, and only has meaning
    alongside the baseline it is compared to.
  key_metrics:
    - {name: recruitment_index, value: "0.000 ± 0.000", n_seeds: 5}
    - {name: mean_approach, value: "-0.08"}
    - {name: effect_size, value: "Cohen's d = 6.38 vs baseline"}

study_card:
  goal: "negative control: response blocked abolishes recruitment"
  mechanism: Identical CPM world to the baseline except responder chemotaxis lambda = 0 (cue still secreted).
  why_before_next: Isolates the response as a necessary cause — pairs with the adversarial arm to establish both ingredients are required.
  expected_result: Recruitment index stays at (or near) zero for the whole run; no net approach.
  main_expert_question: Does blocking the response (rather than the cue) fully account for the loss of recruitment, ruling out a cue-only explanation?

question: |
  If the chemotactic response is blocked (lambda -> 0) while the cue is still
  secreted, is recruitment abolished?

hypothesis: |
  With the cue present but the response inhibited, responders no longer climb the
  gradient; the recruitment index stays near zero.

objective: |
  Repeat the baseline world with the responder chemotaxis strength set to zero (the
  intervention) and measure the recruitment index over 500 MC sweeps.

description: |
  The intervention arm of the slice. The world is identical to the baseline except
  the responder chemotaxis lambda is set to 0 — the CPM analogue of pharmacologically
  blocking the receptor/response while the cue is unchanged. This is the claim
  layer's "intervention on the response" made concrete: same cue, blocked response.

claim: |
  Blocking the chemotactic response abolishes recruitment: the recruitment index
  stays at 0 (mean approach ~0), despite the cue being present.

expected_behavior:
  - Recruitment index stays at (or near) zero for the whole run.
  - Responder mean distance to the source does not fall.

visualizations:
  - name: Recruitment over time (all conditions)
    address: local:ChemotaxisRecruitment

embed_visualizations:
  - name: Animated spatial scene
    title: "Chemotactic recruitment — animated scene (baseline vs this condition)"
    url: /workspace/studies/recruitment-inhibited/viz/scene.html

readouts:
  - name: Recruitment index
    identifier: recruitment_index
    units: fraction of responders within radius
    status: measured
    description: Fraction of responder cell centres of mass within 15 px of the source centroid.
  - name: Mean approach
    identifier: mean_approach
    units: dimensionless (0-1)
    status: measured
    description: Fraction of the initial responder-to-source gap closed over the run.
  - name: Responder mean distance
    identifier: responder_mean_distance
    units: px
    status: measured
    description: Mean centre-of-mass distance from responders to the source centroid.

behavior_tests:
  - name: Blocking the response abolishes recruitment
    classification: primary
    description: |
      Pass criterion: recruitment index stays below 0.1 throughout. Measured from the
      run: recruitment index remains 0.000 across all 500 sweeps (mean approach -0.08,
      i.e. no net approach).
    measure: {kind: recruitment_index, condition: recruitment-inhibited, stat: max}
    pass_if: {op: lt, value: 0.1}
    status: passed
    result: PASS

findings:
  - id: F-01
    kind: computational
    status: confirms
    mechanism_origin: emergent
    evidence:
      from_test: Blocking the response abolishes recruitment
      divergence_factor: 6.38
      observed: "recruitment index 0.000 ± 0.000 across 5 seeds despite the cue present (baseline 0.767; d=6.38)"
    statement: |
      The intervention works: across 5 seeds the recruitment index stays at
      0.000 +/- 0.000 with lambda=0, despite the cue being present (baseline 0.767;
      Cohen's d = 6.38) — recruitment is response-dependent.

robustness:
  n_replicates: 5
  seeds: [17, 29, 43, 61, 89]
  parameter_sweep: false
  per_measure:
    - name: recruitment_index
      cv: 0.0

controls:
  - kind: adversarial
    name: No cue yields no recruitment (recruitment-adversarial)
    test: Blocking the response abolishes recruitment
    result: PASS
    observed:
      recruitment_index: 0.0
    description: The other necessary-cause arm — no cue also gives no recruitment.

alternative_hypotheses:
  - claim: Recruitment persists on the cue alone, independent of the response strength.
    status: excluded
    discriminated_by: Blocking the response abolishes recruitment
    note: Excluded here — with the cue present but lambda=0, recruitment is 0.

conclusion: |
  Recruitment is causally dependent on the chemotactic response, not merely on the
  presence of the cue. Together with the baseline, this isolates the response as a
  necessary cause.

conclusion_verdicts:
  regression_compatibility:
    result: PASS
    basis: Reproduces the expected abolished-recruitment behaviour with the declared energies and ICs (lambda=0).
  biological_validation:
    result: PASS
    basis: recruitment index ≈ 0.0, abolished vs baseline 0.767
  explanatory_gain:
    result: POSITIVE
    basis: Isolates the chemotactic response as a necessary ingredient for recruitment.

biological_summary: |
  This is the response-blocked negative-control arm of the chemotactic-recruitment
  slice. The world is identical to the baseline — source cells still secrete the
  diffusible cue and form the same spatial gradient — except the responder
  chemotaxis strength (lambda) is set to zero, the CPM analogue of pharmacologically
  blocking the response. With no bias on their Cellular Potts copy attempts,
  responder centres of mass do not drift toward the source and the recruitment
  index stays at 0.000 across all 500 Monte-Carlo sweeps and all 5 seeds, versus
  0.767 for the baseline. This shows the chemotactic response — not merely the
  presence of the cue — is a necessary ingredient for recruitment.

literature_anchors:
  - expectation: Blocking the chemotactic response abolishes gradient-directed recruitment even when the cue is present.
    model_observable: recruitment_index
    source: "Chemotaxis up a secreted gradient (canonical)"
    status_in_workspace: "Verified — observed value matches"
    cites: [glazier1993]

key_assumptions:
  - Identical world to recruitment-baseline except responder chemotaxis lambda = 0.
  - Recruitment radius = 15 px.

gate_status: passed

runtime:
  default_emitter: series-json
  max_generations: 1
  post_run_scripts: []

model_change:
  base_model: pbg_cpm_studies.composites.chemotaxis.recruitment
  new_processes: []
  new_state_variables: []
  new_parameters: [cue_rate, chemo_lambda]
  modified_processes: []
  new_listeners: []
  notes: |
    Same parameterized CPMProcess as the baseline, with chemo_lambda forced to 0
    (response blocked) while cue_rate is unchanged (cue present). No new
    processes, state variables, or listeners were added.

design_pivot_required:
  - id: negative-control-arm
    status: resolved
    question: Should the response-blocked condition be built as a dedicated study arm, or treated only as an implicit zero-baseline comparison?
    alternatives:
      - Treat lambda=0 as an informal baseline comparison only
      - Build a dedicated inhibited study as a first-class necessary-ingredient control (this study)
    requested_response: none — resolved
    notes: |
      Resolved by building this as its own study: it isolates the chemotactic
      response as a necessary cause, excluding "the cue alone suffices" as an
      alternative explanation, and gives the investigation causal (not just
      correlational) evidence for the recruitment claim.

enforced_params:
  cue_rate: 10.0
  chemo_lambda: 0.0

parent_studies:
  - study: recruitment-baseline
    condition: tests-passed
    relation: leads-to

runs:
  - run_id: recruitment-inhibited-5seed
    name: recruitment-inhibited (5 seeds)
    status: completed
    canonical: true
    timestamp: '2026-08-07'
    seeds: [17, 29, 43, 61, 89]
    emitter: chemotaxis_data/results series-json
    outcomes:
      'Blocking the response abolishes recruitment':
        result: PASS
        measured_value: 0.0
        notes: 0.000 across 5 seeds with the cue present (baseline 0.767)
        evaluated_by: pbg_cpm_studies.evaluators

discovery_implications:
  followup_study_proposals:
    - id: recruitment-dose-response
      title: "Dose-response: recruitment vs cue rate and chemotaxis lambda"
      motivation: "Map the transition between recruited and not-recruited, not just the on/off endpoints."
    - id: recruitment-3d
      title: "3D-lattice recruitment"
      motivation: "Check the phenotype generalizes beyond the 2D lattice (an applicability boundary)."
    - id: receptor-kinetics-realization
      title: "Receptor-kinetics realization of the same claim"
      motivation: "Refine the phenomenological chemotaxis lambda into a receptor model; it must preserve the recruitment response."
conditions:
  baseline:
    name: inhibited
    composite: pbg_cpm_studies.composites.chemotaxis.recruitment
    params: {cue_rate: 10.0, chemo_lambda: 0.0} # cue ON, response BLOCKED (intervention)

  model_settings: []
inputs: []

narrative_spine_skip: [implementation_requirements]
narrative_spine_skip_reason: >-
  Study is complete (phase Decide). implementation_requirements is a forward
  build-TODO list with no honest content for an already-built study; the other
  spine sections are authored. (The study-level linter does not yet honor this
