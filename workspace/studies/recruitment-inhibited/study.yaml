schema_version: 3
name: recruitment-inhibited
status: complete
phase: Decide
title: "Intervention: block the response"
confidence: Accepted
investigation: chemotactic-recruitment

question: |
  If the chemotactic response is blocked (lambda -> 0) while the cue is still
  secreted, is recruitment abolished?

hypothesis: |
  With the cue present but the response inhibited, responders no longer climb the
  gradient; the recruitment index stays near zero.

objective: |
  Repeat the baseline world with the responder chemotaxis strength set to zero (the
  intervention) and measure the recruitment index over 500 MC sweeps.

description: |
  The intervention arm of the slice. The world is identical to the baseline except
  the responder chemotaxis lambda is set to 0 — the CPM analogue of pharmacologically
  blocking the receptor/response while the cue is unchanged. This is the claim
  layer's "intervention on the response" made concrete: same cue, blocked response.

claim: |
  Blocking the chemotactic response abolishes recruitment: the recruitment index
  stays at 0 (mean approach ~0), despite the cue being present.

baseline:
- name: inhibited
  composite: pbg_cpm_studies.composites.chemotaxis.recruitment_inhibited
  params: {}

expected_behavior:
- Recruitment index stays at (or near) zero for the whole run.
- Responder mean distance to the source does not fall.

visualizations:
- name: Recruitment over time (all conditions)
  address: local:ChemotaxisRecruitment

readouts:
- name: Recruitment index
  identifier: recruitment_index
  units: fraction of responders within radius
  status: measured
  description: Fraction of responder cell centres of mass within 15 px of the source centroid.

behavior_tests:
- name: Blocking the response abolishes recruitment
  classification: primary
  description: |
    Pass criterion: recruitment index stays below 0.1 throughout. Measured from the
    run: recruitment index remains 0.000 across all 500 sweeps (mean approach -0.08,
    i.e. no net approach).
  measure: {kind: recruitment_index, condition: recruitment-inhibited, stat: max}
  pass_if: {op: lt, value: 0.1}
  status: passed
  result: PASS

findings:
- id: F-01
  kind: computational
  status: confirms
  mechanism_origin: emergent
  evidence:
    from_test: Blocking the response abolishes recruitment
    divergence_factor: 6.38
  statement: |
    The intervention works: across 5 seeds the recruitment index stays at
    0.000 +/- 0.000 with lambda=0, despite the cue being present (baseline 0.767;
    Cohen's d = 6.38) — recruitment is response-dependent.

robustness:
  n_replicates: 5
  seeds: [17, 29, 43, 61, 89]
  parameter_sweep: false
  per_measure:
  - name: recruitment_index
    cv: 0.0

controls:
- kind: adversarial
  name: No cue yields no recruitment (recruitment-adversarial)
  test: Blocking the response abolishes recruitment
  result: PASS
  observed:
    recruitment_index: 0.0
  description: The other necessary-cause arm — no cue also gives no recruitment.

alternative_hypotheses:
- claim: Recruitment persists on the cue alone, independent of the response strength.
  status: excluded
  discriminated_by: Blocking the response abolishes recruitment
  note: Excluded here — with the cue present but lambda=0, recruitment is 0.

conclusion: |
  Recruitment is causally dependent on the chemotactic response, not merely on the
  presence of the cue. Together with the baseline, this isolates the response as a
  necessary cause.

key_assumptions:
- Identical world to recruitment-baseline except responder chemotaxis lambda = 0.
- Recruitment radius = 15 px.

gate_status: passed

parent_studies:
- study: recruitment-baseline
  condition: tests-passed
  relation: leads-to
