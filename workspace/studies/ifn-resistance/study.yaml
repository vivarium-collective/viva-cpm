schema_version: 3
name: ifn-resistance
status: in-progress
phase: Simulate
title: "Type-I IFN field & cellular resistance"
confidence: Provisional
investigation: influenza-sego2022
parent_studies:
  - study: virus-field-infection
    condition: tests-passed

purpose:
  question: |
    Layered on the validated Increment-2 virus field + infection transition:
    does a diffusing type-I IFN field, converted per-cell into a resistance
    scalar (source formula `resist = f_bar/(a_rf+f_bar)`), gate an infected
    cell's virus secretion by `(1-resist)` strongly enough to measurably
    REDUCE infection spread and total virus versus the same run with no IFN
    (Increment 2's path, unchanged)?
  mechanism: ifn_field_and_per_cell_resistance

report:
  title: "Increment 3: IFN-driven per-cell resistance substantially cuts virus load (primary evidence), with a smaller, later-emerging reduction in infected-cell spread — mechanism validated, reproduction still PENDING"
  verdict: documented
  confidence: medium
  evidence_quality: measured
  objective: >-
    Drive `run.run_virus_infection_with_ifn` (Task 3.3) — the same
    0.3mm/900-cell sheet, seed, and stochastic H->I transition as Increment
    2's `run_virus_infection`, but with a second diffusing type-I IFN field
    wired alongside the virus field, and, each update, every currently-
    infected cell's virus secretion throttled by `(1 - resist)` where
    `resist = cell_resistance(f_bar, a_rf)` from that cell's locally-sampled
    mean IFN — and compare against `run_virus_infection` (no IFN, no
    resistance) run with identical parameters, to measure whether the
    IFN->resistance gate reduces spread and virus load (Task 3.3's
    integration test, `test_ifn_resistance_slows_spread_vs_no_ifn`, plus the
    fuller with/without series recorded in Task 3.3's report).
  conclusion: >-
    MECHANISM VALIDATED, REPRODUCTION NOT YET ATTEMPTED. Same seed (17),
    same 0.3mm/900-cell sheet, same init_infected_frac (0.05, 45 of 900
    cells seeded infected). The PRIMARY quantitative evidence is total_virus:
    with the IFN->resistance gate active, total_virus is roughly HALVED at
    every sampled step (819.16 vs 1750.69 at step 20, a ~53% reduction at
    the step Task 3.3's integration test actually asserts; 1222.88 vs
    2752.34 at step 30, ~56%; 1624.58 vs 3905.38 at step 40, ~58%) — a
    robust, consistent signal from the earliest sampled step onward. n_I is
    a WEAKER, corroborating directional signal at the tested step: 48 vs 50
    at step 20 is only a ~4% reduction, not on its own strong evidence of
    slowed spread, but the gap widens over later steps as the virus-load
    reduction compounds — 51 vs 60 at step 30 (~15%), 53 vs 69 at step 40
    (~23%). So: the gate's IMMEDIATE, well-supported effect is on virus
    load; its effect on infected-cell COUNT is real but small early and only
    becomes a meaningfully sized effect by step 40. mean_resist over
    currently-infected cells jumps to ~0.53 after the first update and
    plateaus in a narrow 0.55-0.57 band through step 40 (it does NOT ramp
    toward 1 as more IFN nominally accumulates) — virus release is
    throttled to roughly half (1-resist ≈ 0.44) from step 1 onward, a
    steady brake rather than a hard block, consistent with the total_virus
    reduction magnitude. This validates the MECHANISM (IFN accumulates ->
    per-cell resistance rises -> virus release is gated -> total virus
    drops substantially -> infected-cell growth slows, weakly at first and
    more clearly with time) — it is NOT a claim that any of Sego et al.
    2022's Figs 3B/5/7 quantitative targets are met; that evaluation is
    deferred to Increment 9 (the capstone).
  main_insight: >-
    A per-cell resistance scalar computed purely from each infected cell's
    OWN locally-sampled IFN (no explicit cell-cell signaling beyond field
    diffusion) is sufficient to cut total virus roughly in half from the
    earliest sampled step onward — that virus-load reduction is the robust,
    well-supported effect. Infected-cell count responds to the same
    mechanism but more slowly: the n_I gap is small at step 20 (~4%) and
    only widens to a clearly meaningful ~23% by step 40, because fewer
    infections have had time to compound into a visible count difference
    even though virus release is already substantially throttled. The
    protective effect is real, but it comes from resistance hitting a fast
    local steady state (~0.55) almost immediately, not from resistance
    climbing toward saturation (~1) as more IFN mass nominally accumulates
    in the field over time.
  caveat: >-
    This is a mechanism-validation claim only, with three explicit open
    items carried to later increments, most importantly a calibration flag
    from Task 3.3 that stays visible rather than hidden: (1) APC-driven IFN
    amplification is entirely omitted here (global-compartment feedback,
    Increment 8) — this study's IFN comes only from directly-infected cells'
    own local secretion, which here is UNGATED basal release: the CC3D source
    also applies `(1-resist)` to IFN's OWN secretion (`sec_amount =
    (1-resist)*b_fi` in Type1InterferonSecretionSteppable), a negative feedback
    NOT modeled here — Increment 3 gates only virus release per plan scope. Its
    absence removes a brake on IFN, so the modeled resist plateau (below) runs
    somewhat HIGHER than a fully source-faithful version would; (2) resistance's
    role in cell death, the Allee effect, and IL-10 cross-talk are all later
    increments, not modeled here — resistance in this study gates only virus
    secretion (and, in the source but not here, IFN self-secretion); (3) OPEN
    CALIBRATION QUESTION (Increment 9): mean_resist plateaus at ~0.55, not
    ~1 — the steady-state local IFN concentration each infected cell reaches
    lands close to `a_rf` (8.5e-6) in magnitude (resist ≈ 0.55 means f_bar ≈
    1.2x a_rf) rather than far above it, which is plausible but a
    "suspiciously just-right" coincidence between two independently-derived
    constants (a_rf from the ODE-scale calibration; the field magnitude from
    a separate secretion/diffusion/decay derivation chain) that Task 3.3
    flagged as worth cross-checking against the source's actual field
    magnitudes/resist trajectories, not resolved here. Reproduction verdict
    (Figs 3B/5/7) stays PENDING until Increment 9.
  key_metrics:
    - {name: n_I_with_ifn_vs_without_step20, value: "48 vs 50 (~4% reduction)", note: "weak signal at the tested step -- corroborating, not primary evidence"}
    - {name: n_I_with_ifn_vs_without_step30, value: "51 vs 60 (~15% reduction)"}
    - {name: n_I_with_ifn_vs_without_step40, value: "53 vs 69 (~23% reduction)"}
    - {name: total_virus_with_ifn_vs_without_step20, value: "819.16 vs 1750.69 (~53% reduction)", note: "primary quantitative evidence at the tested step"}
    - {name: total_virus_with_ifn_vs_without_step30, value: "1222.88 vs 2752.34 (~56% reduction)"}
    - {name: total_virus_with_ifn_vs_without_step40, value: "1624.58 vs 3905.38 (~58% reduction)"}
    - {name: mean_resist_plateau, value: "~0.53 at step 1, then 0.55-0.57 through step 40 (does NOT ramp to ~1)", flag: "Increment-9 calibration question — see caveat"}
    - {name: a_rf, value: 8.51558276606456e-06}

study_card:
  goal: Validate that per-cell resistance, computed from local type-I IFN and used to gate virus secretion by (1-resist), measurably reduces infection spread and total virus versus the Increment-2 no-resistance path — no reproduction claim.
  mechanism: A second diffusing/decaying type-I IFN field (secreted by infected cells) is sampled locally per infected cell each update into `resist = f_bar/(a_rf+f_bar)` (source convention, NOT the paper's printed `1 - ...` form), which throttles that cell's NEXT update's virus secretion via `world.set_cell_secretion_scale(virus_fi, cid, 1-resist)` — the infection transition itself is unchanged from Increment 2.
  why_before_next: Increment 4 (epithelial death/recovery) and later increments (chemokine/IL-10, macrophage/NK/CD8+ response) all build on a cell's resistance state; this study establishes that the resistance signal itself moves in the protective direction and has a real, measurable effect on spread before anything downstream depends on it.
  expected_result: With the IFN->resistance gate active, total_virus stays substantially lower than the same-seed no-IFN run at every sampled step (the study's primary, robust quantitative evidence, ~53-58% reduction); n_I also grows more slowly, but only weakly so at the earliest tested step (~4% at step 20), strengthening to a clearly meaningful gap by step 40 (~23%) — a corroborating directional trend, not co-equal evidence with total_virus. mean_resist over infected cells is > 0 once IFN has accumulated (the gate is actually engaged, not a no-op).
  main_expert_question: Is the ~0.55 resist plateau (rather than ramping toward the paper's implied stronger protection) a real feature of the source's constants, or a magnitude/convention issue that Increment 9's calibration pass needs to resolve before the capstone reproduction can be trusted?

question: |
  Does a diffusing type-I IFN field, converted per-cell into a resistance
  scalar via the CC3D-source formula `resist = f_bar/(a_rf+f_bar)`, gate
  infected cells' virus secretion by `(1-resist)` strongly enough to
  measurably slow infection spread and reduce total virus versus the same
  seed/parameters with no IFN (Increment 2's unmodified path)?

hypothesis: |
  Layered on the Increment-2 virus field + infection transition: a type-I
  IFN field secreted by infected cells diffuses and decays; each infected
  cell's locally-sampled mean IFN drives a per-cell resistance scalar that
  throttles ITS OWN virus secretion for the next update. This should leave
  n_I lower and total_virus substantially lower than an identical no-IFN
  run at the same steps, while mean_resist stays strictly positive once IFN
  has had time to accumulate.

objective: |
  Wire the type-I IFN field (Task 3.2, `viva_cpm_studies/influenza/fields.py`
  `add_ifn_field`) and the pure per-cell resistance function (Task 3.3,
  `viva_cpm_studies/influenza/resistance.py::cell_resistance`) into a new
  driver, `run.run_virus_infection_with_ifn` (Task 3.3), alongside the
  unmodified Increment-2 `run_virus_infection`, and compare their per-update
  series (n_I, n_H, total_virus, plus `mean_resist` recorded only by the
  with-IFN driver) at identical seed/parameters (Task 3.3's integration test
  `tests/test_influenza_virus_infection.py::test_ifn_resistance_slows_spread_vs_no_ifn`
  and the fuller with/without series in Task 3.3's report). A minimal
  in-package figure (`viva_cpm_studies/influenza/viz.py::ifn_resistance_figure`,
  Task 3.4) renders both series side by side plus the mean_resist trajectory.

description: |
  Increment 3 of the influenza-sego2022 capability ladder: adds ONE new
  diffusible field (type-I IFN) and ONE new per-cell state computation
  (resistance, from local IFN) that gates the Increment-2 virus-secretion
  rate. No death/recovery, no Allee effect, no IL-10 cross-talk, no immune
  cells, and no APC-driven global IFN amplification — those arrive in later
  increments. The IFN field's diffusion/decay/secretion constants and the
  resistance formula's `a_rf` constant are taken from the CC3D
  ViralInfectionVTM source (see `viva_cpm_studies/influenza/params.yaml`'s
  `ifn:` and `resistance:` blocks); the resistance formula matches the
  source's stored convention (`resist = f_bar/(a_rf+f_bar)`, a plain
  Hill/saturation function), NOT the paper's printed form
  (`rho = 1 - f_bar'/(theta*a_f+f_bar')`) — every source consumer applies
  `(1-resist_source)` wherever the paper's rho appears protectively, which
  is exactly how `run_virus_infection_with_ifn` uses it.

claim: |
  A type-I IFN field, converted per-cell into a resistance scalar, gates
  virus secretion and roughly halves total virus versus an identical
  no-IFN run — the study's primary, robust evidence. Infected-cell count
  moves the same protective direction but more weakly, becoming meaningful
  only later in the run. This validates the mechanism only; it is not a
  claim that Sego et al. 2022's quantitative figure targets are met, which
  remains pending.

expected_behavior:
  - With the IFN->resistance gate active, n_I at any given update is <=
    the same-seed no-IFN run's n_I at that update (spread does not outrun
    the unresisted path).
  - total_virus with the gate active is strictly less than the no-IFN run's
    total_virus at the same update, once IFN has had time to accumulate.
  - mean_resist over currently-infected cells is > 0 once IFN has
    accumulated (the gate is actually engaged, not a no-op returning
    resist=0 everywhere).

readouts:
  - name: Infected cell count, with-IFN vs without (weak, widening signal)
    identifier: n_I
    units: cells
    status: measured
    description: >-
      `n_I` series from `run_virus_infection_with_ifn` vs `run_virus_infection`
      (same seed=17, patch_mm=0.3, init_infected_frac=0.05, mcs_per_update=10):
      48/51/53 (with-IFN) vs 50/60/69 (without) at steps 20/30/40 — a WEAK
      signal at step 20 (only ~4% reduction, 2 cells), widening to ~15% at
      step 30 and ~23% at step 40 as the effect compounds. This is a
      corroborating directional readout, not the study's primary
      quantitative evidence (see total_virus below).
  - name: Total virus-field concentration, with-IFN vs without (primary quantitative evidence)
    identifier: total_virus
    units: field concentration (sum over lattice sites)
    status: measured
    description: >-
      `total_virus` series over the same runs: 819.16/1222.88/1624.58
      (with-IFN) vs 1750.69/2752.34/3905.38 (without) at steps 20/30/40 —
      roughly HALVED already at step 20 (~53% reduction, the step Task
      3.3's integration test actually asserts) and staying in that ~53-58%
      regime through step 40. This is the study's PRIMARY, robust
      quantitative evidence for the mechanism's effect; n_I is a weaker
      signal at the tested step (see above).
  - name: Mean per-cell resistance over currently-infected cells
    identifier: mean_resist
    units: dimensionless (0-1)
    status: measured
    description: >-
      `mean_resist` series from `run_virus_infection_with_ifn` only (no
      no-IFN counterpart, since resistance doesn't exist without the IFN
      field): 0.0 at step 0 (no IFN yet), 0.5290 at step 1, 0.5543 at step
      2, then plateauing in a 0.5555-0.5697 band from step 3 through step
      40 — reaches its local steady state almost immediately and stays
      essentially flat rather than climbing toward 1. FLAGGED (see report
      caveat) as an open Increment-9 calibration/convention question, not
      hidden.

behavior_tests:
  - name: IFN-gated resistance does not let spread outrun the no-IFN path (weak directional check)
    classification: diagnostic
    description: |
      WEAK, DIRECTIONAL check only, not the study's quantitative gate: `op:
      le, value: 0` passes on ANY reduction, however small, so a PASS here
      proves only that n_I did not get WORSE with the gate active — it does
      NOT by itself establish a meaningful effect size. Measured at the step
      Task 3.3's integration test actually asserts (step 20): with_ifn
      n_I[-1]=48 <= without n_I[-1]=50, a reduction of only 2 cells (~4%) —
      a genuinely weak signal at that step. The gap does widen at later
      steps (51 vs 60 at step 30, ~15%; 53 vs 69 at step 40, ~23%, per Task
      3.3's fuller report series), so the directional trend strengthens over
      time, but the quantitative claim for THIS study rests on total_virus
      (next test), not on this loose n_I criterion.
    measure: {kind: n_I_delta_vs_without_ifn, condition: ifn-resistance, stat: final}
    pass_if: {op: le, value: 0}
    status: passed
    result: PASS
  - name: IFN-gated virus release leaves strictly less total virus (primary quantitative gate)
    classification: primary
    description: |
      This is the study's PRIMARY quantitative evidence for the mechanism's
      effect. Pass criterion: total_virus at the run's final step with the
      gate active must be strictly less than the same-seed no-IFN run's
      total_virus at that step. Measured at step 20 (the step Task 3.3's
      integration test actually asserts): with_ifn total_virus[-1]=819.16 <
      without total_virus[-1]=1750.69 — a ~53% reduction, already
      substantial at the earliest sampled step, not just a loose
      any-reduction pass like the n_I check above. The reduction stays in
      the ~53-58% regime through step 40 (1222.88 vs 2752.34 at step 30;
      1624.58 vs 3905.38 at step 40).
    measure: {kind: total_virus_delta_vs_without_ifn, condition: ifn-resistance, stat: final}
    pass_if: {op: lt, value: 0}
    status: passed
    result: PASS
  - name: Resistance gate actually engages (mean_resist > 0)
    classification: primary
    description: |
      Pass criterion: mean_resist over currently-infected cells must be > 0
      by the run's final step (sanity that the gate is not a no-op).
      Measured: mean_resist[-1] > 0 at step 20 (Task 3.3); the fuller series
      shows mean_resist reaches ~0.53 after just the first update and
      plateaus at ~0.55-0.57 through step 40 — well above 0, though it does
      NOT climb toward 1 (see the FLAG in report.caveat).
    measure: {kind: mean_resist, condition: ifn-resistance, stat: final}
    pass_if: {op: gt, value: 0.0}
    status: passed
    result: PASS

