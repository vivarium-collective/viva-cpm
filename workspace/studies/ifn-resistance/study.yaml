findings:
  - id: F-01
    kind: computational
    status: partial
    mechanism_origin: engineered
    evidence:
      from_test: IFN-gated resistance does not let spread outrun the no-IFN path (weak directional check)
      divergence_factor: 0.96
      observed: "n_I with-IFN 48/51/53 vs without 50/60/69 at steps 20/30/40 (same seed=17, patch_mm=0.3, init_infected_frac=0.05); ratio 0.96 (step 20, ~4% reduction) -> 0.85 (step 30, ~15%) -> 0.77 (step 40, ~23%)"
    statement: |
      With the IFN->resistance gate active, infected-cell growth is
      slightly slower than the identical no-IFN path, but the effect is
      WEAK at step 20 (only ~4% reduction, 2 cells) — not on its own strong
      evidence of slowed spread. The gap widens meaningfully by step 40
      (~23%) as the effect compounds, so this is a corroborating
      directional trend that strengthens over time, not the study's primary
      quantitative evidence (that's total_virus, F-02) and not a strong
      signal at the step the underlying integration test actually asserts.
  - id: F-02
    kind: computational
    status: confirms
    mechanism_origin: engineered
    evidence:
      from_test: IFN-gated virus release leaves strictly less total virus (primary quantitative gate)
      divergence_factor: 0.42
      observed: "total_virus with-IFN 819.16/1222.88/1624.58 vs without 1750.69/2752.34/3905.38 at steps 20/30/40; ratio 0.42-0.47 across the three sampled steps"
    statement: |
      This is the study's PRIMARY, robust quantitative evidence. Gating
      each infected cell's virus secretion by (1-resist) cuts total virus
      roughly in half already at step 20 (~53% reduction, the step the
      underlying integration test actually asserts) and stays in the
      ~53-58%-reduction regime through step 40 — a substantial, sustained
      brake on virus load that is the direct, measurable output of the
      resistance mechanism, and a much stronger signal at the tested step
      than the n_I check (F-01).
  - id: F-03
    kind: computational
    status: partial
    mechanism_origin: engineered
    evidence:
      from_test: Resistance gate actually engages (mean_resist > 0)
      divergence_factor: 0.55
      observed: "mean_resist 0.0 (step 0) -> 0.5290 (step 1) -> 0.5543 (step 2) -> plateau 0.5555-0.5697 through step 40; never approaches 1"
    statement: |
      The resistance gate engages immediately (not a no-op) and stays
      substantially positive throughout, confirming the mechanism's
      qualitative direction. It only PARTIALLY confirms the expected
      behavior, though: resistance reaches a fast local steady state near
      0.55 and stays essentially flat, rather than climbing toward
      saturation (~1) as the naive expectation of "more IFN accumulates
      over time -> more resistance" would suggest. This is flagged, not
      hidden, as an Increment-9 calibration/convention open question (see
      report.caveat and the standalone caveat item below).

conclusion: |
  MECHANISM VALIDATED, NOT REPRODUCED. The type-I IFN field drives a
  per-cell resistance scalar that gates virus secretion and measurably
  reduces total virus relative to the Increment-2 no-IFN path (same seed):
  total_virus is the PRIMARY, robust quantitative evidence, roughly halved
  at every sampled step (~53% at step 20, the step Task 3.3's integration
  test actually asserts, through ~58% at step 40). n_I moves in the same
  protective direction but is a WEAKER, corroborating signal at the tested
  step (48 vs 50, ~4% at step 20), widening to a more meaningful ~23% by
  step 40 (53 vs 69) as the effect compounds — n_I alone at step 20 is not
  strong evidence of slowed spread. mean_resist confirms the gate engages
  (>0 from step 1 onward) but plateaus at ~0.55 rather than ramping toward
  1 — a flagged Increment-9 calibration/convention question, not resolved
  here. This increment has no death/recovery, no Allee effect, no IL-10
  cross-talk, no immune cells, and no APC-driven global IFN amplification,
  and makes NO claim about matching any of Sego et al. 2022's Figs 3B/5/7
  quantitative acceptance bands — that reproduction verdict is PENDING
  until Increment 9 (the capstone).

conclusion_verdicts:
  regression_compatibility:
    result: PASS
    basis: Reproduces Task 3.3's measured integration-test result and report series exactly (same driver, same seed, same params.yaml constants).
  biological_validation:
    result: PENDING
    basis: >-
      This increment validates the MECHANISM (IFN accumulates -> per-cell
      resistance rises -> virus secretion is gated -> total virus load is
      substantially reduced, with a weaker, later-emerging reduction in
      infected-cell count) with a single seeded run, not a quantitative
      reproduction
      against any of Figs 3B/5/7. Death/recovery, the Allee effect, IL-10
      cross-talk, immune cells, and APC-driven global IFN amplification
      don't exist yet. The resist plateau (~0.55, not ~1) is an OPEN
      magnitude/convention question for Increment 9 — do NOT read PENDING
      here as a passing or failing reproduction verdict; no reproduction
      claim is made until Increment 9.
  explanatory_gain:
    result: PENDING
    basis: >-
      No alternative mechanism is being compared at this increment;
      deferred to later increments / the capstone where a reproduction
      comparison against the paper's figures becomes meaningful.

biological_summary: |
  Infected epithelial cells secrete type-I interferon (IFN) into a second
  diffusing, decaying extracellular field (source-cited diffusion
  coefficient, decay rate, and secretion constant, per
  `viva_cpm_studies/influenza/params.yaml`'s `ifn:` block), layered on the
  Increment-2 virus field. Each update, every currently-infected cell reads
  its own locally-diffused mean IFN concentration and converts it into a
  resistance scalar via the CC3D-source formula `resist =
  f_bar/(a_rf+f_bar)` (params.yaml `resistance:` block; NOT the paper's
  printed `1 - f_bar'/(theta*a_f+f_bar')` form — every source consumer
  applies `(1-resist_source)` wherever the paper's rho appears
  protectively, matched here). That resistance throttles the SAME cell's
  own virus secretion for the next update by a factor of `(1-resist)`, so a
  cell that has accumulated more local IFN releases proportionally less
  virus. Measured against an identical no-IFN run (Increment 2's path,
  unchanged), this produces a substantial, sustained brake on VIRUS LOAD —
  total_virus is the study's primary, robust quantitative evidence, roughly
  halved already at step 20 (~53%) and staying in that ~53-58%-reduction
  regime through step 40. Infected-cell COUNT (n_I) moves in the same
  protective direction but only weakly at step 20 (~4%, 48 vs 50 cells);
  the reduction widens to a clearly meaningful ~23% by step 40 (53 vs 69)
  as the virus-load reduction has more time to compound into fewer new
  infections — a corroborating trend, not evidence as strong as
  total_virus's. mean_resist itself reaches a fast
  local steady state (~0.53-0.57) almost immediately rather than climbing
  toward saturation — because the IFN field's fast decay and diffusion
  drive each infected cell's local IFN to a quasi-steady concentration
  within about one update, and that concentration happens to sit close to
  (about 1.2x) the resistance formula's `a_rf` constant rather than far
  above it. There is no cell death/recovery, no Allee effect, no IL-10
  cross-talk, no immune cells (macrophages/NK/CD8+ T), and no APC-driven
  global IFN amplification feedback yet — all later increments.

key_assumptions:
  - APC-driven IFN amplification is entirely omitted — in this study, IFN
    comes only from directly-infected cells' own local secretion, not from
    the global ODE-compartment feedback loop the paper models (Increment
    8). The measured protective effect here is therefore a LOWER bound on
    what a full model with amplification might show.
  - Resistance in this study ONLY gates virus secretion (via
    `set_cell_secretion_scale`). The source also uses resistance to modulate
    infected-cell death probability and the model's Allee-effect term, and
    IL-10 secretion cross-talks with it — none of that exists yet (later
    increments).
  - >-
    OPEN CALIBRATION QUESTION (flagged for Increment 9, not resolved here) --
    mean_resist plateaus at ~0.55 (f_bar ≈ 1.2x a_rf), not climbing toward
    1, because each infected cell's local IFN reaches a fast
    secretion/diffusion/decay steady state that happens to land close in
    magnitude to `a_rf` (8.5e-6) — a plausible but "suspiciously just
    right" coincidence between two independently-derived constants (Task
    3.3's report). Worth cross-checking against the source's actual field
    magnitudes/resist trajectories before Increment 9 locks in a
    reproduction verdict.
  - Single seed (17) for both drivers (same two-RNG-stream convention as
    Increment 2) — the with/without comparison is a single-run
    demonstration of the mechanism's qualitative and approximate
    quantitative behavior, not a statistically characterized effect size
    across a systematic replicate sweep.
  - As in Increment 2, there is no live-demo process-bigraph composite for
    the WITH-IFN driver — `run_virus_infection_with_ifn` is a raw
    `cpm_core.World` loop (Task 3.3), not wrapped as a composite. The
    `conditions.baseline` entry below reuses the SAME Increment-2
    live-demo composite (`viva_cpm_studies.composites.influenza.viral_infection`,
    no IFN/resistance wiring) purely so this study has a dashboard-loadable
    baseline; it is NOT the composite this study's readouts are measured
    from, and it does not reproduce the IFN mechanism. All readouts above
    come directly from `run.run_virus_infection_with_ifn` /
    `run.run_virus_infection`.
  - The with-IFN driver `run_virus_infection_with_ifn` is ~4-5x slower per
    step than `run_virus_infection` (two diffusing fields, IFN needing 40 vs virus's
    5 stiff-diffusion substeps per MCS) — a performance note for Increment
    9's longer/larger reproduction runs, not addressed here.

literature_anchors:
  - expectation: "Type-I IFN secreted by infected cells confers a per-cell resistance that reduces virus release (Sego 2022 Sec. 2.2, cellular viral resistance rho)."
    model_observable: "mean_resist over currently-infected cells (this study's `resist` field, `resistance.cell_resistance`) rises from 0.0 to ~0.53 after the first update and plateaus at ~0.55-0.57 through step 40; total_virus with the resulting (1-resist) gate is roughly halved vs the no-IFN path at steps 20/30/40 (819.16/1222.88/1624.58 vs 1750.69/2752.34/3905.38)."
    source: "CC3D ViralInfectionVTM source (Type1InterferonModelSteppable.update_resistance) via viva_cpm_studies/influenza/params.yaml resistance: block"
    status_in_workspace: "Wired and measured directly (resist gates virus secretion by (1-resist) each update). The MAGNITUDE of the plateau (~0.55, not saturating toward 1) is an OPEN Increment-9 calibration question — flagged in report.caveat and key_assumptions, not resolved here. No acceptance-band comparison to a digitized figure yet."
    cites: [sego2022influenza]
  - expectation: "Sego et al. 2022's reproduction (Figs 3B/5/7) implicitly requires the IFN-resistance mechanism to be strong enough to shape infected/uninfected epithelial-cell trajectories at paper scale."
    model_observable: "This study's with/without comparison shows the mechanism moves trajectories in the correct (protective) direction, with a robust, non-trivial magnitude on total_virus (roughly halved at every sampled step) but only a WEAK effect on n_I at the tested step (48 vs 50 at step 20, ~4%), widening to a more meaningful ~23% by step 40 (53 vs 69) — at 0.3mm/900-cell reduced scale, using source-cited constants throughout."
    source: "Sego 2022 Figs 3B, 5, 7 (digitized acceptance bands, Increment 0)"
    status_in_workspace: "Referenced QUALITATIVELY only — this study does not compare against the digitized Fig 3B/5/7 acceptance bands (viva_cpm_studies/influenza/targets/); that quantitative reproduction comparison is Increment 9's capstone, not attempted here."
    cites: [sego2022influenza]

