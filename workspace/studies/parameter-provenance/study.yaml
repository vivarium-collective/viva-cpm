schema_version: 3
name: parameter-provenance
status: in-progress
phase: Design
title: "Parameter provenance & digitized Fig 3B/5/7 targets"
confidence: medium
investigation: influenza-sego2022

purpose:
  question: |
    What is the authoritative, cited parameter set for reproducing Sego et al.
    2022's cellularized influenza model, and where does that authority (the
    CC3D ViralInfectionVTM source) disagree with the paper's own printed
    tables?
  mechanism: |
    Documentation only — no simulation is run by this study. It establishes
    the parameter/spec authority that all later increments build on.
  expected_outcome: |
    A cited, machine-readable parameter file (params.yaml) and provenance
    docs that a reviewer can audit line-by-line, plus digitized figure-target
    acceptance bands, with every source-vs-paper disagreement recorded
    explicitly rather than silently resolved.

report:
  title: "Parameter authority established: CC3D source + paper tables, 8 discrepancies recorded"
  verdict: documented
  confidence: medium
  evidence_quality: cited
  objective: >-
    Acquire the Sego et al. 2022 supplementary CC3D source (ViralInfectionVTM),
    transcribe Tables 1-4 into a single cited params.yaml, extend
    docs/cc3d-reference/ with formula/constant/source documentation, and
    digitize the target curves from Figs 3B, 5, 7 into acceptance-band data —
    before any engine code exists.
  conclusion: >-
    The parameter authority for this investigation is established and cited:
    pbg_cpm_studies/influenza/params.yaml mirrors
    docs/cc3d-reference/sego2022-parameters.md, every section cites either the
    paper's Tables 1-4 or the CC3D source directly, and figure-target
    acceptance bands exist for Figs 3B, 5, 7. Eight places where the CC3D
    source and the paper's printed tables disagree are recorded, not
    resolved, in sego2022-parameters.md §7. This is NOT a claim that
    reproduction has been demonstrated — no simulation exists yet.
  main_insight: >-
    Treating the paper's own supplementary source as ground truth (rather
    than only its printed tables) surfaces real, previously-implicit
    modeling choices the paper's prose alone would hide — e.g. the source's
    NeighborOrder=3 vs. the paper-silent default assumption of 2, and two
    immune-adhesion entries where the source's per-subtype matrix does not
    collapse to the paper's stated single value.
  caveat: >-
    This study documents provenance; it does not validate reproduction. The
    8 discrepancies in sego2022-parameters.md §7 are open items — params.yaml
    currently follows the source-literal value in each case (a recorded
    modeling choice, not a settled resolution). Figure targets are digitized
    by eye from log-scale panels and are approximate.
  key_metrics: []

study_card:
  goal: Establish and cite the authoritative parameter set (CC3D source + paper tables) and digitized figure targets before any reproduction engine code is written.
  mechanism: Pure documentation — transcribe params.yaml from the CC3D ViralInfectionVTM source and the paper's Tables 1-4, cross-cited in docs/cc3d-reference/, plus digitized Fig 3B/5/7 acceptance bands.
  why_before_next: Increment 1 (epithelial-sheet-baseline) and every later increment consume params.yaml and the figure targets directly; they must rest on an audited, cited authority rather than ad hoc numbers.
  expected_result: A cited params.yaml, two provenance docs, three figure-target JSON files, and an explicit list of 8 source-vs-paper discrepancies — no pass/fail simulation result.
  main_expert_question: Should any of the 8 recorded discrepancies be resolved toward the paper's stated values instead of the source-literal ones before Increment 1 locks params.yaml in as ground truth?

question: |
  What is the authoritative, cited parameter set for reproducing Sego et al.
  2022's cellularized influenza model (CompuCell3D ViralInfectionVTM), and
  where does the source disagree with the paper's own printed tables?

hypothesis: |
  N/A — this is a documentation/provenance study, not a hypothesis-testing
  simulation. No hypothesis is evaluated here.

objective: |
  Produce a single, cited parameter file and supporting provenance
  documentation that later increments can consume without re-deriving
  constants from the paper or source, and digitize the paper's Figs 3B, 5, 7
  into acceptance-band targets for the eventual capstone reproduction.

description: |
  Increment 0 of the influenza-sego2022 investigation. This study documents,
  rather than simulates: it cites the parameter authority
  (pbg_cpm_studies/influenza/params.yaml), the CC3D-source acquisition and
  transcription docs (docs/cc3d-reference/sego2022-source-notes.md and
  sego2022-parameters.md), and the digitized figure targets
  (pbg_cpm_studies/influenza/targets/{fig3b,fig5,fig7}.json). It reference the
  bibliography entry sego2022influenza (workspace/references/papers.bib) for
  the paper itself. No composite, run, or simulated observable exists in this
  study — those begin at Increment 1 (epithelial-sheet-baseline).

claim: |
  The parameter authority for the influenza-sego2022 investigation is
  established and cited: params.yaml is sourced from the CC3D
  ViralInfectionVTM package and the paper's Tables 1-4, with every value
  traceable to one or the other, and figure-target acceptance bands exist for
  Figs 3B, 5, 7. This is a claim of DOCUMENTATION COMPLETENESS, not of
  reproduction — no simulation has been run against these targets.

expected_behavior:
  - "Parameter authority is established and cited"
  - "Source-vs-paper discrepancies are recorded, not silently resolved"
  - "Figure-target acceptance bands exist for Figs 3B, 5, 7"

