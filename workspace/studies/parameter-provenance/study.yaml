findings:
  - id: F-01
    kind: methodological
    status: confirms
    mechanism_origin: cited
    evidence:
      from_test: null
      observed: >-
        params.yaml (pbg_cpm_studies/influenza/params.yaml) cites every
        section to either "Sego 2022 Table N" or the CC3D source directly;
        docs/cc3d-reference/sego2022-parameters.md mirrors it with formulas
        and constants; three figure-target JSON files
        (pbg_cpm_studies/influenza/targets/{fig3b,fig5,fig7}.json) digitize
        acceptance bands from Figs 3B, 5, 7.
    statement: |
      The parameter/spec authority for reproducing Sego et al. 2022 is
      established and fully cited (CC3D ViralInfectionVTM source + paper
      Tables 1-4), with digitized acceptance-band targets for the three
      figures the capstone increment must reproduce. No simulation evidence
      exists yet — this finding is about documentation completeness only.
  - id: F-02
    kind: methodological
    status: partial
    mechanism_origin: cited
    evidence:
      from_test: null
      observed: >-
        docs/cc3d-reference/sego2022-parameters.md §7 lists 8 places where
        the CC3D source and the paper's printed tables disagree: (1) neighbor
        order 3 (source) vs. an assumed 2 (paper silent), (2) Infected-
        Macrophage adhesion 20 (source, per-subtype) vs. the paper's
        collapsed "infected-immune = 10", (3) NKcell-CD8Tcell adhesion 25
        (source) vs. the paper's collapsed heterotypic-immune = 10, (4)
        active lattice dimensions (175x175, source default) matching neither
        paper patch size exactly, (5) the initial-viral-load sweep
        {1,10,100,1000,10000} is scenario config, not enumerated in the
        source's base ModelInputs, (6) ViralCellDeathSteppable is an
        explicitly "simplified version" omitting the paper's printed
        ROS/viral-load Hill-saturation death term, (7)
        ContactKillingSteppable multiplies by cell_resist directly rather
        than (1 - cell_resist) like every other resistance consumer, (8)
        macrophage-virus chemotaxis is labeled "moderate" in the paper's
        table but numerically equals the "strong" NK value (5,000) in both
        source and paper — a qualitative-label mismatch, not a numeric one.
    statement: |
      Eight source-vs-paper discrepancies are recorded as open items rather
      than silently resolved. params.yaml currently follows the CC3D
      source-literal value in each numeric case, per the controller ruling
      that the source is what actually produced the published figures — but
      this is a recorded modeling choice, not a settled resolution, and is
      carried forward as a decision_needed at the investigation level.

robustness:
  n_replicates: 0
  seeds: []
  parameter_sweep: false

key_assumptions:
  - "The CC3D ViralInfectionVTM supplementary source is treated as the authoritative, source-literal parameter reference where it disagrees with the paper's printed tables (controller ruling; see decisions_needed at the investigation level)."
  - "Figure targets (Figs 3B, 5, 7) are digitized by eye from log-scale panels in the published PDF and are approximate acceptance bands, not extracted vector/tabular data."
  - "params.yaml's chemotaxis functional_form is noted as saturating/COM in the source while the engine currently implements a linear term — recorded as a future-increment gap, not resolved here."

