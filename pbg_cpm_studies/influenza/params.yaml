# Canonical parameters for the Sego et al. 2022 influenza reproduction.
# Mirrors docs/cc3d-reference/sego2022-parameters.md. Every section cites a source.
cpm:
  source: "Sego 2022 Tables 3-4"
  lattice_um: 2
  cell_sites: 25          # 5x5 sites; 10 um diameter
  volume_constraint_um2: 100
  lambda_volume: 9
  temperature: 10         # intrinsic random motility H*
  neighbor_order: 3          # CONTROLLER OVERRIDE: source-literal (paper silent; ViralInfectionVTM.xml Potts+Contact NeighborOrder=3)
  dt_min: 1
adhesion:                 # contact energies J (Table 3)
  source: "Sego 2022 Table 3"
  uninfected_immune: 20
  infected_immune: 10
  dead_immune: 20
  homotypic_immune: 25
  heterotypic_immune: 10
  epithelial_epithelial: 5.0    # CONTROLLER OVERRIDE: source-literal (ViralInfectionVTM.xml), resolves the gap
  epithelial_medium: 25.0       # CONTROLLER OVERRIDE: source-literal (ViralInfectionVTM.xml), resolves the gap
  # NOTE: the paper's Table 3 collapses immune adhesion; the source ships a full 8x8 matrix that
  # does NOT collapse cleanly (infected-macrophage=20 not 10; NK-CD8=25 not 10 — discrepancies
  # #2/#3 in docs/cc3d-reference/sego2022-parameters.md). The collapsed values below are the
  # paper's; the transcription doc's full source matrix is the authority for Increments 6-7.
  # Add: full_matrix_source: "docs/cc3d-reference/sego2022-parameters.md (source-literal 8x8)"
diffusion:
  source: "Sego 2022 Table 3 (de Jong et al. 2006)"
  virus_um2_s: 0.0119
  chemokine_um2_s: 1.04
  ifn_type1_um2_s: 0.520
  il10_um2_s: 0.327
chemotaxis:
  source: "Sego 2022 Table 3"
  functional_form: "lambda_c * c / (1 + c_CM)  # saturating/COM; engine currently linear"
  macrophage_virus: 5000
  nk_chemokine: 5000
  cd8_chemokine: 10000
scaling:
  source: "Sego 2022 p.6, Table 4"
  ode_epithelial_population: 250000
  theta: 4.0e-8
  eta_0p3mm: 0.0049
  eta_1p0mm: 0.04
  seeding_fraction: 0.01
  local_fraction_macrophage: 1.00
  local_fraction_nk: 0.75
  local_fraction_cd8: 0.75
virus:                    # virus field + infection transition constants (Increment 2)
  source: "CC3D source (ImmuneModel/ImmuneModelInputs.py, ImmuneModel/ImmuneModelLib.py,
            Simulation/ViralInfectionVTMSteppables.py) via docs/cc3d-reference/sego2022-parameters.md
            §3/§6; s_to_mcs=60 s/MCS, um_to_lat_width=2 um/site, cell_diameter=5 sites,
            cell_volume=25 sites^2, tot_ec_ODE=250000"
  diffusion_lat2_per_mcs: 0.17882616694562153   # unitless D, lattice^2/MCS
  # = exp_virus_decay_im * exp_virus_dl^2 * s_to_mcs / um_to_lat_width^2, where
  #   exp_virus_decay_im = virus_decay_ODE(0.412015488642712 /day) / 86400,
  #   exp_virus_dl = exp_cell_diameter(10um) * 5.0 = 50um (diffusion_length_cell_diam below).
  # Source: ImmuneModelInputs.py `virus_dc_im` (fed to CC3DML GlobalDiffusionConstant "virus_dc").
  # Cross-validated: 0.011921744463041435 um^2/s * 60/4 = 0.178826... matches doc's Table-3-derived
  # 0.0119 um^2/s to 3 s.f.
  decay_per_mcs: 0.00028612186711299444          # unitless decay, 1/MCS
  # = (virus_decay_ODE / 86400) * s_to_mcs. Source: ImmuneModelInputs.py `virus_decay_im`
  # (fed to CC3DML GlobalDecayConstant "virus_decay" baseline, before the runtime
  # min(1.0, virus_decay_im + g_va*A*dim.z) antibody-clearance term applied in
  # ViralSecretionSteppable.step — that runtime term is NOT included here, see notes below).
  diffusion_length_cell_diam: 5                  # source `exp_virus_dl` = exp_cell_diameter*5.0
  secretion_g_vi: 0.38620664055922777            # per-MCS release amount per InfectedReleasing cell
  # Derivation chain (do NOT re-derive differently in 2.1/2.2 — apply exactly this convention):
  #   1. ODE-calibrated rate g_vi = 278.068781202644 /day
  #      (source ImmuneModel/ImmuneModelLib.py, `immune_model_string()`'s per-cell g_vi literal,
  #       i.e. the cellularized model instantiated with scale_loc/scale_vol set from actual cell
  #       counts -- NOT the separate organism-scale `immune_model_string_ode()` copy of g_vi).
  #   2. -> per-MCS: g_vi_percell_per_mcs = g_vi * s_t, s_t = s_to_mcs/86400 = 6.944444e-4 day/MCS
  #      (ViralInfectionVTMSteppables.py:1140, `scale_time=s_to_mcs/24/60/60`) = 0.19310332027961388.
  #   3. -> the literal value ViralSecretionSteppable multiplies by the lattice z-thickness
  #      (`self.dim.z = 2`, source `ViralInfectionVTM.xml <Dimensions ... z="2"/>`, fixed for both
  #      0.3mm and 1.0mm patch scenarios) BEFORE applying `sec_amount = g_vi*(1-resist)`
  #      (Simulation/ViralInfectionVTMSteppables.py:205-208): 0.19310332027961388 * 2 = 0.38620664...
  #      recorded here, since this is the literal number the source formula `g_vi*(1-resist)` uses.
  # CONVENTION for Task 2.1/2.2: this value already bakes in CC3D's z=2 slab geometry. If the
  # viva-cpm virus field is modeled as a single-layer (z=1 / pure-2D) field, use the
  # pre-z-factor value 0.19310332027961388 instead (divide this constant by 2) and document which
  # was chosen; if the field explicitly models a 2-lattice-site-thick slab matching the source,
  # use this constant as-is. Apply once per MCS to each InfectedReleasing cell, multiplied by
  # (1 - resist) and divided by cell.volume when adding to the field (secreteInsideCell semantics).
  infection_g_hv: 0.006133879567670876           # per-MCS rate coefficient, rate = g_hv * v_mean(s)
  # Derivation: ODE-calibrated g_hv = 1.41324585239137e-06 /day (source ImmuneModelLib.py
  # `immune_model_string()`'s per-cell g_hv literal, `g_hv = 1.41324585239137E-06 * s_t / s_l`)
  # with s_t = s_to_mcs/86400 = 6.944444e-4 day/MCS and s_l = 1/(tot_ec_ODE*cell_volume) =
  # 1/(250000*25) = 1.6e-7 (ViralInfectionVTMSteppables.py:1142, `scale_loc=1/tot_ec_ODE/cell_volume`).
  # No dim.z factor here (confirmed: ViralInternalizationSteppable.do_cell_internalization uses
  # `rate = g_hv * viral_amount_com` directly, viral_amount_com = secretor.amountSeenByCell(cell)/
  # cell.volume, no dim.z multiplier — unlike secretion_g_vi above).
  # CONVENTION: apply once per MCS per Uninfected cell as
  # Pr(infect in this MCS) = 1 - exp(-infection_g_hv * v_mean_at_cell), v_mean_at_cell = mean local
  # virus field concentration seen by the cell (field amount / cell volume). On success the cell
  # transitions directly to InfectedReleasing (source has no separate pre-release Infected state
  # for this transition).
  v0_ode_options: [0, 50, 500]                   # source ImmuneModelInputs.py `v0_ODE` (3 hand-picked
  # options, 0 active by default = "use frac_init_infected instead"; 50 = "non-lethal according to
  # calibrated ODE model"; 500 = "lethal according to calibrated ODE model")
  frac_init_infected: 0.05                       # source `frac_init_infected`, used only when v0_ODE=0:
  # num_to_infect = int(num_epithelial * frac_init_infected) cells randomly set to InfectedReleasing
  # at t=0 (Simulation/ViralInfectionVTMSteppables.py CellsInitializerSteppable). Matches the top of
  # the paper's initial-infection-fraction sweep {0.001,0.005,0.01,0.05} in the `scenarios:` section.
  # Initial-field-seeding meaning (only used when v0_ODE>0): v0 = v0_ODE/tot_ec_ODE (virus per
  # epithelial cell, ODE-scale); the field is seeded UNIFORMLY at every lattice site with
  # v0_sites = v0 * num_epithelial / (dim.x * dim.y) (FieldInitializerSteppable, source
  # `Simulation/ViralInfectionVTMSteppables.py` ~line 89-93) -- i.e. "initial viral load" is a total
  # virus amount, converted to a per-site field concentration by the actual seeded epithelial count
  # and domain area, not a literal field value itself.
ifn:                      # type-I IFN field + secretion/uptake constants (Increment 3)
  source: "CC3D source (ImmuneModel/ImmuneModelInputs.py, ImmuneModel/ImmuneModelLib.py
            `immune_model_string()`, Simulation/ViralInfectionVTMSteppables.py
            `Type1InterferonSecretionSteppable`) via docs/cc3d-reference/sego2022-parameters.md
            §3/§5; s_to_mcs=60 s/MCS, um_to_lat_width=2 um/site, cell_diameter=5 sites,
            cell_volume=25 sites^2, tot_ec_ODE=250000, dim.z=2 (lattice z-thickness)"
  diffusion_lat2_per_mcs: 7.793793725154791     # unitless D, lattice^2/MCS
  # = exp_t1ifn_decay * exp_t1ifn_dl^2 * s_to_mcs / um_to_lat_width^2, where
  #   exp_t1ifn_decay = t1ifn_decay_ODE(112.230629642229 /day) / 86400,
  #   exp_t1ifn_dl = exp_cell_diameter(10um) * 2.0 = 20um (diffusion_length_cell_diam below).
  # Source: ImmuneModelInputs.py `t1ifn_dc` (fed to CC3DML GlobalDiffusionConstant "t1ifn_dc").
  # Exact literal (source's own approx docstring rounds to ~7.792; this is the full-precision value).
  decay_per_mcs: 0.07793793725154792            # unitless decay, 1/MCS
  # = (t1ifn_decay_ODE / 86400) * s_to_mcs. Source: ImmuneModelInputs.py `t1ifn_decay`
  # (fed to CC3DML GlobalDecayConstant "t1ifn_decay"). Exact literal (was ~0.07792 approx).
  diffusion_length_cell_diam: 2                 # source `exp_t1ifn_dl` = exp_cell_diameter*2.0
  secretion_g_fp: 0.00027327308013600416        # per-MCS basal IFN release per InfectedReleasing/
  # Infected cell, resistance-gated: (1-resist)*b_fi. NAMING NOTE: the task brief's "g_fp" follows
  # the paper's Table 1 symbol for this term (basal release by infected/releasing cells,
  # 𝓑(τ,Î)*g_fp/|V| — see sego2022-parameters.md §5); the literal CC3D/Antimony symbol that
  # implements exactly this per-infected-cell basal-release mechanism is `b_fi`, NOT a symbol
  # literally spelled "g_fp" (no such symbol exists in the source). Do NOT confuse this with the
  # source's SEPARATE `b_fp*P` term (APC-count-driven, population/eta-scaled, applied as a
  # spatially-uniform boundary secretion via 8 `t1ifn_secr0..7` XML elements, NOT per-infected-cell)
  # -- the source code comment "Add global secretion by APCs: g_fp*P" mislabels that DIFFERENT term
  # with the symbol "g_fp" even though the Antimony parameter name backing it is `b_fp`. This matches
  # sego2022-parameters.md §5's own framing: "Release by infected/releasing cells g_fp/|V| (basal),
  # plus APC-driven amplification" -- b_fi is the basal term recorded here; the b_fp/APC amplification
  # term is NOT recorded as a params.yaml key (population-dependent via eta, out of scope for this
  # task; flagged for whoever wires immune-cell recruitment/amplification in a later increment).
  # Derivation chain (same convention as virus.secretion_g_vi in Increment 2):
  #   1. ODE-calibrated rate b_fi = 0.196756617697923 /day
  #      (source ImmuneModel/ImmuneModelLib.py, `immune_model_string()`'s per-cell b_fi literal:
  #       `b_fi = 0.196756617697923 * s_t`, the cellularized model — NOT the separate organism-scale
  #       `immune_model_string_old()` copy of the same raw symbol).
  #   2. -> per-MCS per-cell: b_fi_percell_per_mcs = 0.196756617697923 * s_t, s_t = s_to_mcs/86400 =
  #      6.944444e-4 day/MCS (ViralInfectionVTMSteppables.py:1140) = 0.00013663654006800208.
  #   3. -> Type1InterferonSecretionSteppable.step multiplies by `self.dim.z = 2` BEFORE applying
  #      `sec_amount = (1-resist)*b_fi` (Simulation/ViralInfectionVTMSteppables.py, `b_fi =
  #      get_model_val('b_fi') * self.dim.z`): 0.00013663654006800208 * 2 = 0.00027327308013600416,
  #      recorded here (same z=2-baked-in convention as virus.secretion_g_vi; see that key's
  #      CONVENTION note for the z=1 alternative -- divide this constant by 2 if the viva-cpm IFN
  #      field is single-layer).
  uptake_g_fi: 15.74439694686276                # per-MCS uptake rate coefficient, per InfectedReleasing/
  # Infected cell: `t1i_secretor.uptakeInsideCell(cell, 1E12, up_amount/cell.volume)`.
  # Derivation: ODE-calibrated g_fi = 0.00181375452827859 /day (source ImmuneModelLib.py
  # `immune_model_string()`'s per-cell g_fi literal, `g_fi = 0.00181375452827859 * s_t / s_l`) with
  # s_t = 6.944444e-4 day/MCS, s_l = 1/(tot_ec_ODE*cell_volume) = 1/(250000*25) = 1.6e-7
  # (ViralInfectionVTMSteppables.py:1142) -> 7.87219847343138, then multiplied by `self.dim.z = 2`
  # (Type1InterferonSecretionSteppable.step: `up_amount = get_model_val('g_fi') * self.dim.z`)
  # = 15.74439694686276. Population-independent (no s_v/eta factor), unlike secretion_g_fp's
  # separate b_fp/APC term above -- a single canonical value applies across both patch scenarios.
  # NOTE: this task records the exact numeric value per the brief; wiring uptake into the CPM
  # engine's IFN-field consumer logic is deferred to a later task (Task 3.2 per the brief).
resistance:               # cellular viral resistance rho (Increment 3)
  source: "CC3D source (ImmuneModel/ImmuneModelLib.py `immune_model_string()`,
            Simulation/ViralInfectionVTMSteppables.py
            `Type1InterferonModelSteppable.update_resistance`) via
            docs/cc3d-reference/sego2022-parameters.md 'Cellular viral resistance rho'"
  formula: "resist = f_bar/(a_rf + f_bar)"
  # CONVENTION (do not silently "fix" this): the source stores `resist = f_bar/(a_rf+f_bar)`, a
  # PLAIN Hill/saturation function -- NO leading `1 -`, NO theta scaling factor -- even though the
  # paper's printed form (Sec. 2.2) is `rho = 1 - f_bar'/(theta*a_f + f_bar')`. Every consumer of
  # this stored value in the source (ViralCellDeathSteppable, RecoverySteppable,
  # ChemokineSecretionSteppable, IL10SecretionSteppable) applies it as `(1 - resist)` wherever the
  # paper's rho appears in a protective role -- i.e. `(1 - resist_source)` plays the role of the
  # paper's rho. ONE EXCEPTION: ContactKillingSteppable multiplies by `resist` directly (not
  # `1-resist`) -- see sego2022-parameters.md §7.7, flagged there as a possible source
  # inconsistency, not resolved here.
  a_rf: 8.51558276606456e-06     # resistance denominator constant, in field-concentration units
  # matching `t1i_secretor.amountSeenByCell(cell) / cell.volume` (same s_l-scaled internal-field
  # convention as virus/IFN secretion/uptake constants above).
  # Derivation: ODE-calibrated a_rf = 53.2223922879035 (source ImmuneModelLib.py
  # `immune_model_string()`'s per-cell a_rf literal, `a_rf = 53.2223922879035 * s_l`) with
  # s_l = 1/(tot_ec_ODE*cell_volume) = 1/(250000*25) = 1.6e-7 -> 8.51558276606456e-06. Applied
  # directly with NO dim.z factor (Type1InterferonModelSteppable.update_resistance: `a_rf =
  # self.im_steppable.get_model_val('a_rf')`, used as-is), unlike ifn.secretion_g_fp/uptake_g_fi
  # above which both get multiplied by dim.z=2.
scenarios:
  source: "Sego 2022 Section 3"
  initial_viral_load: [1, 10, 100, 1000, 10000]
  initial_infection_fraction: [0.001, 0.005, 0.01, 0.05]
  patch_mm: [0.3, 1.0]
