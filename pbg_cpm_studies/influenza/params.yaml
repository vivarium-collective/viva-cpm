    # be misread as implying CD8 recruitment is also chemokine-gated -- it is not; CD8's CHEMOTAXIS
    # is chemokine-driven (chemotaxis_v_cd8 above), but its RECRUITMENT/inflow is APC-driven. Also
    # unlike macrophage/NK, CD8's inflow_rate_by_type has NO r2 homeostatic-replenishment term (see
    # inflow_formula below) -- CD8+ has no fixed non-zero homeostatic population baseline analogous
    # to b_m/b_k.
    stub_reason: "inflow term depends on the APC field mean P (live ODE-solver state, same category
                   as il10.sig_1/nk.recruitment's G_ki); recruitment is not wired into the viva-cpm
                   engine by this task -- values are recorded for whichever increment wires the ODE
                   solver and the APC/P field."
    inflow_formula: "inflow_rate = b_ep * hill_equation(P, a_ep, h_e)"
    outflow_formula: "outflow_rate = B_ei + mu_e"
    # Source: Simulation/ViralInfectionVTMSteppables.py `ImmuneModelSteppable.inflow_rate_by_type`/
    # `.outflow_rate_by_type` (~lines 1183-1200): `if _type_int == self.CD8TCELL: return
    # self.__rr["b_ep"] * nCoVUtils.hill_equation(self.__rr["P"], self.__rr["a_ep"], self.__rr["h_e"])`
    # for inflow (single term, no `+ r2`); `return self.__rr["B_ei"] + self.__rr["mu_e"]` for outflow.
    # `B_ei` is a live ODE-solver state variable (default-initialized to 0 in `immune_model_string()`
    # line ~213: `B_ei = 0`, dynamically updated during a real run) -- same "requires the live ODE
    # solver" category as nk.recruitment's `G_ki`; not recorded as a numeric constant here.
    hill_equation_formula: "hill_equation(val, diss_cf, hill_cf) = 1 / (1 + (diss_cf/val)**hill_cf), 0 if val==0"
    hill_coefficient_h_e: 3          # Hill exponent, dimensionless. Source ImmuneModelLib.py
    # `immune_model_string()`: `h_e = 3` (unscaled constant) -- same value as macrophage's h_m=3,
    # different from NK's h_k=2.
    b_ep_raw_per_day: 101318.358506851     # dissociation-numerator coefficient, ODE-calibrated /day
    a_ep_raw: 14522.3188063909             # Hill dissociation constant, ODE-calibrated (APC/P units)
    mu_e_raw_per_day: 0.441073272611722    # outflow homeostatic-decay rate coefficient, ODE-calibrated /day
    # Source ImmuneModelLib.py `immune_model_string()`: `b_ep = 101318.358506851 * s_t * s_v`,
    # `a_ep = 14522.3188063909 * s_v`, `mu_e = 0.441073272611722 * s_t`. No `b_e`/`hs_cd8` homeostatic
    # population constant exists in the source (confirmed: CD8's inflow_formula has no `+ r2` term,
    # unlike macrophage/NK) -- CD8+ has no fixed homeostatic baseline analogous to b_m/b_k.
    # Cellularized values NOT computed here (record-but-STUB scope, mirrors nk.recruitment).
  local_fraction_cd8: 0.75         # == scaling.local_fraction_cd8 above; source
  # ImmuneModel/ImmuneModelInputs.py `local_ratio_cd8 = 0.75` -- fraction of the ODE-predicted CD8+
  # population placed as actual CPM cells ("local") vs. held as the well-mixed "nearby" surrogate
  # count consumed by killing.nearby_term_deferred above.
scenarios:
  source: "Sego 2022 Section 3"
  initial_viral_load: [1, 10, 100, 1000, 10000]
  initial_infection_fraction: [0.001, 0.005, 0.01, 0.05]
  patch_mm: [0.3, 1.0]
