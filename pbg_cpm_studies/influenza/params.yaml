  # Numerically identical to il10_decay above (same raw /day constant, see CROSS-CHECK note there).
  sig_1: "DYNAMIC -- Sigma1 is an Antimony ASSIGNMENT RULE, not a fixed parameter: `Sigma1 := a_11*T
    + a_12*D` (ImmuneModel/ImmuneModelLib.py `immune_model_string()` line ~62), where T (a TNF-like
    population ODE state) and D = tot_cell - H - I (dying/damage-associated tissue state) are BOTH
    live ODE-solver state variables, not literals. ChemokineSecretionSteppable/IL10SecretionSteppable
    read it fresh each step via `sig_1 = self.im_steppable.get_model_val('Sigma1')`. IMPORTANT: this
    means a single numeric sig_1 literal CANNOT be honestly recorded here without fabricating a value
    -- it requires the full immune-model ODE/SBML solver's live T/D state, which this increment does
    NOT implement (same deferred category as macrophage.recruitment's Hill term on C, and the global
    boundary secretion / IL-10 IC items below). Recorded here as documentation (formula + the raw
    a_11/a_12 coefficients below) rather than a fabricated scalar, per the brief's 'do not fabricate
    constants' instruction; the key is present (satisfies the required-keys contract) but is NOT an
    engine-usable numeric constant until the ODE solver is wired in a later increment."
  sig_1_stub: 2.4412677181638998    # Task 6.1 ENGINE STUB for sig_1 (Sigma1), per the Task-6.1 brief's
  # explicit ruling: "the source's sig_1:=a_11*T+a_12*D is a dynamic ODE quantity -> deferred to
  # Increment 8; use a STUBBED CONSTANT... document that this fixes the TNF-dependence pending
  # Increment 8 -- the L-dependent Hill self-regulation is preserved, and the chemokine GRADIENT
  # SHAPE (set by diffusion from macrophage locations) is robust to sig_1's exact value." This key is
  # SEPARATE from `sig_1` above (which stays the honest non-numeric documentation of the true dynamic
  # quantity) so neither Task 6.0's "do not fabricate a scalar" finding nor Task 6.1's need for an
  # engine-usable number is compromised.
  # VALUE CHOICE (order-of-magnitude, not a fabricated "true" value): set equal to the CELLULARIZED
  # `g_1` at the 0.3mm-patch scaling (`g_1_raw(498.217901666102) * scaling.eta_0p3mm(0.0049)` =
  # 2.4412677181638998 -- same number as the `g_1` comment above's 0.3mm cellularization, and the same
  # "default to the 0.3mm scenario" convention every other driver in this package already uses, e.g.
  # `run.run_virus_infection`'s `patch_mm: float = 0.3` default). Reasoning: with L_loc small (as it
  # is through most of a short integration run, since IL-10 starts at 0 and only slowly accumulates),
  # the Hill ratio term `(g_1*L+g_2)/(L+d_2)` is DOMINATED by `g_2/d_2` near L=0 (~0.0625, both
  # cellularized) and asymptotes toward `g_1` (~2.44, cellularized) as L grows past `d_2` (~6.85e-5,
  # tiny) -- so any sig_1 far from this ~[0.06, 2.44] range would make Hill(L) trivially saturate near
  # 0 or 1 for the entire reachable L range, defeating the "L-dependent self-regulation is preserved"
  # part of the ruling above. sig_1_stub = g_1(cellularized) puts Hill(0) ~ 0.975 (near-max secretion
  # at low local IL-10) sliding down to Hill(L->large) ~ 0.5 (half-max, self-limiting) as local IL-10
  # accumulates -- a genuine, non-degenerate self-regulation range, not a precision claim about the
  # true (unimplementable without the ODE solver) Sigma1.
  sig_1_a_11: 0.00061091213762049      # raw Antimony coefficient of T in `Sigma1 := a_11*T + a_12*D`
  # (ImmuneModelLib.py `immune_model_string()` line ~68; flat literal, no s_t/s_v/s_l scaling).
  sig_1_a_12: 0.0000192792875130612    # raw Antimony coefficient of D in `Sigma1 := a_11*T + a_12*D`
  # (ImmuneModelLib.py `immune_model_string()` line ~69; flat literal, no s_t/s_v/s_l scaling).
  g_1: 498.217901666102           # RAW (pre-cellularization) Antimony literal coefficient, BEFORE the
  # `* s_v` (population-scale) factor: ImmuneModelLib.py `immune_model_string()` line ~72,
  # `g_1 = 498.217901666102 * s_v`. Recorded as the raw ODE-calibrated coefficient (bare key name
  # `g_1` per the brief/test) because g_1 is SCENARIO-DEPENDENT (s_v = eta varies by patch size) --
  # same convention as macrophage.recruitment's `*_raw` values, which this section mirrors in spirit
  # (the test only requires the key be present, not the cellularized number). Cellularized
  # (s_v=eta, scenario-dependent per scaling.eta_0p3mm/eta_1p0mm):
  #   0.3mm patch (eta=0.0049): g_1 = 498.217901666102 * 0.0049 = 2.4412677181638998
  #   1.0mm patch (eta=0.04):   g_1 = 498.217901666102 * 0.04   = 19.928716066644082
  g_2: 5462.05818489935           # RAW (pre-cellularization) literal, BEFORE `* s_v * s_l`:
  # ImmuneModelLib.py line ~73, `g_2 = 5462.05818489935 * s_v * s_l`. SCENARIO-DEPENDENT (s_v) AND
  # s_l-scaled (s_l = 1/(tot_ec_ODE*cell_volume) = 1.6e-7, population-independent factor).
  # Cellularized (s_l=1.6e-7, s_v=eta):
  #   0.3mm patch (eta=0.0049): g_2 = 5462.05818489935 * 0.0049 * 1.6e-7 = 4.28225361696109e-06
  #   1.0mm patch (eta=0.04):   g_2 = 5462.05818489935 * 0.04   * 1.6e-7 = 3.495717238335584e-05
  d_2: 428.253164311871           # RAW (pre-cellularization) literal, BEFORE `* s_l`:
  # ImmuneModelLib.py line ~74, `d_2 = 428.253164311871 * s_l`. SCENARIO-INDEPENDENT (only s_l, no
  # s_v) -- a single cellularized value applies across both patch scenarios:
  #   d_2 (cellularized, s_l=1.6e-7) = 428.253164311871 * 1.6e-7 = 6.852050628989936e-05
  hill_regulation_formula: "sec_amount = b_{c,l} * sig_1 / (sig_1 + (g_1*L_loc + g_2) / (L_loc + d_2)),
    L_loc = local mean IL-10 concentration seen by the macrophage cell
    (il10_secretor.amountSeenByCell(cell)/cell.volume). IDENTICAL form gates BOTH
    ChemokineSecretionSteppable (b_c above) and IL10SecretionSteppable (b_l here) -- same
    sig_1/g_1/g_2/d_2 read from the SAME immune-model ODE-solver instance each step (one shared
    Hill-regulation mechanism, not two independent ones). Source: ChemokineSecretionSteppable.step
    / IL10SecretionSteppable.step, both ~identical 5-line 'Macrophage secretion / Local' blocks
    (Simulation/ViralInfectionVTMSteppables.py lines 1482-1490 and 1544-1552)."
  deferred:
    global_boundary_secretion: "BOTH ChemokineSecretionSteppable and IL10SecretionSteppable have a
      'Global' block (after the per-cell 'Local' block shown above) that writes a num_macro-scaled,
      domain-uniform secretion amount into 8 XML boundary elements (chemo_secr0..7 / il10_secr0..7)
      via the SAME Hill-regulation form applied to num_macro (nearby-surrogate macrophage count) and
      the ODE solver's total-L state -- population/eta-scaled (loc_to_global = scale_vol/scale_loc),
      out of scope for this increment (Increment 8 per the brief); NOT recorded as a params.yaml key."
    il10_initial_condition: "IL10SecretionSteppable.step, mcs==0 branch: `L = b_lh*(1-mean_resist)*
      num_epithelial/(dim.x*dim.y)`, used to set `self.field.il10[...] = amount_init` -- a UNIFORM
      field write at t=0 across the whole domain. Skipped: viva-cpm's field engine (as used by prior
      increments) has no field-write API for this task to call; the raw b_lh (WITHOUT dim.z, distinct
      from the b_lh key above) and the formula are documented here for whoever wires field
      initialization in a later increment."
